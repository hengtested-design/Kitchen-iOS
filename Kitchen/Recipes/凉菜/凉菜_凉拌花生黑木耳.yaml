steps:
- number: 1
  description: 将黑木耳泡开后放入加了点盐水中焯一下，将焯过水的黑木耳捞出来；
- number: 2
  description: 直接将洗净的花生倒入， 再加入点盐；
- number: 3
  description: 就八角，花椒，桂皮， 香叶， 干辣椒和小茴香放入调料球中；
- number: 4
  description: 将调料球放入锅中和花生一起煮上五分钟；
- number: 5
  description: 关火， 盖上盖， 一起泡上三个小时以上；
- number: 6
  description: 再将泡过的水沥干， 取出调料球；
- number: 7
  description: 将准备好的黑木耳， 花生和香菜末放入一大碗中；
- number: 8
  description: 在小碗中用醋，胡椒， 蒜末， 香油和小米椒末搅拌均匀；
- number: 9
  description: 将调好的调料汁倒入准备好的菜中，搅拌均匀；
- number: 10
  description: 装入盘中。
