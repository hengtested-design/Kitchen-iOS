steps:
- number: 1
  description: 准备所有材料。
- number: 2
  description: 将干木耳用凉水洗净泡开，我用的是小耳朵木耳，所以每朵不是太大，大的大家用手撕开便可。
- number: 3
  description: 将大蒜切沫，小米椒椒和香菜切成小段。
- number: 4
  description: 锅中将水煮开，木耳用开水焯（就是放入开水里面煮开后，2分钟马上拿出来）一下。捞出来过凉水沥干放在盘子里面。
- number: 5
  description: 调好凉拌酱汁，将仲景花椒油、仲景原味香菇酱、芝麻油、大蒜沫及糖、生抽，香醋，盐调匀成味汁。（大家没有花椒油的，可以直接拿花椒炸油淋于木耳上面）
- number: 6
  description: 将味汁淋于过凉的木耳上面，再加上小米椒、香菜及芝蔴凉拌成菜。
- number: 7
  description: 拿上筷子，咬一口吃，完全爽脆的口感。
_source: cookbook-kg
