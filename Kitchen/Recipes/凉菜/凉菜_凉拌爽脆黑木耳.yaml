id: 10140
name: 凉拌爽脆黑木耳
cuisine: 凉菜
difficulty: 1
duration: 10
calories: 55
servings: 2
tags:
- 酸咸
- 拌
cover: https://i02piccdn.sogoucdn.com/c609daf57570cecb
ingredients:
- name: 香菇酱
  amount: 45
  unit: 毫升
  isMain: true
- name: 黑木耳
  amount: 20
  unit: 克
  isMain: true
- name: 大蒜
  amount: 2
  unit: 瓣
  isMain: true
- name: 熟白芝麻
  amount: 0
  unit: 适量
  isMain: true
- name: 盐
  amount: 0
  unit: 适量
  isMain: true
- name: 香菜
  amount: 0
  unit: 适量
  isMain: true
- name: 小米椒
  amount: 0
  unit: 适量
  isMain: true
- name: 生抽
  amount: 10
  unit: 毫升
  isMain: false
- name: 仲景花椒油
  amount: 15
  unit: 毫升
  isMain: false
- name: 芝麻油
  amount: 5
  unit: 毫升
  isMain: false
