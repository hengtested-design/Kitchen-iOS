  description: 黑木耳
- number: 2
  description: 提前几小时泡发。洗净，去根儿，撕成小片儿。
- number: 3
  description: 洋葱去皮洗净，青椒洗净，荆芥洗净，泡盐水片刻。
- number: 4
  description: 青椒洋葱切丝，荆芥捞出备用。
- number: 5
  description: 木耳焯水，一分钟左右。
- number: 6
