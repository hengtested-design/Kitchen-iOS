id: 10129
name: 凉拌黑木耳
cuisine: 凉菜
difficulty: 1
duration: 10
calories: 50
servings: 2
tags:
- 微辣
- 拌
cover: https://i03piccdn.sogoucdn.com/683ca23eda42fb1a
ingredients:
- name: 黑木耳
  amount: 0
  unit: 适量
  isMain: true
- name: 青红尖椒
  amount: 0
  unit: 各1个
  isMain: true
- name: 香菜
  amount: 1
  unit: 根
  isMain: true
