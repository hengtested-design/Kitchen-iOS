steps:
- number: 1
  description: 干黑木耳提前2个小时温水泡发后清洗干净摘除蒂部，然后开水里焯2分钟后捞出放冷水里冰一下捞出沥干水分。
- number: 2
  description: 青红辣椒各1根，如果不喜欢吃辣，辣椒可以不放。香菜清洗干净后切段。
- number: 3
  description: 锅底少许油，冷油放入花椒和大料。小火爆香。做一些花椒油。
- number: 4
  description: 盐1勺、白糖半勺、芝麻油1勺、生抽1勺、青红辣椒放到黑木耳里一起拌均匀。
- number: 5
  description: 最后加入1勺花椒油和香菜段即可。
