id: 10141
name: 泰国手标红茶
cuisine: 家常菜
difficulty: 3
duration: 20
calories: 185
servings: 2
cover: https://s.chuimg.com/泰国手标红茶/泰国手标红茶.jpeg
description: 这是一道源自泰国街头的经典奶茶，茶香浓郁，口感绵密顺滑，炼乳与牛奶带来香甜奶味。茶奶结合可提供少量蛋白质和钙，但含糖量较高，适宜作为消暑解渴的饮品。制作步骤简单，但需反复过滤茶汤并等待长时间冷藏，整体耗时约 4 小时 20 分钟，对新手稍有耐心即可完成。
ingredients:
- name: 水(600cc)
  amount: 0
  unit: 适量
  isMain: false
- name: 茶粉(20g)
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖(24g)
  amount: 0
  unit: 适量
  isMain: false
- name: 牛奶(18ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 炼乳(24g)
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 600cc 水大火烧开
- number: 2
  description: 在过滤袋中装入 20g 茶粉，开水倒入过滤袋中，过滤 20 遍
- number: 3
  description: 使用克称量取 24g 炼乳、24g 白糖和 18ml 牛奶放入 1000ml 以上的水壶中
- number: 4
  description: 将过滤好的茶水倒入水壶中搅拌，直到白糖融化
- number: 5
  description: 将水壶放到冰箱 4 小时以上
- number: 6
  description: 喝前可以加 6-8 颗冰块
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
