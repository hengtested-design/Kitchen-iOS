steps:
- number: 1
  description: 黄骨鱼洗净，要小心鱼身上的那根硬刺；
- number: 2
  description: 姜切片 蒜拍碎 葱白部份切段；
- number: 3
  description: 葱绿部份切葱花；
- number: 4
  description: 锅中热油，爆香姜 蒜和葱白；* 应该先用锅铲压着姜片抹一遍锅底，这样煎的鱼皮才不容易粘锅；
- number: 5
  description: 放入黄骨鱼，先煎好一面；
- number: 6
  description: 再翻到鱼的另一面，再煎好；* 这次杯具了，鱼皮全粘锅了 ：P* 一定要煎透一面再翻面，一次性煎好两面；
- number: 7
  description: 倒入热开水，大概与鱼身持平；
- number: 8
  description: 调入盐、生抽、老抽、料酒，盖上锅盖，持续用大火烧至汤汁剩1/4；* 红烧肉类要大转烧开转中小火烧，鱼类就一直用大火烧；
- number: 9
  description: 最后调入白糖和鸡精，收收汁就好了；撒葱花……
