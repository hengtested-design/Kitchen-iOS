id: 10348
name: 韩式拌饭
cuisine: 家常菜
difficulty: 3
duration: 45
calories: 1080
servings: 2
cover: https://s.chuimg.com/韩式拌饭/韩式拌饭.jpeg
description: 韩式拌饭是一道色彩缤纷、口感丰富的韩国家常料理，甜辣酱汁包裹着米饭、蔬菜、牛肉和溏心蛋，拌匀后一口满足。多种蔬菜提供维生素和膳食纤维，牛肉和鸡蛋补充优质蛋白，营养均衡。制作简单但备菜步骤稍多，新手也能从容完成，从准备到上桌大约需要 45 分钟。
