id: 10130
name: 龟苓膏
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 129
servings: 2
cover: https://s.chuimg.com/龟苓膏/龟苓膏.jpeg
description: 龟苓膏是一道广式传统甜品，口感嫩滑微苦回甘，常作为夏日消暑小食。龟苓膏能清热祛湿、滋阴养颜，是营养健康的一款点心。做法简单，新手也能轻松掌握，全程只需备料、搅拌和加热，冷藏等待约两小时后即可享用。
steps:
- number: 1
  description: 在锅中倒入龟苓膏粉 25 克与冷水 120 毫升，充分搅拌至无颗粒感。
- number: 2
  description: 在另一个容器中加入白砂糖 100 克，倒入沸水 500 毫升，搅拌至糖完全溶解。
- number: 3
  description: 将糖水缓慢倒入龟苓膏粉液中，立即搅拌均匀，避免结块。
- number: 4
  description: 将混合液体放入锅中，加热时保持中小火，并持续搅拌以防粘锅。
- number: 5
  description: 加热至液体变粘稠并开始冒小泡，即可关火。
- number: 6
  description: 快速将液体倒入模具中，自然冷却凝固。建议冷藏 1~2 小时后食用，口感更佳。
tips: 龟苓膏冷却过程中不可随意移动容器，否则可能影响成型。; 加热时应避免使用大火，防止结块或糊底。; 可根据个人口味添加蜂蜜、炼乳或水果食用。; 不同品牌龟苓膏粉浓度略有差异，建议参照包装说明调整配比。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
