id: 10163
name: 咕噜肉
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 673
servings: 2
tags:
- 酸甜
- 下饭菜
- 炸
description: 咕噜肉是一道经典粤式家常菜，酸甜开胃、外酥里嫩，菠萝的果香让肉块吃起来格外清爽解腻。猪肉提供优质蛋白质，青椒和菠萝则补充维生素与膳食纤维。这道菜的难点在于掌握炸肉的火候，对新手略有挑战，但只要按步骤操作便能成功。从腌制到出锅，全程大约需要 40 分钟，很适合为家人做一道下饭快菜。
ingredients:
- name: 1 汤匙 = 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 1 茶匙 = 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 梅头猪肉 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 青椒 25g
  amount: 0
  unit: 适量
  isMain: false
- name: 罐头菠萝片 75g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 1/4 茶匙
  amount: 0
  unit: 适量
  isMain: false
- name: 茄汁 4 汤匙
  amount: 0
