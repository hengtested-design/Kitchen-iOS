id: 10013
name: 本帮红烧肉
cuisine: 家常菜
difficulty: 1
duration: 60
calories: 310
servings: 2
tags:
- 甜味
- 烧
cover: https://i01piccdn.sogoucdn.com/5cf202a6d085a7dc
ingredients:
- name: 五花肉
  amount: 1000
  unit: 克
  isMain: true
- name: 黄酒
  amount: 750
  unit: 克
  isMain: true
- name: 老姜
  amount: 70
  unit: 克
  isMain: false
- name: 冰糖
  amount: 136
  unit: 克
  isMain: false
- name: 老抽
  amount: 20
  unit: 克
  isMain: false
- name: 生抽
  amount: 30
  unit: 克
  isMain: false
- name: 玉米油
  amount: 20
  unit: 克
  isMain: false
steps:
- number: 1
  description: 准备好1000克猪五花肉、黄酒、冰糖、老姜、生抽、老抽、盐、玉米油。
- number: 2
  description: 准备工作：老姜70克用刀拍一下切大块、将750毫升黄酒倒在量杯内、30克生抽和20克老抽也放在自动锅带的量杯里、136克冰糖和4克盐称好。
- number: 3
  description: 五花肉洗净切大块
- number: 4
  description: 自动锅内加入20克玉米油抹匀
- number: 5
  description: 将五花肉块平摊在锅底
- number: 6
  description: 盖好锅盖插电源选干锅功能煸一下肉块（当自动锅觉得锅内没有水分了就会停止加热，我们把肉翻个面再进行一次干锅功能就行。）
- number: 7
  description: 最后把肉皮这面也煸一下，然后关电源把锅里煸出来的油到出去。
- number: 8
  description: 把姜块倒进去
- number: 9
  description: 将黄酒加进去
- number: 10
  description: 再加入勾兑好的酱油，端起锅胆将调料摇匀再放回锅套里。
- number: 11
  description: 盖好盖子选红烧肉功能即可。（液晶屏会显示倒计时58分钟。）
- number: 12
  description: 当程序进行到还剩23分钟时打开锅盖加入4克盐。
- number: 13
  description: 再加入136克冰糖盖好盖子继续未完的程序。
- number: 14
  description: 收汁结束以后自动锅会发出提示音，液晶屏会显示ok，这时打开锅盖，盛肉开吃吧！
_source: cookbook-kg
