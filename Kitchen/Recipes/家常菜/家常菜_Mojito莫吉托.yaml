id: 10132
name: Mojito莫吉托
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 187
servings: 2
tags:
- 酸甜
description: 这款鸡尾酒口感清爽酸甜，带有薄荷的清凉和朗姆酒的微醺，是经典的夏季饮品。酒精含量较低，佐以富含维生素 C 的青柠，能生津解渴、提神醒脑。制作十分简单，对新手友好，从备料到完成只需大约十 分钟。
ingredients:
- name: 一块青柠（切成两个半块）
  amount: 0
  unit: 适量
  isMain: false
- name: 五珠薄荷叶
  amount: 0
  unit: 适量
  isMain: false
- name: 糖浆 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 金色朗姆酒 45ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蓝天原味伏特加 10ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将切成半块的青柠之一切成小块，放入海波杯，随后用研杵将其捣出汁；
- number: 2
  description: 用 3-4 珠薄荷叶沿着杯口涂抹，随后将其放入杯中；
- number: 3
  description: 加入 糖浆 20ml；
- number: 4
  description: 加入 金色朗姆酒 45ml；
- number: 5
  description: 将剩下的半块青柠压出汁水放入杯中；
- number: 6
  description: 轻轻搅拌，使砂糖/糖浆处于半融合状态；
- number: 7
  description: 将打碎的冰块放入杯中，直到占杯中 3/4；
- number: 8
  description: 加入冰镇苏打水直到刚好淹没碎冰；
- number: 9
  description: 旋转搅拌半分钟；
- number: 10
  description: 使用碎冰将海波杯补满；
- number: 11
  description: 将剩下的一株薄荷叶拍醒，插入碎冰，作装饰。
tips: 参考资料：[【哔哩哔哩】莫吉托(Mojito)世界上最著名的经典鸡尾酒之一。](https://www.bilibili.com/video/BV1jg4y187kB); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
