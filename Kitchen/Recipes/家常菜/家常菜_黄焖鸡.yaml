id: 10260
name: 黄焖鸡
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 766
servings: 2
tags:
- 咸鲜
- 下饭菜
- 炒
description: 黄焖鸡是一道以鸡腿、香菇、青椒为主料的家常菜，汤汁浓郁，鸡肉滑嫩，咸鲜微甜，十分下饭。富含优质蛋白质和菌菇多糖等营养。炒糖色环节稍有挑战，但可用老抽替代，整体难度不高，新手也能顺利掌握。从备菜到出锅，大约需要 40 分钟。
ingredients:
- name: 鸡腿
  amount: 0
  unit: 适量
  isMain: false
- name: 香菇（干香菇最佳）= 5 朵
  amount: 0
  unit: 适量
  isMain: false
- name: 青椒
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜片
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒 个
  amount: 5
  unit: 适量
  isMain: false
- name: 盐
  amount: 10
  unit: g
  isMain: true
- name: 料酒
  amount: 10
  unit: ml
  isMain: false
- name: 白胡椒粉
  amount: 5
  unit: g
  isMain: true
- name: 白糖
  amount: 5
  unit: g
  isMain: true
- name: 酱油
  amount: 5
  unit: ml
  isMain: false
- name: 土豆
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡腿洗净，剁成**4cm**大小的块
- number: 2
  description: 生姜切片、干辣椒切成**小圈**
- number: 3
  description: 香菇切片，青椒切成细长的**马蹄状**，若为干香菇，洗净灰尘后泡一晚上并留香菇水备用
- number: 4
  description: 若有土豆，切为与鸡肉大小类似的**滚刀块**
- number: 1
  description: 炒糖色：锅里倒入底油，冷油时放入白糖（**有一定难度，新手可跳至鸡肉炒制并使用老抽替代**）
- number: 2
  description: 小火慢慢加热，待油温逐渐升高，白糖开始融化并变成较深的棕色（期间要不断搅拌，防止糊锅）
- number: 3
  description: 迅速倒入鸡块，转大火，快速翻炒！烹入料酒，继续翻炒片刻
- number: 4
  description: 将生姜片和干辣椒倒入
- number: 5
  description: 放入酱油，炒匀
- number: 6
  description: 倒入香菇水或清水，以能淹住鸡肉为准
- number: 7
  description: 倒入香菇片，白胡椒粉，盐，土豆
- number: 8
  description: 翻炒均匀后，盖上锅盖焖煮，转中小火**15——20分钟**，有条件可以转至砂锅
- number: 9
  description: 待鸡肉软烂，汤汁浓稠后（汤汁不要收的太干），最后放入青椒
- number: 10
  description: 放入味精，兜炒均匀后，关火！青椒基本断生即可，不要炒时间久了
