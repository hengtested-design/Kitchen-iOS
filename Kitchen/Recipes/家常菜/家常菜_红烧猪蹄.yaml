id: 10219
name: 红烧猪蹄
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 639
servings: 2
tags:
- 下饭菜
- 红烧
cover: https://s.chuimg.com/红烧猪蹄/红烧猪蹄.jpeg
description: 红烧猪蹄是一道汤汁浓郁、肉质软糯的经典家常菜，咸香甜美，极为下饭。猪蹄富含胶原蛋白和蛋白质，营养丰富。这道菜对新手有一定挑战，但借助高压锅可以简化流程，有一定烹饪基础更易上手。从备料到完成大约需要 1 小时。
ingredients:
- name: 猪蹄：2~3 根
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油：30ml
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 2 片
  amount: 0
