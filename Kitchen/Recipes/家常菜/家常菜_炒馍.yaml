id: 10320
name: 炒馍
cuisine: 家常菜
difficulty: 3
duration: 15
calories: 767
servings: 2
tags:
- 炒
description: 炒馍是一道咸香酥脆的家常面食，属于北方风味。馒头丁炒至金黄，外脆里软，孜然与五香粉的加入让风味更加浓郁。可搭配鸡蛋提供蛋白质，搭配小葱增添清香，营养均衡。制作难度适中，新手也能很快上手，预计 大约 15 分钟即可出锅享用。
steps:
- number: 1
  description: 将馒头切成小块或小片。
- number: 2
  description: 选有鸡蛋的话将鸡蛋打进碗里，打散（可加盐和五香粉各 1g 或不加，等炒的过程中加）。
- number: 3
  description: 鸡蛋浇在馒头上，拌匀，鸡蛋不宜过多。
- number: 4
  description: 大火热锅，倒入食用油（不锈钢锅怕伤锅的话可以先倒油，烧至油热也可也可）
- number: 5
  description: 将馍丁放进去翻炒，翻炒均匀。
- number: 6
  description: 将火调小，炒至馍丁呈金黄色。
- number: 7
  description: 放入盐，胡椒粉，五香粉。
- number: 8
  description: 最后将葱花放入一起翻炒几下。
- number: 9
  description: 关火出锅。
tips: 炒的过程中要注意控制火候，以防炒糊; 火大补救措施将火调小，可沿锅边加油润锅或洒水，注意不要全倒在一个地方，最好分散开; 调味料可根据个人喜好放入其他香料（比如南德调味料）; 如果喜欢吃脆的，可以将火开到最小，多翻炒一会，关火后趁锅热再放置一会再倒出，更香脆; 辅料也可根据个人口味方位蒜末，蒜苗等，可以单独爆香在混合; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
