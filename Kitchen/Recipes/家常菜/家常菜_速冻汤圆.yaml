id: 10272
name: 速冻汤圆
cuisine: 家常菜
difficulty: 1
duration: 6
calories: 568
servings: 2
cover: https://s.chuimg.com/速冻汤圆/速冻汤圆.jpeg
description: 速冻汤圆是一道快速方便的微波炉甜点，外皮软糯、内馅香甜，属于中式传统小吃。主要提供碳水化合物，能迅速补充能量。做法极易上手，新手也能轻松完成，从准备到出锅仅需大约 6 分钟。
ingredients:
- name: 速冻汤圆：11 个。数量取决于碗的大小。保证放入的汤圆最高不超过碗高度 - 5mm。
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 取出速冻汤圆，放入碗中。
- number: 2
  description: 倒入开水，直至浸没汤圆。
- number: 3
  description: 微波炉高火 4 分钟。
- number: 4
  description: 假如汤圆均已吸水膨胀，则已熟。
- number: 5
  description: 如果没熟，再加热 1 分钟。
tips: 注意先加汤圆再加热水，不要颠倒，不然汤圆倒入热水可能会溅出烫伤。以及无法控制水面高度可能溢出。; 假如微波炉里碗太烫无法取出，可以用毛巾，或者某些微波炉可以连托盘一起取出。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
