id: 10282
name: 生汆丸子汤
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 857
servings: 2
tags:
- 咸鲜
description: 生汆丸子汤口感鲜嫩弹滑，是一道原汁原味的家常汤品。猪肉提供优质蛋白质，搭配木耳、黄花等食材，营养较为均衡。制作中需要自己剁肉并掌握挤丸子的火候，稍有些门槛，更适合有一定基础的厨艺爱好者。从备料到上桌大约需要 1 小时。
steps:
- number: 1
  description: 肉改刀切开，肥瘦三七分
- number: 2
  description: 上刀剁一剁，用刀背砸一砸，把肉筋打开打松疏
- number: 3
  description: 剁一剁，砸一砸，剁成肉末，要想好吃得自己剁，机器打的太黏糊了
- number: 1
  description: 每斤肉，6 克盐，1 克胡椒粉
- number: 2
  description: 上手抓匀
- number: 3
  description: 葱姜花椒水分次加，边加边搅，用手揉匀，让肉吸饱水。每斤肉末 80 克葱姜花椒水
- number: 4
  description: 放入鸡蛋清，继续顺着一个方向搅
- number: 5
  description: 加入 40 克土豆淀粉，搅匀
- number: 6
  description: 加入熟豆油，这是为了保持其嫩滑弹的状态
- number: 1
  description: 起锅烧水，烧开，改小火，似开非开的样子
- number: 2
  description: 上手，挤丸子，
- number: 3
  description: 全部漂起来，用小火煮 1 分钟
- number: 1
  description: 粉丝放碗底
- number: 2
  description: 加木耳，黄花，小香葱并用盐、胡椒粉、鸡粉打底调味
- number: 3
  description: 连汤带丸子冲如碗中
- number: 4
  description: 淋 3-5 滴香油
- number: 5
  description: 加一小颗香菜
tips: 参考来自：[生汆丸子汤，吃的就是一个鲜、嫩、弹，学会打丸子的这些技巧，这碗汤才地道](https://www.bilibili.com/video/BV1Ga411C7zg?spm_id_from=333.1007.top_right_bar_window_history.content.click); * 辣椒油可以根据口味放; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
