id: 10364
name: 包菜炒鸡蛋粉丝
cuisine: 家常菜
difficulty: 3
duration: 20
calories: 570
servings: 2
tags:
- 咸鲜
- 快手菜
- 炒
cover: https://s.chuimg.com/包菜炒鸡蛋粉丝/包菜炒鸡蛋粉丝.jpeg
description: 包菜炒鸡蛋粉丝是一道咸鲜可口的家常快手菜，脆甜的包菜丝与软韧的粉丝、嫩滑的鸡蛋相互融合，口感层次丰富。包菜富含维生素和膳食纤维，鸡蛋提供优质蛋白质，胡萝卜增添营养，荤素搭配均衡。制作时需要提前浸泡粉丝，整体流程稍多但操作并不复杂，对新手有一定挑战性。从备料到出锅，大约需要 1 小时 20 分钟。
steps:
- number: 1
  description: 胡萝卜、包菜切丝备用
- number: 2
  description: 粉丝先用冷水浸泡 1 小时，然后将粉丝放入锅中，加入开水烧至粉丝烫软捞出备用
- number: 3
  description: 鸡蛋打入碗中，加入盐后搅拌 15 秒
- number: 4
  description: 葱、蒜、辣椒切成小粒备用
- number: 5
  description: 起锅烧油，倒入鸡蛋，打散炒熟盛出
- number: 6
  description: 再倒入油，放入葱、蒜、干辣椒翻炒 8 秒
- number: 7
  description: 下胡萝卜、包菜丝儿翻炒 30 秒
- number: 8
  description: 放入粉丝
- number: 9
  description: 放调料，生抽 15 ml，老抽 10 ml，蚝油 10 ml，盐 2 克
- number: 10
  description: 放入之前炒好的鸡蛋，翻炒约 15 秒
- number: 11
  description: 出锅摆盘
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
