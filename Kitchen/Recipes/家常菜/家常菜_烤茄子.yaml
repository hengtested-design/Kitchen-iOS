id: 10384
name: 烤茄子
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 145
servings: 2
tags:
- 快手菜
- 下饭菜
- 烤
cover: https://s.chuimg.com/烤茄子/烤茄子.jpeg
description: 烤茄子香气浓郁、外焦里嫩，孜然和蒜蓉的辛香完美融入软糯的茄肉，是街头烧烤风味在家轻松复刻的菜品。茄子富含维生素 P 和花青素，有助于保护心血管、抗氧化。做法需要用到烤箱，但步骤清晰，新手也能在大约半 小时完成，很适合作为家庭聚餐的快手下饭菜。
ingredients:
- name: 茄子 1 个 （大约 200g）
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 20-30 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油 4-6 克
  amount: 0
  unit: 适量
  isMain: false
- name: 小米椒 1 个 （大约 20g）
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜蓉 3-4 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 孜然 1-3 克
  amount: 0
  unit: 适量
  isMain: false
- name: 食用盐 0.5-2 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将酱油、孜然、食用盐、蒜蓉和切碎的小米椒置于碗中，均匀搅拌备用
- number: 2
  description: 茄子洗净，用纸巾擦干表面的水分
- number: 3
  description: 用叉子在茄子的一侧扎 4-8 下
- number: 4
  description: 使用 15-25ml 的食用油涂满茄子表面
- number: 5
  description: 将烤箱温度设置为 200℃ （打开烤箱风扇 大火），预热 2 分钟
- number: 6
  description: 将茄子放入烤箱中层或者上层，烤制 12-15 分钟 （茄子表面有褶皱，且能按压 0.3-0.5cm 的深度即可）
- number: 7
  description: 取出茄子，用刀茄子上竖着划一个口子。口子居中，上下距 1-1.5cm
- number: 8
  description: 用小刀或者叉子伸入口子，竖着切割茄子内部
- number: 9
  description: 将口子微微掰开，倒入第一步准备的酱料
- number: 10
  description: 再次将茄子放入烤箱，将烤箱温度设置为 200℃ ，烤制 4-7 分钟
- number: 11
  description: 取出，关闭烤箱电源
tips: 最终成品和楼下烧烤摊的烤茄子差不多，太香了！; **注意事项：**; 茄子表面有水分、未涂满食用油或未使用叉子扎孔可能导致**茄子在烤制的过程中爆裂**; **可以改进的环节：**; 第一次用刀划口子的时候，可以直接将茄子竖直切成两半，然后切割出纹路后涂抹上酱料; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
