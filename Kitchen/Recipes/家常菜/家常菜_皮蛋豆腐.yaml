id: 10386
name: 皮蛋豆腐
cuisine: 家常菜
difficulty: 1
duration: 5
calories: 566
servings: 2
tags:
- 下饭菜
- 凉拌
description: 皮蛋豆腐是一道清爽开胃的凉拌家常菜，松花蛋 Q 弹滑嫩，嫩豆腐入口即化，咸香微酸的口味特别下饭。豆腐富含优质植物蛋白和钙，皮蛋则提供铁、维生素 A 等营养素，搭配食用易于消化吸收。制作过程几乎零门槛，新手也能轻松完成，从备料到上桌仅需 大约 5 分钟。
ingredients:
- name: 皮蛋 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 内酯豆腐 1 盒
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 2.5g
  amount: 0
  unit: 适量
  isMain: false
- name: 醋 15 ml
