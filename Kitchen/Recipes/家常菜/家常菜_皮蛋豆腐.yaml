steps:
- number: 1
  description: 先把皮蛋剥壳，切成四瓣。
- number: 2
  description: 嫩豆腐切块或者切片放中间。
- number: 3
  description: 将生抽、白砂糖、醋、香油、辣椒油调成酱汁，淋上去。
- number: 4
  description: 最后可选撒上花生碎、葱花、香菜。
tips: 豆腐先焯水去豆腥味可以去除豆腥味; 皮蛋切瓣时刀上可以抹点香油防止粘刀; 参考资料：[涼拌皮蛋豆腐 by 低配版小當家 - 愛料理](https://icook.tw/recipes/437531); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
