steps:
- number: 1
  description: 五花肉切方块。
- number: 2
  description: 准备好各种香料。
- number: 3
  description: 肉放开水中洋淖一下。
- number: 4
  description: 炒锅放油加入几粒冰糖，熬至起泡时，入五花肉翻炒上色。
- number: 5
  description: 加入老抽、生抽、盐、腐乳汁、各种香料等，翻炒后加入开水。
- number: 6
  description: 从炒锅倒入高压锅，压15至20分钟。
- number: 7
  description: 再倒入炒锅再加几粒冰糖并大火收汁。
- number: 8
  description: 加入鹌鹑蛋。
- number: 9
  description: 待汤汁粘稠后，即可出锅装盘。
