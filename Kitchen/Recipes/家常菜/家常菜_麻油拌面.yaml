id: 10353
name: 麻油拌面
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 451
servings: 2
tags:
- 快手菜
- 煮
description: 麻油香气浓郁，搭配老抽与胡椒粉简单调味，咸香适口，是一道省时省钱的家常拌面。面条提供充足碳水化合物，麻油含有不饱和脂肪酸与维生素 E，能为身体补充能量。制作毫无难度，厨房新手也能轻松上手，从煮水到拌好只需大约十分钟。
steps:
- number: 1
  description: 将水倒入锅中并煮沸 （喜欢吃 q 弹面的同学，可在水里加入 30 克盐，用盐水煮出来的面会比较 q 弹）
- number: 2
  description: 将快熟面放入锅中 3 分钟（也可参考当下品牌快熟面的烹饪时间）
- number: 3
  description: 当面开始散了可以开始搅拌，让面受热均匀
- number: 4
  description: 将水滤干把面倒入碗中
- number: 5
  description: 按照上面的计量放入麻油，老抽，胡椒粉，生抽（可选）
- number: 6
  description: 筷子搅拌均匀
- number: 7
  description: 一道简单即省钱的懒人麻油拌面就完成啦
