id: 10301
name: 印度焖饭
cuisine: 家常菜
difficulty: 5
duration: 90
calories: 730
servings: 2
description: 印度焖饭是源自莫卧儿帝国时期的皇家料理，米粒细长、香料气息浓郁，鸡肉嫩滑、米饭粒粒分明，层次丰富。富含蛋白质和多种香料精华，能提振食欲。制作步骤较繁琐，对新手不太友好，全程约需 90 分钟（鸡肉需提前腌制 1 小时）。
ingredients:
- name: 鸡腿肉 500g（去骨，切大块）
  amount: 0
  unit: 适量
  isMain: false
- name: 酸奶 100ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 15g，磨碎
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 6 瓣（约 18g），磨碎
  amount: 0
  unit: 适量
  isMain: false
- name: 红辣椒粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜黄粉 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 印度综合香料粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 柠檬汁 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 巴斯马蒂香米 300g（提前浸泡 30 分钟）
  amount: 0
  unit: 适量
  isMain: false
- name: 水 2000ml（煮米用）
  amount: 0
  unit: 适量
  isMain: false
- name: 月桂叶 2 片
  amount: 0
  unit: 适量
  isMain: false
- name: 小豆蔻 3 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 丁香 4 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 肉桂棒 1 根（约 5cm）
  amount: 0
  unit: 适量
  isMain: false
- name: 八角 1 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 3 个（约 300g），切薄片
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 50ml（炸洋葱用）
  amount: 0
