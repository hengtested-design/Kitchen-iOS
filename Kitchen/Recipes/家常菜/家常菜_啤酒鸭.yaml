id: 10166
name: 啤酒鸭
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 170
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/啤酒鸭/啤酒鸭.jpeg
description: 这是一道风味独特的家常菜肴，鸭肉鲜香软烂，透着淡淡啤酒清香，热而不浮、香而不腻。鸭肉富含蛋白质，啤酒去腥增香，搭配食用更有滋味。做法对新手友好，从备料到出锅大约需要 1 小时。
ingredients:
- name: 鸭肉半只（约 1kg）
  amount: 0
  unit: 适量
  isMain: false
- name: 啤酒 800ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽酱油 10-15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽酱油 5-10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 5 片
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜头 12 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒 5 个
  amount: 0
