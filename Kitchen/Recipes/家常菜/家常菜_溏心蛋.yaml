id: 10089
name: 溏心蛋
cuisine: 家常菜
difficulty: 3
duration: 15
calories: 72
servings: 2
description: 这是一道用普通电锅就能轻松做出的家常蛋料理，蛋黄呈现流动的溏心状态，口感嫩滑香醇。每颗鸡蛋提供约 6 克优质蛋白质，尤其适合健身人群补充营养。制作过程简单明了，只要掌握好加热和静置的时间，新手也能快速上手，全程仅需 大约 15 分钟。
ingredients:
- name: 鸡蛋 1 颗或更多（只要您的电锅装得下，不管有几颗鸡蛋都可以）
  amount: 0
  unit: 适量
  isMain: false
- name: 淹过鸡蛋约 2 公分的冷水
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将鸡蛋放入电锅中。鸡蛋不可互相堆叠，应皆在底部，并留有空间可以晃动
- number: 2
  description: 倒入淹过鸡蛋约 2 公分的冷水
- number: 3
  description: 开盖，使用最大功率加热至水滚起（大约 85 - 95 度，稍微滚动，不需完全沸腾）
- number: 4
  description: 关火，盖上盖子，让鸡蛋静置。
- number: 5
  description: 沥干水分，用冷水冲洗鸡蛋约 1 分钟，即可去壳食用。
tips: 如果觉得鸡蛋不够熟的小伙伴可以依照自己的喜好添加更多的水。; **警告** 溏心蛋有沙门氏菌感染的风险。不建议静置 5 分钟以内。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
