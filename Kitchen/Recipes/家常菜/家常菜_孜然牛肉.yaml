id: 10173
name: 孜然牛肉
cuisine: 家常菜
difficulty: 3
duration: 45
calories: 612
servings: 2
tags:
- 咸鲜
- 炒
description: 孜然牛肉是一道香辣鲜嫩的家常小炒，浓郁的孜然风味与牛肉的软滑、青椒的清脆融合得恰到好处。牛肉富含优质蛋白和铁，搭配青椒还能补充维生素，营养均衡。制作需要一些刀工和火候把控，适合有一定下厨基础的爱好者尝试。算上腌肉和备菜，全程大约 45 分钟就能端上餐桌。
steps:
- number: 1
  description: 首先将小米椒切碎，和孜然粒一起放入捣药罐捣碎成颗粒，这样更入味。如果时间紧张可跳过捣碎步骤
- number: 2
  description: 青椒切头去籽（喜欢辣的可不去），切成丝。葱切段。
- number: 3
  description: 牛肉提前解冻，过一边水洗干净，晾干或用厨用纸吸干，将牛肉顺着纹理切成片
- number: 4
  description: 然后进行腌肉，加入生抽，淀粉，油，均匀搅拌，静止 30 分钟。腌肉方法也可参考[学习腌](../../tips/learn/学习腌.md)
- number: 5
  description: 热锅下油，放入葱，爆出香味后放入腌好的牛肉煸炒
- number: 6
  description: 牛肉变色后均匀放入孜然辣椒颗粒并炒熟
- number: 7
  description: 然后下入青椒丝，断生后放盐
- number: 8
  description: 大🔥炒 1 分钟后关火再翻炒 30 秒保证受热均匀即可出锅
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
