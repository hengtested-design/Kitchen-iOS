id: 10376
name: 水油焖蔬菜
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 92
servings: 2
tags:
- 快手菜
description: 水油焖蔬菜是一道简单快手的家常佐餐，通过沸水加几滴油和调料，让叶菜口感软嫩、色泽油亮，既清爽又带有淡淡油香。这种做法有助于提高脂溶性维生素的吸收率，比生吃蔬菜更有营养价值。烹饪难度低，对新手非常友好，从洗菜到出锅一般只需 10 分钟。
steps:
- number: 1
  description: 洗净蔬菜
- number: 2
  description: 锅中加入 150ml 水，并烧开。（水不需要能完全没过蔬菜）
- number: 3
  description: 加入 3g 盐
- number: 4
  description: （可选）加入 3ml 蚝油
- number: 5
  description: 加入 2ml 食用油
- number: 6
  description: 下菜， 翻拌一下，然后盖上锅盖焖 1 分钟
- number: 7
  description: 盛盘
tips: '* 不确定咸淡的情况， 可以先少放盐， 在出锅前尝味， 考虑调整加盐; * 可以用鸡汤、骨头汤等替代水， 更好吃; * 焖的时间不可过长; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
