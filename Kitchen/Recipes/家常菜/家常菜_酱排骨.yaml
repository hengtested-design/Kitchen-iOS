id: 10245
name: 酱排骨
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 1351
servings: 2
tags:
- 咸鲜
- 炒
cover: https://s.chuimg.com/酱排骨/酱排骨.jpeg
description: 酱排骨色泽酱红，肉质酥烂，骨香浓郁，汁浓味鲜，咸中带甜，是一道经典的家常菜。排骨富含优质蛋白质和钙质，营养均衡。制作涉及炒糖色和较长时间炖煮，对新手有一定挑战，但只要按步骤操作，也能顺利掌握。预计从备料到出锅约需 1 小时。
steps:
- number: 1
  description: 起锅烧热水，放入排骨、姜片、料酒，煮开后用勺子舀去白色油沫，2-3 分钟后出锅
- number: 2
  description: 冷水清洗排骨，清洗 2-3 遍
- number: 3
  description: 小火起锅，加入食用油，加入白砂糖 ，轻轻搅拌到糖水变成黄色
- number: 4
  description: 倒入排骨翻炒 30 S 后，加入生抽、蚝油、五香粉、蒜、小米椒后翻炒 30 S 后，加入清水没过排骨
- number: 5
  description: 大火煮 30 分钟，加入老抽上色，再煮 10 分钟
- number: 6
  description: 起锅摆盘
tips: '* 增加味道的可以考虑加入豆瓣酱、番茄酱等; * 大火煮时间可以根据每个人情况做调整; * 煮排骨期间，可以顺道放入 2-3 个 鸡蛋一起煮，做成简易版卤蛋; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
