id: 10410
name: 金钱蛋
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 427
servings: 2
tags:
- 下饭菜
- 煎
description: 金钱蛋是一道外焦里嫩、咸香微辣的湘味家常菜，煎至金黄的蛋片形似铜钱，寓意吉祥。鸡蛋与青红椒搭配，富含优质蛋白质和多种维生素，营养均衡。制作难度中等，新手稍加练习也能掌握，全程约需 30 分钟即可完成下饭菜。
ingredients:
- name: 鸡蛋 5 个
  amount: 0
  unit: 适量
  isMain: false
- name: 玉米淀粉 40 g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 20-35 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 线椒 15 g
  amount: 0
  unit: 适量
  isMain: false
- name: 小米辣 6-15 g（约 2-5 个）
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 10 g（约 2-3 瓣）
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 3 g（约 1-2 根）
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 5 g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡蛋冷水下锅，大火煮开转小火煮 8 分钟
- number: 2
  description: 用自来水冲凉，方便剥皮
- number: 3
  description: 蒜切沫（粒径不大于 1 mm），线椒和小米辣切小粒（约 2-3 mm）
- number: 4
  description: 每个熟鸡蛋沿短轴切成体积类似的 4 份
- number: 5
  description: 如果打算沾淀粉，每片鸡蛋粘上淀粉，抖掉多余的淀粉
- number: 6
  description: 锅内放入 25 ml 油（如果不沾淀粉，放 20 ml），放入熟鸡蛋片
- number: 7
  description: 煎至微焦黄后，补 10 ml 油（如果不沾淀粉，补 10 ml），翻面
- number: 8
  description: 第二面微黄后，加入线椒、小米辣、蒜末煎制约一分钟，翻面
- number: 9
  description: 接着加豆瓣酱煎制约几十秒，翻面
- number: 10
  description: 生抽、耗油、糖调成汁，轻轻颠锅后即可出锅
tips: 原汁原味的做法建议放 15 g，不能吃辣的减少到 6 g，还可以剔除辣椒籽; 推荐使用不粘锅，使用不粘锅时初次放油可以减少 5 ml; 应确保鸡蛋剥皮时已经完全凝固; 不宜过度翻炒，容易散; 参考资料：[【步骤图】湘菜馆-金钱蛋的做法_湘菜馆-金钱蛋的做法步骤_家常菜_下厨房](https://www.xiachufang.com/recipe/107161729/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
