id: 10234
name: 蒜苔炒肉末
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 258
servings: 2
tags:
- 咸鲜
- 炒
description: 蒜苔炒肉末是北方家常菜，咸鲜脆嫩，蒜香浓郁。蒜苔富含膳食纤维和维生素，五花肉提供蛋白质，荤素搭配均衡。做法简单，备料轻松，新手也能快速上手。从切配到出锅大约只需 10 分钟。
ingredients:
- name: 蒜苔 1 扎（每扎蒜苔约 190g）
  amount: 0
  unit: 适量
  isMain: false
- name: 五花肉薄片 4 片（约 20g）
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜瓣 2 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 2g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 蒜苔切成 5cm 小段，备用
- number: 2
  description: 五花肉切成 5mm * 5cm 丝状，备用
- number: 3
  description: 蒜瓣拍碎切成末，备用
- number: 4
  description: 热锅，锅内放入 10ml 食用油。等待 10 秒让油温升高
- number: 5
  description: 放入蒜末，中火翻炒 **10 秒** 将蒜末炒出香味
- number: 6
  description: 放入五花肉和 5ml 生抽，中火翻炒 **30 秒** 将肉炒熟并上色
- number: 7
  description: 将蒜苔放入锅内并加入 10ml 生抽，翻炒 **30 秒**
- number: 8
  description: 锅内加入 20g 水，中火翻炒 **5 分钟** 将蒜苔炒至稍稍变软
- number: 9
  description: 最后加入 2g 食盐，中火翻炒 **30 秒**，即可出锅装盘
tips: 加入食盐前可尝一下咸淡，自行决定是否增减盐量; 选用五花肉薄片是因为切肉简单且不用腌制即可入味; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
