id: 10366
name: 印度葫芦丸子
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 571
servings: 2
tags:
- 炸
description: 这道北印度素菜将葫芦擦丝与鹰嘴豆粉团成丸子，油炸后浸入番茄洋葱咖喱，外酥内软、酱汁浓郁香辛。瓠瓜清润、鹰嘴豆粉提供植物蛋白与膳食纤维，是一道饱腹又均衡的素食。制作涉及油炸和熬酱，步骤稍多但按序操作不难掌握，全程大约需要 40 分钟。
