id: 10072
name: 酱炖蟹
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 468
servings: 2
tags:
- 咸鲜
- 下饭菜
- 炖
description: 这道菜是浙江平湖地区的秋日限定咸鲜风味，蟹黄绵润裹着酱香，蟹肉清甜，汤汁拌饭一绝。富含优质蛋白和微量元素。难度适中，适合有基础的新手，从准备到出锅大约 30 分钟。
ingredients:
- name: 螃蟹 500 g（约 3-4 只中等河蟹）
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 30-50 g
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 0-15 g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 菜油 20 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄酱 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 5 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老姜 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1 个（约 50 g）
  amount: 0
  unit: 适量
  isMain: false
- name: 猪肉末 50 g
  amount: 0
  unit: 适量
  isMain: false
- name: 水 500 mL
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 把螃蟹刷洗干净，然后在砧板上对半劈开
- number: 2
  description: 锅里下菜油，放入姜末和豆瓣酱爆香，加入冰糖炒化，直到冒小气泡就盛出
- number: 3
  description: 在盘子里铺上一层酱，然后把切好的螃蟹切开面朝下，整齐排放在酱上
- number: 4
  description: 放点葱段和姜片，建议敲个鸡蛋或在盘底铺肉末
- number: 5
  description: 上锅蒸 10-12 分钟
tips: 咸口放 50 g 豆瓣酱，甜口减少豆瓣酱的用量并加入冰糖和番茄酱; 出锅后再撒上一点葱花会更香也更好看; 参考资料：[秋风起，平湖这道美味很下饭_潮新闻官网](https://tidenews.com.cn/news.html?id=2925971); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
