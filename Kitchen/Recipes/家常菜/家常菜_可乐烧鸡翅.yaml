id: 10051
name: 可乐烧鸡翅
cuisine: 家常菜
difficulty: 2
duration: 60
calories: 240
servings: 2
tags:
- 咸甜
- 烧
cover: https://i01piccdn.sogoucdn.com/145266f374de86d1
ingredients:
- name: 鸡翅
  amount: 500
  unit: 克
  isMain: true
- name: 可乐
  amount: 200
  unit: 毫升
  isMain: true
- name: 姜
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒
  amount: 0
  unit: 适量
  isMain: false
- name: 盐
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将买回来的鸡翅洗净
- number: 2
  description: 用刀在鸡翅上划上几刀，以便更好的入味
- number: 3
  description: 把鸡翅倒进锅里，锅里加上适量的水，放上些姜片和花椒用水焯一下
- number: 4
  description: 我焯水时多煮了一会（在烧的时候也节省时间，烧得也更软烂些）
- number: 5
  description: 将焯好的鸡翅捞出沥水备用
- number: 6
  description: 锅里放少许的油，将姜段放进锅里爆香
- number: 7
  description: 再将焯好的鸡翅也放进去翻炒一会
- number: 8
  description: 接着烹入料酒和酱油再炒一会
- number: 9
  description: 这时倒入可乐，可乐要没过鸡翅，用中小火烧15到20分钟
- number: 10
  description: 烧至汤汁粘稠，再放上适量的盐收干即可
