id: 10159
name: 卤菜
cuisine: 家常菜
difficulty: 3
duration: 60
calories: 467
servings: 2
tags:
- 咸鲜
- 下酒
cover: https://s.chuimg.com/卤菜/卤菜.jpeg
description: 这是一道经典中式卤味，肉质鲜嫩入味，香气浓郁，卤汁可反复使用、越陈越香，适合做凉菜、下酒或搭配主食。菜品富含优质蛋白和多种维生素，营养均衡。制作需要一点耐心，但步骤清晰，对新手比较友好。提前浸泡去血水、熬糖色和高压卤制约需 1 小时，再浸泡过夜让风味充分渗入，第二天取出切片即可享用。
ingredients:
- name: 卤料包 1 包（约 10g）
  amount: 0
  unit: 适量
  isMain: false
- name: 黄豆酱 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 南腐乳 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 半个（约 100g）
  amount: 0
