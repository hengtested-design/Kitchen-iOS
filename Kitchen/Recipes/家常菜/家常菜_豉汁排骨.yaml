id: 10241
name: 豉汁排骨
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 1513
servings: 2
tags:
- 蒸
description: 这是一道粤式茶楼里的人气蒸点，豉香醇厚，排骨滑嫩脱骨。排骨提供优质蛋白和钙质，发酵豆豉增添风味也更利吸收。做法需经过泡洗、腌制和控火蒸制，对新手稍有考验，但步骤清晰易上手，从备料到出锅大约只需 1 小时。剩余的汤汁用来拌饭或拌面格外鲜美。
ingredients:
- name: 肋排 500 g
  amount: 0
  unit: 适量
  isMain: false
- name: 阳江豆豉 15 g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜蓉 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜末 5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 3 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 生粉 8 g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 20 ml（不打算淋热油为 10 ml）
  amount: 0
  unit: 适量
  isMain: false
- name: 清水 30 ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将排骨用冷水浸泡 10 分钟泡去血水，换水重复 2 次，用厨房纸吸干
- number: 2
  description: 将豆豉放入水中浸泡 5 分钟
- number: 3
  description: 将所有食材混合（食用油放 10 ml），腌制 8-30 分钟
- number: 4
  description: 水开后上锅蒸 18 分钟
- number: 5
  description: 焖 2 分钟
- number: 6
  description: 锅中倒入 10 ml 热油，加热到 180-200 ℃
- number: 7
  description: 均匀撒上葱花和白芝麻，热油浇在撒料上
tips: 豆豉浸泡后稍微剁碎会更入味; 蒸制时间随排骨大小调整，以筷子能轻松插入软骨处为准; 传统的豉汁排骨不放撒料和淋热油; 吃剩的汤汁可以用来拌饭或者拌面; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
