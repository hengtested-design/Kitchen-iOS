steps:
- number: 1
  description: 加入以下食材，注意不要超过容器的 3/4
- number: 2
  description: 夸赞一下自己🥰
- number: 3
  description: 微波炉（高火）加热 **1分钟** （至蓬松蛋糕形态）
- number: 4
  description: 取出杯子（烫手啊啊啊啊↑）并拍朋友圈就可以吃了
tips: 在夸赞自己之前的操作可以重复多遍做出更大的蛋糕; 泡打粉用来让蛋糕更蓬松 大多不含铝 几块钱一包 可以买了在家备着; 在 **加入任何喜欢的口味食材！** 这一步骤中 若加入**液体**（如牛奶） 请务必确保下一步可以搅和成**稠酸奶状** 建议少量多次加入以防止水分过量而导致成品湿瘪; **食材不要超过容器的3/4!!**; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
