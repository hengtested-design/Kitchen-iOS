id: 10270
name: 空气炸锅鸡翅中
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 504
servings: 2
tags:
- 快手菜
- 炸
cover: https://s.chuimg.com/空气炸锅鸡翅中/空气炸锅鸡翅中.jpeg
description: 这是一道方便省事的家常快手菜，鸡翅外焦里嫩，自带油脂香气，比快餐店的更对胃口。鸡翅中富含优质蛋白和脂肪，能量充足。对新手非常友好，实际操作只需几分钟，全程大约四十分钟就能吃上。
ingredients:
- name: 鸡翅中 6 个（泰森奥尔良鸡翅中，其他品牌例如圣农嘟嘟翅可能会大一些，请自行根据食量斟酌）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡翅从冰箱拿出来，鸡翼面朝下放入锡纸烤盘，撒上罗勒碎，盖上保鲜膜自然解冻 20 分钟
- number: 2
  description: 撒上罗勒碎，空气炸锅 200°C，10 分钟
- number: 3
  description: 翻面，撒上罗勒碎，空气炸锅 200°C，7 分钟
tips: 推荐购买温控比较好的空气炸锅，不然可能会糊; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
