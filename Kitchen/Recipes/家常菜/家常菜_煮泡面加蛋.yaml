id: 10326
name: 煮泡面加蛋
cuisine: 家常菜
difficulty: 1
duration: 10
calories: 550
servings: 2
tags:
- 快手菜
- 煮
description: 煮泡面加蛋是一道便捷的快手主食，口感顺滑，汤味浓郁，适合随时填饱肚子。主要提供碳水化合物和蛋白质，能快速补充能量。做法极其简单，只需烧水、煮面、打入鸡蛋煮熟，新手也能轻松掌握，全程大约 10 分钟即可完成。
ingredients:
- name: 单人，能支撑一个成年人不饥饿状态约 3 至 4 小时。
  amount: 0
  unit: 适量
  isMain: false
- name: 泡面 1 包
  amount: 0
  unit: 适量
  isMain: false
- name: 水 550ml-1000ml，根据锅的情况。以能完整将泡面浸入其中为准。
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1 个
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 先将水加热至沸腾（火候不做严格要求，使用热水会更快）
- number: 2
  description: 将取出的面饼放入锅中
- number: 3
  description: 将泡面里附带的佐料放入锅中
- number: 4
  description: 取出筷子轻微拨动泡面，使佐料充分溶解，面饼充分浸泡受热
- number: 5
  description: 盖上锅盖等待约 1 分钟至锅内水再次沸腾
- number: 6
  description: 去壳鸡蛋，加入锅中
- number: 7
  description: 等待约 3 至 4 分钟，即可
tips: 本指南中的鸡蛋包括但不仅限于：生鸡蛋，熟鸡蛋，卤蛋等; 原材料泡面可在楼下便利店购买; 可根据个人需要加入佐料，和其他食材包括但不仅限于：火腿肠，生菜，小肉丝，辣条，鱼干，虾仁，鸡腿; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
