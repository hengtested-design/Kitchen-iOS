id: 10156
name: 冬瓜酿肉
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 578
servings: 2
tags:
- 咸鲜
- 蒸
cover: https://s.chuimg.com/冬瓜酿肉/冬瓜酿肉.jpeg
description: 冬瓜酿肉是一道荤素搭配的家常蒸菜，口感鲜嫩爽滑，肉馅的咸香与冬瓜的清甜相互融合，清爽不腻。猪肉末提供优质蛋白质和必需氨基酸，冬瓜则有助于清热利尿、补充水分。做法简单，即使是新手也能轻松上手，只需稍加练习卷肉技巧即可。从备料到出锅，大约需要 30 分钟。
ingredients:
- name: 猪肉末 300g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1 个（可选,不习惯的人可能会有点腥）
  amount: 0
  unit: 适量
  isMain: false
- name: 冬瓜 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱花（一根,约 20g）
  amount: 0
  unit: 适量
  isMain: false
- name: 胡椒粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 水淀粉 25g（淀粉 25g,水 50ml）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱姜末（姜 3-4 片约 30g, 取上面一根葱花中的葱白部分即可）
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 20g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 冬瓜去皮，切成 25cm 长 3cm 厚的片
- number: 2
  description: 将切好的冬瓜放入碗中，放入 15g 盐，将冬瓜抹匀，放置 10 分钟
- number: 3
  description: 放置冬瓜的同时，换个碗放入肉末，葱姜末， 5g 盐，淀粉 5g，胡椒粉，生抽，胡椒粉
- number: 4
  description: 使用筷子在肉末中进行顺时针搅拌，搅拌到食材颜色没有明显对比（约 2 分钟）
- number: 5
  description: 将腌制好的冬瓜（会变软）使用清水洗三遍
- number: 6
  description: 拿出 1 片冬瓜片卷起来，并把肉塞进去
- number: 7
  description: 放入碟子中摆到碟子的边缘
- number: 8
  description: 打入 1 个鸡蛋到中间圆圈处
- number: 9
  description: 放入普通铁锅中水烧开后，蒸 15 分钟，盖上锅盖
- number: 10
  description: 开盖，取出蒸好的冬瓜酿肉
- number: 11
  description: 将冬瓜酿肉碟子的水倒入锅中，放入水淀粉，加入 50ml 清水倒入锅中烧开
- number: 12
  description: 淋到冬瓜酿肉上
tips: 操作时，拿出冬瓜酿肉时注意碟子很烫，小心操作。; 参考资料：[b站视频](https://www.bilibili.com/video/BV1oF411F7wD?spm_id_from=333.337.search-card.all.click&vd_source=9f568660d497311d3f945e5dce319705); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
