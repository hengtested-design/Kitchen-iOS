steps:
- number: 1
  description: 将鳝鱼切成三段后切成细丝
- number: 2
  description: 加入 0.5 g 胡椒粉、3 g 料酒搅拌均匀，再加入 5 g 香油腌制
- number: 3
  description: 热油滑锅
- number: 4
  description: 加入植物油，烧到 6 成热
- number: 5
  description: 加入一半蒜末和全部姜末，翻炒几下
- number: 6
  description: 加入鳝丝，中火爆炒 30 秒
- number: 7
  description: 边缘淋入 10 g 料酒，翻炒几下
- number: 8
  description: 加入生抽，炒匀
- number: 9
  description: 加入蚝油、老抽，翻炒几下
- number: 10
  description: 加入食用盐、白糖、3 g 胡椒粉，炒匀
- number: 11
  description: 淀粉和水混合为水淀粉，倒入锅中，收汁至浓稠
- number: 12
  description: 装盘，撒上蒜蓉、葱花
- number: 13
  description: 另起锅烧热，加入猪油，烧至七成热，浇在鳝丝上
tips: 不能将鳝鱼的血洗得太干净，否则鳝鱼很容易发黑发臭; 鳝鱼可以让摊主帮忙宰杀; 可以多加一些胡椒粉和白糖，有利于去腥增香; 参考资料：[“响油鳝丝”的家常做法，味道很赞，先收藏了 - YouTube](https://www.youtube.com/watch?v=X2DvbhnWcN4); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
