id: 10051
name: 响油鳝丝
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 556
servings: 2
tags:
- 咸鲜
- 下饭菜
description: 响油鳝丝是一道经典的江浙沪家常菜，鳝丝鲜嫩滑爽，蒜香浓郁，酱汁微甜，淋上热猪油后香气四溢，非常下饭。鳝鱼富含优质蛋白和 DHA，营养丰富。这道菜对刀工和火候有一定要求，难度适中，新手需要稍加练习。从备料到出锅，一般 大约 40 分钟就能端上餐桌。
ingredients:
- name: 鳝丝 400 g
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 40 g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜末 20 g
  amount: 0
  unit: 适量
  isMain: false
