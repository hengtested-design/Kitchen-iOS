id: 10109
name: 葱油
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 2069
servings: 2
tags:
- 咸鲜
- 凉拌
description: 葱油是一道提香增鲜的家常调味油，带着浓郁的葱香和开洋的复合鲜味，用来拌馅、凉拌或热菜明油都很适合。主要提供油脂能量，葱姜等辛香料还含有植物活性成分，可辅助去腥开胃。做法简单，对新手友好，一般准备加熬制大约 30 分钟就能完成。
ingredients:
- name: 油 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 80g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 150g
  amount: 0
  unit: 适量
  isMain: false
- name: 开洋 50g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 开洋泡入 50 度温水中，加入 10ml 料酒去腥，泡 10 分钟后取出沥干水分
- number: 2
  description: 葱，香菜洗净，切成 5cm 长的段，擦干表面水份
- number: 3
  description: 洋葱切成丝，在锅里用热水煮 5 分钟，取出沥干水份
- number: 4
  description: 姜去皮，切成片
- number: 5
  description: 锅里倒入全部油，放入上述预处理好的材料，开中小火炸 20 分钟
tips: 渣后的开洋葱渣也可以食用，葱油可以滤掉这些料渣，也可以保留; 开洋可以极大提升葱油鲜香，并增加鲜甜风味; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
