id: 10394
name: 莴笋叶煎饼
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 477
servings: 2
tags:
- 快手菜
- 煎
cover: https://s.chuimg.com/莴笋叶煎饼/莴笋叶煎饼.jpeg
description: 莴笋叶煎饼是一道简单快手的家常小吃，口感外酥里嫩，带有莴笋叶的清香味。莴笋叶富含维生素和膳食纤维，搭配鸡蛋补充优质蛋白，营养均衡。制作过程无需复杂技巧，只需搅拌并煎制两面，新手也很容易上手，预计从备料到出锅仅需 大约 10 分钟。
steps:
- number: 1
  description: 莴笋叶剁碎，加入鸡蛋、生粉、生抽、鸡精搅拌均匀备用
- number: 2
  description: 起锅烧油，倒入莴笋叶浆汁，均匀平铺在锅面上
- number: 3
  description: 第一面炸 120 S 后，翻面再炸 60 S 后出锅
tips: '* 选择莴笋叶是某省市买到的蔬菜包基本都包含莴笋，可以换成韭菜等; * 莴笋叶直接焯水后凉拌有苦味，所以选择做成煎饼的配菜; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
