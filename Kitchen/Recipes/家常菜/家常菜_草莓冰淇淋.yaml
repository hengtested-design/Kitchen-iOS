id: 10126
name: 草莓冰淇淋
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 1653
servings: 2
description: 这是一道不需要搅拌机就能轻松制作的家常草莓冰淇淋，果香浓郁、口感绵密。草莓富含维生素 C，搭配奶香四溢的炼乳和奶油，能提供能量和钙质。做法简单不考验厨艺，新手也能一次成功。全程制作耗时约八小时，其中大部分是冷冻时间，实际动手只需短短几十分钟。
ingredients:
- name: '草莓糖浆:'
  amount: 0
  unit: 适量
