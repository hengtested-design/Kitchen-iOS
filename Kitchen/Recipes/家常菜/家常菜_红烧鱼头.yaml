steps:
- number: 1
  description: 锅中热油，先爆香姜、蒜、葱白；
- number: 2
  description: 放入胖鱼头，两面煎透，表面微焦；
- number: 3
  description: 倒入开水，与鱼头持平；
- number: 4
  description: 调入生抽、老抽、料酒、白糖、盐、鸡粉；
- number: 5
  description: 盖上锅盖，大火烧，期间间隔地将汤汁浇在鱼头表面；
- number: 6
  description: 最后看汤汁烧得差不多了，关火。装盘撒葱花装饰下。
