id: 10361
name: 凉拌豆腐
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 343
servings: 2
tags:
- 快手菜
- 凉拌
description: 这道凉菜清爽可口，富含植物蛋白和钙质，低脂健康，制作简单快捷，一般初学者只需要 10 分钟即可完成。
ingredients:
- name: 豆腐 250 g （约 1 块常见大小的豆腐）
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 2-3 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 香油 5 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 醋 5 ml（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 2 g（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒油 5 ml（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将 豆腐 切成 2 cm 见方的小块，备用。
- number: 2
  description: 锅中加入 500 ml 饮用水，大火烧开。
- number: 3
  description: 放入 豆腐 块，煮 **1-2 分钟**，以去除豆腥味并使豆腐口感更紧实。
- number: 4
  description: 将 煮好的 豆腐 块捞出，沥干水分，放入碗中，备用。
- number: 5
  description: 将 小葱 洗净，切成葱花，备用。
- number: 6
  description: 将 大蒜 去皮，切成蒜末，备用。
- number: 7
  description: 在一个干净的小碗中，加入 15 ml 生抽，5 ml 香油，5 ml 醋（可选），2 g 白糖（可选）。
- number: 8
  description: 加入切好的 大蒜末。
- number: 9
  description: 搅拌均匀，使 白糖 充分溶解，酱汁混合均匀。
- number: 10
  description: 将制作好的酱汁均匀淋在 豆腐 块上。
- number: 11
  description: 撒上切好的 小葱花。
- number: 12
  description: 根据个人喜好，淋上 5 ml 辣椒油（可选）。
- number: 13
  description: 用 筷子 或勺子轻轻拌匀，即可食用。
tips: 制作凉拌豆腐时，建议选用质地较硬的北豆腐或老豆腐，不易碎裂，口感更佳。; 如果喜欢更清淡的口感，可以省略醋和辣椒油。; 酱汁的比例可以根据个人口味进行调整。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
