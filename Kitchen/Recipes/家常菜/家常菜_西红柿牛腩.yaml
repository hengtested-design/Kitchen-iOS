id: 10239
name: 西红柿牛腩
cuisine: 家常菜
difficulty: 5
duration: 90
calories: 1569
servings: 2
tags:
- 酸甜
- 下饭菜
- 炒
description: 西红柿牛腩汤汁浓厚酸甜可口，牛肉软绵醇香，是道开胃下饭的家常菜。富含蛋白质、维生素和番茄红素，营养均衡。对新手有一定挑战，需要掌握炖肉火候和番茄炒汁的技巧。一般初学者大约需要 90 分钟完成。
ingredients:
- name: 西红柿 3-4 个（每个约 200g）
  amount: 0
  unit: 适量
  isMain: false
- name: 牛腩 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 20-30ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 牛腩切条、切块成长宽高均 2cm ，冷水下锅，开锅煮制 2 分钟去除血水，捞出冲洗干净
- number: 2
  description: 另起锅 2L 水烧开，加入 2cm 两段葱段、两片姜片、八角、料/黄酒 5-10ml，放入焯好的牛肉，盖盖炖制（砂锅 1 小时，高压锅炖肉模式 45 分钟），筷子能轻松插透就证明炖好了
- number: 3
  description: 西红柿去皮：西红柿头部滑十字至腰线，筷子/刀叉从果蒂捅入，煤气灶小火，一边转动一边烤，及时拿下来查看，起皮后撕下来，切块。越小越好
- number: 4
  description: 起锅烧油，油温 7 成热，葱、姜各 10g，番茄下锅，炒透炒出番茄红色，加入煮好的牛腩和原汤，原汤刚刚没过牛肉即可
- number: 5
  description: 根据个人口味放入盐、糖、生抽调味盖盖
- number: 6
  description: 开锅后大火继续炒制 3-5 分钟
- number: 7
  description: 待番茄汁呈中等粘稠程度后关火，散入葱花，盛盘
tips: 用火注意安全、用火注意安全、用火注意安全; 用砂锅/铝锅炖肉时，水开后转中小火/小火，使用高压锅见[学习使用压力锅](./../../../tips/learn/高压力锅.md); 教程中的番茄去皮方式是目前为止本人实践最快的方式; 绝对不用番茄酱和少加佐料，尽可能还原食材的原味; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
