id: 10377
name: 油醋爆蛋
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 471
servings: 2
tags:
- 咸鲜
- 快手菜
- 下饭菜
description: 这是一道湘味十足的家常快手下饭菜，酸辣鲜香，鸡蛋焦香蓬松裹满浓郁汤汁，十分开胃。鸡蛋提供优质蛋白质和卵磷脂，搭配香醋更有助于促进食欲。做法极其简单，新手友好，从准备到出锅仅需大约十分钟。
ingredients:
- name: 鸡蛋 4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 小米辣 10 g（约 3 个）
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 35-50 mL
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 香醋 15 mL
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 10-15 mL
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 0-5 g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡蛋不需打散，直接打入碗中备用
- number: 2
  description: 香葱切 3cm 长小段即可
- number: 3
  description: 蒜瓣和小米辣放入打蒜器，打成沫
- number: 4
  description: 将香醋、生抽、蚝油、白糖、水加入小碗，搅拌均匀作为糖醋料汁
- number: 5
  description: 油热倒入鸡蛋，等鸡蛋凝固之后铲成大块，倒入蒜沫、小米辣沫、倒入糖醋料汁
- number: 6
  description: 大火收汁、快出锅时加入葱段即可
tips: 亲测老恒和酿造香醋零添加口味最好，醋香是本菜灵魂所在。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
