id: 10412
name: 雷椒皮蛋
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 448
servings: 2
description: 雷椒皮蛋是一道卖相朴实但风味十足的家常凉菜，青椒的焦香与皮蛋的醇滑交融，酸辣开胃，尤其适合夏日佐餐。皮蛋富含蛋白质和矿物质，青椒提供丰富的维生素 C，大蒜则有助增进食欲。整道菜操作简单，新手也能轻松驾驭，从备料到完成大约只需 15 分钟。
ingredients:
- name: 皮蛋 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 青椒 4 根 （长 10-15cm，宽 2-4cm）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 （大约 10cm 即可，葱绿最佳）
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 3-4 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15-20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 陈醋 15-20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 6-10g
  amount: 0
  unit: 适量
  isMain: false
- name: 香油 5-7ml
  amount: 0
  unit: 适量
  isMain: false
- name: 小米辣 3-4 颗
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 青椒清洗，去除根部，侧面切开，去除内部的子后在案板压平，备用（一定要去除青椒子，否则会在锅里炸开）
- number: 2
  description: 葱切成半厘米小段，备用
- number: 3
  description: 蒜去皮，切成碎末，备用
- number: 4
  description: 皮蛋去皮，备用
- number: 5
  description: 小米辣，切成 5-10mm 的小段，备用
- number: 6
  description: 热锅，锅内放入 10ml - 20ml 食用油
- number: 7
  description: 放入全部青椒，改小火保持锅子温度，煎至青椒变软（可以用筷子试一下，插入即透即可）
- number: 8
  description: 关火，将皮蛋和青椒放入小铁盆中
- number: 9
  description: 方法 1： 有擀面杖且砸东西不会吵到邻居：用擀面杖的一头在小盆中砸击皮蛋和青椒，至皮蛋与青椒混合（选项）
- number: 10
  description: 方法 2：将青椒用手撕开，撕成大约半厘米的条状，用叉子将皮蛋压碎（选项）
- number: 11
  description: 小米辣
- number: 12
  description: 倒入生抽，陈醋，白糖，香油，以及其他未使用的备用食材
- number: 13
  description: 均匀搅拌
