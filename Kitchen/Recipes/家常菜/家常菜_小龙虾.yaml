steps:
- number: 1
  description: 小龙虾刷干净去虾线，葱切 2cm 葱段，姜蒜切末。
- number: 2
  description: 烧油，油微热, 下香叶、八角、桂皮、青花椒、花椒、子弹头辣椒。
- number: 3
  description: 香料出香气之后下锅葱姜蒜
- number: 4
  description: 葱姜蒜爆香后，加入郫县豆瓣、黄豆酱，炒出红油。
- number: 5
  description: 下小龙虾，翻炒至变色。
- number: 6
  description: 加入啤酒，等啤酒烧开后加入生抽，盐。
- number: 7
  description: 将小龙虾完全煮熟后出锅。
tips: 饭店应该都是油炸一遍，家庭油炸的话，太浪费了，所以在这个菜谱里用油比炒菜油多一些煎一下，实测同样好吃。; 去虾线后的虾肉比不去虾线的虾肉口感差一些，并且小龙虾去虾线对新手是一个挑战，能接受虾线的情况下不去虾线也可以。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
