id: 10298
name: 凉粉
cuisine: 家常菜
difficulty: 3
duration: 240
calories: 539
servings: 2
tags:
- 煮
cover: https://s.chuimg.com/凉粉/凉粉.jpeg
description: 凉粉是一道源自四川的传统小吃，口感冰凉爽滑，酸辣开胃，很适合夏天消暑。主要原料是豌豆淀粉，富含碳水化合物，能为身体快速补充能量。制作过程不算复杂，但需要耐心搅煮和长时间冷藏定型，对新手来说难度适中。从煮制到完成大约需要 3-4 小时，其中大部分是等待冷藏的时间，动手操作只需大约半 小时。
ingredients:
- name: 豌豆淀粉  100g
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜   3 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 小米辣  3 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒粉  10g
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油   10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 醋   10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖  3ml
  amount: 0
  unit: 适量
  isMain: false
