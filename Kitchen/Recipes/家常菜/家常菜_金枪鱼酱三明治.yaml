id: 10100
name: 金枪鱼酱三明治
cuisine: 家常菜
difficulty: 1
duration: 5
calories: 569
servings: 2
tags:
- 咸鲜
- 烤
description: 这道西式早餐三明治以水浸金枪鱼拌入蛋黄酱和俄式酸黄瓜汁，咸鲜微酸，口感绵密，配上烤脆的吐司格外饱腹。富含优质蛋白和 Omega-3 等营养，能快速补充能量。制作非常简单，只需混合酱料、用轻食机加热，新手也能在 5 分钟里轻松搞定。
ingredients:
- name: 水浸金枪鱼 65g
  amount: 0
  unit: 适量
  isMain: false
- name: 方形吐司片 2 片
  amount: 0
  unit: 适量
  isMain: false
- name: 蛋黄酱 50 mL
  amount: 0
  unit: 适量
  isMain: false
- name: 俄式酸黄瓜汁 10-15mL（可根据个人口味调整）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将金枪鱼、蛋黄酱、俄式酸黄瓜汁倒入碗中，用勺子搅拌，保证将金枪鱼块搅碎，酱整体呈糊状，并备用
- number: 2
  description: 将 1 片吐司放在轻食机上
- number: 3
  description: 将做好的金枪鱼酱涂抹到吐司上，建议 10-15ml
- number: 4
  description: 将另一片方形吐司片覆盖在上面，并按压轻食机，开机
- number: 5
  description: 待轻食机自动停止加热，即可装盘使用
tips: 金枪鱼酱可以在前一天晚上在冰箱冷藏; 金枪鱼酱建议冷藏时间不超过一周，切需要使用保鲜膜盖住; 注意在按压操作之前不要将轻食机电源接通，以免引发安全问题; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
