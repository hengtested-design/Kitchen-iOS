id: 10158
name: 凉拌鸡丝
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 293
servings: 2
tags:
- 凉拌
cover: https://s.chuimg.com/凉拌鸡丝/凉拌鸡丝.jpeg
description: 一道少油低卡的家常凉菜，鸡丝嫩滑入味，麻油与香醋调和出微麻微酸的清爽口感，适合夏日解腻。鸡胸肉富含优质蛋白且脂肪含量低。做法简单，新手也能轻松上手，从备料到完成大约只需 30 分钟。
ingredients:
- name: 鸡胸肉 200 克
  amount: 0
  unit: 适量
  isMain: false
- name: 麻油 5 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 4 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 香醋 4 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 3 克
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 2 克
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 20 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 姜切片，备用
- number: 2
  description: 锅中倒入 4 升水
- number: 3
  description: 加入鸡胸肉、姜片
- number: 4
  description: 倒入 20 毫升料酒
- number: 5
  description: 开大火不盖盖将水烧开
- number: 6
  description: 水开后转中火，用勺子将浮沫捞出
- number: 7
  description: 继续煮 **5-7** 分钟，如果是非冷冻肉煮 5 分钟，冷冻肉煮 7 分钟
- number: 8
  description: 鸡胸肉大小会影响成熟时间，用筷子插入鸡胸肉，如果能轻松插入，代表鸡肉熟了。如果不熟需延长煮制时间
- number: 9
  description: 用凉白开水冲泡鸡胸肉，使鸡胸肉降至室温
- number: 10
  description: 顺着鸡胸肉纹理将鸡胸肉撕成细丝
- number: 11
  description: 准备一个碗
- number: 12
  description: 碗中加入准备好的麻油、生抽、香醋、白糖、盐
- number: 13
  description: 搅拌料汁，使糖和盐尽量溶化
- number: 14
  description: 将料汁倒入鸡丝中，搅拌均匀
tips: 这道菜是隔离期间用现有材料做的，有条件可以加入香菜、小葱等进行调味，喜欢吃辣的可以加入辣椒油; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
