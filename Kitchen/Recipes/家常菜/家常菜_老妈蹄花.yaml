id: 10224
name: 老妈蹄花
cuisine: 家常菜
difficulty: 4
duration: 120
calories: 1425
servings: 2
cover: https://s.chuimg.com/老妈蹄花/老妈蹄花.jpeg
description: 老妈蹄花汤色奶白，猪蹄软烂脱骨，口感细腻，配上酸辣蘸汁十分开胃，是经典的川式家常菜。猪蹄富含胶原蛋白，白芸豆增添绵密口感，营养丰富。操作需要高压锅和提前浸泡，对新手有一定挑战，但按步骤来做不难掌握。含浸泡和压煮，全程大约需要 2 小时（不含提前一晚浸泡白芸豆的时间）。
ingredients:
- name: 猪蹄：3 根
  amount: 0
  unit: 适量
  isMain: false
- name: 白芸豆：200g
  amount: 0
  unit: 适量
  isMain: false
- name: 当归：2g
  amount: 0
  unit: 适量
  isMain: false
- name: 白胡椒粉：5g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜片：30g
  amount: 0
  unit: 适量
  isMain: false
- name: 当归：2g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜末：8g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡精：2g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽：25g
