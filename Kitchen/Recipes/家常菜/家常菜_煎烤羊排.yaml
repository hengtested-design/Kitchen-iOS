id: 10206
name: 煎烤羊排
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 1850
servings: 2
tags:
- 煮
description: 一道外酥里嫩、香气浓郁的料理，先以香料炖煮再煎出金黄脆壳，风味浓郁不腻，是家常宴客两相宜的硬菜。羊肉富含优质蛋白和铁、锌等矿物质，有助于温补气血。做法步骤稍多，但只要按流程走，新手也能拿下；使用高压锅全程约 1 小时，普通锅约 1.5 小时。
ingredients:
- name: 羊排 750g（建议选择带一些肥肉的）
  amount: 0
  unit: 适量
  isMain: false
- name: 桂皮 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 八角 1 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 白芷 6g
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 5 片
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 25g（注：若计划喝煮羊排的汤，则此处的盐在炖煮步骤中省略，在最后的煎烤步骤中加入）
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 孜然粒 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 烧烤撒料 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 孜然粉 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 白芝麻 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 1g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将羊排按照骨头分布，切成块状。
- number: 2
  description: 炒锅中加入冷水，放入全部羊排块，水沸腾后继续焯水 2 - 3 分钟，捞出备用。
- number: 3
  description: 将焯好水的羊排、桂皮、花椒、八角、白芷、香叶、料酒放入锅中（高压锅或普通锅）。
- number: 4
  description: 加入饮用水没过所有食材。如果使用高压锅，上汽后压 30 分钟。如果使用普通锅，炖煮 80 分钟。
- number: 5
  description: 将炖煮完成的羊排捞出，沥干水分，放入无油无水的炒锅 / 煎锅中。
- number: 6
  description: 中大火煎 6 - 7 分钟，直至羊排中的油脂被煎出，*表面呈金黄酥脆状态*。
- number: 7
  description: 锅中保留煎出的羊油，加入辣椒粉、孜然粒、烧烤撒料、孜然粉、白芝麻，翻炒均匀。
- number: 8
  description: 加入糖和盐（如果在炖煮步骤中未添加），翻炒均匀。
- number: 9
  description: 翻炒均匀后即可关火，盛盘。
tips: 花椒和白芷是这道菜的关键调料，不可缺少。; 炖煮时间不宜过长，羊排过于软烂则在煎制时容易碎裂。; 煎制时利用羊排自身煎出的油脂来炒香调料，风味更佳。; 焯水、炖煮、煎制过程中会产生较多羊油，处理时请注意不要直接倒入下水道，以防堵塞。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
