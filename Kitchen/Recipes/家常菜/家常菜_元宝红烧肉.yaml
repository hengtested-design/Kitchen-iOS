id: 10000
name: 元宝红烧肉
cuisine: 家常菜
difficulty: 1
duration: 60
calories: 260
servings: 2
tags:
- 咸甜
- 炖
cover: https://i02piccdn.sogoucdn.com/edfa476aaac07721
ingredients:
- name: 带皮五花肉
  amount: 800
  unit: 克
  isMain: true
- name: 老抽
  amount: 30
  unit: 克
  isMain: true
- name: 生抽
  amount: 60
  unit: 克
  isMain: true
- name: 料酒
  amount: 25
  unit: 克
  isMain: true
- name: 冰糖
  amount: 80
  unit: 克
  isMain: true
- name: 八角
  amount: 3
  unit: 个
  isMain: true
- name: 姜
  amount: 5
  unit: 片
  isMain: true
- name: 葱
  amount: 1
  unit: 根
  isMain: true
- name: 花椒
  amount: 40
  unit: 粒
  isMain: true
- name: 香叶
  amount: 3
  unit: 片
  isMain: false
