id: 10355
name: 示例菜
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 1265
servings: 2
cover: https://s.chuimg.com/示例菜/示例菜.jpeg
description: <!-- 这是 HowToCook 菜谱仓库中的示例菜谱模板文件。 -->
ingredients:
- name: 咖喱块 115g
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆 2 个（每个土豆大约重 120g，共约 240g）
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-15ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 土豆去皮、切成不超过 4cm 的大块，备用
- number: 2
  description: 咖喱块切碎，增加接触面积加速溶解，备用
- number: 3
  description: 热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高
- number: 4
  description: 放入土豆，保持翻炒至土豆*变软*（可以用筷子确认）<!-- 在描述过程时不得加入上文或原材料中未提及的食材。 -->
- number: 5
  description: 加水没过所有食材，沸腾后，将火调小然后**等待 15 - 20 分钟** <!-- 对于可以自行斟酌加量的食材，必须给出建议的范围 -->
- number: 6
  description: 关火，加咖喱并搅拌，等待直至咖喱融化 <!-- 凡是需要等待的步骤必须给出`等待时间计算公式`或`结束一个步骤的判断标准` -->
- number: 7
  description: 再开火，缓慢**搅拌 10 分钟**，防止糊锅
- number: 8
  description: 在外观*呈粘稠状态*后关火，盛盘
tips: <!-- 在这里额外补充一些注意事项、参考资料、安全须知等。 -->; 操作时，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水至没过食材。; 参考资料：[世界美食教程的微博视频](http://t.cn/EJ77yFy); <!-- 必须保留下面的文字。 -->; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。; <!-- 在提交 Pull Request 前，请删除模板中的所有注释。 -->
