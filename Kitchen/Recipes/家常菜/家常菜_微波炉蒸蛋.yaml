id: 10082
name: 微波炉蒸蛋
cuisine: 家常菜
difficulty: 1
duration: 10
calories: 151
servings: 2
tags:
- 快手菜
- 蒸
description: 一道用微波炉快速制作的嫩滑蒸蛋，口感细腻如布丁，属于家常快手菜。富含优质蛋白，易于消化吸收，很适合作为早餐或轻食。制作非常简单，新手也能轻松上手，全程约 10 分钟即可完成。
ingredients:
- name: 鸡蛋 2 个（约 100g 蛋液）
  amount: 0
  unit: 适量
  isMain: false
- name: 温水或高汤 100-120ml（蛋液体积的 1.0-1.2 倍）
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 1g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 2ml（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 香油 几滴（出锅用）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将鸡蛋打散，加入温水/高汤、盐、生抽，轻轻搅匀，尽量不要起泡。
- number: 2
  description: 将蛋液过筛倒入耐热碗中，表面若有气泡可用牙签轻戳。
- number: 3
  description: 覆盖保鲜膜并扎 8-10 个小孔，或使用微波炉专用盖（留缝隙）。
- number: 4
  description: 放入微波炉中加热：
- number: 5
  description: 加热完成后取出静置 1 分钟，让余温使中心完全熟化。
- number: 6
  description: 淋上香油，撒葱花即可食用。
tips: 水温应在 40–50℃ ，不宜过热。; 蛋液与水比例控制在 1:1 至 1:1.2 之间口感最佳。; 覆盖保鲜膜并扎孔能防止表面爆开或出现蜂窝。; 过筛可显著提升细腻度。; 若表面鼓泡或出水，说明加热过头，下次缩短时间即可。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
