id: 10390
name: 红烧茄子
cuisine: 家常菜
difficulty: 4
duration: 45
calories: 547
servings: 2
tags:
- 下饭菜
- 炸
description: 红烧茄子是一道咸香浓郁的家常下饭菜，软糯的茄块吸饱汤汁，搭配柿子椒和番茄，酸辣适口。茄子富含膳食纤维和维生素 P，炸过的茄块香而不腻。制作需要挂糊油炸并慢烧入味，步骤略多但对新手仍可尝试，专注细节就能成功。从备料到出锅大约需要 45 分钟。
ingredients:
- name: 青茄子的数量
  amount: 0
  unit: 适量
  isMain: false
- name: 青辣椒
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱
  amount: 0
  unit: 适量
  isMain: false
- name: 西红柿
  amount: 1
  unit: 个
  isMain: false
- name: 大葱
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜
  amount: 3
  unit: 瓣
  isMain: false
- name: 鸡蛋
  amount: 1
  unit: 个
  isMain: false
- name: 面粉
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 青茄子、青辣椒、西红柿、洋葱、大葱洗净。
- number: 1
  description: 大葱切 5 毫米宽的葱花，大蒜扒皮并拍碎，西红柿切 6 立方厘米的块，青辣椒、洋葱切 5g 的块。
- number: 1
  description: 茄子切菱形块（先切 2 公分厚的片，然后再把片切成 2 公分的条，最后斜刀切块儿...）。
- number: 1
  description: 将面粉倒入盆中，依次加入少量水，搅拌均匀，呈粘稠糊状。
- number: 1
  description: 加入淀粉，加入 30 克水，搅拌均匀。
- number: 1
  description: 将鸡蛋打到盆中，加入（面粉 / 20）克的盐，搅拌均匀。
- number: 1
  description: 将茄块倒入面糊中，搅拌使茄块的每一面都能沾上面糊。
- number: 1
  description: 开大火，热锅，加入 500 毫升的油，当能看到锅里的油冒出一丝烟时，调至小火，将茄块用筷子夹入到油锅，待所有的茄块下锅之后，调至中火，直到茄块变金黄色时捞出，将油倒出。
- number: 1
  description: 加入（份数 * 5）g 的油，放入大蒜、葱花，翻炒 15 秒，放入青辣椒块翻炒 30 秒，放入西红柿翻炒 30 秒。
- number: 1
  description: 放入炸好的茄块，加水面高度为锅内食材的 0.8 倍。
- number: 1
  description: 放入酱油和（份数 * 3）g 的盐。
- number: 1
  description: 等待，直到汤汁呈粘稠状（水位大概为剩余食材高度的 0.2-0.3 倍），开盖，盛出菜，关火。
tips: 在操作的第 4-6 步骤中要注意：; 一定要顺序执行，否则会有灾难性错误......; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
