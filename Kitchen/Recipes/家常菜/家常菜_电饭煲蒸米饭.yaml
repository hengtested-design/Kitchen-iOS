id: 10331
name: 电饭煲蒸米饭
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 442
servings: 2
tags:
- 蒸
description: 一道家喻户晓的基础主食，米香纯粹、口感软糯，因水量调节可偏硬或偏润。富含碳水化合物，能快速补充能量，适合搭配各类菜肴。操作极其简单，新手也能轻松上手，从洗米到焖好大约需要四十分钟。
steps:
- number: 1
  description: 清洗米
- number: 2
  description: 将米和水一起加入电饭煲中。
- number: 3
  description: 连接电饭煲电源，进入加热模式。等待大约 30 分钟。
- number: 4
  description: 待电饭煲自动进入保温模式后。
- number: 5
  description: 将米在电饭煲中闷 10-15 分钟。
- number: 6
  description: 盛出米。
tips: 技术总结; 不论什么容器，水的量都是可以使用“指尖量水法”煮出好米饭。; 水的多少是能够严重影响一碗好米饭的口感。; 南方一般食用江南米，北方一般食用北方大米，江南米会比较细长，而北方大米会比较短且圆。; 米饭不同品种的米，不同的水量会极度影响口感。; 更多信息请参考使用的电饭煲的说明书。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
