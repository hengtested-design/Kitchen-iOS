id: 10200
name: 淄博烧烤
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 650
servings: 2
tags:
- 烤
cover: https://s.chuimg.com/淄博烧烤/淄博烧烤.jpeg
description: 这是一道山东淄博特色烧烤，小饼卷肉配大葱的吃法风味独特，肉香、酱香与葱香交融，口感层次丰富。五花肉富含优质蛋白质和脂肪，大葱提供膳食纤维，搭配小饼能快速补充能量。制作需要控制炭火火候和翻烤技巧，对新手稍具挑战，全程约 40 分钟即可完成。
ingredients:
- name: 猪五花肉 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 小薄饼 5 张
  amount: 0
  unit: 适量
  isMain: false
- name: 大葱 1 根（约 100g）
  amount: 0
  unit: 适量
  isMain: false
- name: 芝麻酱 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 甜面酱 15g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 五花肉切成厚度不超过 2cm 长的块，并串成串。（五花肉可以预先腌制一下，味道更佳）
- number: 2
  description: 大葱切成 5cm 长的葱段，备用
- number: 3
  description: 芝麻酱加 10ml 温水调稀，与甜面酱混合均匀，备用（可以换成"芝麻盐"）
- number: 4
  description: 点燃炭火，等待炭火烧至**通红无明火**状态（约 15 分钟）
- number: 5
  description: 将五花肉串均匀摆在在烤网上，烤至*底面焦黄出油*后翻面
- number: 6
  description: 继续烤制约 2 - 3 分钟，至*两面焦黄、边缘微焦*后取下
- number: 7
  description: 取一张小薄面饼平铺，抹上 3 - 4g 混合酱料
- number: 8
  description: 放上烤好的肉片和 1 - 2 段大葱，卷起即可食用
tips: 五花肉切片时建议放入冰箱冷冻 30 分钟后再切，更易切块。; 炭火烤制风味优于燃气，有条件建议使用木炭。; 酱料可根据个人口味调整芝麻酱与甜面酱的比例，也可以换成芝麻盐。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
