id: 10292
name: 金针菇汤
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 149
servings: 2
tags:
- 咸鲜
- 快手菜
description: 这是一道清淡爽口的家常汤品，口味鲜美，属简易快手菜。金针菇含有丰富的氨基酸和膳食纤维，加鸡蛋还能补充优质蛋白。制作门槛极低，新手也能轻松驾驭，从备菜到出锅大约只需 10 分钟。
ingredients:
- name: 金针菇 400-500 克 （市场里面售卖的一袋即可）
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 15 克
  amount: 0
  unit: 适量
  isMain: false
- name: 味精 5 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 金针菇徒手掰散，越散越好**不然容易藏牙**，洗净备用。
- number: 2
  description: 用菜刀或者水果刀将上述金针菇段段切，可依据个人喜好，但长度不宜超过 5 cm。
- number: 3
  description: 将金针菇放入锅中，加水没过约食材总高度 1.1 倍，沸腾后**等待 3 分钟**。
- number: 4
  description: 加入味精和食盐并搅拌。
- number: 5
  description: 继续加热约 30 秒，关火装盘。
tips: 如果喜欢在汤里加入鸡蛋，可在步骤 3 中水沸腾之后将打散的鸡蛋液倒入锅中。; 出锅后可加入 3-4 滴香油（或者麻油）增香。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
