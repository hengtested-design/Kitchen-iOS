steps:
- number: 1
  description: 昂刺鱼收拾干净， 生姜和红干辣椒切丝，小葱打结。
- number: 2
  description: 油锅烧热，加入昂刺鱼煎到发黄。
- number: 3
  description: 生姜丝，红干辣椒丝和葱结，爆出香味。
- number: 4
  description: 入适量的水。
- number: 5
  description: 加入适量的葡萄酒，酱油及糖。
- number: 6
  description: 小火慢炖20分钟，大火将汁即将收干，加入适量的盐即可出锅。
