id: 10403
name: 蚝油生菜
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 125
servings: 2
tags:
- 咸鲜
- 快手菜
description: 蚝油生菜是一道爽口鲜香的家常菜，脆嫩的生菜淋上蒜香蚝油汁，咸中带甜，属于粤菜和川菜馆都很常见的快手素菜。富含维生素和膳食纤维，有助于促进消化。做法对新手非常友好，从洗菜到出锅大约只需 15 分钟即可完成。
ingredients:
- name: 生菜 1 棵( 200 g ± 50 )
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 6-8 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 4-5 瓣（做成蒜泥或切碎）
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 6 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 0.5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 1 g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 5-8 ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 生菜洗净并去掉烂菜叶。
- number: 2
  description: 热锅，先放 1 L 清水（凉），然后在锅内放入 2 ml - 3 ml 食用油和 0.5 g 盐，等待锅中的水煮沸。
- number: 3
  description: 水沸后，放入生菜，将**每一片**生菜叶都焯水 10 s。
- number: 4
  description: 捞出生菜，控干水份，摆盘 。
- number: 5
  description: 调汁：将生抽 10 ml 、蚝油 6-8 ml 、盐 0.5 g 、 白糖 1 g 放入碗中调匀，并加入 10-15 ml 清水（凉）搅拌均匀。
- number: 6
  description: 再开火，热锅，放入食用油 5-8 ml，油热放入蒜泥。
- number: 7
  description: 等待有蒜香飘出，倒入调好的汁，煮沸即可，立马关火。
- number: 8
  description: 将锅中的汤汁均匀地**浇**在生菜上。
tips: 这道菜富含维生素，做法简单，尝起来爽口又不上火。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
