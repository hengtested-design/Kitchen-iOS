  description: '茉莉绿茶调配（推荐比例=>茶 : 水 : 冰 = 1~2 : 50 : 30）'
- number: 2
  description: 正式调配
tips: '耙耙柑可以用其他容易分离果肉的柑橘替代，比如丑橘; 果肉和茶水比例为 1 : 1，如果需要配置更大的分量，可按比例提升用量; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
