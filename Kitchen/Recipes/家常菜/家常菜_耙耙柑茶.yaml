cover: https://s.chuimg.com/耙耙柑茶/耙耙柑茶.jpeg
description: 耙耙柑茶是一款融合了柑橘清甜与茉莉花香的果茶饮品，口感清爽回甘，属于创意调饮，不限于特定菜系。耙耙柑富含维生素 C 与膳食纤维，搭配绿茶饮用能带来清新提神的体验。做法非常简单，新手友好，从泡茶到搅拌全程仅需约 15 分钟即可完成。
ingredients:
- name: 耙耙柑 1~2 个（200 克以上）
  amount: 0
  unit: 适量
  isMain: false
- name: 茉莉绿茶 2~4 克
  amount: 0
  unit: 适量
  isMain: false
- name: 冰块 60 克
  amount: 0
  unit: 适量
  isMain: false
- name: '1 : 1 蔗糖糖浆 10 克（可选）'
  amount: 0
  unit: 适量
  isMain: false
