id: 10018
name: 红烧肉炖土豆
cuisine: 家常菜
difficulty: 2
duration: 60
calories: 310
servings: 2
tags:
- 咸鲜
- 炖
cover: https://i02piccdn.sogoucdn.com/a141ed4f3037d9ed
ingredients:
- name: 猪肉
  amount: 350
  unit: 克
  isMain: true
- name: 土豆
  amount: 3
  unit: 个
  isMain: true
- name: 葱
  amount: 15
  unit: 克
  isMain: false
- name: 姜
  amount: 10
  unit: 克
  isMain: false
- name: 蒜
  amount: 5
  unit: 瓣
  isMain: false
- name: 花生油
  amount: 30
  unit: 毫升
  isMain: false
- name: 盐
  amount: 2
  unit: 克
  isMain: false
- name: 料酒
  amount: 15
  unit: 毫升
  isMain: false
- name: 老抽
  amount: 10
  unit: 毫升
  isMain: false
- name: 生抽
  amount: 15
  unit: 毫升
  isMain: false
- name: 白糖
  amount: 20
  unit: 克
  isMain: false
- name: 醋
  amount: 5
  unit: 毫升
  isMain: false
- name: 八角
  amount: 1
  unit: 枚
  isMain: false
- name: 胡椒粉
  amount: 2
  unit: 克
  isMain: false
- name: 味精
  amount: 2
  unit: 克
  isMain: false
steps:
- number: 1
  description: 把猪肉洗净，切成小块。葱、姜、蒜切碎。
- number: 2
  description: 锅里放油，放入葱、姜、蒜、八角煸炒出香味。放入肉块翻炒2分钟。
- number: 3
  description: 放入料酒、老抽、生抽、白糖、胡椒粉、醋翻炒均匀。
- number: 4
  description: 添加足量水大火烧开，小火炖40分钟。
- number: 5
  description: 土豆洗净去皮，切小块放入锅中。
- number: 6
  description: 用大火烧开，小火再炖20分钟。
- number: 7
  description: 放入盐、味精调味即可。
- number: 8
  description: 出锅装盘，即可享用。
_source: cookbook-kg
