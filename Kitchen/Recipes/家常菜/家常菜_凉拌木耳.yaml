id: 10358
name: 凉拌木耳
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 129
servings: 2
tags:
- 快手菜
- 凉拌
cover: https://s.chuimg.com/凉拌木耳/凉拌木耳.jpeg
description: 凉拌木耳，由于发放物资中有很多干货，木耳是较为健康的食物。且凉拌木耳的烹饪方式也相对简单。
steps:
- number: 1
  description: 泡发干木耳, 水量约为 400ml, 泡发约 45 分钟。 （湿木耳跳过此步骤）
- number: 2
  description: 将泡发好的木耳, 进行去根处理（如图 4, 5, 6）, 并彻底洗净。
- number: 3
  description: 起锅烧水，水开后放入木耳, 大火煮 1.5-2 分钟。
- number: 4
  description: 将蒜瓣、小米辣切碎放入碗中 （可选取中大碗）, 并依次加入盐、糖、生抽、醋、香油、芥末, 用量如上。
- number: 5
  description: 木耳盛出后沥水, 放入上一步碗中。
- number: 6
  description: 搅拌充分，端盘。
tips: '* 调味品的数量可以根据个人口味进行调整, 如果不喜欢芥末, 可以不加入。; * 等木耳冷却入味后口味更佳, 约 15 分钟。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
