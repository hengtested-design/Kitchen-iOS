id: 10098
name: 蒸花卷
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 400
servings: 2
tags:
- 快手菜
- 蒸
description: 这是一道北方传统面食，松软可口，带着淡淡麦香。使用冷冻花卷蒸制，能快速补充碳水化合物和膳食纤维。做法极其简单，烹饪新手也能轻松掌握，全程仅需半小时，是理想的快手早餐。
ingredients:
- name: 冷冻花卷 5 个（女生分量 3 个即可）（可以在超市、各种买菜平台购买）
  amount: 0
  unit: 适量
  isMain: false
- name: 圆碟子，直径 28cm
  amount: 0
  unit: 适量
  isMain: false
- name: 蒸架，直径 20cm
  amount: 0
  unit: 适量
  isMain: false
- name: 水 400ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 从花卷的包装袋中取出 5 个花卷
- number: 2
  description: 把花卷平铺在碟子上，尽量不用重叠
- number: 3
  description: 往锅里倒入 400ml 水，把蒸架放里面，把装花卷的碟子放在蒸架上，盖上锅盖。
- number: 4
  description: 开大火加热，直至水沸腾。
- number: 5
  description: 转中火加热 15 分钟
- number: 6
  description: 开盖用手感受花卷的表面温度，如果不够热，就继续盖上盖子加热，否则就可以关火出锅。
- number: 7
  description: 碟子取出放凉至 50 度即可食用
tips: 操作时，需要注意观察锅里的水不能少于 50ml。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
