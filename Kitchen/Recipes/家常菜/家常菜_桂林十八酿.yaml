id: 10194
name: 桂林十八酿
cuisine: 家常菜
difficulty: 3
duration: 300
calories: 468
servings: 2
tags:
- 煎
cover: https://s.chuimg.com/桂林十八酿/桂林十八酿.jpeg
description: 桂林传统酿菜系列，将调好味的猪肉、虾滑等馅料酿入青椒、苦瓜、田螺、茄子等十多种中空食材中，煎焖成菜，一菜一味，鲜香多汁，口感软嫩或弹牙，属于浓郁的地方家常风味。馅料提供优质蛋白质，搭配多种蔬菜，富含维生素与膳食纤维，营养较为均衡。制作步骤需要逐一填馅和掌控火候，稍需耐心，但操作逻辑简单，厨艺新手也能尝试，预计全部完成约需 1.5 小时。
steps:
- number: 1
  description: '**青椒酿**：青椒去籽挖空 → 塞入猪肉馅或虾滑 → 煎至虎皮色 → 酱汁焖煮'
- number: 2
  description: '**田螺酿**：田螺焯水取肉 → 螺肉与猪肉剁碎混合 → 塞回螺壳 → 紫苏薄荷焖煮'
- number: 3
  description: '**猪肉馅**：最基础通用的选择，肥瘦 3:7 口感最佳'
- number: 4
  description: '**虾滑馅**：鲜甜弹牙，青椒酿里常用'
- number: 5
  description: '**螺肉猪肉混合馅**：田螺酿的灵魂，螺肉与猪肉 1:1，加紫苏薄荷'
- number: 6
  description: '**混合馅**：猪肉 + 虾滑混搭，鲜甜与油脂香兼得'
tips: '[青椒酿](../青椒酿/青椒酿.md) — 青椒酿肉 / 虾滑酿青椒（fork 版本）; [田螺酿](../田螺酿/田螺酿.md) — 螺肉猪肉 1:1，配紫苏薄荷; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
