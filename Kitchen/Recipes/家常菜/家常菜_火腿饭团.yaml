id: 10314
name: 火腿饭团
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 665
servings: 2
tags:
- 快手菜
- 煮
cover: https://s.chuimg.com/火腿饭团/火腿饭团.jpeg
description: 一道简单快手的日式风味饭团，咸香火腿搭配沙拉酱与海苔，口感丰富饱腹。富含碳水化合物、蛋白质和维生素，能快速补充能量。制作难度极低，新手也能轻松上手，从煮饭到完成大约只需 1 小时。
ingredients:
- name: 火腿(100g)
  amount: 0
  unit: 适量
  isMain: false
- name: 米饭(125g)
  amount: 0
  unit: 适量
  isMain: false
- name: 水(90ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 冷冻青豆(30g)
  amount: 0
  unit: 适量
  isMain: false
- name: 冷冻玉米粒(30g)
  amount: 0
  unit: 适量
  isMain: false
- name: 海苔碎(10g)
  amount: 0
  unit: 适量
  isMain: false
- name: 喜欢的沙拉酱(20g)
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-15ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将米饭和水放到电饭锅里，点击米饭模式，等待完成
- number: 2
  description: 冷冻玉米粒和青豆放到锅里，加水没过所有食材，沸腾后静待 2 分钟后，捞出。
- number: 3
  description: 火腿切成 1cm 的方块
- number: 4
  description: 与此同时，加入 10ml 食用油，加入火腿翻炒至火腿上色
- number: 5
  description: 将米饭，火腿，海苔碎，青豆，玉米粒，沙拉酱放入碗中，混合均匀即可
- number: 6
  description: 装盘（如果有的话）
tips: 沙拉酱的程度可以根据个人口味酌情删减。; 可以尝试混合沙拉酱。; 参考资料：小红书 - 干饭选手又困了; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
