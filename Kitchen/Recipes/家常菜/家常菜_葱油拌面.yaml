id: 10337
name: 葱油拌面
cuisine: 家常菜
difficulty: 2
duration: 20
calories: 355
servings: 2
tags:
- 快手菜
description: 葱油拌面是一道经典的上海家常面点，以独特的葱油香味著称，做法简单快捷。富含碳水化合物和脂肪，能快速补充能量。一般初学者只需 20 分钟即可完成，非常适合作为日常快手晚餐。
ingredients:
- name: 小葱 100 g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 100 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 60 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 20 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 15 g
  amount: 0
  unit: 适量
  isMain: false
- name: 干面条 80 g （约相当于 150 g 湿面条）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱油酱汁 15 ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将 小葱 洗净，切成长段（约 5-7 cm）。葱白和葱绿可以分开。
- number: 2
  description: 锅中加入 100 ml 食用油，中火烧热。先放入葱白段，煸炒至微黄。
- number: 3
  description: 加入葱绿段，转小火，继续煸炒。
- number: 4
  description: 保持小火，耐心煸炒约 **15-20 分钟**，直至葱段变得焦黄酥脆。
- number: 5
  description: 将焦黄的葱段捞出（葱油保留在锅中）。
- number: 6
  description: 在锅中的葱油中，加入 60 ml 生抽，20 ml 老抽，15 g 白糖。小火加热并搅拌，约 **1 分钟**，至糖溶解，酱汁混合均匀。立即关火。将制作好的葱油酱汁倒入容器中，放凉后密封保存。
- number: 1
  description: 取 80 g 干面条。
- number: 2
  description: 锅中加入 1000 ml 饮用水，大火烧开。
- number: 3
  description: 放入 面条，根据面条包装说明，煮至熟透（通常 **3-8 分钟**，以包装说明为准）。
- number: 4
  description: 将 煮好的 面条 捞出，沥干水分，放入碗中。
- number: 1
  description: 在装有 面条 的碗中，加入 15 ml 之前做好的 葱油酱汁。
- number: 2
  description: 可以加入之前炸好的葱段（可选）。
- number: 3
  description: 用 筷子 快速搅拌均匀，即可食用。
tips: 炸葱油时，火一定要小，要有耐心，才能将葱的香味充分炸出。; 制作好的葱油酱汁可以冷藏保存一段时间，下次吃面时直接取用。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
