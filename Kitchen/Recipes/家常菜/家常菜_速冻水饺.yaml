id: 10271
name: 速冻水饺
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 502
servings: 2
tags:
- 咸鲜
description: 这是一道源自中国的家常面食，采用市售冻饺速成，皮薄馅丰，口感鲜香。佐以醋、姜、蒜等蘸料，滋味更添层次。作为一餐，它能提供充足的蛋白质与碳水，营养饱腹。制作毫无难点，新手也能轻松上手，前后仅需大约一 刻钟。
steps:
- number: 1
  description: 中火，将水倒入锅中，静候水煮沸。
- number: 2
  description: 将饺子倒入锅中。
- number: 3
  description: 倒入锅前可以适当用水过一下。
- number: 4
  description: 倒入饺子后，可以用炒菜勺子或铲子搅水，但要注意不要铲到饺子上，以避免粘锅上撕破皮或互相粘连造成粘连处夹生。
- number: 5
  description: 频率不需要太高，平均每 `30` 秒摇 `3` 秒，饺子浮起后不需要再做此步。
- number: 6
  description: 饺子浮起及水再次煮沸后，用炒菜勺子盛起一个饺子观察，如果面皮有夹生可用炒菜勺子舀入 80ml 凉水，将水降温，然后继续煮至沸腾，此间重复此观察、搅拌操作，最多加两次水就能全熟。
- number: 7
  description: 所有饺子浮起后（下饺子后约 8 分钟）用铲子或漏勺把饺子铲入盘或碗中，装盘后即可食用。
- number: 8
  description: 吃完饺子后，等锅内水温降低，将水倒掉并用洗洁精及时刷锅，不然过段时间锅内煮过的面粉会在锅壁形成黏糊糊的物质。
tips: 这道菜存在一些补充做法，包括但不限于：; 额外添加下列材料：; * 黑醋 10ml; * 姜 一小块 50 克; * 香油 2 滴; * 大蒜/蒜泥 3 瓣/人; * 考虑搭配黑醋食用。建议用量：10-20ml。; * 考虑姜切丝，在小碗加入 20ml 的黑醋与姜丝搅拌当蘸料，味道更丰富。; * 考虑搭配黑醋时加入 1~3 滴香油，搅拌当蘸料。; * 考虑搭配黑醋时加入砸好的蒜泥，搅拌当蘸料。（口腔内会残留蒜味，若饭后需要与他人面对面谈话建议放弃或清洁口腔）; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
