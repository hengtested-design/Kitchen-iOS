id: 10333
name: 老友猪肉粉
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 927
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/老友猪肉粉/老友猪肉粉.jpeg
description: 老友猪肉粉酸辣鲜香，米粉爽滑，带着豆豉与酸笋特有的浓郁风味，是典型的南宁家常味。猪肉提供优质蛋白质，米粉则快速补充碳水能量。整体制作中等难度，需注意提前泡发米粉，熟练后大约四十分钟就能端上桌。
ingredients:
- name: 米粉（250g 记得 50 度的温水泡半小时）
  amount: 0
  unit: 适量
  isMain: false
- name: 猪肉(50g)
  amount: 0
  unit: 适量
  isMain: false
- name: 酸笋(50g)
  amount: 0
  unit: 适量
  isMain: false
- name: 剁椒（15g 辣椒剁完后, 个人需求适当放。 ）
  amount: 0
  unit: 适量
  isMain: false
- name: 豆豉(30g)
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜(10g)
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒(10-20ml)
  amount: 0
