  isMain: false
- name: 米醋(5ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 盐(5ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 油(15ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 生粉(15ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 胡椒粉(10ml)
  amount: 0
