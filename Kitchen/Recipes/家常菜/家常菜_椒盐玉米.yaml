id: 10374
name: 椒盐玉米
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 693
servings: 2
cover: https://s.chuimg.com/椒盐玉米/椒盐玉米.jpeg
description: 一道外酥里嫩、咸香扑鼻的风味小食，有着川菜馆里常见的干香口感，咬开是玉米自带的清甜。玉米提供丰富的碳水化合物与膳食纤维，搭配芝麻还能补充优质脂肪和维生素 E。这道菜步骤略多但操作简单，需要一点耐心抖水裹粉，对新手比较友好。从解冻到出锅大约需要 30 分钟。
ingredients:
- name: 玉米粒（袋装） 350g
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉（在锅里完全能盖住玉米粒表面为准，在 40 - 70g）
  amount: 0
  unit: 适量
  isMain: false
- name: 椒盐粉 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 芝麻粒 10g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 玉米粒都是剥好的，直接解冻即可，温水泡 15 分钟或者灶上开水煮 5 分钟。
- number: 2
  description: 拿出一个簸箕，将其假设为 BoxA，垫上吸油纸，倒进解冻好的玉米粒。
- number: 3
  description: shaking shaking shaking! - 直到吸油纸全部变湿为止。
- number: 4
  description: 拿出第二个簸箕 BoxB，垫上吸油纸，将 BoxA 的玉米粒全部倒入 BoxB 中。
- number: 5
  description: shaking shaking shaking! - 直到吸油纸全部变湿为止。
- number: 6
  description: 重复上述操作多次，直到玉米表面没有明显可见的水滴但保持湿润的状态。
- number: 7
  description: 倒入大量淀粉，能够完全盖住玉米粒。
- number: 8
  description: shaking shaking shaking! - 直到淀粉裹住了玉米粒
- number: 9
  description: 开灶 - 放锅 - 倒入油 尽量铺满锅底 但不要太多。
- number: 10
  description: 油热 8 成，倒入裹上了淀粉的玉米粒。
- number: 11
  description: 中火先煎 30s，不要翻炒，不然淀粉会掉。
- number: 12
  description: 轻微翻炒 3 分钟即可出锅。
- number: 13
  description: 最重要的一步：撒上 3g 椒盐，撒上芝麻粒！
- number: 14
  description: 香喷喷的”椒盐玉米“就做好了
tips: 玉米粒不要自己剥，费手的，可以直接外卖软件买菜”已经剥好的玉米粒“，30 分钟 送达后温水解冻。; 开水解冻慢就拿开水煮！（ 千万别煮玉米本身，带着包装一起煮，撕掉一个口; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
