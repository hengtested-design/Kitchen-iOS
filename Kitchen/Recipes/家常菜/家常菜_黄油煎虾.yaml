id: 10077
name: 黄油煎虾
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 741
servings: 2
tags:
- 咸鲜
- 煎
cover: https://s.chuimg.com/黄油煎虾/黄油煎虾.jpeg
description: 黄油煎虾是一道风味浓郁、虾肉鲜嫩弹牙的家常海鲜菜。鲜虾富含优质蛋白和钙、锌等矿物质，搭配黄油增添了奶香与能量。制作相对简单，只需耐心处理活虾，新手也能顺利上手，总耗时约一小时。
ingredients:
- name: 鲜虾 300g
  amount: 0
  unit: 适量
  isMain: false
- name: 黄油 7g
  amount: 0
  unit: 适量
  isMain: false
- name: 黑胡椒粒 大概 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 45ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 米酒 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 2.5ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鲜虾摘除头部，顺带扯出虾线（这步处理不好可在下一步开背时取出虾线），使用剪刀剪开或菜刀片开虾背，沥干水分备用
- number: 2
  description: 调制酱汁：小碗放入上述量的全部生抽、米酒、白糖、盐搅匀备用
- number: 3
  description: 中大火热锅，热锅内放入食用油，等待 10 秒让油温升高
- number: 4
  description: 虾全部放入锅中，开始瓶磨黑胡椒，均匀地撒在虾上翻炒
- number: 5
  description: 虾变色后加入黄油，黄油完全融化后倒入调制酱汁，继续翻炒
- number: 6
  description: 大火翻炒 15 秒收汁即可装盘
tips: 虾开背才更好入味，不过处理时切记切记小心用刀，新手容易伤到手; [冯小厨的菜谱](https://www.bilibili.com/video/BV1g541177cd); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
