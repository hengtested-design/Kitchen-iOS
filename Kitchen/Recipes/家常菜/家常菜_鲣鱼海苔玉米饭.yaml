id: 10351
name: 鲣鱼海苔玉米饭
cuisine: 家常菜
difficulty: 2
duration: 5
calories: 383
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/鲣鱼海苔玉米饭/鲣鱼海苔玉米饭.jpeg
description: 这是一道鲜香味美的日式简餐，米饭粒粒分明，融合了鲣鱼的咸鲜、海苔的酥香与玉米的甜脆。鲣鱼富含优质蛋白和 DHA，搭配海苔的矿物质和玉米的膳食纤维，营养均衡。做法非常简单，新手也能轻松完成，实际动手仅需 5 分钟，加上煮饭总共约 40 分钟即可享用。
ingredients:
- name: 鲣鱼海苔碎 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 玉米粒 80g/袋
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 盛好米饭，放入玉米粒拌好
- number: 2
  description: 放入鲣鱼海苔碎
tips: 使用米家小饭煲煮东北米的话，水没过米 3 毫米就行，太多水煮出来不是一粒一粒的饭; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
