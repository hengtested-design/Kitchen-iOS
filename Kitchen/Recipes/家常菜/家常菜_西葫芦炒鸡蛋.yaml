id: 10406
name: 西葫芦炒鸡蛋
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 224
servings: 2
tags:
- 酸甜
- 咸鲜
- 快手菜
- 下饭菜
- 炒
cover: https://s.chuimg.com/西葫芦炒鸡蛋/西葫芦炒鸡蛋.jpeg
description: 西葫芦炒鸡蛋是一道清爽可口的家常快手菜，西葫芦软嫩多汁、鸡蛋鲜香松软，加入西红柿后更添酸甜风味，十分下饭。鸡蛋提供优质蛋白质和卵磷脂，西葫芦含有丰富的维生素 C 和膳食纤维，搭配食用营养均衡。制作过程简单，对新手非常友好，从备料到出锅一般初学者只需 15 分钟即可完成。
ingredients:
- name: 西葫芦 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 西红柿 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 3 个
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用盐 6g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 西红柿洗净，切成小块，备用
- number: 2
  description: 西葫芦洗净，切成边长约为 4cm 的菱形，备用
- number: 3
  description: 打三个鸡蛋到碗里，打散搅匀，备用
- number: 4
  description: 热锅，锅内放入 5ml - 10ml 食用油
- number: 5
  description: 倒入鸡蛋，保持翻炒至鸡蛋成固体，用锅铲分成小块后盛到碗里，备用
- number: 6
  description: 锅内放入 5ml - 10ml 食用油，倒入西红柿，炒至变软
- number: 7
  description: 倒入西葫芦一起翻炒均匀，放入 6g 食用盐，将火调小然后**等待 4 - 5 分钟**
- number: 8
  description: 倒入备用的鸡蛋，中火翻炒 15 秒
- number: 9
  description: 关火，盛盘
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
