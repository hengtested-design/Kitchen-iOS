id: 10389
name: 红烧冬瓜
cuisine: 家常菜
difficulty: 3
duration: 25
calories: 519
servings: 2
tags:
- 咸鲜
- 红烧
cover: https://s.chuimg.com/红烧冬瓜/红烧冬瓜.jpeg
description: 红烧冬瓜是一道色泽红亮、香鲜味美的家常素菜，口感软糯入味，属于大众喜爱的中式烧菜。冬瓜本身富含水分、膳食纤维和维生素 C，具有清热解暑、利尿消肿的作用，搭配简单的调味料，营养又好消化。这道菜对初学者比较友好，操作步骤清晰，只需掌握好火候和调味，预计制作时长约 25 分钟。
steps:
- number: 1
  description: 冬瓜去皮，切 边长不超过 2cm 小块
- number: 2
  description: 起锅烧油，放入冬瓜，缓缓翻滚煎炸 2 分钟 ，直至冬瓜表面泛金黄色
- number: 3
  description: 取出冬瓜，放入大碗备用
- number: 4
  description: 利用锅中的剩余油，依次放入姜末、生抽、蚝油，翻炒 15 S
- number: 5
  description: 重新倒入冬瓜，翻炒 30 S 后，加入开水，水要没过冬瓜表面，大火煮 10 分钟
- number: 6
  description: 加入老抽上色，继续煮，直至冬瓜软糯（筷子可以轻松插近冬瓜）
- number: 7
  description: 加入鸡精、料酒、香葱翻炒后 30 S， 取出冬瓜到大碗中
- number: 8
  description: 锅中剩余汤汁保留，倒入水淀粉，煮开后汤汁浇灌在冬瓜表面
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
