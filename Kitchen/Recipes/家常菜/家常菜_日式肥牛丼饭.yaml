id: 10311
name: 日式肥牛丼饭
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 774
servings: 2
tags:
- 下饭菜
- 炒
cover: https://s.chuimg.com/日式肥牛丼饭/日式肥牛丼饭.jpeg
description: 一道经典的日式家常盖饭，肥牛片与白洋葱在咸甜酱汁中炖煮入味，肉质软嫩，洋葱甜润，汁香浓郁。牛肉提供优质蛋白和血红素铁，洋葱富含膳食纤维与多种抗氧化物。制作不算复杂，新手只要跟着步骤操作也能轻松完成，炒煮过程约需 30 分钟。
ingredients:
- name: 洋葱 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 肥牛 250 克
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 1~2 根
  amount: 0
  unit: 适量
  isMain: false
- name: 白芝麻 5 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 洋葱剥去外层去芯，切成月牙状
- number: 2
  description: 葱洗净切成 0.5cm 的小段
- number: 3
  description: 热锅直接放入白芝麻，**前后晃动锅体**使芝麻均匀受热至*略呈金黄色*
- number: 4
  description: 肥牛焯水 1 分钟后捞出
- number: 5
  description: 将 40g `味淋`（或 30g `料酒`），30g `酱油`，20g `耗油`，5g `糖`，5g `老抽`（可选，用于调色），在碗中搅拌混合成`调料`（该步骤可直接将碗放在电子秤上进行）
- number: 1
  description: 热油锅放入洋葱，**快速翻炒**至洋葱*变透明状*
- number: 2
  description: 关小火，加入 250g 水（或出汁），开回大火加热**等待 3 分钟**
- number: 3
  description: 加入牛肉和`调料`
- number: 4
  description: '**不断翻动**所有食材 **10 分钟**，防止食材粘锅'
- number: 5
  description: 关火
- number: 6
  description: 盛装肥牛丼至[米饭](../米饭/电饭煲蒸米饭.md)上（注意要把汁水淋一些在饭上）
- number: 7
  description: 撒上葱花和白芝麻，制作完成。
- number: 1
  description: 微波炉：单人份高火 2-3 分钟
- number: 2
  description: 锅：需额外加 50ml 水，加热时需**不断翻动**
tips: '```shell; struct Staple{float 咸度;}; struct Staple 牛丼; 牛丼.咸度 = 尝一口汤汁; while(牛丼.咸度 < 预期) 加入(1 g)酱油; 牛丼.咸度 = 尝一口汤汁; ```; 如果用的是比较不错的牛肉，可以选择不焯水，能够更加保留牛肉的风味，因为加入了味淋所以不会很腥，无需担心牛肉不熟，加热 10 分钟肯定熟了; 如果有条件，选择加入 15g`清酒`; ``` mermaid; graph TD; A[处理肉，洋葱，葱花，白芝麻] --> B[开油锅, 炒熟洋葱]; B --> C[加水, 煮3分钟]; C --> D[加入牛肉和调料, 边搅拌边煮10分钟]; D --> E[盛装至碗中，撒上葱花和白芝麻]; ```; [河水洋洋实验室 【牛丼｜肥牛饭】吉野家牛肉饭的正宗做法](https://www.bilibili.com/video/BV1rK4y1d7Fk); [夏叔厨房 60秒搞定神仙配方，好吃又下饭的肥牛饭！](https://www.bilibili.com/video/BV1xu4y1676X); 如果您遵循本'
