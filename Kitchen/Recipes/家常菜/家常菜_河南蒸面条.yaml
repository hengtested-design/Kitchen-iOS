id: 10313
name: 河南蒸面条
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 3066
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/河南蒸面条/河南蒸面条.jpeg
description: 河南蒸面条是源自河南的家常小吃，面条先蒸后炒再蒸，油润入味，口感劲道爽滑。五花肉和蒜薹提供丰富的蛋白质和膳食纤维，搭配主食带来均衡营养。制作步骤稍多一些，但对新手而言只要按顺序操作就能成功。从备料到出锅，总共约需 40 分钟。
ingredients:
- name: 挂面 300g
  amount: 0
  unit: 适量
  isMain: false
- name: 五花肉 350g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜薹 150g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 2g
  amount: 0
  unit: 适量
  isMain: false
