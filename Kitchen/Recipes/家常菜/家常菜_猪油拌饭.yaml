id: 10327
name: 猪油拌饭
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 420
servings: 2
tags:
- 咸鲜
- 快手菜
description: 这是一道充满南方家常气息的简单拌饭，米粒被融化的猪油包裹，透着酱油的咸鲜和葱花的清香，是许多孩子食欲不振时的安心之选。主要提供快速碳水与脂肪能量，但胆固醇较高，不宜常吃。制作毫无门槛，哪怕完全不会做饭也能轻松完成，煮好的米饭只要几分钟就能拌出一碗香喷喷的主食。
ingredients:
- name: 米饭 200 g
  amount: 0
  unit: 适量
  isMain: false
- name: 猪油 15 g（添加蚝油时，减少到 10 g）
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 5 ml（添加蚝油时，减少到 3 ml）
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 2 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 8 g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱花 0-12 g（初始建议 5 g）
  amount: 0
  unit: 适量
  isMain: false
- name: 猪油渣 5 g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 碗底铺猪油
- number: 2
  description: 加入米饭
- number: 3
  description: 淋上酱油与蚝油
- number: 4
  description: 撒上葱花和猪油渣
- number: 5
  description: 搅拌均匀
tips: 建议搭配瘦肉和蔬菜食用来均衡营养; 高胆固醇，不建议经常食用; 参考资料：[猪油拌饭 - 维基百科，自由的百科全书](https://zh.wikipedia.org/wiki/%E8%B1%AC%E6%B2%B9%E6%8B%8C%E9%A3%AF); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
