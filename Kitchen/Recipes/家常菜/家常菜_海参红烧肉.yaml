steps:
- number: 1
  description: 海参切小段备用。
- number: 2
  description: 五花肉切麻将块冷水下锅焯去血沫杂质
- number: 3
  description: 锅内到少许油烧热。
- number: 4
  description: 放入焯好的五花肉煸炒。
- number: 5
  description: 煸炒到五花肉涂油，颜色变焦黄即可。
- number: 6
  description: 放入姜，葱，八角，香叶，桂皮，干辣椒，冰糖放入葱姜。放入老抽煸炒片刻，煸炒出香料的香味。倒入没过肉的开水，倒入少许生抽。炖制肉6.7成熟烂，放盐调味。
- number: 7
  description: 放入海参，炖制汤汁收浓即可。
