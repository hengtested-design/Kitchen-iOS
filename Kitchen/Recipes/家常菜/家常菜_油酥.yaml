  isMain: false
- name: 面粉
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 面粉盛小碗里，加入盐
- number: 2
  description: 加入 200 度的热油
- number: 3
  description: 用筷子将其搅拌成无固状物体的糊状。
