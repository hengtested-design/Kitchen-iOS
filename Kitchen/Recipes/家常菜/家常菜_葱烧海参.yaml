id: 10068
name: 葱烧海参
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 299
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/葱烧海参/葱烧海参.jpeg
description: 这是一道经典的鲁菜家常烧制海味，以浓郁的葱香和软糯入味的海参为特色，汤汁稠亮咸鲜回甜。海参富含胶原蛋白与多种微量元素，对滋养身体很有益处。整体烹饪难度不高，但需提前花时间将干海参充分泡发，实际烧制过程约三十分钟即可完成，新手只要按步骤操作也容易成功。
ingredients:
- name: 泡发好的海参（北极参） 4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 大葱葱白 1 根大葱的葱白即可
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 20-25ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉 2g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 葱白切成 1cm 的段，备用。
- number: 2
  description: 海参切成 1cm 的段，备用。
- number: 3
  description: 准备一个空碗，倒入 20g 蚝油， 10g 生抽， 2g 白糖，搅拌均匀。![料汁](./酱汁.jpeg)
- number: 4
  description: 另一个空碗倒入淀粉，水，制备水淀粉，勾芡用。
- number: 5
  description: 热锅，锅内放入 20ml - 25ml 食用油。等待 10 秒让油温升高。
- number: 6
  description: 放入葱白，调*小火*，注意不要让葱白变焦。大概煎 3-5 分钟即可。![葱白](./葱白.jpeg)
- number: 7
  description: 用筷子夹出葱白，放入盘中备用。
- number: 8
  description: 倒入调好的料汁，炒香，**等待 1 - 2 分钟** 。
- number: 9
  description: 放入切好的海参，翻炒 1 分钟
- number: 10
  description: 加入 100 ml 的水， 中小火， **等待 5 分钟**
- number: 11
  description: 等待锅中汤汁快干的时候，加入水淀粉，加入前面取出的葱白
- number: 12
  description: 在外观*呈粘稠状态*后关火，盛盘 ![葱烧海参-预览图-5](./葱烧海参.jpeg)
tips: 操作时，需要注意观察锅中的水量，如快见底的时候就直接接入水淀粉即可。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
