id: 10117
name: 无厨师机蜂蜜面包
cuisine: 家常菜
difficulty: 5
duration: 180
calories: 176
servings: 2
cover: https://s.chuimg.com/无厨师机蜂蜜面包/无厨师机蜂蜜面包.jpeg
description: 这是一款无需厨师机的家常蜂蜜小面包，松软香甜，底部略带脆感，表面刷满蜂蜜水再撒上芝麻，透着朴实的甜香。主要用料为高筋面粉、牛奶、鸡蛋和黄油，提供充足的碳水化合物、蛋白质和钙质，作为早餐或加餐都很安心。做法简单，全程手揉，发酵时间灵活，甚至可以提前一晚放入冰箱冷藏，第二天再烘烤，对新手相当友好。制作耗时大约 3 小时，其中大部分是发面等待时间，实际动手并不费力。
steps:
- number: 1
  description: 制作面团：将面粉，牛奶（建议加热到 40°，本人使用微波炉 15 - 20s），酵母，鸡蛋，面粉，糖和盐混合起来。
- number: 2
  description: 搅拌面团，将原料混合均匀成团。
- number: 3
  description: 加入黄油混合。
- number: 4
  description: 继续搅拌 + 手揉，均匀混合。
- number: 5
  description: 开始发面，使用保鲜膜覆盖容器，普通气温(10 - 20°)放置 1 - 2 小时，稍长时间对效果影响不大。
- number: 6
  description: 明显看到面团发酵变大（2 倍）即可开始切分面团, 此时面团应该不再十分黏手。
- number: 7
  description: 切分面团：理想状态每一份 60g（美观），可根据喜好适当调整大小。
- number: 8
  description: 将每一份小面团使用擀面杖擀成舌状后卷起, 再次醒面 10。
- number: 9
  description: 再次使用擀面杖擀成舌状后卷起, 从中间切开（一个变成两个）。
- number: 10
  description: 再次使用擀面杖擀成舌状后卷起, 从中间切开（两个变成四个）。（此步骤可以按照自己的时间多擀/卷几次, 把握一份的大小就行）
- number: 11
  description: 烤盘放入油纸并倒入花生油, （每份卷好的）底部蘸水 + 面粉后放入烤盘。
- number: 12
  description: 再次醒发（盖上保鲜膜）, 这一步可以放入冰箱, 第二天再烤。
- number: 13
  description: 刷上蛋液。
- number: 14
  description: 烤箱 180°(355°F), 18 - 20 分钟。
- number: 15
  description: 出炉后, 刷上蜂蜜水, 撒上芝麻。
tips: 发面时间并不固定, 每 1 小时看一下确认就可以, 明显发酵变大即可, 建议发酵 2 - 2.5 倍大。; 面团大小不会显著影响口感和烘烤效果，可根据喜好调整。; 参考资料：下厨房 - 脆底蜂蜜小面包; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
