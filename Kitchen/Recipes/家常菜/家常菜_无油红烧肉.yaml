id: 10008
name: 无油红烧肉
cuisine: 家常菜
difficulty: 1
duration: 180
calories: 260
servings: 2
tags:
- 咸鲜
- 煮
cover: https://i04piccdn.sogoucdn.com/13d178be58b5eb49
ingredients:
- name: 五花肉
  amount: 600
  unit: g左右
  isMain: true
- name: 大葱
  amount: 0.5
  unit: 根
  isMain: true
- name: 老姜
  amount: 3
  unit: 片
  isMain: true
- name: 八角
  amount: 1
  unit: 个
  isMain: false
- name: 花椒
  amount: 30
  unit: 粒左右
  isMain: false
- name: 黄酒
  amount: 45
  unit: 毫升
  isMain: false
- name: 老抽
  amount: 45
  unit: 毫升
  isMain: false
- name: 生抽
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖
  amount: 35
  unit: 克
  isMain: false
- name: 高度白酒
  amount: 5
  unit: 毫升
  isMain: false
steps:
- number: 1
  description: 准备好全部材料；
- number: 2
  description: 将五花肉清洗干净，去除猪皮上没有剔干净的猪毛，然后切成麻将大小的块；
- number: 3
  description: 将五花肉块放入锅中，加入葱段，姜片，八角，花椒，加入没过肉块的清水；
- number: 4
  description: 大火加热，煮开后继续煮几分钟，撇干净表面浮沫，转小火加盖煮30分钟左右。这里可以先大火煮开，然后转中小火撇浮沫。然后再次转大火煮开沸腾，再转中小火撇沫，重复几次就可以撇的很干净了哦；
- number: 5
  description: 加入黄酒，再次煮沸；
- number: 6
  description: 加入老抽，生抽，煮开后转小火，加盖煮40分钟左右；
- number: 7
  description: 揭盖，加入冰糖，然后继续加盖小火煮30分钟左右，至筷子能轻易的戳通肉块；
- number: 8
  description: 转大火收汁，不停翻炒，防止糊锅；
- number: 9
  description: 待锅中汤汁收至自己喜欢的程度（我喜欢留点汤拌饭），加入高度白酒；
- number: 10
  description: 翻炒均匀后，出锅装盘趁热吃。
_source: cookbook-kg
