id: 10365
name: 印度土豆花菜
cuisine: 家常菜
difficulty: 3
duration: 25
calories: 668
servings: 2
description: 这道印度家常素菜以干香金黄、香料浓郁为特点，土豆绵软、花菜略带焦边，属于北印度风味。土豆和花菜富含膳食纤维与维生素 C，营养均衡。做法简单，对新手友好，从准备到出锅约需 25 分钟。
ingredients:
- name: 土豆 2 个（约 250g），去皮切块（约 2cm 大小）
  amount: 0
  unit: 适量
  isMain: false
- name: 花菜 1 个（约 300g），掰成小朵
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 1 个（约 100g），切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄 1 个（约 100g），切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 8g，磨碎
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 3 瓣（约 9g），切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 青辣椒 1 根，切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 30ml
  amount: 0
  unit: 适量
  isMain: false
- name: 孜然籽 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜黄粉 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 红辣椒粉 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 香菜粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 印度综合香料粉 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 香菜叶 15g（装饰用）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将土豆去皮切成约 2cm 的块状
- number: 2
  description: 将花菜掰成均匀的小朵，大朵可用刀切小
- number: 3
  description: 在炒锅中倒入 30ml 食用油，中火加热
- number: 4
  description: 油热后放入孜然籽 3g，炸至*孜然籽变深色且散发香味*（约 10 秒，注意不要炸糊）
- number: 5
  description: 放入切碎的洋葱，翻炒至*洋葱变透明微黄*（约 3-4 分钟）
- number: 6
  description: 加入生姜、大蒜和青辣椒，翻炒 1 分钟
- number: 7
  description: 加入切碎的番茄，翻炒至*番茄软烂*（约 2-3 分钟）
- number: 8
  description: 加入姜黄粉 3g、红辣椒粉 3g、香菜粉 5g、盐 5g
- number: 9
  description: 翻炒 1 分钟，使香料与蔬菜融合
- number: 10
  description: 放入土豆块，翻炒 2 分钟使土豆表面裹上香料
- number: 11
  description: 放入花菜朵，轻轻翻拌均匀
- number: 12
  description: 盖上锅盖，转中小火，**焖 12-15 分钟**，期间每 3-4 分钟打开翻炒一次防止粘锅
- number: 13
  description: 当*土豆用筷子可轻松戳透、花菜略有焦边*时，撒入印度综合香料粉 3g
- number: 14
  description: 翻炒 1 分钟
- number: 15
  description: 关火，撒上香菜叶，盛盘
tips: 这道菜是干炒风格(Dry)，不需要加水。如果觉得太干容易粘锅，可以加入极少量水（约 15-30ml），但不宜过多。; 土豆块不要切太小，否则容易炒散。; 花菜的边缘略微焦黄是正常的，反而会增添风味。; Aloo Gobi 因 2001 年的英国喜剧电影"Bend It Like Beckham"（像贝克汉姆一样踢球）而在西方世界广为人知。; 这道菜可以搭配印度烤饼(Naan)、印度薄饼(Roti)或米饭食用。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
