steps:
- number: 1
  description: 木耳温水泡发2小时，洗净，开水焯5分钟，过冷水捞出备用；
- number: 2
  description: 花生米提前用葱、姜、花椒、大料、盐煮熟捞出，去掉配料；
- number: 3
  description: 西芹用开水焯2分钟，过冷水，捞出；
- number: 4
  description: 斜切成粒；
- number: 5
  description: 红椒、绿椒切片，大蒜拍碎；
- number: 6
  description: 所有食材放在大一点儿的盆里；
- number: 7
  description: 兑汁；图中有一个大勺和一个小勺，2大勺生抽、2 大勺米醋、2小勺糖、2小勺花椒油、2小勺香油、半小勺盐；
- number: 8
  description: 倒入盆里，拌匀；
- number: 9
  description: 已拌好。
- number: 10
  description: 素菜也能吃出精彩！
