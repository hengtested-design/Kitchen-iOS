id: 10145
name: 砂糖椰子冰沙
cuisine: 家常菜
difficulty: 1
duration: 600
calories: 231
servings: 2
tags:
- 快手菜
cover: https://s.chuimg.com/砂糖椰子冰沙/砂糖椰子冰沙.jpeg
description: 砂糖椰子冰沙是一道极具热带风情的快手冷饮，清甜的椰香融合粗粒黄糖的焦香，口感绵密冰爽。椰子水富含天然电解质与矿物质，能快速补充水分，咖啡调糖增添碳水能量。制作门槛极低，只要提前将椰汁冻硬，敲打成沙即可，对新手毫无压力。从冷冻到出品需提前准备 10 小时以上，但动手操作仅需几分钟，很适合作为悠闲的午后冰品。
ingredients:
- name: 瓶装椰子汁 500ml
  amount: 0
  unit: 适量
  isMain: false
- name: 咖啡调糖 10g（两包太古咖啡调糖）
  amount: 0
  unit: 适量
  isMain: false
- name: 坚果碎（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 500ml 瓶装椰汁倒掉 200ml，立刻拧紧瓶盖。
- number: 2
  description: 将这瓶椰汁放入冰箱冷冻区并冷冻 10 小时以上。
- number: 3
  description: 将这瓶椰汁取出，若确认瓶中椰汁已彻底冻结，则在墙角、椅背、桌角等坚硬表面上用力抽打。（请务必确认表面不会因此受到损伤）
- number: 4
  description: 当抽打到冻结椰汁变成冰沙状态，打开瓶盖倒出冰沙。
- number: 5
  description: 在冰沙表面均匀撒上咖啡调糖或坚果碎。
- number: 6
  description: 完成
tips: 在以上步骤中，瓶装椰汁可以提前冰冻，但是不宜超过 7 天，否则有变质风险。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
