steps:
- number: 1
  description: 五花肉切块，冷水下锅加料酒焯水
  tips: 去除血沫
- number: 2
  description: 锅中放少量油，小火炒冰糖至焦糖色
  tips: 小心糊锅
- number: 3
  description: 下肉块翻炒上色
  tips: 每面都要裹上糖色
- number: 4
  description: 加入生抽、老抽、调料和开水，大火烧开
  tips: 用开水不是冷水
- number: 5
  description: 转小火炖1小时至软烂
  tips: 注意观察水量
- number: 6
  description: 大火收汁，加盐调味
  tips: 汁浓肉亮
tips: 选择肥瘦相间的五花肉口感最好
