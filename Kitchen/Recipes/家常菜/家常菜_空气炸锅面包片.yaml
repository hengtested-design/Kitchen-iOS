id: 10093
name: 空气炸锅面包片
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 254
servings: 2
tags:
- 快手菜
- 炸
description: 空气炸锅面包片是一道极简快手的主食，外脆内软，麦香纯粹，特别适合减脂期食用。它富含膳食纤维和植物蛋白，能提供较长时间的饱腹感。做法毫无门槛，只需将面包片放入空气炸锅即可，对新手极其友好，从准备到完成仅需大约五分钟。
ingredients:
- name: 面包片（两片）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 取出两片面包片（建议使用粗粮面包片）
- number: 2
  description: 将面包片**垂直**放入空气炸锅
- number: 3
  description: 200°C 烘烤 5 分钟
- number: 4
  description: 取出即可使用
