id: 10124
name: 芋泥雪媚娘
cuisine: 家常菜
difficulty: 5
duration: 30
calories: 160
servings: 2
tags:
- 烤
cover: https://s.chuimg.com/芋泥雪媚娘/芋泥雪媚娘.jpeg
description: 芋泥雪媚娘外皮软糯 Q 弹，内馅是细腻香甜的芋泥与轻盈奶油，口感层次丰富，是一道源自家常创意的中式甜品。芋头和紫薯提供膳食纤维与花青素，牛奶和淡奶油补充钙质，营养均衡。制作无需烤箱，步骤简单，对新手很友好，即使不擅烘焙也能轻松完成。从头到尾大约需要两小时，就能做出让孩子爱不释口的自制小点心。
ingredients:
- name: 荔浦芋头 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 紫薯粉 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 牛奶 165g
  amount: 0
  unit: 适量
  isMain: false
- name: 糯米粉 a 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 糯米粉 b 75g
  amount: 0
  unit: 适量
  isMain: false
- name: 玉米淀粉 22g
  amount: 0
  unit: 适量
  isMain: false
- name: 黄油 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 淡奶油（推荐安佳） 145g
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 26g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 芋头切块，大火煮熟至软（40 分钟即可），全部放入料理机
- number: 2
  description: 向内加入 30g 牛奶，25g 淡奶油，将其打成泥状
- number: 3
  description: 再向内加入 3g 紫薯粉，18g 白砂糖，继续搅拌打成细腻芋泥
- number: 4
  description: 取出另一个碗，加入全部糯米粉 b，22g 玉米淀粉，135g 牛奶，50g 白砂糖，混匀并过筛一遍，保鲜膜盖上并扎小洞，中火蒸半个小时
- number: 5
  description: 在蒸的过程中，将糯米粉 a 放入平底锅小火翻炒至微微发黄（即炒熟），作为手粉备用
- number: 6
  description: 将中火蒸完半小时的糯米牛奶混合物（果冻状）趁热加入黄油 30g，将黄油揉至面团完全吸收，然后放冰箱冷藏一小时
- number: 7
  description: 取出另一只碗，加入 120g 淡奶油，8g 白砂糖，打发至有纹路，装进裱花袋备用
- number: 8
  description: 取出冷藏后的面团，搓揉 5 分钟，分成 30g 一个，均匀撒上 2g 手粉防粘，擀成圆形，先挤上 5g 裱花奶油，然后放上 30g 芋泥，最后将面饼像包包子一样包起来（可以减去多余的皮）
- number: 9
  description: 包好后再均匀撒 2g 手粉防粘
- number: 10
  description: 重复以上两步直至原材料用光
tips: 制作时最好佩戴不粘手套; 制作完即可食用，不用再加热; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
