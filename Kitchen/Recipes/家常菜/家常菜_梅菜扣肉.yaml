id: 10195
name: 梅菜扣肉
cuisine: 家常菜
difficulty: 4
duration: 300
calories: 3756
servings: 2
tags:
- 煮
cover: https://s.chuimg.com/梅菜扣肉/梅菜扣肉.jpeg
description: 这是一道客家传统名菜，成菜酱红油亮、汤汁黏稠，扣肉肥而不腻、软烂醇香。五花肉富含优质蛋白和脂肪酸，搭配梅干菜能提供膳食纤维。整体工序稍多，需要掌握煮、炸、蒸的火候，对新手有一定挑战。从备料到出锅，连同浸泡梅菜的时间在内，大约需要 2.5 小时。
steps:
- number: 1
  description: 梅菜放到清水中，浸泡 1 小时
- number: 2
  description: 锅中倒入 50 ml 食用油，将整个五花肉猪皮朝下，放到锅中 1 分钟 ，取出挂掉猪皮 【可选】
- number: 3
  description: 锅中加入开水，放入五花肉，大火煮 20 分钟 （筷子可以插进五花肉），取出五花肉
- number: 4
  description: 在五花肉表面涂抹均匀老抽、五香粉、白砂糖，放置 15 分钟
- number: 5
  description: 起锅烧油，加入五花肉，中火油炸直至两面金黄色（3-5 分钟）
- number: 6
  description: 起锅烧油，倒入梅菜，加上小米椒、蒜蓉、鸡精、食用盐后翻炒，直至炒干梅干菜水分
- number: 7
  description: 五花肉切片（后端 0.5-1 cm）,放在大碗中，散上梅干菜
- number: 8
  description: 中火蒸 45 分钟
- number: 9
  description: 拿个盘子倒盖在五花肉大碗中，将五花肉倒在盘子中
tips: '* 制作过程中发现，脆皮五花肉真香 Orz~; * 不喜欢吃甜的可以去掉白砂糖，不影响主流程; * 倒数第二个步骤，可以根据个人喜好调整时间; * 炒干梅干菜的作用是为了后续吸油（盲猜）; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
