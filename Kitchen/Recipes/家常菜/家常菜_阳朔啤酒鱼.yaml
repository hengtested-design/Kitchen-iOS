id: 10073
name: 阳朔啤酒鱼
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 1092
servings: 2
tags:
- 咸鲜
- 煮
cover: https://s.chuimg.com/阳朔啤酒鱼/阳朔啤酒鱼.jpeg
description: 阳朔啤酒鱼是广西阳朔的地方名菜，选用漓江鲜鱼带鳞煎制，以啤酒代水焖煮，鱼鳞酥脆、鱼肉鲜嫩，啤酒香与番茄微酸交融，风味浓郁独特。鱼肉富含优质蛋白和矿物质，搭配番茄、辣椒，维生素丰富且开胃助食。制作难度中等，对新手稍具挑战，但跟着步骤操作也能成功，预计 30 分钟即可完成。
ingredients:
- name: 剑骨鱼或鲤鱼 1 条（约 750g，不去鳞）
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 15ml
  amount: 0
  unit: 适量
  isMain: false
