id: 10192
name: 枝竹羊腩煲
cuisine: 家常菜
difficulty: 5
duration: 30
calories: 2391
servings: 2
description: 这是一道源自广东的传统煲仔菜，羊肉与腐竹在柱侯酱和腐乳的调和下，酱香浓郁，口感肥美而不腻口，暖身暖心，尤其适合寒冬食用。羊肉富含蛋白质和铁质，能温补气血，腐竹则提供优质植物蛋白，搭配起来营养均衡。虽然备料和炖煮步骤较多，但全程火候控制并不复杂，新手只需按部就班也能成功。预计从准备到出锅约需两个半小时。
ingredients:
- name: 羊腩 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 炸腐竹 30g-50g
  amount: 0
  unit: 适量
  isMain: false
- name: 柱侯酱 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 腐乳 40g
  amount: 0
  unit: 适量
  isMain: false
