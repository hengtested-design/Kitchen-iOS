id: 10253
name: 香菇滑鸡
cuisine: 家常菜
difficulty: 3
duration: 60
calories: 608
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/香菇滑鸡/香菇滑鸡.jpeg
description: 香菇滑鸡是一道以鸡腿肉和香菇为主料的家常菜，鸡腿肉经过煸炒和焖煮后口感滑嫩，搭配香菇独特的菌香，汤汁浓郁鲜美，属于老少皆宜的粤式风味。鸡肉富含优质蛋白质和多种氨基酸，香菇含有香菇多糖和膳食纤维，有助于增强免疫力和促进消化。这道菜需要一些刀工和火候控制，对新手有一定挑战，整体制作约需 1 小时。
ingredients:
- name: 大鸡腿 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 干香菇 5 粒
  amount: 0
  unit: 适量
  isMain: false
