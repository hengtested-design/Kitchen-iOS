id: 10088
name: 温泉蛋
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 72
servings: 2
description: 温泉蛋源自日本，蛋白呈半流动凝乳状，蛋黄却温润凝固，口感滑嫩细腻，与溏心蛋恰好相反。鸡蛋富含优质蛋白、卵磷脂和多种维生素，营养十分全面。制作时需要借助温度计将水温控制在 70℃，虽然对温度稍有要求，但步骤简单，耐心等待约半小时便能完成。佐以昆布酱油和葱花，鲜香清爽，是一道轻松上手的小食。
ingredients:
- name: 鸡蛋的用量为 1 个，按照您的食量和锅的大小计算。
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 在锅中盛装一定量自来水，确保水面没过约鸡蛋 3cm，水中插入温度计
- number: 2
  description: 开火或打开电磁炉，逐渐调整电磁炉功率或火苗大小，使得水温保持在 **70 摄氏度**
- number: 3
  description: 将鸡蛋放入锅中。鸡蛋不可互相堆叠，应皆在底部，并留有空间可以晃动
- number: 4
  description: 保持当前温度 **25 分钟**
- number: 5
  description: 准备一杯冰水
- number: 6
  description: 捞出鸡蛋，并立刻放入冰水中，**等待 3 分钟**
- number: 7
  description: 将鸡蛋打入小碗，完成制作
tools:
- 厨房用温度计（尽量选用带有夹子的温度计）
- 杯子（无特定要求，只要是杯子就行）
- 昆布酱油（一种日式的少盐酱油，用于为温泉蛋调味）
- 香葱
tips: '``` mermaid; graph TD; A[锅中加水，插入温度计] --> B[控制水温到70℃]; B --> C[放入鸡蛋，保持水温为70℃ 25分钟]; B --> D[准备冰水]; C --> E; D --> E[鸡蛋捞出放入冰水，等待3分钟]; E --> F[鸡蛋打入小碗]; ```; 若使用机械式温度计（无需供电）则温度计探头需没入水中至少 6cm，若使用电子温度计则无特殊要求; 锅可以采用稍厚的锅，方便控制温度; 虽然 70 摄氏度 25 分钟已经完全可以杀死沙门氏菌，但还是要尽量少吃，或购买正规可生食鸡蛋制作; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
