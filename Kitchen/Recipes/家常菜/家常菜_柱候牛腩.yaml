id: 10193
name: 柱候牛腩
cuisine: 家常菜
difficulty: 4
duration: 180
calories: 980
servings: 2
tags:
- 煮
cover: https://s.chuimg.com/柱候牛腩/柱候牛腩.jpeg
description: 这是一道经典广式风味菜肴，肉香浓郁，色泽红亮，带筋牛腩软烂入味，口感丰富。富含优质蛋白质和胶原蛋白，滋补暖身。虽需一定耐心，但使用高压锅能大幅缩短时间，对新手也较友好。普通炖煮约需 3 小时，用高压锅则约 1 小时即可完成。
