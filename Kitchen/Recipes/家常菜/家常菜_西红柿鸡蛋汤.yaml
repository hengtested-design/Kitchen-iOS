id: 10291
name: 西红柿鸡蛋汤
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 258
servings: 2
tags:
- 酸甜
- 快手菜
description: 西红柿鸡蛋汤是一道酸甜开胃、口感滑嫩的家常汤品，做法极简，属于老少皆宜的大众菜肴。富含番茄红素、维生素 C 和优质蛋白质，营养均衡易吸收。对新手非常友好，快手省时，预计制作时长 大约 15 分钟。
ingredients:
- name: 西红柿 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1-2 个（依照自己的口味而定，喜欢吃鸡蛋就放 2 个，一般就放 1 个）
  amount: 0
  unit: 适量
  isMain: false
- name: 香油 2 滴
  amount: 0
  unit: 适量
  isMain: false
- name: 味素 5 克（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 15 克
  amount: 0
  unit: 适量
  isMain: false
- name: 葱、姜、蒜共 15 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将西红柿洗净，切块。
- number: 2
  description: 葱姜蒜切碎。
- number: 3
  description: 鸡蛋打到碗中，用筷子（或打蛋器）搅拌均匀。
- number: 4
  description: 热锅，并放入 15 毫升的油，待能从油中看到冒出一丝烟时，放入葱姜蒜翻炒 30 秒。
- number: 5
  description: 放入西红柿翻炒 1 分钟。
- number: 6
  description: 倒入水，水的高度大约为锅内菜品高度的 1.2 倍，并放入盐。
- number: 7
  description: 待开锅后，将鸡蛋液放入，并用筷子将鸡蛋打散，放入味素和香油。
- number: 8
  description: 等待 30 秒，关火出锅。
tips: 味素可加可不加。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
