id: 10263
name: 黔式腊肠娃娃菜
cuisine: 家常菜
difficulty: 1
duration: 15
calories: 1030
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/黔式腊肠娃娃菜/黔式腊肠娃娃菜.jpeg
description: 这道菜咸鲜可口，融合了黔式腊肠的醇香与娃娃菜的清甜，是西南菜系中少见的不辣风味，南北皆宜。娃娃菜富含维生素和膳食纤维，搭配腊肠的蛋白质与脂肪，营养均衡。制作过程极为简单，无需掌握火候和额外调味，从备料到出锅仅需 15 分钟，非常适合新手和忙碌的日常。
ingredients:
- name: 黔式腊肠 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 娃娃菜 300g
  amount: 0
  unit: 适量
  isMain: false
- name: 水 750ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 锅内放入 750ml 水，开火加热至沸腾
- number: 2
  description: 放入腊肠，计时 13 分钟
- number: 3
  description: 放入娃娃菜，计时 2 分钟
- number: 4
  description: 关火，夹出腊肠及娃娃菜
- number: 5
  description: 娃娃菜切段、腊肠切片，装盘
tips: 根据锅的大小，建议以水量没过食材为宜，宁多勿少; 如果没有刀具，娃娃菜和腊肠不切也可以; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
