id: 10139
name: 杨枝甘露
cuisine: 家常菜
difficulty: 2
duration: 20
calories: 661
servings: 2
description: 这是一道改良版的经典港式甜品，用奇亚籽代替西谷米，口感滑嫩又带有籽粒的细微嚼劲，芒果的香甜与葡萄柚的微酸交织，椰奶增添浓郁。富含膳食纤维、维生素 C 和优质脂肪，清爽解暑。制作非常简单，新手也能轻松完成，从备料到享用只需约 20 分钟。
ingredients:
- name: 奇亚籽 24g
  amount: 0
  unit: 适量
  isMain: false
- name: 牛奶 50ml
  amount: 0
  unit: 适量
  isMain: false
- name: 冰块 2 小块
  amount: 0
  unit: 适量
  isMain: false
- name: 芒果 1 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 葡萄柚 1/2 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 椰奶 150ml
  amount: 0
  unit: 适量
  isMain: false
- name: 切丝芒果干 （可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 切丝柳橙干 （可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 奇亚籽泡牛奶 10 分钟。
- number: 2
  description: 泡籽之时，把半粒芒果、葡萄柚去皮切丁，放入杯中。
- number: 3
  description: 半粒芒果切小块放入调理机加冰块、椰奶打成泥。
- number: 4
  description: 倒入杯中，放上点缀材料（如有）。
- number: 5
  description: 一边享用一边写代码！！
