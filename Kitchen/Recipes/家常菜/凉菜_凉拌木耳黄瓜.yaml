steps:
- number: 1
  description: 这个木耳来至于美天的信任之美、八朵木耳、此木耳没有根须、杂物、非常好！
- number: 2
  description: 用冷水浸泡2小时左右
- number: 3
  description: 木耳洗净、锅中倒入适量清水烧开、放入木耳煮2分钟左右、沥出
- number: 4
  description: 黄瓜洗净去皮切成滚刀
- number: 5
  description: 把所有调料放入碗中拌匀
- number: 6
  description: 淋在黄瓜木耳上、再撒上葱花、红泡椒粒、（可用胡萝卜粒代替）一盘开胃的菜菜上桌啦！
