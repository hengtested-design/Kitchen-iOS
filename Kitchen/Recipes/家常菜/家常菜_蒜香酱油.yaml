id: 10110
name: 蒜香酱油
cuisine: 家常菜
difficulty: 2
duration: 5
calories: 177
servings: 2
tags:
- 咸鲜
description: 蒜香酱油是一道蒜香浓郁、咸鲜油润的家常蘸料，常用于白切鸡、饺子等菜肴的提味。大蒜和芝麻分别具有抗菌和补充不饱和脂肪酸的作用。做法极其简单，对新手非常友好，全程只需大约 5 分钟即可完成。
ingredients:
- name: 蒜头 2 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 白芝麻 5 克
  amount: 0
  unit: 适量
  isMain: false
- name: 花生油 15 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油 30 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 蘸料碟 1 个
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 拍碎蒜头
- number: 2
  description: 往蘸料碟中加入酱油
- number: 3
  description: 起锅，加入花生油，等到油温滚烫后加入拍好的蒜头，炸半分钟
- number: 4
  description: 半分钟后，关火，把热油倒入蘸料碟，用筷子搅拌即可
