id: 10303
name: 咸肉菜饭
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 847
servings: 2
description: 这是一道充满上海弄堂风情的家常主食，咸肉的醇香与青菜的清甜在猪油的点化下融进每一粒米饭，既有锅巴焦脆，又保留菜梗爽嫩，层次分明。青菜富含维生素和膳食纤维，咸肉提供蛋白质与能量，荤素搭配均衡。做法并不复杂，但需要掌握分次下菜叶的小技巧，对新手而言稍有挑战。从头备料到出锅，大约需要 1 小时。
ingredients:
- name: 大米 300 g
  amount: 0
  unit: 适量
  isMain: false
- name: 水 310 ml（偏硬 300 ml，偏软 325 ml，如果加入冬笋，额外加入 20 ml）
  amount: 0
  unit: 适量
  isMain: false
- name: 青菜 400 g
  amount: 0
  unit: 适量
  isMain: false
- name: 咸肉 150 g
  amount: 0
  unit: 适量
  isMain: false
- name: 冬笋 100 g
  amount: 0
  unit: 适量
  isMain: false
- name: 猪油 15 g
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 0-3 g
  amount: 0
  unit: 适量
  isMain: false
- name: 白胡椒粉 1 g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 如果加入冬笋，切薄片后冷水下锅煮 10 分钟去涩味
- number: 2
  description: 咸肉切 1 cm 小丁
- number: 3
  description: 咸肉和冬笋冷锅下 10 g 猪油、料酒、白糖，中小火煸炒到透明冒泡
- number: 4
  description: 青菜切碎，菜梗和菜叶分开放，菜梗切成 0.5 cm 边长的正方形小块，菜叶切成长 2-3 cm，宽 1-1.5 cm 的长方形小块
- number: 5
  description: 菜梗下锅炒到翡翠色
- number: 6
  description: 米淘净后倒进电饭煲，加水
- number: 7
  description: 把炒好的咸肉和菜梗铺在米上
- number: 8
  description: 正常煮饭模式启动，最后 10 分钟开盖快速铺入菜叶
- number: 9
  description: 煮好后焖 5 分钟，再淋 5 g 猪油、白胡椒粉疯狂翻拌均匀
tips: 炒好的咸肉和菜梗铺在饭上，煮饭时千万不要搅匀; 尽量不要买“家乡鲜肉”，可以预期会很咸。如果不是淡咸肉可以混入新鲜五花肉丁，或减少咸肉的用量，或将瘦肉部分切下泡入 5% 糖水 20 分钟。; 参考资料：[咸肉菜饭 - 维基百科](https://wuu.wikipedia.org/wiki/%E5%92%B8%E8%82%89%E8%8F%9C%E9%A5%AD); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
