id: 10183
name: 巴基斯坦牛肉咖喱
cuisine: 家常菜
difficulty: 5
duration: 30
calories: 602
servings: 2
tags:
- 炖
cover: https://s.chuimg.com/巴基斯坦牛肉咖喱/巴基斯坦牛肉咖喱.jpeg
description: 这道巴基斯坦风味咖喱牛肉香浓软糯，酸辣开胃，带着浓郁的香料气息。牛肉提供优质蛋白，搭配番茄和酸奶，营养均衡。做法不算繁琐，但慢炖需要一点耐心，很适合在闲暇的周末从容准备。从头到尾大约两个半小时，就能端出一锅温暖的异国美味。
ingredients:
- name: 番茄🍅 4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 螺丝椒 2 个（大个的）
  amount: 0
  unit: 适量
  isMain: false
- name: 原味酸奶 1 盒
  amount: 0
  unit: 适量
  isMain: false
- name: Masala 粉一包 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜粉 5g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 全部螺丝椒切成段状，备用
- number: 2
  description: 全部番茄打成番茄蓉，备用
- number: 3
  description: 牛肉切成 2cm 的小块，洗净备用
- number: 4
  description: 炒锅中倒入一层油（用来防止番茄蓉沸腾蒸发）
- number: 5
  description: 倒入番茄蓉，持续搅拌 2-3 分钟，等待它越变越红
- number: 6
  description: 加入 5g 蒜粉，5g 姜粉和 1 包 50g 的 Masala 粉，搅拌均匀
- number: 7
  description: 加入牛肉和螺丝椒段，搅拌均匀
- number: 8
  description: 加入 1 盒酸奶（为了让整个酱汁变得粘稠），搅拌均匀
- number: 9
  description: 将整锅材料转移到电饭煲/电炖锅，并加入 250 ml 的水，开启炖肉/慢炖档，设定时间 2-3 个小时
- number: 10
  description: 等待完成，开锅检查牛肉软糯，就可以吃了
tips: 这道菜是从一个巴基斯坦的朋友那里偷师而来，特地整理了笔记，绝对正宗。; 通常配以 烙饼(roti)、馕(naan) 或 米饭 食用。; 如果想做 Chicken karahi 流程几乎是一样的，除了是先用油和各种花椒胡椒煎鸡肉变黄。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
