steps:
- number: 1
  description: 主材料，j啤酒和切好的鱼块。（鱼块里加入盐料酒淀粉和胡椒粉拌匀腌10分钟）
- number: 2
  description: 姜葱蒜切好备用。（没小香葱用了大葱替代）
- number: 3
  description: 上锅入适量油烧热，将鱼块煎至金黄色捞出。
- number: 4
  description: 煎好的鱼块盛盘。
- number: 5
  description: 利用锅里的底油爆香葱姜蒜。
- number: 6
  description: 再加入一勺辣豆瓣酱炒均。
- number: 7
  description: 放入煎好的鱼块略炒开。（轻点别弄碎鱼块）
- number: 8
  description: 加入适量的酱油和适量的盐。
- number: 9
  description: 再加入一小勺白糖。
- number: 10
  description: 最后加入啤酒，晃动一下锅子。
- number: 11
  description: 盖紧烧至汤汁浓稠关火。
- number: 12
  description: 成品。
_source: cookbook-kg
