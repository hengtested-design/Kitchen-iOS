  amount: 500
  unit: 克
  isMain: true
- name: 大蒜
  amount: 4
  unit: 个
  isMain: false
- name: 啤酒
  amount: 250
  unit: 毫升
  isMain: false
- name: 料酒
  amount: 1
  unit: 勺
  isMain: false
