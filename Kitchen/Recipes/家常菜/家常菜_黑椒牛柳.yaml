id: 10262
name: 黑椒牛柳
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 216
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/黑椒牛柳/黑椒牛柳.jpeg
description: 黑椒牛柳是一道广受欢迎的家常小炒，黑椒风味浓郁，牛柳嫩滑，搭配甜脆的洋葱和彩椒，荤素均衡，口味老少咸宜。牛肉富含优质蛋白和铁，彩椒和洋葱能补充多种维生素。这道菜对新手十分友好，从备料到出锅，通常一小时以内就能完成。
ingredients:
- name: 牛肉量
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱量
  amount: 0
  unit: 适量
  isMain: false
