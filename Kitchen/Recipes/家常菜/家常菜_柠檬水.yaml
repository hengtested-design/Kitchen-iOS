id: 10140
name: 柠檬水
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 141
servings: 2
tags:
- 酸甜
- 咸鲜
cover: https://s.chuimg.com/柠檬水/柠檬水.jpeg
description: 这道饮品以新鲜柠檬为主角，搭配果蜜调和，酸甜平衡，冰镇后更感清凉解暑。柠檬富含维生素 C，经常饮用有助于补充营养、提神美白。制作步骤极简，只需捶打、加料、摇晃，新手也能在三五分钟内完成。
ingredients:
- name: 柠檬 40~45 克
  amount: 0
  unit: 适量
  isMain: false
- name: 果蜜 40~45 克
  amount: 0
  unit: 适量
  isMain: false
- name: 冰几块（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 称 40~45 克柠檬，放入雪克杯中
- number: 2
  description: 雪克杯盖盖子锤大约 10 次
- number: 3
  description: 加入果蜜 40~45 克
- number: 4
  description: 补水
- number: 5
  description: 摇晃均匀
- number: 6
  description: 最后根据喜好加冰
