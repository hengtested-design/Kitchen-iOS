id: 10222
name: 红烧鸡翅
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 1016
servings: 2
tags:
- 咸鲜
- 下饭菜
- 红烧
description: 红烧鸡翅是一道家常下饭菜，咸鲜带甜、色泽红亮，肉质嫩滑易脱骨。鸡翅富含优质蛋白质与胶原蛋白，营养好吸收。制作难度适中，新手按步骤操作也能顺利掌握，从备料到出锅大约需要 40 分钟。
ingredients:
- name: 新鲜鸡翅 500g（约 8-10 个，单个鸡翅约 50-60g）
  amount: 0
  unit: 适量
  isMain: false
- name: 姜片 4-5 片（约 10g，切片厚度约 2mm）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱段 2-3 段（约 15g，每段长度约 3cm）
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 3-4 瓣（约 15g）
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 1 片
  amount: 0
  unit: 适量
  isMain: false
- name: 八角 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒 2 个（可选，约 5g，不吃辣可省略）
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 15g（颗粒状冰糖）
  amount: 0
  unit: 适量
  isMain: false
