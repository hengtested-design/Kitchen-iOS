id: 10329
name: 空气炸锅照烧鸡饭
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 1854
servings: 2
tags:
- 下饭菜
- 炸
cover: https://s.chuimg.com/空气炸锅照烧鸡饭/空气炸锅照烧鸡饭.jpeg
description: 这道日式照烧风味的鸡肉饭，甜咸酱汁浓郁，表层烘烤得略微焦脆，内里软嫩多汁，搭配米饭非常下饭。鸡肉和鸡蛋提供丰富的优质蛋白，不过酱油和糖的用量较多，更适合偶尔改善口味。做法简单，只需混合原料交给空气炸锅，新手也能轻松搞定，从准备到出锅大约需要 1 小时。
ingredients:
- name: 鸡肉 900g
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油 100-125ml
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 60-65g
  amount: 0
  unit: 适量
  isMain: false
- name: 白醋 30-35ml
  amount: 0
  unit: 适量
  isMain: false
- name: 丽滋饼干（咸味曲奇可替代） 16 个(48g)
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 2 个
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将酱油、糖和醋混合在一起,搅匀料汁备用
- number: 2
  description: 另一个碗中加入鸡肉、鸡蛋、1/2 料汁和压碎的丽滋饼干。搅拌均匀
- number: 3
  description: 空气炸锅用箔纸碗铺底，加入肉饼混合物，将剩余的料汁均匀的倒在上面
- number: 4
  description: '**350°F(177°C)** 炸**40 分钟**。最好在米饭上食用'
- number: 5
  description: 在外观*呈金黄酥脆*后出锅，切块盛盘
tips: 米饭的做法参考[电饭煲蒸米饭](https://cook.aiursoft.com/dishes/staple/%E7%B1%B3%E9%A5%AD/%E7%94%B5%E9%A5%AD%E7%85%B2%E8%92%B8%E7%B1%B3%E9%A5%AD/)或[煮锅蒸米饭](https://cook.aiursoft.com/dishes/staple/%E7%B1%B3%E9%A5%AD/%E7%85%AE%E9%94%85%E8%92%B8%E7%B1%B3%E9%A5%AD/); 操作时，需要注意温度以免烫伤。; 参考资料：[库克美食教程:Air fryer Teriyaki Chicken Meatloaf](https://cookpad.com/eng/recipes/16276348); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
