id: 10111
name: 蔗糖糖浆
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 400
servings: 2
cover: https://s.chuimg.com/蔗糖糖浆/蔗糖糖浆.jpeg
description: 自制饮料糖浆，按 1：1 比例将白砂糖与水混合溶解，方便控制冷饮甜度，是调饮的基础配方。富含碳水化合物，能快速补充能量。做法极其简单，对新手非常友好，仅需几分钟即可完成，冷藏可保存一周。
ingredients:
- name: 水 100 克
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 100 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将称好的白砂糖的饮用水于容器混匀
- number: 2
  description: 容器封盖放冰箱冷藏
tips: 水无论冷热都可，如果比较急用，可用热水溶解后再冷却糖浆。; 配制好的糖浆不会轻易变质，在冷藏状态下保存一周通常是没问题的。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
