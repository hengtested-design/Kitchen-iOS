id: 10149
name: 酸梅汤
cuisine: 家常菜
difficulty: 2
duration: 360
calories: 359
servings: 2
tags:
- 酸甜
- 煮
cover: https://s.chuimg.com/酸梅汤/酸梅汤.jpeg
description: 酸梅汤是一道酸甜可口、清凉解暑的传统饮品，冰镇后饮用尤为沁人心脾。配方中的乌梅、山楂、甘草等原料有助于生津止渴、消食开胃。做法简单，新手友好，只需浸泡、熬煮和冷藏即可。制作全程包括浸泡、两次煎煮和冷藏，大约需要 6 小时以上，建议提前准备。
ingredients:
- name: 两升水
  amount: 0
  unit: 适量
  isMain: false
- name: 乌枣 25 克
  amount: 0
  unit: 适量
  isMain: false
- name: 乌梅 25g
  amount: 0
  unit: 适量
  isMain: false
- name: 黄冰糖 100 克
  amount: 0
  unit: 适量
  isMain: false
- name: 山楂片 30 克
  amount: 0
