steps:
- number: 1
  description: 鱼头洗净从中间劈开。
- number: 2
  description: 豆腐切成块备用。
- number: 3
  description: 锅中放入油，下入豆腐块。
- number: 4
  description: 炸至金黄捞出。
- number: 5
  description: 再下入鱼头煎制。
- number: 6
  description: 把鱼头推向一边，炒香葱姜蒜和八角。
- number: 7
  description: 烹入料酒，加入酱油 醋 糖。
- number: 8
  description: 加入开水，烧开。
- number: 9
  description: 加入炸好的豆腐，转中火焖至20分钟，加入盐和鸡精调味即可。
