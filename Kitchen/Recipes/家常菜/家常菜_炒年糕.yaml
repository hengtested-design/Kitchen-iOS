id: 10316
name: 炒年糕
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 960
servings: 2
tags:
- 炒
description: 这是一道闽南风味的主食，年糕软糯弹牙，带着葱油的焦香，家常又饱腹。以米粉制成的年糕提供充足碳水化合物，搭配鸡蛋和青菜能补充蛋白质与维生素，营养均衡。做法简单，对新手友好，从准备到出锅大约需要 30 分钟。
ingredients:
- name: 年糕 250 g * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 2 根 * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 50 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 1-2g * 份数，按口味喜好。
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 锅中加水烧开，煮熟年糕，碗中加水确保年糕不会粘连，捞起年糕备用。
- number: 2
  description: 小葱切葱花（将葱白和葱叶分开），青菜切小段备用。
- number: 3
  description: （可选） 制作炒蛋，见[西红柿炒蛋](https://github.com/Anduin2017/HowToCook/blob/master/dishes/vegetable_dish/%E8%A5%BF%E7%BA%A2%E6%9F%BF%E7%82%92%E9%B8%A1%E8%9B%8B.md)。
- number: 4
  description: 热锅，加入 30ml 食用油。
- number: 5
  description: 将葱白倒入锅中，直至大部分葱白变成焦黄色且发出香味，倒出葱油备用。
- number: 6
  description: 重新热锅，加入 20ml 食用油。
- number: 7
  description: 加入所有辅料（鸡蛋，青菜等），翻炒均匀。
- number: 8
  description: 将年糕的水倒掉，向锅中加入年糕。
- number: 9
  description: 加入酱油和盐，翻炒均匀。
- number: 10
  description: 关火，加入葱油，翻炒均匀，乘盘。
tips: 辅料的选择可以根据个人选择酌情添加，如加入瘦肉等; 在煮年糕的时候注意搅拌，以免粘锅; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
