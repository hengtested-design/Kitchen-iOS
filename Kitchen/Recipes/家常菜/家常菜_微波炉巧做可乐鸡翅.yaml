id: 10049
name: 微波炉巧做可乐鸡翅
cuisine: 家常菜
difficulty: 1
duration: 20
calories: 230
servings: 2
tags:
- 原味
- 烧
cover: https://i02piccdn.sogoucdn.com/556bf37e13d5344b
ingredients:
- name: 鸡中翅
  amount: 15
  unit: 个
  isMain: true
- name: 可口可乐
  amount: 0
  unit: 适量
  isMain: false
- name: 糖
  amount: 1
  unit: 勺
  isMain: false
- name: 酱油
  amount: 0
  unit: 少许
  isMain: false
steps:
- number: 1
  description: 我用的原料很少，但是可乐一定选择可口可乐，我总觉得这样做出来的味道更地道些。
- number: 2
  description: 锅内放少许油，因鸡翅本身皮脂含油，所以尽量少放油。将鸡翅放入炒至颜色变白时加入一勺白糖。
- number: 3
  description: '本人不喜欢爆锅，觉得那样会有很多葱姜蒜末的渣滓。另外做肉制品，放糖是必须的，既除腥又提鲜。只是北方人不太喜欢吃糖，看个人口味吧。: 3'
- number: 4
  description: '加入白糖炒至颜色发黄，发焦时加入酱油。: 个人觉得放老抽的话比生抽味道更香，但颜色会深些，也看各自爱好吧。'
- number: 5
  description: 炒至水分消失，就是有些粘锅底了就灭火，这时放入微波专用碗中，入微波炉微波4分钟。可以根据多少适当增加时间。这便是减少时间最好的办法。微波炉工作原理由内加热，所以鸡肉会从里面先熟，这样短短4分钟便可以完成煤气灶上加水小火慢炖的工序了。
- number: 6
  description: 等待的时间可以收拾一下厨房。
- number: 7
  description: 4分钟到了，取出碗来，这时很明显看到碗中有大半碗微波时鸡肉中出来的水分。拍得不是很清楚，具体操作时会看到的。
- number: 8
  description: 将鸡肉再次倒入炒锅翻炒，将微波出的鸡汁炒干。这其实是最重要的一步，因为微波炉从鸡肉内部加热可将鸡肉本身的水分带出，这样就免去了普通制作方法中鸡肉外面很漂亮鲜美，而内部颜色发白并且略带腥味。而4分钟的微波时间，刚好让鸡肉内部水分析出却不会达到发柴发干。这时倒入可乐，将鸡块没过即可，失去水分的鸡肉内部分子会尽可能的把可乐汁吸收进去，这样鸡肉本身的腥味全部被可乐代替，鸡肉分子就会喝饱可乐。
- number: 9
  description: 刚加入可乐时会有很多气泡，只要刚刚没过鸡翅就可以了，大火熬制当气泡消失露出鸡肉来就可以翻炒了。随着翻炒会观察到鸡肉在迅速上色、发亮。
- number: 10
  description: 凡是加入糖来烹饪的菜肴，只要看到糖挂色了，虽然感觉锅里还有浆汁，也要及时加入出锅前提味的佐料，迅速翻炒、关火。这里就把蒜末、辣椒碎加入。因为动作稍稍一慢，汤汁就全部干掉了，这是经验哦！能喝酒的人，出锅前可以淋上些酒。
- number: 11
  description: 大功告成。装盘。
_source: cookbook-kg
