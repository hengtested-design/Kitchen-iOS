id: 10075
name: 鲤鱼炖白菜
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 792
servings: 2
tags:
- 咸鲜
- 煮
cover: https://s.chuimg.com/鲤鱼炖白菜/鲤鱼炖白菜.jpeg
description: 鲤鱼炖白菜是一道鲜香浓郁的家常炖菜，鱼肉软嫩入味，白菜清甜吸汁，属于典型的北方风味。鲤鱼富含优质蛋白和不饱和脂肪酸，搭配白菜提供膳食纤维和维生素，营养均衡。制作过程需要煎鱼和炖煮，有一定难度但不算复杂，适合有基础烹饪经验的朋友尝试，从备料到出锅大约需要 40 分钟。
ingredients:
- name: 食用油：10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 姜：3 片
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜：3 瓣（切成块）
  amount: 0
  unit: 适量
  isMain: false
- name: 鲤鱼：1.2 斤（清理过的）
  amount: 0
  unit: 适量
  isMain: false
- name: 娃娃菜：13 片（可以多放一些，一顿就缩小了）
  amount: 0
