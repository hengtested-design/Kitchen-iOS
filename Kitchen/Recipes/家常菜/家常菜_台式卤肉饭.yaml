id: 10162
name: 台式卤肉饭
cuisine: 家常菜
difficulty: 3
duration: 300
calories: 1495
servings: 2
cover: https://s.chuimg.com/台式卤肉饭/台式卤肉饭.jpeg
description: 台式卤肉饭是一道浓香四溢的台湾家常料理，肉条软糯入味，酱汁琥珀般油亮，浇在热米饭上满口脂香。富含优质蛋白、胶原蛋白和碳水，能快速补充能量。做法对新手非常友好，只需备好食材、掌握火候，全程约 1.5 小时即可完成，其中动手操作仅需半小时，剩下的交给小火慢炖。
ingredients:
- name: 红葱头 25 g
  amount: 0
  unit: 适量
  isMain: false
- name: 带皮五花肉 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 4 个（可任意修改鸡蛋个数）
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽酱油 75 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 米酒 10 + 25 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 25 g
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 2 片
  amount: 0
  unit: 适量
  isMain: false
- name: 八角 1 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 20 g
  amount: 0
  unit: 适量
  isMain: false
- name: 白胡椒粉 6 g
  amount: 0
  unit: 适量
  isMain: false
- name: 五香粉 6 g
  amount: 0
  unit: 适量
  isMain: false
- name: 米饭 （根据个人食量决定）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 带皮五花肉切成 $0.7cm（长）\times 0.7cm（宽） \times 2.5cm（高）$ 的细长条
- number: 2
  description: 红葱头、大蒜切末备用
- number: 3
  description: 鸡蛋煮熟剥壳，并用刀划破蛋白（便于入味），备用。
- number: 4
  description: '**大火**热锅，锅内放入 15 ml 食用油，让油滑满锅底即可。'
- number: 5
  description: 放入五花肉条，翻炒至肉色稍微变白，沿锅边淋入米酒 10ml 。继续翻炒至五花肉不再出油。
- number: 6
  description: 将切好的红葱头加入锅中，翻炒 1 分钟爆出油葱香味。
- number: 7
  description: 将切好的红葱头加入锅中，翻炒 30 秒。
- number: 8
  description: 把猪肉推到旁边，放入冰糖加热到融化冒泡变成焦糖，再把猪肉一起翻拌，让焦糖均匀附着。
- number: 9
  description: 加入生抽炒出香气。
- number: 10
  description: 呛入米酒 25 ml ，水加到淹过猪肉，加入白胡椒粉、五香粉、八角、香叶、水煮蛋，沸腾后转小火卤 1 小时。
- number: 11
  description: 1 小时后，开大火收汁直到酱汁浓稠，呈现有光泽的琥珀色，即完成。
- number: 12
  description: 炖煮结束后，乘一碗米饭，将软烂的卤肉浇在米饭上，并加上卤蛋，开始享用。
tips: 对于五花肉切条步骤，定义：五花肉带皮面向上摆在桌上，此时肉皮所在平面为长宽形成的平面，垂直此平面的为高。肉条最终效果是肥瘦相间的细长条。（注意：此处肉条一定要细，即长宽较小。细肉条更易于炖煮软糯）。; 五花肉切条小技巧：; 若五花肉是**未冷冻**的，可以放入冰箱**冷冻室 30 分钟** 再取出切条。; 若是**冷冻五花肉**，可以在**常温**下放置 **30 分钟** 后再切条。; 切条时可以较小的力度将刀刃与肉快速摩擦，如此更易于切割并保护五花肉肥瘦相间的结构。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
