id: 10122
name: 红柚蛋糕
cuisine: 家常菜
difficulty: 3
duration: 35
calories: 622
servings: 2
tags:
- 炸
description: 红柚蛋糕是一道用空气炸锅就能轻松完成的清新甜点，融合了红柚果粒的微酸果香与蛋糕的松软口感，适合作为单人份下午茶。鸡蛋和面粉提供蛋白质与碳水，红柚富含维生素 C，带来简单的基础营养。制作难度中等，关键在于分次搅拌成无颗粒的淡黄色面糊，新手只要耐心按步骤操作就能成功。从备料到出锅大约需要 35 分钟，想吃现烤甜点时不会占用太多时间。
ingredients:
- name: 鸡蛋 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 面粉 80g
  amount: 0
  unit: 适量
  isMain: false
- name: 红柚果肉 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 油 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 水 80ml
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 15g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 锡纸盘里打入鸡蛋 2 个， 加入红柚果肉 20g
- number: 2
  description: 锡纸盘中倒入 15ml 油并摇晃锡纸盘时期均匀覆盖盘底
- number: 3
  description: 锡纸盘中放入 10g 糖， 以及 40g 面粉和 40ml 水
- number: 4
  description: 用筷子顺时针方向搅拌至淡黄色糊状
- number: 5
  description: 锡纸盘中放入 5g 糖， 以及 40g 面粉和 40ml 水
- number: 6
  description: 继续用筷子搅拌至淡黄色糊状
- number: 7
  description: 锡纸盘放入空气炸锅的烤篮上，用 180 摄氏度烤 15 分钟
- number: 8
  description: 打开空气炸锅，小心取出锡纸盘，用筷子或勺子将蛋糕翻面
- number: 9
  description: 继续 180 摄氏度烤 8 分钟
- number: 10
  description: 取出即可食用
tips: 如果喜欢较甜的口感可以增加 10g 糖; 红柚果肉可以酌情添加，但每份最好不超过 40g 以免影响成品观感; 糊状指没有面粉疙瘩且整体颜色均匀; 刚出锅的锡纸盘比较烫，请用夹子夹取或使用湿抹布之类的隔热材料拿取; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
