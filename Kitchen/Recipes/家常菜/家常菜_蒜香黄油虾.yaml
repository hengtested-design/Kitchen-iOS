id: 10070
name: 蒜香黄油虾
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 526
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/蒜香黄油虾/蒜香黄油虾.jpeg
description: 蒜香黄油虾是一道经典的西式海鲜菜，虾肉鲜嫩弹牙，被浓郁的蒜香和黄油包裹，带有淡淡柠檬清香。虾肉富含优质蛋白，搭配黄油提供能量，适合快速补充营养。做法简单，只需几种常见食材，新手也能轻松上手，从备料到出锅大约二十分钟。
ingredients:
- name: 大虾 8-10 只（约 200g）
  amount: 0
  unit: 适量
  isMain: false
- name: 无盐黄油 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 4 瓣（约 20g）
  amount: 0
  unit: 适量
  isMain: false
- name: 白葡萄酒 15ml（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 柠檬 1/4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 橄榄油 10ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 大虾去头去壳留尾，用牙签挑去虾线，洗净后用厨房纸吸干水分
- number: 2
  description: 大蒜切成蒜末，备用
- number: 3
  description: 中火加热平底锅，放入 10ml 橄榄油
- number: 4
  description: 油热后放入大虾，每面煎 1-1.5 分钟至变色，取出备用
- number: 5
  description: 同一锅中加入黄油，融化后放入蒜末，小火炒香（约 30 秒）
- number: 6
  description: 如使用白葡萄酒，此时加入并煮至酒精挥发（约 1 分钟）
- number: 7
  description: 将虾放回锅中，与蒜香黄油酱汁翻炒均匀（约 1 分钟）
- number: 8
  description: 挤入柠檬汁，翻炒均匀后立即关火
- number: 9
  description: 装盘，淋上锅中剩余酱汁
tips: 虾不宜过度烹饪，否则会变硬; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
