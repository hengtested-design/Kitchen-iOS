id: 10187
name: 徽派红烧肉
cuisine: 家常菜
difficulty: 4
duration: 45
calories: 3847
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/徽派红烧肉/徽派红烧肉.jpeg
description: 徽派红烧肉是一道色泽红亮、肥而不腻的经典徽式家常菜，口感软糯 Q 弹，咸甜交融。以五花肉为主料，富含优质蛋白质和脂肪，能提供充沛能量。烹制需掌握炒糖色与火候，稍有挑战，预估制作时长约 45 分钟。
steps:
- number: 1
  description: 五花肉切块，每块 2-3 cm 大小
- number: 2
  description: 锅中加入 150 ml 食用油，倒入五花肉，煎炸 2 分钟 后，加入盐，翻炒五花肉，2 分钟 后出锅
- number: 3
  description: 锅中加入 50 ml 食用油，倒入白砂糖，翻炒到咖啡色
- number: 4
  description: 倒入五花肉，翻炒 30 S ，加入姜片、蒜头后翻炒 30 S
- number: 5
  description: 加入料酒，五香粉、葱，加入水没过五花肉，盖上锅盖煮 10 分钟
- number: 6
  description: 加入生抽、老抽、蚝油，中火煮 20 分钟
- number: 7
  description: 开锅，大火烧汁，端盘
tips: '* 葱是整根，不需要切碎; * 步骤二加盐的目的是锁住五花肉的油脂; * 制作过程，用部分五花肉做了水煮处理，跟未处理的一起做后续制作，发现未水煮的肉质更 Q 弹; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
