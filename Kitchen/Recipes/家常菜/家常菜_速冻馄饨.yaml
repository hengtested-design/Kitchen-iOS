id: 10273
name: 速冻馄饨
cuisine: 家常菜
difficulty: 2
duration: 55
calories: 540
servings: 2
tags:
- 咸鲜
description: 速冻馄饨皮薄馅嫩，汤清味鲜，是一道便捷的家常面食。主要提供碳水化合物和蛋白质，便于快速补充能量。做法简单，对新手非常友好，使用电饭煲即可完成，从烧水到出锅大约需要 55 分钟。
steps:
- number: 1
  description: 将水倒入电饭煲中，按炖或煮的模式运行 35 分钟，此时揭开电饭煲应看到水为沸腾状态。
- number: 1
  description: 将速冻馄饨小心放入水中，注意不要烫伤。
- number: 2
  description: 放入电饭煲前可以适当用水过一下。
- number: 3
  description: 如果馄饨有调料包，此时可一并加入水中。
- number: 1
  description: 盖上电饭煲，按同样炖或煮的模式运行 20 分钟。
- number: 1
  description: 将所有馄饨连同能没过所有馄饨的水一同盛入碗中。
- number: 2
  description: 如果此前没有加入调料包，此时可按自身口味轻重加入盐、鸡精、胡椒粉、香油调味。
- number: 3
  description: 也可撒上 5~8 片香菜叶佐味（仅适用于对香菜味道不敏感的人）。
tips: '* 出锅后也可以加入水煮荷包蛋（[太阳蛋](../../dishes/breakfast/太阳蛋.md)）一起食用。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
