id: 10411
name: 陕北熬豆角
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 191
servings: 2
tags:
- 炖
description: 这是一道西北农家风味的炖菜，豆角绵软、土豆沙糯、番茄汤汁浓郁，酸香开胃。富含膳食纤维、维生素和碳水化合物，营养均衡。做法极其简单，食材用量可随喜好调整，几乎没有失败的可能，对新手特别友好。从备料到出锅，大约只需 30 分钟。
ingredients:
- name: 豆角 300g * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆 1 个 * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 西红柿 1 个 * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 螺丝椒（可选）2 个 * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 6g * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 6ml * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 五香粉 3g * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 6ml * 2 人
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 3 圈
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 2 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 香菜碎（可选）根据口味加
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 葱切花，蒜切沫，姜切丝，备用。
- number: 2
  description: 豆角去筋，切*2-10cm*小段，备用。
- number: 3
  description: 土豆去皮，切*1cm³*小块，备用。
- number: 4
  description: 西红柿去皮，切*1cm³*小块，备用。
- number: 5
  description: 辣椒去仔，切*0.15cm 宽*条，备用。
- number: 6
  description: 起锅烧油(10ml - 15ml)，冒烟后放入葱姜蒜，翻炒至闻到葱姜蒜香味；
- number: 7
  description: 加入豆角，翻炒至变色（青绿色变为翠绿色）；
- number: 8
  description: 加入土豆块，翻炒 30s；
- number: 9
  description: 加入热水（水面刚刚漫过菜），盖上锅盖熬至土豆*变软*（可以用筷子确认）；
- number: 10
  description: 加入西红柿块，加入盐，生抽，蚝油，五香粉，辣椒，熬至西红柿成汁（注意搅拌，防止糊锅）；
- number: 11
  description: 加入香菜碎，出锅。
tips: 加入西红柿后开始继续熬制后，需要偶尔翻搅防止糊底; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
