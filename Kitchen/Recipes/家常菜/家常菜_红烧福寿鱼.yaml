id: 10118
name: 红烧福寿鱼
cuisine: 家常菜
difficulty: 1
duration: 20
calories: 200
servings: 2
tags:
- 鱼香
- 烧
cover: https://i04piccdn.sogoucdn.com/4d76d3ca1ae96980
ingredients:
- name: 福寿鱼
  amount: 1
  unit: 条
  isMain: true
- name: 葱
  amount: 0
  unit: 适量
  isMain: false
- name: 姜
