id: 10102
name: 鸡蛋三明治
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 560
servings: 2
tags:
- 快手菜
description: 这是一道简单快手的西式简餐，吐司夹着绵密的鸡蛋酱和咸香培根，口感软嫩又带着焦香。鸡蛋富含优质蛋白，搭配培根和黄油能快速补充能量。操作非常友好，厨房新手也能轻松驾驭，全程只需 大约 10 分钟即可完成。
ingredients:
- name: 鸡蛋 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 吐司 2 片
  amount: 0
  unit: 适量
  isMain: false
- name: 培根 2 片
  amount: 0
  unit: 适量
  isMain: false
- name: 黄油 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 蛋黄酱 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 1g
  amount: 0
  unit: 适量
  isMain: false
- name: 黑胡椒 2g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 吐司切去四边，备用
- number: 2
  description: 鸡蛋煮熟，捣碎
- number: 3
  description: 混合鸡蛋、蛋黄酱、盐、黑胡椒
- number: 4
  description: 锅中加入黄油，煎熟培根
- number: 5
  description: 组装吐司，在两片吐司间加入制作好的鸡蛋酱及培根
- number: 6
  description: 四边形吐司切成三角形装盘
tips: 也可加入芝士、酸黄瓜等食材; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
