id: 10400
name: 蒲烧茄子
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 326
servings: 2
tags:
- 煎
description: 蒲烧茄子是一道咸甜交织、口感软糯的家常菜，借鉴日式蒲烧风味却用中式煎烧手法烹制。茄子富含膳食纤维和多种维生素，有助于清热活血。难度适中，对新手稍需耐心，预计制作时长约 30 分钟。
ingredients:
- name: 根据锅的类型决策不同量的油
  amount: 0
  unit: 适量
  isMain: false
- name: 不粘锅：油汇聚成滴后要散布在茄子的面积
  amount: 0
  unit: 适量
  isMain: false
- name: 铁锅：摊开后油可以刚好覆盖锅底
  amount: 0
  unit: 适量
  isMain: false
- name: 1 个长的上小下大的茄子（注意不要使用浙茄和圆茄）
  amount: 0
  unit: 适量
  isMain: false
- name: 1 份蒲烧汁
  amount: 0
  unit: 适量
  isMain: false
- name: 20 ml 蜂蜜
  amount: 0
  unit: 适量
  isMain: false
- name: 15 ml 白糖
  amount: 0
  unit: 适量
  isMain: false
- name: 40 ml 生抽
  amount: 0
  unit: 适量
  isMain: false
- name: 10 ml 老抽
  amount: 0
  unit: 适量
  isMain: false
- name: 20 ml 料酒
  amount: 0
  unit: 适量
  isMain: false
- name: 100 ml 水
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 茄子削皮、横着切成两段
- number: 2
  description: 蒸 5  分钟
- number: 3
  description: 纵向切开，不要切断，在两边切面各划 2~3 刀至可以摊平
- number: 4
  description: 煎至两面金黄
- number: 5
  description: 往茄子上浇蒲烧汁至没过 1/2 茄子高度
- number: 6
  description: 煎至背面上色，翻面
- number: 7
  description: 把剩下的蒲烧汁浇在茄子上
- number: 8
  description: 出锅，一份茄子烧蒲烧汁就烧好了
tips: 这个蒲焼き其实很中国，日式的蒲烧其实是烤的。; 灵魂其实在于蒲烧汁？也可以买现成的蒲烧汁。; 如果觉得腻可以在装盘后撒点切成 2~5 mm 的小葱，颜色搭配上也能不那么单调。; 炒茄子（鱼香茄子、酱爆茄子）墙裂推荐浙茄，细长所以切成滚刀块刚刚好，皮很嫩不像这里需要去皮，茄子的味道适中。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
