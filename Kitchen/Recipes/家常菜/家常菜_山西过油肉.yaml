id: 10182
name: 山西过油肉
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 679
servings: 2
tags:
- 咸鲜
description: 过油肉是山西传统名菜，肉片滑嫩、蒜苔爽脆，咸鲜微酸，带着陈醋的醇香，属于典型的地方家常风味。猪里脊提供优质蛋白，搭配木耳、蒜苔和葱头，营养均衡。这道菜对火候和上浆技巧有一定要求，更适合有一定下厨基础的爱好者尝试。从备料到出锅，大约需要 40 分钟。
ingredients:
- name: 猪里脊 150 g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜苔 6 根
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 300ml
  amount: 0
  unit: 适量
  isMain: false
- name: 葱姜蒜 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 木耳 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱头 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 其他调料 20g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 木耳提前泡发好，如果着急可以用热水泡发。
- number: 2
  description: 猪里脊切片放入碗中，加 20ml 生抽、料酒、花椒粉，打入一个鸡蛋，拿自己的小手搅拌均匀，加入淀粉（建议红薯淀粉）拌匀，倒入 300ml 食用油封浆，腌制 15 分钟。
- number: 3
  description: 蒜苔切段大约 3cm，葱头切菱形块备用。
- number: 4
  description: 起锅烧油油要多一点，油温五成热，下入腌制好的肉片，将肉片打散，捞出控油备用。
- number: 5
  description: 将锅中多余油倒出，留 10ml 油炒菜，油温七成热
- number: 6
  description: 下入葱姜蒜爆香，先下蒜苔炒至断生，再下入木耳葱头，加入生抽，花椒粉，翻炒几下将之前炸好的肉片下入翻炒
- number: 7
  description: 加 10g 的盐，起锅前加 10ml 的醋和鸡精，起锅装盘。
tips: 炸肉片时，表面微焦即可，注意控制火候。; 起锅前也可以打个薄薄的水淀粉，口感更佳。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
