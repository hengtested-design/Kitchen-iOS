id: 10363
name: 凉拌黄瓜
cuisine: 家常菜
difficulty: 1
duration: 15
calories: 107
servings: 2
tags:
- 凉拌
description: 这是一道清爽开胃的家常凉菜，口感脆嫩，酸香适口。黄瓜富含水分和维生素，有助于清热解暑、美容养颜。做法非常简单，对新手友好，只需拍碎、调味、腌制 15 分钟，全程约 20 分钟即可完成。
steps:
- number: 1
  description: 用菜刀将黄瓜拍扁，再剁成长 3 厘米的碎块
- number: 2
  description: 将碎黄瓜装入碗中
- number: 3
  description: 将蒜拍碎切成碎末
- number: 4
  description: 将碗中放入 5 克白糖，搅拌均匀腌制 15 分钟（用糖腌制更好吃，且成色更好不会蔫）
- number: 5
  description: 将醋，酱油，盐，蚝油和蒜依次倒入碗中搅拌均匀
- number: 6
  description: 将香油倒入碗中并均匀搅拌
tips: '* 部分情况下黄瓜端头有苦味，请洗净切下后确认; * 做好之后直接开吃，亦可先准备好后放入冰箱冷藏（并非冷冻）后食用; * 若放入冰箱冷藏，则需使用保鲜膜包紧，并在 8 小时内食用完毕，否则黄瓜会因过度腌制失去清脆口感; * 推荐黄瓜去皮，口感更好; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
