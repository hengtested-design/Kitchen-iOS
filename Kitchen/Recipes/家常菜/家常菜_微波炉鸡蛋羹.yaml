id: 10415
name: 微波炉鸡蛋羹
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 160
servings: 2
tags:
- 快手菜
- 蒸
cover: https://s.chuimg.com/鸡蛋羹/微波炉鸡蛋羹.jpeg
description: 微波炉鸡蛋羹是一道简单快手的家常蒸蛋，口感嫩滑细腻，尤其适合作为夜宵或快速加餐。鸡蛋富含优质蛋白质和多种维生素，能为身体提供必要营养，虾皮还补充了钙质。这道菜对新手非常友好，无需掌握火候技巧，从打蛋调味到出炉，全程仅需约 10 分钟即可完成。
ingredients:
- name: 鸡蛋 2 个 * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 水 200ml * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 虾皮 10 个 * 份数（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 5g *份数（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 3g * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 芝麻油（香油） 1ml（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将鸡蛋打入可使用微波炉加热的陶瓷碗中，使用筷子将其打散。
- number: 2
  description: 加入水和盐，搅拌均匀。
- number: 3
  description: 将虾皮放入碗中，搅拌均匀，保证所有虾皮不会堆积在一起。
- number: 4
  description: 葱切碎至边长 0.6±3mm 状，放入碗中搅拌均匀。
- number: 5
  description: 将此碗及内容物放入微波炉中，容器表面覆盖保鲜膜或以可微波瓷盘加盖（注意：不得密封，必须留有涨缩量）加热 2 分钟(500W)。
- number: 6
  description: 小心地取下保鲜膜或其他覆盖物，然后继续加热 2 分钟。
- number: 7
  description: 若微波炉不带旋转式加热盘，将碗缓慢的水平旋转 180 度，以确保内容物加热均匀。
- number: 8
  description: 放入芝麻油。
- number: 9
  description: 小心地从微波炉中拿出碗（真的很烫）。
- number: 10
  description: 如果选择放入酱油，则确保酱油在鸡蛋羹表面流动后能以最薄的形式沾满鸡蛋羹表面即可。
- number: 11
  description: 开心的享受鸡蛋羹
tips: 鸡蛋 1 个约为 50±5g。若使用其他品种蛋品可按比例增减水量。; 一定要确保将鸡蛋打散，否则可能会发生轻度鸡蛋爆炸。; 鸡蛋和水不能超过碗容量的 2/3，否则可能发生溢出。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
