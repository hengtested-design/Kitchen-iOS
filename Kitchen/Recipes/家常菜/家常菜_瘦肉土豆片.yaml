id: 10213
name: 瘦肉土豆片
cuisine: 家常菜
difficulty: 3
duration: 60
calories: 585
servings: 2
tags:
- 快手菜
- 炒
cover: https://s.chuimg.com/瘦肉土豆片/瘦肉土豆片.jpeg
description: 一道快手家常小炒，肉片滑嫩，土豆片软韧入味，带有蒜苗清香，属于典型的家常菜风格。瘦肉富含优质蛋白质和铁质，土豆提供碳水化合物和膳食纤维，搭配均衡。制作流程简单明了，需注意刀工和火候，适合有一定基础的新手尝试。从备料到出锅，预计 大约 1 小时即可完成。
ingredients:
- name: 纯瘦肉 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜苗 2 根（约 20 g）
  amount: 0
  unit: 适量
  isMain: false
- name: 生粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用盐 2g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 土豆去皮、对半切开，再切成约 2mm 的薄片，备用
- number: 2
  description: 蒜苗洗净，切成约 1cm 的段，备用
- number: 3
  description: 瘦肉洗净切成约 2mm 的薄片，放入碗中，加入 5g 生粉、5g 生抽、3g 老抽腌制十分钟，备用
- number: 4
  description: 瘦肉腌制时，烧一锅开水，将土豆片放入锅中，焯水，约 5 分钟
- number: 5
  description: 热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高
- number: 6
  description: 放入瘦肉，翻炒至变色，倒入蒜苗一起炒，蒜苗炒约 20 秒
- number: 7
  description: 放入土豆，保持翻炒，加入 2g 食用盐、5g 生抽，
- number: 8
  description: 炒约 3 分钟，盛盘
tips: 土豆片焯水注意不宜太久，防止土豆片变软; 腌制瘦肉要搅拌均匀; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
