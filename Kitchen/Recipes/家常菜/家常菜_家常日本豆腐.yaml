id: 10368
name: 家常日本豆腐
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 946
servings: 2
tags:
- 酸甜
- 咸鲜
- 快手菜
- 下饭菜
description: 家常日本豆腐是一道外酥里嫩的家常快手菜，金黄脆壳包裹着柔滑的玉子豆腐，搭配青椒、胡萝卜等时蔬，可调成咸鲜或酸甜风味，脆嫩咸香。日本豆腐以鸡蛋为主要原料，富含优质蛋白，加上木耳和蔬菜，营养均衡。需要一点煎豆腐的技巧，难度适中，新手也能尝试，全程大约 30 分钟即可上桌。
ingredients:
- name: 日本豆腐 300 g（约 3 个）
  amount: 0
  unit: 适量
  isMain: false
- name: 青椒 120 g（中等大小 1 个）
