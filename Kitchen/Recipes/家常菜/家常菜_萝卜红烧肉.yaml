id: 10017
name: 萝卜红烧肉
cuisine: 家常菜
difficulty: 2
duration: 60
calories: 310
servings: 2
tags:
- 咸鲜
- 炖
cover: https://i01piccdn.sogoucdn.com/a468055612b5f10d
ingredients:
- name: 五花肉
  amount: 0
  unit: 600克（带皮）
  isMain: true
- name: 白萝卜
  amount: 1
  unit: 根
  isMain: true
- name: 八角
  amount: 0
  unit: 1-2个（大料）
  isMain: false
- name: 桂皮
  amount: 1
  unit: 小块
  isMain: false
- name: 姜
  amount: 3
  unit: 片
  isMain: false
- name: 香葱
  amount: 2
  unit: 根
  isMain: false
- name: 冰糖
  amount: 5
  unit: 粒
  isMain: false
- name: 料酒
  amount: 0
  unit: 1汤匙（15ml）
  isMain: false
- name: 老抽
  amount: 15
  unit: 毫升
  isMain: false
- name: 生抽
  amount: 0
  unit: 1汤匙（15ml）
  isMain: false
- name: 盐
  amount: 1
  unit: 小匙
  isMain: false
steps:
- number: 1
  description: 准备所需材料。
- number: 2
  description: 盆中装入凉水，加入一大勺料酒，放入五花肉，浸泡15分钟。
- number: 3
  description: 五花肉放入热水锅里焯一下，捞出。
- number: 4
  description: 捞出后晾凉，切成均匀的方块。锅里放一点点油，放入五花肉块小火慢慢煸炒。
- number: 5
  description: 小火煸炒至五花肉表面微微变色出油，将多余的油倒出，盛出五花肉待用。
- number: 6
  description: 锅洗净，放入1汤匙（15ml）的油，放入冰糖煮至冰糖液颜色变深。
- number: 7
  description: 倒入炒过的五花肉块，翻炒均匀。再加入料酒、生抽、老抽。
- number: 8
  description: 翻炒均匀。
- number: 9
  description: 加入没过肉量的开水，大火烧开后撇去浮沫。放入姜、葱、八角、桂皮。
- number: 10
  description: 放入砂锅中用小火炖煮（或者直接用炒锅煮）。
- number: 11
  description: 待肉煮至六七成熟时（约40分钟），加入切块的白萝卜同煮。
- number: 12
  description: 炖至萝卜软熟，转大火收稠汤汁，加少许盐调味，撒葱花即可。
_source: cookbook-kg
