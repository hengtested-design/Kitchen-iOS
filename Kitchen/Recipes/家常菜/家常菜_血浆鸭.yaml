id: 10237
name: 血浆鸭
cuisine: 家常菜
difficulty: 5
duration: 120
calories: 2482
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/血浆鸭/血浆鸭.jpeg
description: 血浆鸭是一道湖南武冈传统名菜，鸭肉香酥脆嫩，浸透醋血后连姜和辣椒都变得甜净不辣。鸭肉与鸭血提供优质蛋白和铁质，适合补血养身。制作步骤较多，需要留意火候和翻炒，但跟着步骤操作，初学者也能在 大约 2 小时完成。
ingredients:
- name: 鲜仔鸭肉 2000g
  amount: 0
  unit: 适量
  isMain: false
- name: 鲜鸭血 250ml
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 6 片 （根据个人吃辣喜好程度可多放 1-3 片姜）
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜仔 6 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 香葱 2 根，切好备用
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒 1000g（根据个人吃辣喜好程度可选青椒，线椒，美人椒等，喜欢吃辣可增加 5-8 个小米辣或朝天椒，切好备用）
  amount: 0
  unit: 适量
  isMain: false
- name: 酒（任选其一）：
  amount: 0
  unit: 适量
  isMain: false
- name: 高度白酒 50ml + 水 150ml
  amount: 0
  unit: 适量
  isMain: false
- name: 啤酒 200ml
  amount: 0
  unit: 适量
  isMain: false
- name: 米酒 200ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 10ml
  amount: 0
  unit: 适量
  isMain: false
