id: 10330
name: 煮锅蒸米饭
cuisine: 家常菜
difficulty: 2
duration: 25
calories: 418
servings: 2
tags:
- 煮
cover: https://s.chuimg.com/米饭/煮锅蒸米饭.jpeg
description: 这是一道朴实无华的家常主食，用普通煮锅就能做出软糯适口的米饭。白米饭主要提供碳水化合物，为身体快速补充能量。做法极为简单，新手只需全程关注火候即可轻松掌握，从下米到出锅大约需要 25 分钟。
ingredients:
- name: 米：100ml-200ml/人
  amount: 0
  unit: 适量
  isMain: false
- name: 水：米的体积的 2 倍
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 清洗大米
- number: 2
  description: 将米和水加入煮锅
- number: 3
  description: 大火煮至水沸腾
- number: 4
  description: '**搅拌底部防止粘黏**'
- number: 5
  description: 盖上锅盖，转**小火**加热 10-15 分钟（根据对软糯程度的喜好），中途切勿打开锅盖
- number: 6
  description: 关火，静置 5 分钟
- number: 7
  description: Enjoy :)
tips: '[腐国人研究煮米饭，好想送他们个电饭煲！](https://www.bilibili.com/video/BV1RW411z7r9); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
