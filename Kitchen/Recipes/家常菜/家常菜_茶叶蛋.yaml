id: 10096
name: 茶叶蛋
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 193
servings: 2
tags:
- 咸鲜
description: 这道传统小吃茶香浓郁，鲜香可口，富含优质蛋白质，是快捷的营养早餐之选。制作步骤清晰，难度适中，新手需要留意火候与香料配比，约 30 分钟即可完成，一次能做够 2-3 人食用，适合周末从容备好。
ingredients:
- name: 鸡蛋 400g（约 8 颗）
  amount: 0
  unit: 适量
  isMain: false
- name: 八角 4g（约 2 颗）
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 0.5-1g（约 2 片）
  amount: 0
  unit: 适量
  isMain: false
- name: 桂皮 3g（1 小块）
  amount: 0
  unit: 适量
  isMain: false
- name: 茴香 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 红茶 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 25g
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 3g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 用冷水将鸡蛋煮熟，大火大约 8 分钟（根据自家厨具决定）
- number: 2
  description: 鸡蛋捞出，过冷水
- number: 3
  description: 将鸡蛋互相碰撞，使每个鸡蛋产生裂缝
- number: 4
  description: 将鸡蛋下锅，放入八角，香叶，桂皮，茴香，冰糖，红茶，生抽，老抽，食盐
- number: 5
  description: 加水直至没过鸡蛋
- number: 6
  description: 大火煮开之后，转中小火煮 15 分钟
tips: 鸡蛋捞出过冷水是为了让鸡蛋和壳之间产生间隙; 食盐可根据个人口味选择不加; 八角，香叶，桂皮，茴香，冰糖，自己没有这么多食材可以买现成的卤料包; 常规做法的卤汁渗透速度慢，内部味道容易偏淡。想入味更快、切面更好看：**剥壳** → 在蛋白侧面**划 3–11 刀**（上下十字方向，接近蛋黄即可，别太深以免蛋黄散出）→ 放入小容器，卤汁**没过鸡蛋** → 浸泡 **2 天以上**; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
