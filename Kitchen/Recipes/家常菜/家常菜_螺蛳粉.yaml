id: 10341
name: 螺蛳粉
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 1109
servings: 2
tags:
- 咸鲜
- 快手菜
description: 螺蛳粉是广西柳州的特色小吃，汤鲜味浓，酸辣爽口，米粉软滑筋道。口味上融合了螺蛳汤的鲜美、酸笋的独特发酵风味和辣椒油的刺激，层次分明。作为主食，米粉提供充足碳水化合物，螺蛳肉包和配料带来一定蛋白质，酸笋则有助于开胃促消化。这道菜所需操作简单，只需按顺序煮熟米粉和调味即可，对新手非常友好。从烧水到出锅，最快约十分钟就能端上餐桌，适合快手解决一餐。
ingredients:
- name: 根据个人经验，一包袋装螺蛳粉足够一人一餐食（虽然看着很大包）
  amount: 0
  unit: 适量
  isMain: false
- name: 水 1L
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 锅中加水，将水烧开
- number: 2
  description: 下米粉，煮 3-5 分钟，期间用筷子搅拌，防止米粉粘在一起
- number: 3
  description: 下汤料包，按个人口味添加
- number: 4
  description: 下一部分配料包，如木耳，花生，螺蛳（这部分配料需要煮一会才入味）
- number: 5
  description: 下调味包，按个人口味添加
- number: 6
  description: 搅拌后捞出，放入碗中
- number: 7
  description: 下剩下的配料包，如酸笋，豆皮（这部分配料不适合被汤泡太久）
- number: 8
  description: 享用美食
tools:
- 煮锅
- 电磁炉/灶台
- 筷子一双
tips: 如果想要更有嚼劲的粉，可以缩短第二步煮粉的时间; 如果想在螺蛳粉中添加炸蛋，请参考炸蛋的教程; 配料的选择请依照个人口味; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
