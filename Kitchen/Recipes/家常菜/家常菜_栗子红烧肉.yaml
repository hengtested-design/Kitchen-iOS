id: 10002
name: 栗子红烧肉
cuisine: 家常菜
difficulty: 2
duration: 20
calories: 310
servings: 2
tags:
- 咸甜
- 炖
cover: https://i03piccdn.sogoucdn.com/fdd5a2165f7e966c
ingredients:
- name: 五花肉
  amount: 1
  unit: 块
  isMain: true
- name: 板栗
  amount: 250
  unit: 克
  isMain: true
- name: 姜片
  amount: 0
  unit: 适量
  isMain: false
- name: 桂皮
  amount: 0
