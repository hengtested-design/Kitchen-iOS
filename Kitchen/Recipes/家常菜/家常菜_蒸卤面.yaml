id: 10338
name: 蒸卤面
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 1563
servings: 2
tags:
- 蒸
description: 这是一道豫南地区经典的家常面食，荤素搭配，面条吸足汤汁，口感软韧，咸香入味。五花肉提供优质蛋白质和脂肪，芹菜富含膳食纤维。做法简单易学，新手也能从容上手，整体制作约需一小时。
ingredients:
- name: 芹菜 两根中等大小的芹菜
  amount: 0
  unit: 适量
  isMain: false
- name: 五花肉 350g
  amount: 0
  unit: 适量
  isMain: false
- name: 面条 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 大葱 10cm
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 5 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 姜片 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 青椒 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 干红椒 3 个
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒 20 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 五香粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 10ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 猪肉去皮，切成 `2 cm * 6 cm * 0.5 cm` 薄片备用
- number: 2
  description: 芹菜去叶，去掉根部 2cm，然后从中对半切开，切成 2cm 段备用
- number: 3
  description: 大蒜去皮切粒备用，葱切 0.2cm 薄片备用，姜切细丝备用
- number: 1
  description: 炒锅烧热至冒烟后，倒入 3ml 食用油滑锅后倒出底油
- number: 2
  description: 重新加入食用油，加入肉片，葱姜蒜，干红椒，炒 1 分钟，注意不停匀速翻炒
- number: 3
  description: 加入料酒，生抽，老抽，再翻炒 1 分钟
- number: 4
  description: 续入 500ml 热水。盖上锅盖炖煮 3 分钟
- number: 5
  description: 将芹菜，青椒倒入锅中，加入盐，五香粉调味，盖上锅盖继续炖煮 3 分钟 后关火
- number: 6
  description: 蒸锅加入 1000ml 水，烧开上汽后，将面条摊平在笼屉上放入锅中，蒸 15 分钟
- number: 7
  description: 面条蒸熟后取出，用筷子和无情铁手扒拉散开在案板上，室温冷却
- number: 1
  description: 将面条放入菜锅中搅拌，搅拌方式为一手持筷，一手持锅铲将菜翻至面条上面，以面条以全部均匀上色为搅拌完成标准
- number: 2
  description: 将搅拌后的面条再次放在整屉上，再次蒸 10 分钟 关火
tips: 技术总结; 切割猪肉时，可以让菜市场摊贩帮忙，根据经验，请求时机把握在已切割后未付款之前成功率最高; 首次做饭时可以提前备好料防止手忙脚乱，后续熟练后可以并发执行; 两次蒸面条时，都要尽量的弄散开，可以避免蒸好后团在一起。面条太长时可以拽断，方便后续搅拌与盛取; 取出蒸好的面条时尽量动作轻一些，避免蒸屉翻到面条触水; 佐餐时啤酒更配呦！; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
