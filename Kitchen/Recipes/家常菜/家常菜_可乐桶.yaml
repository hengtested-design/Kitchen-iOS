id: 10136
name: 可乐桶
cuisine: 家常菜
difficulty: 2
duration: 5
calories: 450
servings: 2
tags:
- 快手菜
description: 可乐桶是一款简单易调的休闲鸡尾酒，口感清爽甜润，可乐的气泡和柠檬汁很好地中和了威士忌的烈感，适合聚会场合。主要提供能量，柠檬补充维生素 C。整个调配过程只需 5 分钟即可完成，新手也能轻松上手。
ingredients:
- name: 威士忌 100 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 可口可乐 500 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 柠檬 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 冰块 300 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将柠檬对半切（**刀方向垂直于柠檬的头尾连线**），并从其中的一半中切取一片柠檬备用
- number: 2
  description: 再次将柠檬对半切，将得到的 4 角柠檬用压汁器压出柠檬汁置于容器中备用
- number: 3
  description: 将挤压过的柠檬置于容器中备用
- number: 1
  description: 选择一个杯子，建议使用容量在大约 1 升的大型玻璃杯或铁皮酒桶
- number: 2
  description: 将冰块和挤压过的柠檬入杯中（可根据个人喜好设计柠檬与冰块的摆放）
- number: 3
  description: 倒入 15 毫升柠檬汁（如果喜酸可以加多点或全加）
- number: 4
  description: 沿杯壁缓慢倒入可口可乐至距离杯口 3/4 处（控制可乐和威士忌的比例约在 5:1 ）
- number: 5
  description: 倒入威士忌直至满杯
tips: 可乐桶因冰块和可乐的口感掩盖了威士忌的酒味，因此不善酒力的人也容易在不知不觉中过量饮酒，请在保证个人与饮酒者的安全下调配。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
