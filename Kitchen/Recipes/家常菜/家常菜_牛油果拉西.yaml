id: 10143
name: 牛油果拉西
cuisine: 家常菜
difficulty: 1
duration: 5
calories: 392
servings: 2
description: 这是一款融合了印度传统酸奶饮品“拉西”的创新饮品，口感绵密顺滑、清甜不腻，特别适合作为早餐或午后提神饮品。牛油果富含单不饱和脂肪酸与膳食纤维，搭配酸奶的优质蛋白和益生菌，一杯便能提供持久饱腹感。制作极为简单，新手也能零失败，从备料到享用只需 大约 5 分钟。
ingredients:
- name: 原味酸奶 120 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 熟透的牛油果 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 蜂蜜 1 汤匙（可根据口味增减）
  amount: 0
  unit: 适量
  isMain: false
- name: 冷牛奶 60 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 小豆蔻粉 1 撮（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将牛油果对半切开，去核，剥去外皮，将果肉切成小块备用。
- number: 2
  description: 在搅拌机中加入 120ml 原味酸奶、切好的牛油果块、1 汤匙蜂蜜以及 60ml 冷牛奶。
- number: 3
  description: （可选）加入一小撮小豆蔻粉以增加独特风味。
- number: 4
  description: 启动搅拌机，**搅拌大约 1 分钟**直至液体变得完全顺滑和浓郁。
- number: 5
  description: 将打好的饮品倒入杯中。
- number: 6
  description: （可选）在表面放上几片薄荷叶或撒上 5g 切碎的坚果作为装饰。
tips: 牛油果必须选择熟透的，这样才能保证饮品的绵密口感和颜色。; 如果喜欢更冰凉的口感，可以适当减少一点牛奶，加入几块冰块一起搅拌。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
