id: 10069
name: 蒜蓉虾
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 456
servings: 2
tags:
- 咸鲜
- 蒸
cover: https://s.chuimg.com/蒜蓉虾/蒜蓉虾.jpeg
description: 这道广东传统名菜以鲜香嫩滑著称，虾肉清甜弹牙，蒜香浓郁扑鼻。海虾富含优质蛋白和钙、硒等微量元素，搭配蒜蓉有助杀菌开胃。做法十分简单，处理虾、铺酱、蒸制、淋油几步即成，新手也能轻松驾驭，全程约需 15 分钟。
steps:
- number: 1
  description: 用刀从虾头中间切开，切到距离虾尾 1 cm
- number: 2
  description: 将蒜蓉酱铺在虾身中间，放在盘子中
- number: 3
  description: 锅中倒入热水，将盘子放入锅中，大火蒸 3 分钟
- number: 4
  description: 烧热油，倒入虾盘中，倒入生抽
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
