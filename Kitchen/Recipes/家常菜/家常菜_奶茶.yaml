id: 10138
name: 奶茶
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 81
servings: 2
description: 这是一道用红茶和奶粉轻松调制的家常饮品，茶香与奶香交融，口感顺滑温暖。红茶中的茶多酚搭配牛奶的蛋白质和钙质，既能提神又补充日常营养。做法非常简单，新手也能一次成功，仅需大约半 小时就能喝上自制奶茶。
ingredients:
- name: 袋泡红茶 2 包（约 4g）
  amount: 0
  unit: 适量
  isMain: false
- name: 奶粉 11-12g
  amount: 0
  unit: 适量
  isMain: false
- name: 砂糖 5-7g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 取袋泡红茶 2 包放入杯中，加入 180-200mL **沸水**。
- number: 2
  description: '**等待 20 - 30 分钟**。'
- number: 3
  description: 称取 11-12g 奶粉和 5-7g 砂糖，分别加入前一步骤得到的液体中。
- number: 4
  description: 搅拌均匀即可饮用。
tips: 加入沸水后，尽量保持杯子内部温暖，例如使用开口较小的杯子或盖上盖子。如果气温较低时，使用量杯量取可能导致沸水在冲入红茶前冷却，则可以不使用量杯量取而直接估计其体积。; 等待时间结束后可提起或搅动茶包以使冲泡更加均匀。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
