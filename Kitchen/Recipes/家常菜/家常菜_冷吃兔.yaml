id: 10157
name: 冷吃兔
cuisine: 家常菜
difficulty: 4
duration: 300
calories: 590
servings: 2
tags:
- 麻辣
- 咸鲜
description: 这是一道经典的四川自贡盐帮菜，麻辣干香，兔肉紧实有嚼劲，入口先辣后鲜，回味悠长。兔肉高蛋白低脂肪，富含卵磷脂和多种氨基酸，营养丰富且易于消化。制作过程需处理多种香料并严格控制火候，对新手有一定挑战。从备料到炒制完成约需 1.5 小时，但放置一夜后风味更佳，值得提前准备。
