id: 10409
name: 金针菇日本豆腐煲
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 606
servings: 2
tags:
- 下饭菜
description: 金针菇日本豆腐煲是一道酱香浓郁的家常下饭菜，豆腐外焦里嫩，金针菇爽滑入味。金针菇富含氨基酸和膳食纤维，日本豆腐提供优质蛋白，营养开胃。这道菜步骤简单，新手也能轻松掌握，从备菜到出锅大约需要 30 分钟。
ingredients:
- name: 金针菇 1-2 把
  amount: 0
  unit: 适量
  isMain: false
- name: 豆腐 2 袋
  amount: 0
  unit: 适量
  isMain: false
- name: 小米椒 3-5 根，切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 2-3 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 3ml
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-15ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 豆腐切片，小火煎到两面金黄出锅备用。
- number: 2
  description: 切蒜成蒜末；将生抽，蚝油，老抽，糖，100ml 水调汁备用。
- number: 3
  description: 热锅放油，油热放小米椒、蒜末爆香，先放金针菇，炒软，把煎好的豆腐平铺在金针菇上，倒入#2 配好的料汁，焖 5 分钟，大火收汁。
tips: 金针菇一定要先炒软; 豆腐尽量不要翻炒，容易碎; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
