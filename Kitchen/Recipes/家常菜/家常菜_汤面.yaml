id: 10312
name: 汤面
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 565
servings: 2
tags:
- 咸鲜
description: 汤面是一道自由搭配的家常主食，汤汁清爽，面条软滑，兼容各种荤素食材，味道可鲜可淡。它富含碳水化合物和优质蛋白质，搭配蔬菜还能补充维生素与膳食纤维，营养均衡又饱腹。做法非常简单，无需厨艺基础，新手也能轻松驾驭。从准备食材到出锅，一般约需 30 分钟。
ingredients:
- name: 面类材料：单人一个方便面大小的量，可以在 70-230g 之间选择。
  amount: 0
  unit: 适量
  isMain: false
- name: 冷水： 加入能浸没面的量，一般在 200 - 400 ml 之间选择
  amount: 0
  unit: 适量
  isMain: false
- name: 菜类：体积大约和面类相当
  amount: 0
  unit: 适量
  isMain: false
- name: 其中青菜体积可忽略
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 先将菜类材料切成边长不超过 4cm 的块状，便于煮熟
- number: 2
  description: 如有生肉，则先放入冷水中，盖上锅盖，煮沸腾，先捞出上层血沫，再关火，捞出半熟的肉备用
- number: 3
  description: 先大火将水加热至沸腾，后调至中火
- number: 4
  description: 将较难煮熟的食材放入锅中（比如半熟肉类、香菇类、等最先放入锅中）。为保证煮熟，可在沸腾后计时 10 分钟，特别难熟的大块食材可追加 5 分钟。
- number: 5
  description: 将面食放入锅中，适当搅拌确保面和汤充分接触，使液面保持轻微沸腾，煮 5 分钟。加入面后液面易产生白色泡沫，可适当抬起锅盖通气或者撤下锅盖。
- number: 6
  description: 将易于煮熟的食材如青菜类放入锅中，适当搅拌以充分浸没，煮 2-5 分钟
- number: 7
  description: 关火，随后加入盐、胡椒粉、香油等自己喜欢的调味料，适当搅拌即可出锅食用
tips: 操作流程可根据自己喜好更改，多多尝试会有惊喜; 如掌握不好加盐量，可采用少量多次添加的方法，以免过量; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
