id: 10378
name: 洋葱炒鸡蛋
cuisine: 家常菜
difficulty: 2
duration: 5
calories: 562
servings: 2
tags:
- 快手菜
- 下饭菜
- 炒
cover: https://s.chuimg.com/洋葱炒鸡蛋/洋葱炒鸡蛋.jpeg
description: 洋葱炒鸡蛋是一道咸香适口、葱香浓郁的家常菜肴，鸡蛋嫩滑，洋葱清甜，属于国民下饭菜。鸡蛋富含优质蛋白质和多种维生素，洋葱含有膳食纤维和抗氧化物质，是一道营养均衡的快手菜。这道菜操作极其简单，对新手非常友好，从备料到出锅只需约 5 分钟。
steps:
- number: 1
  description: 鸡蛋打入大碗中，加入洋葱片、盐后搅拌 60 S
- number: 2
  description: 起锅烧油，倒入鸡蛋，一面煎炸 30-45 S ，翻面继续翻炒，反复 2-3 分钟 后散上料酒出锅
- number: 3
  description: 鸡蛋装盘，散上葱花
