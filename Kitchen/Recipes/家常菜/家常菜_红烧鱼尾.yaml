id: 10095
name: 红烧鱼尾
cuisine: 家常菜
difficulty: 2
duration: 45
calories: 180
servings: 2
tags:
- 咸鲜
- 烧
cover: https://i01piccdn.sogoucdn.com/f3545af014f32345
ingredients:
- name: 草鱼尾
  amount: 1
  unit: 条
  isMain: true
- name: 植物油
  amount: 50
  unit: 克
  isMain: false
- name: 鲜姜
  amount: 1
  unit: 块
  isMain: false
- name: 大蒜
  amount: 0
  unit: 数瓣
  isMain: false
- name: 八角
  amount: 1
  unit: 颗
  isMain: false
- name: 料酒
  amount: 30
  unit: 克
  isMain: false
- name: 生抽
  amount: 30
  unit: 克
  isMain: false
- name: 红烧酱油
  amount: 0
  unit: 适量
  isMain: false
- name: 盐
  amount: 0
  unit: 少许
  isMain: false
steps:
- number: 1
  description: 草鱼一条，收拾干净后，分成头，身，尾三段，本道菜只取尾部，尾部两面切花刀便于入味
- number: 2
  description: 鲜姜切片，大蒜切厚片，八角一颗准备好
- number: 3
  description: 不粘平底锅中倒入植物油，手放到油锅上方10公分左右处，有明显热气时，将鱼尾放入锅中，煎至两面鱼皮略焦黄
- number: 4
  description: 转小火，一边煎鱼一边将姜片、蒜片、八角入锅中有油的地方，煸炒出香味；将适量的料酒在鱼尾上，再倒入生抽、红烧酱油
- number: 5
  description: 待出香味后，根据口味撒适量盐，加入热水，水量可以比鱼身略低一些，待汤煮开后，转小火，可以用勺子将汤汁浇在鱼尾上，便于表面的鱼肉入味
- number: 6
  description: 盖上锅盖，小火15-20分钟左右，打开盖子后，用勺子将剩余的汤汁继续浇在表面，待汤汁收到自己满意的程度，可关火，出锅
- number: 7
  description: 鱼尾肉很鲜美，但要小心刺噢
_source: cookbook-kg
