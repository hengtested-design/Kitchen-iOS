id: 10352
name: 鹰嘴豆炸饼
cuisine: 家常菜
difficulty: 4
duration: 50
calories: 1098
servings: 2
tags:
- 炸
description: 鹰嘴豆咖喱配油炸面饼是北印度经典街头小吃，松软的炸饼搭配香料浓郁的鹰嘴豆，口感层次丰富，酸辣咸香。鹰嘴豆富含植物蛋白和膳食纤维，饱腹又营养。制作步骤稍多，但跟着流程走并不难，适合有一定基础的家常烹饪。约 50 分钟即可完成（鹰嘴豆需提前浸泡 8 小时）。
ingredients:
- name: 干鹰嘴豆 200g（提前浸泡 8 小时）
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 2 个（约 200g），切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄 3 个（约 300g），切碎
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 10g，磨碎
  amount: 0
  unit: 适量
  isMain: false
