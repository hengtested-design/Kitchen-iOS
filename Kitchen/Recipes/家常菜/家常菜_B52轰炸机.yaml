id: 10131
name: B52轰炸机
cuisine: 家常菜
difficulty: 3
duration: 5
calories: 80
servings: 2
tags:
- 炸
description: 这款鸡尾酒口感层次分明，入口先是伏特加的烈，紧接着是咖啡奶油的回甘，点燃后饮用有独特的冰火体验，属于经典创意鸡尾酒。咖啡酒与百利甜酒提供了少量咖啡因和奶脂，但整体营养以酒精为主。制作需要练习分层倒酒和点火技巧，对新手稍有难度，整个过程大约只需 5 分钟。
ingredients:
- name: 甘露咖啡酒 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 爱尔兰百利甜酒 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蓝天原味伏特加 10ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 在利口酒杯的最底层倒入甘露咖啡酒到 1/3 处。(10ml)
- number: 2
  description: 顺着吧勺缓缓倒入爱尔兰百利甜酒，也是 1/3 处 (10ml)。注意要慢，保证层次分明。（太快甜酒会和咖啡混合）
- number: 3
  description: 最后在上层倒入蓝天原味伏特加 （10ml)
- number: 4
  description: 用打火机热一下杯口
- number: 5
  description: 最后一步点火： 看到淡蓝色的小火苗了吗？
tips: 喝的时候，现在酒吧常用的方法是提供一个吸管，在火还燃烧的时候插入，然后快速全部吸入。; 由于吸管太细，其中氧气不足，所以火苗会灭掉，不必担心。这时候，会感到一股热辣顺着喉咙一直烈到胃，之后就是久久的咖啡奶油回甘。非常刺激又好喝。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
