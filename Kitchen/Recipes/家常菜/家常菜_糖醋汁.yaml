id: 10107
name: 糖醋汁
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 146
servings: 2
tags:
- 酸甜
- 快手菜
- 糖醋
description: 这款调味汁酸甜可口，是中餐里糖醋菜肴的经典风味来源。调制简单、比例易记，新手也能轻松上手，从备料到完成约需 10 分钟。糖分能提供能量，醋香有助于开胃解腻，让家常菜瞬间变得有滋有味。
ingredients:
- name: 清水(50ml)
  amount: 0
  unit: 适量
  isMain: false
