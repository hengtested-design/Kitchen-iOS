  amount: 0
  unit: 适量
  isMain: false
- name: 白糖(30g)
  amount: 0
  unit: 适量
  isMain: false
- name: 白醋(20ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒(10ml)
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 按照比例将各调料在小碗中搅拌均匀
- number: 2
  description: 按不同菜肴的方式处理完毕后，将配制好的糖醋汁倒入锅中
- number: 3
  description: 根据各菜肴的不同，烹制 5-10 分钟
- number: 4
  description: 大火收汁，可增加菜的浓度、香味和光泽
