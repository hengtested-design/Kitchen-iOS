id: 10293
name: 银耳莲子粥
cuisine: 家常菜
difficulty: 4
duration: 300
calories: 282
servings: 2
cover: https://s.chuimg.com/银耳莲子粥/银耳莲子粥.jpeg
description: 银耳莲子粥清甜润滑，银耳软糯、莲子绵密，是常见的滋补粥品。富含天然胶质、膳食纤维及多种微量元素，有助养心安神。制作需经历浸泡和慢熬，对新手的耐心是个考验，全程大约需要 3.5 小时。
ingredients:
- name: 银耳 60g
  amount: 0
  unit: 适量
  isMain: false
- name: 去心莲子 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 红枣 6g
  amount: 0
  unit: 适量
  isMain: false
- name: 枸杞 5-6g
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 10-20g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 把银耳、莲子用清水浸泡 2 个小时，红枣浸泡 10 - 20 分钟，枸杞洗净，备用
- number: 2
  description: 在锅中倒入 600ml 水，烧开后依次放入银耳、莲子、红枣
- number: 3
  description: 等待水再次烧开后，盖上锅盖，转至中火继续熬
- number: 4
  description: 熬到大约 1 小时后，放入 5g - 10g 冰糖和 5g - 6g 枸杞，转至小火熬
- number: 5
  description: 小火继续熬 30 分钟，此时银耳开始呈现粘稠状态
- number: 6
  description: 再次放入 5g - 10g 冰糖，用勺子搅拌 5 - 10 分钟
- number: 7
  description: 关火，用勺子盛出
tips: 当银耳呈现粘稠状态时，需要用勺子及时搅拌，防止银耳糊在锅底; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
