id: 10280
name: 朱雀汤
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 168
servings: 2
tags:
- 快手菜
cover: https://s.chuimg.com/朱雀汤/朱雀汤.jpeg
description: 朱雀汤是一道豫东地区的家常快手汤品，口感顺滑香甜，带着芝麻油的醇香。鸡蛋提供优质蛋白质，制作非常简单，只需烧水冲蛋几步就能完成，前后不到十分钟即可上桌，还有清热去火的效果。
ingredients:
- name: 一个鸡蛋
  amount: 0
  unit: 适量
  isMain: false
- name: 500ml 水
  amount: 0
  unit: 适量
  isMain: false
- name: 20 克白糖（根据个人口味调整）
  amount: 0
  unit: 适量
  isMain: false
- name: 2ml 香油
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡蛋在碗中打散，再倒入香油。
- number: 2
  description: 水烧开后，在沸腾状态下快速倒入盛有鸡蛋的碗中。
- number: 3
  description: 放入白糖。
tips: 鸡蛋一定要打散，水一定要在沸腾冒泡状态倒入鸡蛋液中，否则汤可能会浑浊影响口感; 此为豫东地区做法，其他地区有不放白糖放盐的，口味不同，根据个人口味调整; 此汤乃去火神器！; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
