id: 10250
name: 香干肉丝
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 472
servings: 2
tags:
- 下饭菜
- 炒
description: 香干肉丝是一道咸香下饭的家常小炒，肉丝嫩滑，香干柔韧，青椒爽脆。富含动物性与植物性双重蛋白质，搭配青椒补充维生素。难度适中，新手稍加练习即可掌握，预计制作时长约 30 分钟。
steps:
- number: 1
  description: '`肉丝`（没有肉丝，自己切）用生抽(3ml)，生粉混合均匀待用。'
- number: 2
  description: 将`青椒`洗净，再用`滚刀手法`切好备用。
- number: 3
  description: '`大蒜`横切成片，`香干`切丝。'
- number: 4
  description: '`淀粉`与水(10ml)混合，搅拌均匀。'
- number: 1
  description: 干净锅 15ml 油，不用等油热就倒入肉丝慢慢划散，肉丝熟了，立马捞出，留油到锅里。
- number: 2
  description: 将蒜片和香干放入锅中，加入 2ml 生抽，翻炒均匀。
- number: 3
  description: 2-3 分钟，看火大小，将青椒丝放入锅中混合，翻炒。
- number: 4
  description: 1 分钟后，放入肉丝混合。
- number: 5
  description: 倒入淀粉与水的混合物勾芡，加入盐 3g，鸡精 2g，翻炒 2-3 分钟出锅。
- number: 6
  description: 成品。
tips: '**辣椒选择青椒，螺丝椒为最优解，喜欢辣的可以加入小米椒切细碎，同青椒一起加入！**; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
