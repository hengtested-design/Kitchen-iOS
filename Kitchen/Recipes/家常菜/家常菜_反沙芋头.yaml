id: 10112
name: 反沙芋头
cuisine: 家常菜
difficulty: 3
duration: 20
calories: 397
servings: 2
cover: https://s.chuimg.com/反沙芋头/反沙芋头.jpeg
description: 反沙芋头是一道外酥里糯、甜香可口的潮汕传统小吃，常作下午茶点。荔浦芋头富含膳食纤维、钾和多种维生素，能提供持久饱腹感。制作不难但需要掌握熬糖火候，适合稍有基础的初学者尝试，全程大约 20 分钟即可完成。
ingredients:
- name: 荔浦芋头 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 水 15g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 芋头切长条（稍微大条一点，翻炒过程不容易烂）
- number: 2
  description: 加入可以没过芋头的油，等油温起来（插入筷子冒小泡即可）
- number: 3
  description: 放进芋头到油里，去炸到芋头浮起来，一般是微微泛黄并且可以用筷子很轻松戳洞
- number: 4
  description: 炸芋头的油放起来别浪费，后面炒菜啥的都能用
- number: 5
  description: 接下来关键的一步，把糖(30g)和水(15g)按照 2：1 比例，加热至不变色且冒小泡
- number: 6
  description: 倒入葱花和芋头，关火翻炒，此时等温度下来，糖就会有反沙的效果
- number: 7
  description: 装盘上桌！
tips: 刚做好的反沙芋头很烫，小心烫嘴哦; 再配上茶，啊~真惬意啊; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
