id: 10349
name: 韭菜盒子
cuisine: 家常菜
difficulty: 3
duration: 300
calories: 794
servings: 2
tags:
- 咸鲜
description: 韭菜盒子是一道传统中式面点，外皮金黄酥脆，内馅鲜香多汁。韭菜搭配虾仁和鸡蛋，富含维生素与优质蛋白质。做法简单，对新手也很友好，从和面到出锅大约需要 2.5 小时。
ingredients:
- name: 韭菜 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 虾仁 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 3 枚
  amount: 0
  unit: 适量
  isMain: false
- name: 香油 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 面粉 250g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将面粉放入大碗中，加入水，搅拌成光滑的面团，静置 30 分钟。
- number: 2
  description: 韭菜洗净切碎，加入打散的鸡蛋、5g 盐，搅拌均匀。
- number: 3
  description: 将面团分成小剂子，擀成薄圆饼，包入韭菜、虾仁、鸡蛋液。
- number: 4
  description: 热锅，加入食用油，放入包好的韭菜盒子，煎至两面金黄，约 3-4 分钟。
- number: 5
  description: 盛盘，稍凉后即可享用。
tips: 制作时可根据个人口味添加豆腐干等配料。; 注意煎制时火候，避免外焦内生。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
