id: 10184
name: 带把肘子
cuisine: 家常菜
difficulty: 5
duration: 300
calories: 1037
servings: 2
tags:
- 蒸
description: 带把肘子是陕西大荔的传统名菜，因脚爪形似把柄而得名。成菜肘皮胶粘软糯，肉质酥烂不腻，蘸甜面酱佐葱段食用，咸香醇厚。富含胶原蛋白和优质蛋白质，滋补养颜。制作需去骨、定形、长时间蒸制，对新手有一定挑战，预计整个制作过程约需 3.5 小时。
ingredients:
- name: '带脚、爪猪前肘: 一个（大约二斤五两 = 1250 克）'
  amount: 0
  unit: 适量
  isMain: false
- name: 红豆腐乳 = 10 克
  amount: 1
  unit: 块
  isMain: false
- name: 甜面酱
  amount: 150
  unit: 克
  isMain: true
- name: 精盐
  amount: 15
  unit: 克
  isMain: true
- name: 红酱油
  amount: 35
  unit: 克
  isMain: true
- name: 白酱油
  amount: 25
  unit: 克
  isMain: true
- name: 料酒
  amount: 25
  unit: 克
  isMain: true
- name: 蒜片
