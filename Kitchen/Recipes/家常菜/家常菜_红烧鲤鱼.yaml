id: 10064
name: 红烧鲤鱼
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 1051
servings: 2
tags:
- 咸鲜
- 下饭菜
- 炖
description: 红烧鲤鱼是一道家常鲁菜，鱼肉先炸后炖，外皮微韧，肉质鲜嫩，咸甜酱香中透着五花肉的醇厚，汤汁浓稠下饭。富含优质蛋白和钙、磷等矿物质，有助滋补。处理炸鱼和调味配比稍需耐心，但步骤清晰，新手跟着做也能完成。从备料到出锅预计 大约 1 小时。
ingredients:
- name: 鲤鱼 （大约 2 斤）
  amount: 0
  unit: 适量
  isMain: false
- name: 五花肉 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 大葱 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 80g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜瓣 3-4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒两个
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 50g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 葱、姜、蒜、干辣椒分别清洗干净。
- number: 2
  description: 葱白处切段，每段长度约 4cm，再将每段劈为四瓣。
- number: 3
  description: 姜切片，每片厚度约 3mm。
- number: 4
  description: 一个大蒜拍碎切末，其余蒜切为二瓣。
- number: 5
  description: 干辣椒切四段。
- number: 6
  description: 五花肉切片，约 4cm*4cm。
- number: 7
  description: 清洗鱼。
- number: 8
  description: 鱼背肉厚处拉几道斜口，方便入味
- number: 9
  description: 锅里多倒点油，烧至 7 成热（刚刚开始冒烟），下入鱼炸 1 分钟至鱼皮稍稍变硬捞出备用（注意不要一下锅就拨弄鱼，等炸一会再拨弄、翻面），炸鱼的油倒出，锅里留一点底油
- number: 10
  description: 将锅里底油烧热，下入五花肉，煸出香味。
- number: 11
  description: 放入干辣椒、葱、姜、蒜瓣，翻炒 1 分钟。
- number: 12
  description: 将炸好的鱼倒入锅中。
- number: 13
  description: 沿锅边倒入
- number: 14
  description: 调至中火，将水烧开。
- number: 15
  description: 调至小火，慢焖入味。
- number: 16
  description: 15 分钟 后，打开锅盖，挑出锅里的葱、姜、蒜、干辣椒。
- number: 17
  description: 调至大火收汁，汤汁剩余 1/4 时，撒点蒜末，关火盛出。
- number: 18
  description: 红烧鲤鱼出锅！
tips: 基于下列原因，需要在红烧鲤鱼中添加五花肉：; 五花肉煸炒的时候会出猪油，相比较于植物油，动物油脂更香。; 煸炒至金黄的五花肉炖煮过后吃起来也很香的，相当于配菜。; 鱼类本身脂肪含量少，所以香味欠缺，着重的是肉质的口感。所以一般做鱼类菜都建议用猪油，想要一锅奶白香醇的鱼汤。猪油是最好的选择~; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
