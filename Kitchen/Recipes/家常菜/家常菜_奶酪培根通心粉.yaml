id: 10170
name: 奶酪培根通心粉
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 728
servings: 2
cover: https://s.chuimg.com/奶酪培根通心粉/奶酪培根通心粉.jpeg
description: 奶酪培根通心粉是经典美式家常菜，口感浓郁绵密，奶酪包裹弹牙通心粉，搭配香脆培根，咸香满足。富含蛋白质与钙质，但热量和脂肪较高，建议偶尔享用。制作需要一定耐心，掌握基础白酱和火候对新手略有挑战，整体难度中等。不烘烤时约 30 分钟即可上桌，若选择烘烤需额外预热和烤制，总时长约 1 小时。
ingredients:
- name: 通心粉 100-125g
  amount: 0
  unit: 适量
  isMain: false
- name: 奶酪 40-55g，若要烘烤额外准备 25g， 条状
  amount: 0
  unit: 适量
  isMain: false
- name: 培根或其他肉类 100-125g
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 25g-40g 切成碎
  amount: 0
  unit: 适量
  isMain: false
- name: 黄油 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 面粉 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 牛奶 125ml
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜半瓣，切碎
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 奶酪要磨成碎末
- number: 2
  description: 洋葱切成条状
- number: 3
  description: 通心粉用微咸的水煮 6 分钟
- number: 4
  description: '**中火**'
- number: 5
  description: 锅中放入黄油，等待融化
- number: 6
  description: 加入洋葱
- number: 7
  description: 洋葱软化后加入大蒜
- number: 8
  description: 大蒜香味出来后，加入肉类，等待 5 秒
- number: 9
  description: '**小火**'
- number: 10
  description: 分四次加入牛奶，每次搅拌 5 秒后再加下一次
- number: 11
  description: 加入面粉并充分搅拌
- number: 12
  description: 加入奶酪并搅拌均匀
- number: 13
  description: 将通心粉和奶酪搅拌
- number: 14
  description: 如果不打算烘烤，可以直接吃了
- number: 15
  description: '**烘烤：**'
- number: 16
  description: 预热烤箱至 180°C
- number: 17
  description: 将额外的 50g 芝士铺在通心粉之上
- number: 18
  description: 等待烤箱预热至 180°C 后，将通心粉放入
- number: 19
  description: 烤至表面金黄,约 24 分钟
tips: 本料理及其不健康，有大约 1300 大卡，80g 脂肪，不建议常吃。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
