id: 10052
name: 橙香可乐鸡翅
cuisine: 家常菜
difficulty: 1
duration: 20
calories: 230
servings: 2
tags:
- 酸甜
- 烧
cover: https://i03piccdn.sogoucdn.com/3644cfa8926b8444
ingredients:
- name: 鸡翅
  amount: 500
  unit: 克
  isMain: true
- name: 橙子
  amount: 1
  unit: 个
  isMain: true
- name: 葱
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽
  amount: 0
  unit: 适量
  isMain: false
- name: 可乐
  amount: 0
  unit: 适量
  isMain: false
- name: 盐
  amount: 0
  unit: 适量
  isMain: false
- name: 姜
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 准备好可乐 鸡翅和橙子。
- number: 2
  description: 橙子洗净带皮切成块，备用。
- number: 3
  description: 鸡翅洗净，焯水后沥干水分。
- number: 4
  description: 锅中注入少量的油，下入沥干水分的鸡翅煎制。
- number: 5
  description: 煎制一面金黄后反面，加入葱姜后煎制两面金黄。
- number: 6
  description: 加入糖 和生抽。
- number: 7
  description: 倒入可乐，没过鸡翅。
- number: 8
  description: 倒入橙子块。
- number: 9
  description: 大火烧开转小火，焖至20分钟。
- number: 10
  description: 加入适量的盐，大火收干汤汁即可。
