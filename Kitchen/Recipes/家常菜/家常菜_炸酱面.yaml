id: 10321
name: 炸酱面
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 1272
servings: 2
tags:
- 炒
description: 炸酱面是一道酱香浓郁、面条劲道的传统北京家常面食，搭配清爽菜码，咸甜适口。主要营养来自瘦肉蛋白质和蔬菜维生素，能为人体提供充足能量。做法对新手友好，预计制作时长约 30 分钟，熟练掌握后可通过备菜与炒酱并行进一步缩短时间。
steps:
- number: 1
  description: 菜码切丝备用。
- number: 2
  description: 葱切碎。油锅烧热，下葱和肉，炒至肉完全熟透（无红色）
- number: 3
  description: 下豆瓣酱和甜面酱，继续炒至**微微粘稠**。盛出，得到*炸酱*。
- number: 4
  description: 取大碗，加凉水备用。
- number: 5
  description: 煮面条至断生（无白芯），盛入第 4 步装有凉水的碗中。
- number: 6
  description: 立即控水捞出，盛入干净的碗中。
- number: 7
  description: 取第 3 步炸酱，倒入碗中，拌匀。然后取第 1 步菜码，倒入碗中，拌匀。
tips: '* 肉推荐瘦肉丁，口感更好，推荐现买现用。; * *面条*推荐使用*普通面条*。; * 面条口感关键在于劲道。勿选龙须等细面。; * 如有条件（另一个锅）且熟练后，第 2、3 步和 1、4、5、6 步可分时并行执行。; * 甜咸口个人有爱好，两种酱的配比需要自己迭代优化。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
