id: 10359
name: 凉拌油麦菜
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 191
servings: 2
tags:
- 酸甜
- 凉拌
description: 一道清爽解腻的家常凉菜，芝麻酱的醇厚包裹着油麦菜的脆嫩，酸甜咸香交织，非常开胃。油麦菜富含维生素和膳食纤维，芝麻酱则补充钙与健康脂肪，营养均衡。做法毫无难度，切一切、拌一拌就行，从准备到上桌只需十几分钟，特别适合新手和忙碌时快速成菜。
steps:
- number: 1
  description: 蒜拍碎切末
- number: 2
  description: 醋，酱油，芝麻酱，香油，糖，蚝油，蒜末放到碗里搅拌均匀
- number: 3
  description: 油麦菜切段，每段不超过 4cm
- number: 4
  description: 油麦菜放到一个大点的盆里，倒入上述碗中酱料，充分搅拌均匀.
tips: '* 芝麻酱可以用花生酱代替; * 芝麻酱一定要和油麦菜混合均匀才更好吃.; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
