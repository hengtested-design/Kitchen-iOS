id: 10308
name: 扬州炒饭
cuisine: 家常菜
difficulty: 4
duration: 60
calories: 1769
servings: 2
tags:
- 咸鲜
- 炒
cover: https://s.chuimg.com/扬州炒饭/扬州炒饭.jpeg
description: 这是一道配料丰富的升级版炒饭，米饭粒粒分明，鸡蛋嫩滑，搭配虾仁、午餐肉和蔬菜丁，口感层次鲜明，属于淮扬菜系中的经典主食。富含优质蛋白、碳水化合物和多种维生素，营养均衡。步骤虽多但操作直观，对初级烹饪者也较为友好，只需耐心备料。预计制作时长约 1 小时。
ingredients:
- name: 冷饭 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 2-3 个
  amount: 0
  unit: 适量
  isMain: false
- name: 冷冻去头去皮基围虾 10-15 只
  amount: 0
  unit: 适量
  isMain: false
- name: 午餐肉罐头 150g（推荐上海梅林的火腿午餐肉罐头，340g 每罐，一次用半罐）
  amount: 0
  unit: 适量
  isMain: false
- name: 青豆 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 胡萝卜 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 玉米粒 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 1 根
  amount: 0
  unit: 适量
  isMain: false
- name: 油 30-40ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 12-15g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 胡萝卜切丁 0.2cm*0.2cm*0.2cm，备用
- number: 2
  description: 午餐肉切丁 0.2cm*0.2cm*0.2cm，备用
- number: 3
  description: 葱分别取葱白和葱绿，各切成 0.25-0.5cm 的小段，分开备用
- number: 4
  description: 在碗中打入鸡蛋液，均匀搅拌，备用
- number: 5
  description: 将胡萝卜，青豆，玉米粒煮熟捞出，备用（水别倒）
- number: 6
  description: 将虾煮熟，捞出备用（水可以倒了）
- number: 7
  description: 热锅热油，可以参考[学习炒与煎](../../../tips/learn/学习炒与煎.md)中的热锅双油
- number: 8
  description: 鸡蛋凝固后立刻捞出，备用
- number: 9
  description: 将午餐肉，青豆，胡萝卜，玉米粒，虾倒入锅中翻炒 1-2 分钟，装盘备用
- number: 10
  description: 水冲一下锅，将杂物冲干净，保证锅内干净（可以有油但是不能有杂质）
- number: 11
  description: 热锅热油(10ml)，将葱白放入爆香
- number: 12
  description: 调至小火（如果油温过高可以关火 1-2 分钟），放入米饭，用铲子快速砸击米饭并翻炒，保证米饭均匀沾到油且粒粒分明
- number: 13
  description: 倒入鸡蛋，继续砸击，使鸡蛋碎开并与米饭充分混合
- number: 14
  description: 转大火，倒入其他所有备用配料，快速翻炒 1-2 分钟
- number: 15
  description: 撒入盐，并翻炒至充分混合
- number: 16
  description: 撒入葱绿，翻炒 1 分钟
- number: 17
  description: 关火，装盘
tips: 如做完后胳膊酸痛为正常现象，需加强上肢锻炼; 超市有青豆，胡萝卜，玉米粒的混合冷冻包装，可以使用这个省去切丁的烦恼，推荐 Pams Mixed Veges 很便宜，或者类似的都可以用（如下图）; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
