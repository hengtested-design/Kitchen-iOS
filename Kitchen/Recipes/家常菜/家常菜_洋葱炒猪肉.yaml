id: 10199
name: 洋葱炒猪肉
cuisine: 家常菜
difficulty: 3
duration: 15
calories: 979
servings: 2
tags:
- 下饭菜
- 炒
description: 这是一道家常风味小炒，咸中带甜，酱香浓郁，洋葱炒软后滋味温和，搭配嫩滑猪肉片非常下饭。猪肉提供优质蛋白质和 B 族维生素，洋葱含膳食纤维和多种抗氧化物，开胃助消化。操作简单，新手也能轻松上手，预计制作时长仅需 15 分钟。
ingredients:
- name: 洋葱 一颗 （是主角，喜欢吃洋葱可以多半颗～一颗）
  amount: 0
  unit: 适量
  isMain: false
- name: 猪肉 (250g)
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜头 （3 瓣）
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 (15ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 黑胡椒 (1.25g)
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油 (30ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 (15g)
  amount: 0
  unit: 适量
  isMain: false
- name: 麻油 (5ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄酱 (15ml)
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 (15ml)
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 洋葱切片，猪肉，蒜头拍碎，以及混合上述调味料备用
- number: 2
  description: 炒锅内倒入 1 大匙食用油（等待 10 秒让油温升高），倒入猪肉
- number: 3
  description: 炒至变色后下蒜头炒香盛起备用
- number: 4
  description: 原锅下洋葱翻炒 3~4 分钟后加入调味料炒匀
- number: 5
  description: 下刚盛起备用的猪肉翻炒至猪肉熟后
- number: 6
  description: 待猪肉熟后再翻炒 1、2 分钟即可起锅
tips: 猪肉可选猪肩肉片或是切好的肉丝看个人喜好; [爱料理](https://icook.tw/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
