id: 10388
name: 素炒豆角
cuisine: 家常菜
difficulty: 2
duration: 20
calories: 107
servings: 2
tags:
- 咸鲜
- 下饭菜
- 炒
description: 这是一道酱香浓郁的家常小炒，豆角软嫩入味，鲜辣下饭。富含膳食纤维和多种维生素，有助于促进消化。做法简单，新手也能轻松上手，从备菜到出锅大约 20 分钟。
ingredients:
- name: 豆角 250g
  amount: 0
  unit: 适量
  isMain: false
- name: 小米椒 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 3 圈
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 2 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 6ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 2ml
  amount: 0
  unit: 适量
  isMain: false
- name: 耗油 6ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 6g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 葱切花，蒜切沫，备用。
- number: 2
  description: 生抽、老抽、耗油、盐混合调料汁，备用。
- number: 3
  description: 小米椒切圈，备用。
- number: 4
  description: 豆角去筋，45° 斜切*4-10cm*小段，备用。
- number: 5
  description: 起锅烧油(10ml - 15ml)，冒烟后放入葱、小米椒，翻炒至闻到香味；
- number: 6
  description: 加入豆角，翻炒*30s*,
- number: 7
  description: 加入料汁，开大火翻炒*2分钟*
- number: 8
  description: 倒入 150ml 水
- number: 9
  description: 转中小火，盖上锅盖焖制 8-10 分钟
- number: 10
  description: 加入蒜切沫，出锅。
tips: 切豆角需要一定的刀工，不会的可以使用剪刀; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
