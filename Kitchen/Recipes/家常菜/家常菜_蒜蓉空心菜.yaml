id: 10398
name: 蒜蓉空心菜
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 440
servings: 2
tags:
- 快手菜
- 炒
cover: https://s.chuimg.com/蒜蓉空心菜/蒜蓉空心菜.jpeg
description: 蒜蓉空心菜是一道清脆爽口、蒜香浓郁的家常快手菜，属于典型的川式小炒风味。空心菜富含膳食纤维、维生素和钙质，有助于促进肠道蠕动。做法非常简单，对新手十分友好，从备料到出锅大约只需 15 分钟。
steps:
- number: 1
  description: 空心菜洗净，去掉烂叶或者老梗，均匀切成 2 段或者 3 段（防止过长不好炒）
- number: 2
  description: 锅里先倒少量油，烧至微微冒烟，此时拿起锅将国内的热油向四周浸润，让油均匀覆盖锅底，然后再倒入剩余的油([热锅凉油法](https://cook.aiursoft.com/tips/learn/%E5%AD%A6%E4%B9%A0%E7%82%92%E4%B8%8E%E7%85%8E/?h=%E7%83%AD%E9%94%85#_5))。
- number: 3
  description: 放入蒜末，小火炒 10 到 15 秒煸香
- number: 4
  description: 尽快均匀地放入空心菜，**开大火**，左手拿铲子，右手拿筷子，配合将空心菜不停翻动，**直至软化变绿**。
- number: 5
  description: 接着不需使用筷子，而是使用铲子快速翻炒已软化的空心菜 15 - 20 秒，使之受热更均匀，撒入盐 2 g ，白糖 3 g，生抽 8 ml。
- number: 6
  description: 继续大火翻炒 10 秒，即可出锅。
tips: '* 空心菜尽量选择新鲜，鲜嫩的，否则炒出来口感可能会比较老; * 实际放入空心菜的量可以根据锅的大小决定，建议不超过一个锅，否则太多的话开始的翻动阶段和后续的翻炒，容易掉出少量空心菜到灶台; * 炒空心菜时，一定要**开大火**，这样空心菜才能快速变软的同时保持脆嫩的口感，大火也有利于炒出生抽的香味。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
