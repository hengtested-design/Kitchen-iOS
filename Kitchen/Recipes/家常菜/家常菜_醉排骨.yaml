id: 10247
name: 醉排骨
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 934
servings: 2
tags:
- 酸甜
- 咸鲜
- 炸
cover: https://s.chuimg.com/醉排骨/醉排骨.jpeg
description: 醉排骨是福州传统名菜，口感外酥里嫩，酸甜开胃，带着独特的鱼露鲜香。排骨富含蛋白质和钙质，营养解馋。这道菜需要掌握挂糊和复炸的技巧，更适合有一定下厨经验的朋友尝试，全程大约需要 40 分钟完成。
steps:
- number: 1
  description: 排骨中加入 5 g 地瓜粉和水进行搅拌，清洗 2-3 遍后放入大碗备用
- number: 2
  description: 排骨中加入鱼露、地瓜粉、鸡蛋黄 充分搅拌
- number: 3
  description: 将排骨一个一个放入锅中（切记不可以整碗倒入），保证每个不要粘在一起
- number: 4
  description: 全部放入后，每 30 S 用勺子来回两面翻转瘦肉块，直至排骨表面金黄
- number: 5
  description: 取出排骨，一分钟后倒入油锅中继续炸，直至瘦肉块表面出现焦黄后，取出放入大碗备用
- number: 6
  description: 准备一个小碗，加入蒜末、香醋、白砂糖、鱼露、番茄酱、葱花、芝麻搅拌均匀，倒入 5 ml 热油
- number: 7
  description: 将汤汁浇灌入排骨，在充分搅拌后倒入盘中
tips: '* 鱼露，又称鱼酱油，是一种广东，福建等地常见的调味品。效果类似于生抽; * 本次制作过程中，由于疫情原因没有雨露，只能用老抽代替，所以排骨颜色偏黑，正常是金黄色; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
