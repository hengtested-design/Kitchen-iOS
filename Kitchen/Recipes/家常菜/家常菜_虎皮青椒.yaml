id: 10401
name: 虎皮青椒
cuisine: 家常菜
difficulty: 3
duration: 15
calories: 341
servings: 2
tags:
- 酸甜
- 咸鲜
- 下饭菜
cover: https://s.chuimg.com/虎皮青椒/虎皮青椒.jpeg
description: 虎皮青椒是一道家常小菜，外皮微焦起皱，口感软嫩带脆，咸鲜中透着酸甜，十分开胃下饭。青椒富含维生素 C 和膳食纤维，有助于增强免疫力、促进消化。制作过程简单明了，只需掌握按压和火候，对新手也比较友好，一般约 15 分钟就能完成。
ingredients:
- name: 青椒 5 个，长度在 10-15cm 的最为合适
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 2-3 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 油 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 香醋 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 4g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 去掉青椒蒂，用自来水冲洗干净。
- number: 2
  description: 青椒切长片，平均一个青椒纵向切成 3-4 片即可。
- number: 3
  description: 大蒜去皮，切成碎末，体积在 2mm x 2mm x 2mm 即可。
- number: 4
  description: '`调料 1`：拿一个小碗倒入 20ml 油，将大蒜末放入其中。'
- number: 5
  description: '`调料 2`：白糖、生抽、醋、盐全部倒入砵（碗）等容器，搅拌。'
- number: 6
  description: 将 `调料 1` 倒入锅中，开火加热 5 成放入青椒，青椒片不要叠在一起，单独成片放置锅中。
- number: 7
  description: 用锅铲不停的按压青椒，合适的时候翻面。
- number: 8
  description: 翻炒约 2 分钟，待青椒表皮出现褶皱时，倒入 `调料 2`。
- number: 9
  description: 加大火候继续翻炒 30s 后即可出锅盛入盘中。
