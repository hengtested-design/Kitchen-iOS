id: 10229
name: 茭白炒肉
cuisine: 家常菜
difficulty: 3
duration: 20
calories: 515
servings: 2
tags:
- 咸鲜
- 快手菜
- 炒
cover: https://s.chuimg.com/茭白炒肉/茭白炒肉.jpeg
description: 茭白炒肉是一道家常快手菜，口感鲜嫩爽脆，咸鲜适口，属于典型的江南家常风味。茭白富含膳食纤维和多种维生素，搭配瘦肉提供优质蛋白，荤素搭配均衡营养。烹饪难度中等，新手稍加练习即可掌握，预计制作时长约 20 分钟。
steps:
- number: 1
  description: 茭白切片，每片厚度 0.5 cm
- number: 2
  description: 瘦肉切条，厚度 0.3-0.5 cm，加入料酒、生粉、盐、水搅拌
- number: 3
  description: 姜切片、蒜头剁碎
- number: 1
  description: 起锅水烧开，放入茭白，水煮 60-90 S 后取出沥干
- number: 2
  description: 起锅，倒入 15 ml 油，倒入瘦肉，反复翻炒 60 S 取出
- number: 3
  description: 起锅，倒入 15 ml 油，倒入姜、蒜翻炒 30S，加入茭白继续翻炒 30 S
- number: 4
  description: 继续加入瘦肉翻炒 60 S，加入 20 ml 水，加入盐、鸡精后翻炒 60S 出锅
tips: '* 最后一个步骤，可以考虑加蚝油、生抽代替盐上色; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
