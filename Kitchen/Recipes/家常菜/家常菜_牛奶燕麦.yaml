id: 10092
name: 牛奶燕麦
cuisine: 家常菜
difficulty: 1
duration: 30
calories: 421
servings: 2
tags:
- 煎
description: 一份高蛋白、高纤维的便捷营养早餐，将牛奶的滑润、燕麦的谷香与煎蛋的嫩脆巧妙结合，入口温热柔和、易于消化，饱腹感强。制作过程简单直接，对新手极为友好，全程约三分钟即可完成，搭配蔬果更添清爽。
ingredients:
- name: 🥛 牛奶 280ml/per
  amount: 0
  unit: 适量
  isMain: false
- name: 🍳 鸡蛋 1 个/per
  amount: 0
  unit: 适量
  isMain: false
- name: 🍚 燕麦 40g/per
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将牛奶倒入早餐杯（冷的即可）
- number: 2
  description: 准备好 200ml 水，如果是直饮水直接加入燕麦，否则请烧开后加入燕麦
- number: 3
  description: 水沸后 2 分钟，燕麦煮好
- number: 4
  description: 煮好的燕麦捞出倒入牛奶中（尽量不要将煮燕麦的水也倒入牛奶，影响口感）
- number: 1
  description: 将燕麦替换为快煮燕麦
- number: 2
  description: 将牛奶倒入装有快煮燕麦的容器中并搅拌
- number: 3
  description: 将混合物放入微波炉中
- number: 4
  description: 中等火力微波 4 分钟
- number: 1
  description: 热锅，锅内放一层底油，油热后煎鸡蛋，每面煎 20s，考虑调底味（3g 椒盐，可选）
- number: 2
  description: 关火，装盘
tips: 由于不同微波炉火力不同，故微波炉火力无法精确表明; 不建议混合物超过容器容量 50%，否则加热过程中内容物极有可能溢出; 不建议使用玻璃杯进行烹饪，理由同上; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
