id: 10071
name: 蛏抱蛋
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 1229
servings: 2
tags:
- 咸鲜
- 炸
cover: https://s.chuimg.com/蛏抱蛋/蛏抱蛋.jpeg
description: 蛏抱蛋是福建福州一带的传统家常菜，蛏肉裹着蛋液煎得外酥里嫩，带着洋葱和生抽的咸鲜香气。蛏子富含优质蛋白和锌、铁等微量元素，与鸡蛋搭配营养均衡。制作难度适中，需掌握煎炸火候但步骤不繁琐，预计 大约 30 分钟就能端上餐桌。
steps:
- number: 1
  description: 烧开水，将蛏子放入水中，水煮 2 分钟后，捞上来去壳，放入大碗
- number: 2
  description: 往大碗中加入洋葱、生抽、料酒、鸡精、生粉后，充分搅拌
- number: 3
  description: 往大碗中打入 2 个 鸡蛋，继续搅拌
- number: 4
  description: 起锅烧油，倒入碗中蛏子，煎炸至单面金黄后，翻面继续煎炸
tips: '* 更多情况下，福州当地会选用马蹄（解腻）和马铃薯（洗油），因为疫情期间买不到，所以选用了凤梨; * 闽菜以甜为主，如果吃不惯的可以放弃白糖; * 可以通过勺子敲打瘦肉块，听到声响来判断是否炸透瘦肉; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
