id: 10252
name: 香煎五花肉
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 2985
servings: 2
tags:
- 咸鲜
- 快手菜
- 煎
cover: https://s.chuimg.com/香煎五花肉/香煎五花肉.jpeg
description: 香煎五花肉是一道家常风味的快手荤菜，五花肉片煎得焦香微脆、肥而不腻，搭配脆爽的生菜叶和咸鲜豆瓣酱，入口酱香浓郁又解腻。猪肉富含优质蛋白质和脂肪，能快速补充能量，生菜则提供膳食纤维和维生素，营养更均衡。这道菜适合有一定下厨基础的朋友，新手只要注意火候和防溅油也能轻松上手，从备料到出锅大约半小时即可享用。
ingredients:
- name: 五花肉条（推荐长宽高为 20cm\*6cm\*5cm）
  amount: 0
  unit: 适量
  isMain: false
- name: 生菜一朵
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 5ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将五花肉条沿长边切片，每片厚 1mm-1.5mm，备用
- number: 2
  description: 将切好的五花肉放置碗中，依次加入 8g 酱油，1g 盐，1g 味精，10g 料酒，两片姜，两朵拍扁的大蒜腌制 10 分钟
- number: 3
  description: 将生菜叶直接用手扒下来，洗干净，备用
- number: 4
  description: 热锅，倒入 5ml 食用油。油轻微冒烟后下入五花肉。单面煎制焦黄色后翻面，另一边同理。
- number: 5
  description: 五花肉出锅后，装盘。
- number: 6
  description: 将豆瓣酱抹到菜叶上，卷着五花肉即可食用
tips: 操作时，小心被溅出的油烫到; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
