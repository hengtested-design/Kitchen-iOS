id: 10381
name: 炒滑蛋
cuisine: 家常菜
difficulty: 1
duration: 5
calories: 391
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/炒滑蛋/炒滑蛋.jpeg
description: 炒滑蛋是一道口感嫩滑、蛋香浓郁的经典家常菜，带有淡淡的奶香。鸡蛋富含优质蛋白质和多种维生素，营养丰富，易于吸收。做法非常友好，新手也能轻松掌握，从备料到出锅只需约 5 分钟，是忙碌时快速补充能量的理想选择。
ingredients:
- name: 鸡蛋 4 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 牛奶 30ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡蛋加入牛奶以及 5ml 食用油搅拌均匀，备用
- number: 2
  description: 大火烧热平底锅约 30s, 加入 5ml 食用油
- number: 3
  description: 烧 30s 转小火, 并且放入搅拌好的鸡蛋
- number: 4
  description: 在锅中静置 5 秒后，用锅铲将蛋液从边缘缓慢推向中间
- number: 5
  description: 翻炒至鸡蛋大致凝固后关火，装盘
tips: 最后可根据个人口味撒些黑胡椒或者盐来调味。; 参考资料; [甜琛廚房](http://sweetheartkitchen.com/recipes/scrambled-egg/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
