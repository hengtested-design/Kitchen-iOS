steps:
- number: 1
  description: 排骨冷水下锅焯水，加葱、姜、料酒。
- number: 2
  description: 水沸后去浮沫捞出沥干。
- number: 3
  description: 准备调料。
- number: 4
  description: 备好冰糖（白色、黄色均可，单晶、多晶均可，白糖也可）。
- number: 5
  description: 热锅凉油，加入冰糖，小火翻动。
- number: 6
  description: 炒至上色加酱油。
- number: 7
  description: 加入清水和所有调料。
- number: 8
  description: 大火烧开后转小火慢炖。汤量较小时大火收汁。
- number: 9
  description: 鲜香入味，出锅装盘。
