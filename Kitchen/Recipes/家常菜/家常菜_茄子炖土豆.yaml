id: 10393
name: 茄子炖土豆
cuisine: 家常菜
difficulty: 3
duration: 45
calories: 623
servings: 2
tags:
- 下饭菜
- 炖
description: 茄子炖土豆是一道东北家常炖菜，口感绵软咸香，带着辣椒的微辣和蒜香，十分下饭。茄子富含花青素和膳食纤维，土豆提供碳水化合物和维生素 C，加上猪肉的蛋白质，营养均衡又饱腹。这道菜操作流程简单，但需要掌握翻炒和收汁的火候，对新手有一定挑战，预估难度中等。从备料到出锅大约需要 45 分钟。
ingredients:
- name: 茄子的数量
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆数量
  amount: 0
  unit: 适量
  isMain: false
- name: 肉量
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油量
  amount: 0
  unit: 适量
  isMain: false
- name: 盐量
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒量
  amount: 50
  unit: 适量
  isMain: true
- name: 蒜量 3 瓣，而**不是3整头**）
  amount: 3
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将茄子、土豆、辣椒洗净，蒜扒皮并拍碎。
- number: 2
  description: 将茄子、土豆切成约 6 立方厘米的块，辣椒切成 5 克的小块，肉切成 3 厘米的丝。
- number: 3
  description: 开火，热锅，加入份数 * 13 毫升的油。
- number: 4
  description: 当能看到锅里的油冒出一丝烟时，放入辣椒。
- number: 5
  description: 煸出辣椒香气后，立刻放入肉，用铲子翻炒 30 秒。
- number: 6
  description: 放入土豆，翻炒 30 秒。
- number: 7
  description: 放入茄子，翻炒 30 秒。
- number: 8
  description: 放入酱油和盐，继续翻炒 5 分钟。
- number: 9
  description: 加入水，水面高度为锅内食材高度的 0.9 倍，并盖上锅盖。
- number: 10
  description: 等待，直到锅内水的高度剩余食材高度的 0.1 倍时，开盖，放入蒜，搅拌均匀，关火。
tips: 在操作的第 5-7 步骤中要注意：在此过程中注意锅底如果没有液体（油或水），则加 5 毫升的水再继续翻炒。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
