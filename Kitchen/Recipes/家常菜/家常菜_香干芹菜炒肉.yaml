id: 10251
name: 香干芹菜炒肉
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 741
servings: 2
tags:
- 咸鲜
- 炒
cover: https://s.chuimg.com/香干芹菜炒肉/香干芹菜炒肉.jpeg
description: 香干芹菜炒肉是一道家常小炒，豆干柔韧、芹菜爽脆、猪肉嫩滑，咸鲜微辣。芹菜富含膳食纤维，豆干和猪肉提供优质植物蛋白与动物蛋白。做法简单，对新手友好，从备料到出锅大约只需 30 分钟。
ingredients:
- name: 豆干：150g
  amount: 0
  unit: 适量
  isMain: false
- name: 香芹：4 根
  amount: 0
  unit: 适量
  isMain: false
- name: 猪肉：200g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜头：2 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒：4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒：6 粒（不喜欢可以不放，或者放花椒水）
  amount: 0
  unit: 适量
  isMain: false
- name: 盐：5g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡精：3g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽：8ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油：5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油：10-15ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 芹菜去叶切段、切成不超过 4cm 的条状，备用
- number: 2
  description: 香干切条，宽约小拇指，备用
- number: 3
  description: 蒜头切片或者剁成蒜泥都行，备用
- number: 4
  description: 辣椒切圈或者斜切成条都行，备用
- number: 5
  description: 热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高
- number: 6
  description: 放入花椒、大蒜爆香（可以吃姜的也可以额外放入一些姜片/姜丝）
- number: 7
  description: 加入猪肉炒至变色，再加入 8ml 老抽上色翻炒均匀（有豆瓣酱的，可以放入 3ml 豆瓣酱一起翻炒）
- number: 8
  description: 加入香干翻炒均匀（大约 2 分钟）
- number: 9
  description: 加入辣椒翻炒均匀（大约 1-2 分钟）
- number: 10
  description: 加入芹菜，放入 5g 盐翻炒 1 分钟
- number: 11
  description: 加入 3g 鸡精、5ml 蚝油翻炒均匀，即可出锅
tips: 如果没有买到香芹，或者用的芹菜比较粗，可以考虑焯水，放入滚水中 1 分钟捞出，冷水冲洗（保持爽脆）; 如果买到的豆干比较硬、紧实，也可以切条后再焯水; [香干芹菜炒肉教程](https://www.xiachufang.com/recipe/105987156/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
