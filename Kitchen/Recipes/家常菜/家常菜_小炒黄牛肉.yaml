id: 10177
name: 小炒黄牛肉
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 619
servings: 2
tags:
- 咸鲜
- 炒
cover: https://s.chuimg.com/小炒黄牛肉/小炒黄牛肉.jpeg
description: 这道湘味小炒以大火爆炒逼出牛肉的嫩滑与椒香，口感鲜辣劲爽、芹菜脆嫩，极具湖南风味。牛里脊提供优质蛋白和易吸收的铁质，搭配芹菜增添膳食纤维，营养均衡。备料与烹饪步骤简单明了，全程旺火快炒，对新手十分友好，从切配到出锅大约一小时即可完成。
ingredients:
- name: 牛里脊 400g
  amount: 0
  unit: 适量
  isMain: false
- name: 芹菜 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 小米椒 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 野山椒 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 香菜 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油 6ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 牛里脊切成不超过 3cm 宽，3mm 厚的薄片，倒入 6ml 酱油，用手抓匀备用
- number: 2
  description: 芹菜切成不超过 5cm 的小段，备用
- number: 3
  description: 小米椒切成丝状，备用
- number: 4
  description: 野山椒切成颗粒，备用
- number: 5
  description: 香菜切成成不超过 3cm 的小段，备用
- number: 6
  description: 热锅，锅内放入 15ml 食用油，大火等待 30 秒让油温升高
- number: 7
  description: 放入小米椒和野山椒爆香
- number: 8
  description: 放入牛里脊和芹菜，然后**大火翻炒 1 分钟**
- number: 9
  description: 关火，撒上香菜，盛盘
tips: 操作时，全程需要开大火; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
