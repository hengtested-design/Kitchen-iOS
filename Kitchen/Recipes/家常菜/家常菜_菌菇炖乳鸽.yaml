id: 10290
name: 菌菇炖乳鸽
cuisine: 家常菜
difficulty: 4
duration: 45
calories: 324
servings: 2
tags:
- 咸鲜
- 炖
cover: https://s.chuimg.com/菌菇炖乳鸽/菌菇炖乳鸽.jpeg
description: 菌菇炖乳鸽汤色清亮、肉质细嫩，菌香与鸽鲜交融，属于家常粤式炖汤。乳鸽富含优质蛋白和多种氨基酸，菌菇提供多糖与膳食纤维，温和滋补。整道菜需先将乳鸽焯水去腥，再与玉米、菌菇同炖，对火候和时间的把控略有一些要求，新手稍加注意也能驾驭。从备料到出锅，使用高压锅约需 45 分钟，瓦罐慢炖则需 1 小时出头。
steps:
- number: 1
  description: 冷水洗干净热心摊主处理好的乳鸽
- number: 2
  description: 冷水锅中放入洗干净的乳鸽，加入 15ml 料酒与姜，水煮开即可捞出乳鸽，要不然会丢失营养
- number: 3
  description: 把乳鸽放到高压缩或者瓦罐中、倒入的水要没过乳鸽，放入生姜 20 g，玉米 200 g、菌菇 100 g
- number: 4
  description: 时间到了，盛到碗中，加入 3~5g 盐 即可
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
