id: 10211
name: 田螺酿
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 533
servings: 2
cover: https://s.chuimg.com/田螺酿/田螺酿.jpeg
description: 田螺酿是阳朔“十八酿”之首，螺肉韧而紧致、猪肉嫩滑，紫苏薄荷清香扑鼻，曾登上《舌尖上的中国 2》。富含蛋白质和多种微量元素，螺肉与猪肉搭配营养互补。这道菜步骤稍多，对新手有一定挑战，需提前半天让田螺吐沙，正式制作约 40 分钟，适合节假日全家一起动手。
ingredients:
- name: 大田螺 20 个（约 1000g）
  amount: 0
  unit: 适量
  isMain: false
- name: 猪肉 250g
  amount: 0
  unit: 适量
  isMain: false
- name: 新鲜薄荷叶 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 紫苏叶 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 1 小块（约 15g）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 2 根（约 30g）
  amount: 0
  unit: 适量
  isMain: false
