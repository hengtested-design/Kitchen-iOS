id: 10383
name: 炒青菜
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 152
servings: 2
tags:
- 咸鲜
- 炒
description: 这是一道清爽可口的家常素菜，口感脆嫩、咸鲜回甘。青菜富含维生素与膳食纤维，有助于促进消化。做法非常简单，零基础也能轻松驾驭，从备菜到出锅大约只需 10 分钟。
ingredients:
- name: 青菜 100g * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜瓣 2 粒 * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10-15ml（覆盖锅底即可）
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 2g * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 饮用水 70ml * 份数
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 5g * 份数
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 青菜掰成小瓣，用清水洗净，备用。
- number: 2
  description: 将蒜瓣剁碎，备用
- number: 3
  description: 中火或大火热锅后，锅内放入 10-15ml 食用油。再等待 30 秒让油温升高。
- number: 4
  description: 将准备好的青菜倒入锅中，翻炒至青菜变软（约 1 分钟）。
- number: 5
  description: 放入剁碎的蒜瓣
- number: 6
  description: 倒入计算好的清水，水位应当完全浸润或即将没过青菜，加入食盐 （2g * 份数），继续翻炒约 1 分钟。
- number: 7
  description: 最后加入白糖小火加热 2 分钟，加热时盖上锅盖。
- number: 8
  description: 盛盘。
tips: 加入白糖，会让青菜颜色更绿。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
