id: 10344
name: 酱拌荞麦面
cuisine: 家常菜
difficulty: 2
duration: 20
calories: 475
servings: 2
tags:
- 酸甜
- 快手菜
- 煮
cover: https://s.chuimg.com/酱拌荞麦面/酱拌荞麦面.jpeg
description: 酱拌荞麦面酸甜可口、清凉爽滑，是一道简单快手的家常凉拌面。荞麦面富含膳食纤维和蛋白质，搭配黄瓜、胡萝卜增添清爽口感与维生素，营养均衡。只需煮面、切菜、拌入老干妈，几步搞定，对新手非常友好，一般约 20 分钟便可完成。冷藏后食用风味更佳。
steps:
- number: 1
  description: 荞麦面下冷水煮熟，8-10 分钟 后捞出沥干备用
- number: 2
  description: 黄瓜、萝卜 切成小条
- number: 3
  description: 将荞麦面、黄瓜、萝卜放入盘子，放上老干妈，搅拌
tips: '* 荞麦面沥干后可以放冰箱冰镇后口感更佳; * 配料可以根据个人喜好选择其他，例如虾仁、肉沫等; * 酱料可以根据个人喜欢选择其他，例如花生酱、芝麻酱等; * 荞麦面跟其他面条热量几乎一致，所以不适合作为减脂的主食; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
