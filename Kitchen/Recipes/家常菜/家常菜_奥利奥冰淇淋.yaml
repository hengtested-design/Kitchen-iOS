id: 10114
name: 奥利奥冰淇淋
cuisine: 家常菜
difficulty: 3
duration: 240
calories: 1160
servings: 2
description: 奥利奥冰淇淋口感细腻，奶香与奥利奥的酥脆甜蜜相融，纯动物奶油令整体轻盈不腻。它主要提供能量，含有脂肪和碳水化合物，适合作为消暑小甜点。制作过程较为简单，只需处理饼干夹心和搅打奶油，新手稍加耐心也可完成，全程准备约需半小时，再冷冻 4 小时以上即可享用。
ingredients:
- name: 奥利奥 6 块
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 18 克
  amount: 0
  unit: 适量
  isMain: false
- name: 淡奶油 250 毫升
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将奥利奥拧开后去除利利（夹心），备用
- number: 2
  description: 用筷子将奥奥剁碎，需要有一半奥奥变成粉状，另一半的奥奥最大长度小于 0.5 厘米，备用（某宝可搜“奥利奥饼干碎”，节省时间精力^-^）
- number: 3
  description: 将奶油全部倒置于深容器中，并加入准备好的糖
- number: 4
  description: 开始用电动打蛋器高速挡 搅打至 电动打蛋器提起后下方会出现**悬挂住**的奶油（ 0.5 厘米 - 1 厘米），而不是**全部**像液体一样滴下（部分滴下是正常现象）。
- number: 5
  description: 搅打完成后将奥奥放入奶油中，搅拌均匀直至底部有奥奥。
- number: 6
  description: 可选：将混合物倒入冰淇淋模具中
- number: 7
  description: 放置冰箱冷冻室（ -18 度） 4 小时以上可取出
tips: 剁碎奥利奥的容器注意不要使用易碎容器。; 去除奥利奥夹心时切忌注意割到手。; 参考资料：[5分钟搞定【奥利奥麦旋风】太解馋叭！](https://www.xiachufang.com/recipe/106178429/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
