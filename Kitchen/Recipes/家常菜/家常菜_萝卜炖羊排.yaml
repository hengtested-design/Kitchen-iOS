id: 10232
name: 萝卜炖羊排
cuisine: 家常菜
difficulty: 4
duration: 30
calories: 1259
servings: 2
tags:
- 咸鲜
- 煮
description: 这道汤菜清鲜不腻，羊肉软烂入味，萝卜饱吸汤汁后甘甜绵糯，是北方冬季常见的家常暖身菜。羊肉富含优质蛋白和铁，萝卜含有维生素与膳食纤维，两者搭配温补脾胃、驱寒助消化。虽然需经焯水去腥和两次炖煮，但步骤清晰易循，新手也能顺利上手。整体制作大约需要两小时，若用高压锅可缩短至大约一 小时。
ingredients:
- name: 羊排 400g
  amount: 0
  unit: 适量
  isMain: false
- name: 白萝卜一根
  amount: 0
  unit: 适量
  isMain: false
- name: 大葱一根
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒 10 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 10g ，一般买一头姜，从中切大约 4 片即可
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒或者黄酒 30ml-40ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用盐 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 2-4 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 水：没过食材的量，需要 1000ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 萝卜去皮、滚刀切成 3-5cm 的大块，备用
- number: 2
  description: 羊排在购买时可以让卖家切好，因为家用刀一般难以切动，备用
- number: 3
  description: 羊肉冷水下锅，加入一半的料酒，一半的葱姜，煮 10 分钟去掉血腥，（可选）把焯的过程中出现的血沫子可以用勺子盛出来
- number: 4
  description: 另起一锅冷水，放入切好的白萝卜，放入一半的冰糖，等水开后煮 5 分钟去掉白萝卜的辣味
- number: 5
  description: 盛出来焯好的羊排，放入高压锅中，加水没过所有食材后再增加大约 300ml 的水
- number: 6
  description: 将剩余的葱姜料酒，花椒，冰糖，白芷（可选），盐放入锅中，盖锅等待上汽后计时，中火炖大约 15 分钟。
- number: 7
  description: 关火，等待高压锅放气完毕，开盖，加入之前焯好的萝卜，调味，加入 3-10g 的食盐或者水，品尝汤的咸淡，
- number: 8
  description: 再开火，中火，高压锅上汽再炖 10 分钟，普通锅盖盖再炖 20 分钟
- number: 9
  description: 关火，盛盘
tips: 操作时，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水至没过食材。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
