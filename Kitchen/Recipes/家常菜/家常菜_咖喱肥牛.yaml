id: 10164
name: 咖喱肥牛
cuisine: 家常菜
difficulty: 4
duration: 40
calories: 1821
servings: 2
tags:
- 下饭菜
cover: https://s.chuimg.com/咖喱肥牛/咖喱肥牛.jpeg
description: 咖喱肥牛是一道浓郁下饭的家常菜，咖喱的辛香与肥牛的脂香融合，搭配土豆、胡萝卜等蔬菜，口感绵软醇厚。富含蛋白质、维生素和钙质，荤素搭配均衡。做法简单，对新手友好，一般只需 40 分钟就能端上餐桌，很适合作为便当菜。
ingredients:
- name: 香叶 1 片
  amount: 0
  unit: 适量
  isMain: false
- name: 纯牛奶 50ml
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 胡萝卜 150g
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆 200g （挺饱腹的，酌情添加）
  amount: 0
  unit: 适量
  isMain: false
- name: 肥牛卷 300g （喜欢吃肉就多来点）
  amount: 0
  unit: 适量
  isMain: false
- name: 咖喱块 2 块 （大约 100g）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 洋葱切成条状、胡萝卜以及土豆切成块状，备用
- number: 2
  description: 烧一锅开水，水沸时将肥牛卷下锅，捞出血沫后放在一边沥水，备用
- number: 3
  description: 热锅，锅内放入 10ml - 15ml 食用油，**等待 10 秒让油温升高**
- number: 4
  description: 放入洋葱，翻炒至洋葱变软变透明
- number: 5
  description: 放入土豆以及胡萝卜**翻炒 2 分钟**
- number: 6
  description: 加入冷水至淹没所有食材即可
- number: 7
  description: 将香叶、咖喱块投入锅中，盖上锅盖，**待水沸腾后将火调小然后等待直至土豆块以及胡萝卜块炖至软烂（可用筷子确认）**
- number: 8
  description: 加入肥牛卷以及牛奶，盖上锅盖再小火煮 2-3 分钟即可出锅（用勺子搅拌食材，注意力度，避免肥牛卷破碎）
tips: 咖喱块不用捣碎，直接整块投入即可。; 操作时，需要注意搅拌食材，避免食材调味料不均匀。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
