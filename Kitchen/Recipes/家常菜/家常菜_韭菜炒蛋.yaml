id: 10413
name: 韭菜炒蛋
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 180
servings: 2
tags:
- 咸鲜
- 快手菜
- 炒
description: 韭菜炒蛋是一道经典的家常菜，韭菜香气浓郁，鸡蛋嫩滑鲜美，简单易做，营养丰富。韭菜含有丰富的维生素和纤维素，鸡蛋提供优质蛋白质。这道菜制作简单，原材料易得，特别适合厨房新手入门，从头备菜到盛盘出锅大约只需 10 分钟。
steps:
- number: 1
  description: 韭菜洗净，沥干水分
- number: 2
  description: 韭菜切成约 3cm 长的小段，即为 `韭菜段`
- number: 3
  description: 将鸡蛋打入碗中，搅匀，即为 `鸡蛋液`
- number: 4
  description: 热锅，加入食用油
- number: 5
  description: 油热后，倒入 `鸡蛋液`，快速翻炒至鸡蛋凝固成块，盛出备用，即为 `炒好的鸡蛋`
- number: 6
  description: 锅中再加 5ml 食用油，放入 `韭菜段`，大火快速翻炒 30 秒
- number: 7
  description: 向锅中加入 `炒好的鸡蛋`，翻炒均匀
- number: 8
  description: 加入盐，翻炒均匀
- number: 9
  description: 关火，盛盘
tips: '* 韭菜炒蛋讲究大火快炒，韭菜炒久了容易失去香气和脆嫩口感; * 如果喜欢韭菜更软烂，可以适当延长翻炒时间; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
