  amount: 400
  unit: 克
  isMain: true
- name: 山楂
  amount: 200
  unit: 克
  isMain: true
- name: 冰糖
  amount: 20
  unit: 克
  isMain: true
- name: 八角
  amount: 2
  unit: 个
  isMain: true
- name: 香叶
  amount: 3
  unit: 片
  isMain: true
- name: 桂皮
  amount: 4
  unit: 克
  isMain: true
- name: 姜
  amount: 8
  unit: 克
  isMain: true
- name: 花椒
  amount: 20
  unit: 颗
  isMain: true
- name: 老抽
  amount: 15
  unit: 克
  isMain: false
- name: 生抽
