id: 10001
name: 山楂红烧肉
cuisine: 家常菜
difficulty: 2
duration: 60
calories: 310
servings: 2
tags:
- 酸甜
- 烧
cover: https://i01piccdn.sogoucdn.com/7fc847beb1e47101
ingredients:
