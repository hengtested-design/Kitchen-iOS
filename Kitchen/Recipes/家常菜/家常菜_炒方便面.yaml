id: 10318
name: 炒方便面
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 789
servings: 2
tags:
- 快手菜
- 炒
cover: https://s.chuimg.com/炒方便面/炒方便面.jpeg
description: 这道炒方便面口感 Q 弹筋道，咸香入味，是一道改良自传统煮面的家常快手主食。搭配鸡蛋和火腿肠，丰富了蛋白质和能量来源。做法简单，只需注意冷水冲面保持口感，新手也能轻松完成，全程大约 15 分钟即可出锅。
steps:
- number: 1
  description: 将火腿肠撕开包装，切成宽度 1cm 的小块。
- number: 1
  description: 向煮锅中加入 1200 ml 水，实际以没过面饼为准。完全煮沸，不要在未沸腾时加面。
- number: 2
  description: 加入方便面面饼，煮 45 秒。煮的过程中将其挑动，把面条打散。
- number: 3
  description: 面条打散后立刻关火。不要煮熟！
- number: 4
  description: 从锅中舀出 80ml 热面汤备用。
- number: 5
  description: 将面汤和面分离。用凉水冲一下面条。
- number: 6
  description: 沥干面条上的水分。不要长时间将面泡在水中。
- number: 1
  description: 准备一个小碗，将方便面的调料包挤进去。
- number: 2
  description: 将上一步的 80ml 热面汤全部倒入小碗，搅匀，得到调料碗。
- number: 1
  description: 取出计算好的数量的鸡蛋，打入一个小碗。不要加盐！（鸡蛋最终会混合锅里食材的盐味）
- number: 2
  description: 热锅 20s，加入份数 * 8ml 油。
- number: 3
  description: 加入刚刚准备好的一碗鸡蛋。翻炒大约 20s 至鸡蛋形成固态即可。
- number: 4
  description: 将煎鸡蛋取出暂存。不需要洗锅。但一般锅内不会残余太多油。
- number: 1
  description: 重新热锅 20s，向锅内加入油：份数 * 10ml。
- number: 2
  description: 加入第一步处理的火腿肠。翻炒 10 秒。
- number: 3
  description: 加入第二步的面。翻炒 30 秒。
- number: 4
  description: 加入第三步的调料碗。翻炒 30 秒。
- number: 5
  description: 加入第四步的煎鸡蛋。翻炒 30 秒。
- number: 6
  description: 关火盛盘即可。
tips: '* 在北京，可以考虑在盛盘后加入芝麻酱。如果芝麻酱太浓稠，可以 1:1 兑水稀释。; * 必须使用冷水冲面条！冷水能瞬间剥离面条表面的糊化淀粉，并强制中断内部的余温加热，这是保证面条下锅炒不坨、不粘锅、保持 Q 弹的核心原理。; * 处理面条的另一种方案，同样可以让面条劲道弹牙。拉长了面条整体处理时间，可以同步准备其他辅料：; * 洗面：将方便面面饼放入凉水中浸泡 2 分钟，使其完全吸收水分变湿润，捞出沥干（不用泡软）。; * 上蒸：将湿面饼放入蒸锅，水开后大火蒸 8 分钟，取出抖散备用（蒸能锁住水分，保证面条弹牙）。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
