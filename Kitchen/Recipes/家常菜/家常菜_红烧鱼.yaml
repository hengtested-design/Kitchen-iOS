steps:
- number: 1
  description: 把鱼去鳞去肠宰杀干净。
- number: 2
  description: 切好葱，姜，蒜，辣椒。
- number: 3
  description: 把鱼用少许盐，料酒，姜丝，白胡椒粉腌制10分钟。
- number: 4
  description: 锅里倒油煸香葱姜蒜。
- number: 5
  description: 炒香后然后再加入豆豉和豆瓣酱继续炒香。
- number: 6
  description: 把腌制好的鱼放入锅内。
- number: 7
  description: 倒入适量的清水，加入盐半勺，白糖半勺，料酒，盖上锅盖慢烧。
- number: 8
  description: 等汤汁烧开变浓稠后加入适量白胡椒粉和葱花，即可出锅。
- number: 9
  description: 这鱼好鲜呢。
