id: 10230
name: 荔枝肉
cuisine: 家常菜
difficulty: 4
duration: 45
calories: 681
servings: 2
tags:
- 酸甜
- 炸
cover: https://s.chuimg.com/荔枝肉/荔枝肉.jpeg
description: 荔枝肉是一道酸甜酥香的福州传统闽菜，外焦里嫩的肉块裹着红亮的酱汁，搭配水果添入清爽果香。猪瘦肉富含优质蛋白质，凤梨含有膳食纤维和维生素，能帮助开胃解腻。制作过程需要切肉、挂糊和两次油炸，略有挑战但步骤明确，适合有一定下厨基础的美食爱好者尝试，大约 45 分钟就能端上餐桌。
steps:
- number: 1
  description: 瘦肉切块（每块 2-3 cm ），放入大碗中，加入鸡蛋 1 个 、生粉 50 g 、生抽 3 ml 、鸡精 2 g
- number: 2
  description: 充分搅拌，直至生粉包裹住瘦肉块（太稀则继续加生粉，太干则加水），然后加入 5 ml 油，在充分搅拌后备用
- number: 3
  description: 在准备一个碗，加入番茄酱、鸡精 3 g 、生抽 2 ml 、姜末、白砂糖、生粉 10 g \香醋、凉水 200 ml ,充分搅拌后备用
- number: 4
  description: 切一个凤梨, 准备 6 个 （每个 1.5-2 cm）凤梨块
- number: 5
  description: 起锅烧油，倒入 500 ml 油，一直烧油直到听到油炸声
- number: 6
  description: 将瘦肉一个一个放入锅中（切记不可以整碗倒入），保证每个肉不要粘在一起
- number: 7
  description: 全部放入瘦肉后，每 30 S 用勺子来回两面翻转瘦肉块，直至瘦肉块表面金黄
- number: 8
  description: 取出瘦肉，一分钟后倒入油锅中继续炸，直至瘦肉块表面出现焦黄后，取出放入大碗备用
- number: 9
  description: 起锅，倒入汤汁，30 S 后倒入瘦肉块、凤梨块，充分翻炒后 出锅
- number: 10
  description: 摆上芝麻
tips: '* 更多情况下，福州当地会选用马蹄（解腻）和马铃薯（洗油），因为疫情期间买不到，所以选用了凤梨; * 闽菜以甜为主，如果吃不惯的可以放弃白糖; * 可以通过勺子敲打瘦肉块，听到声响来判断是否炸透瘦肉; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
