id: 10287
name: 罗宋汤
cuisine: 家常菜
difficulty: 4
duration: 180
calories: 2006
servings: 2
tags:
- 酸甜
- 咸鲜
description: 一道源自俄罗斯甜菜汤、在上海改良的海派家常汤品，以番茄和牛肉为主调，口感酸甜浓郁、醇厚鲜美。富含优质蛋白、番茄红素及多种维生素，营养均衡。制作简单，对初学者友好，全程预计 2–3 小时即可完成。
ingredients:
- name: 牛肉高汤 500 mL
  amount: 0
  unit: 适量
  isMain: false
- name: 牛肉 250 g （可选用牛腩肉或牛尾肉）
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄罐头 2 罐 （可用番茄替代、但风味欠佳）
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄膏 5 g （增加番茄风味）
  amount: 0
  unit: 适量
  isMain: false
- name: 马铃薯 400 g
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 100 g
  amount: 0
  unit: 适量
  isMain: false
- name: 胡萝卜 100 g
  amount: 0
  unit: 适量
  isMain: false
- name: 欧芹 100 g
  amount: 0
  unit: 适量
  isMain: false
- name: 包菜 200 g
  amount: 0
  unit: 适量
  isMain: false
- name: 红肠 100 - 200 g
  amount: 0
  unit: 适量
  isMain: false
- name: 橄榄油 5 mL （橄榄油用于蔬菜的烹制，可以用植物油代替）
  amount: 0
  unit: 适量
  isMain: false
- name: 植物油 5 mL （植物油用于牛肉的烹制，不能用橄榄油代替）
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 18 g
  amount: 0
  unit: 适量
  isMain: false
- name: 黑胡椒 3 g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 洋葱、胡萝卜、欧芹切 1cm 见方小丁
- number: 2
  description: 红肠、马铃薯切 2cm 块
- number: 3
  description: 包菜去梗后，手撕至 2cm 片
- number: 4
  description: 牛肉撒盐 3 g 、黑胡椒 3 g 腌制 5 分钟
- number: 1
  description: 平底锅烧热，加入植物油
- number: 2
  description: 煎制牛肉，直至表面**焦黄色**（可以带生，千万别糊了），取出备用。
- number: 1
  description: 汤锅烧热，加入橄榄油、洋葱丁、胡萝卜丁、欧芹丁
- number: 2
  description: 炒至**洋葱透明**，加入番茄膏、番茄罐头
- number: 3
  description: 加入牛肉、马铃薯丁，翻炒均匀
- number: 4
  description: 加水没过食材，中火烹制 1 小时
- number: 1
  description: 开锅加入包菜丁、红肠丁，搅拌均匀
- number: 2
  description: 中火烹制半小时
- number: 3
  description: 开盖加入剩余 15 g 盐，混合均匀后盛盘
tips: 番茄尽量不用新鲜番茄代替，番茄罐头+番茄膏的组合风味更足; 除了胡萝卜、洋葱、欧芹、牛肉是必备食材外，其余可自由搭配; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
