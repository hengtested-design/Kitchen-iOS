id: 10266
name: 懒人蛋挞
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 137
servings: 2
tags:
- 烤
cover: https://s.chuimg.com/懒人蛋挞/懒人蛋挞.jpeg
description: 这道甜品利用现成的蛋挞皮和蛋挞液，外皮酥香、内馅嫩滑，带有焦糖斑点，是经典粤式点心中最易上手的版本。主要成分鸡蛋和牛奶提供了优质蛋白质与钙质，适合作为家庭小点心。整个操作只需组装和烘烤，对完全零基础的新手也很友好，从预热烤箱到出炉约需 40 分钟。
ingredients:
- name: 蛋挞皮 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 蛋挞液约 10ml，到达挞皮的 4/5 最佳
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 烤箱 200 度，预热 10 分钟
- number: 2
  description: 在烤盘上放上蛋挞皮，蛋挞皮中倒入蛋挞液约 10ml，具体分量需要看蛋挞皮大小，通常倒入 4/5 即可
- number: 3
  description: 将烤盘放入烤箱内，上下火 190 度，烤 10 - 20 分。如果想快速烤出蛋挞液上的焦褐斑点，需要上火更高一些，通常是 200 - 210 度
- number: 4
  description: 蛋挞液烤出焦褐斑点，蛋挞皮完全蓬松冒油即可
tips: 操作时，可以根据焦褐斑大小适当调整时间，如果需要; 可以在蛋挞中加 10g 碎芝士，就是一道芝士蛋挞啦~; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
