steps:
- number: 1
  description: 把鸡翅洗净，用刀在每只鸡翅上划一刀，便于烹调时入味。
- number: 2
  description: 加料酒、生姜、少许盐、白胡椒粉、鸡精腌制20分钟左右
- number: 3
  description: 热锅冷油煎鸡翅
- number: 4
  description: 稍成金黄即可，不必煎脆煎焦
- number: 5
  description: 盛起 待用
- number: 6
  description: 改良版可乐鸡翅重点材料出现！！！用番茄代替酱油！将一只番茄洗净切碎
- number: 7
  description: 利用煎鸡翅剩下的油煎番茄
- number: 8
  description: 将番茄煎至酱即可
- number: 9
  description: 将刚才煎好的鸡翅放到番茄酱中
- number: 10
  description: 加少许热水（是热水！）将鸡翅翻面
- number: 11
  description: 加入少许盐、鸡精，撒上一些小番茄蜜饯，用它来代替白糖或冰糖。
- number: 12
  description: 加入一听易拉罐装可乐（百事或可口可乐都可以），盖上锅盖，小火
- number: 13
  description: 待可乐融入鸡翅，成酱状即可
- number: 14
  description: 垫上生菜，装盘
