id: 10267
name: 炸薯条
cuisine: 家常菜
difficulty: 2
duration: 25
calories: 1132
servings: 2
tags:
- 炸
cover: https://s.chuimg.com/炸薯条/炸薯条.jpeg
description: 炸薯条外酥里软，金黄咸香，属于广受欢迎的快餐小食。土豆提供碳水化合物和膳食纤维，但油炸或空气炸制后热量较高。使用半成品薯条和空气炸锅，操作简单，新手也能轻松上手。从预热到出锅，大约需要 25 分钟。
ingredients:
- name: 作为主食，1 人 1 顿 400g（以半成品为准）
  amount: 0
  unit: 适量
  isMain: false
- name: 作为小食，1 人 1 顿 1/4 主食质量+-50g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 开封大分量半成品薯条注意开口要小，可以有效减少长久储藏下薯条表面结霜。
- number: 1
  description: 插电，200℃预热 5 分钟。
- number: 2
  description: 预热的目的是为了确保放入食材的时候锅内温度已经处于烹饪所需温度。
- number: 3
  description: 注意，预热完再拿出薯条，不应等薯条软化后再炸制。
- number: 1
  description: 取出薯条放入空气炸锅，200℃20 分钟。
- number: 2
  description: 取出薯条的时候注意半成品薯条已经有油，所以要异步去做客户端内刀斯林的话需要使用夹持工具。
- number: 3
  description: 5~10 分钟时可以拿出锅体晃动使薯条受热均匀也防止粘连。
- number: 1
  description: 10 分钟~15 分钟时，拿出锅体，往已经干了的薯条表面喷 1 层面积为薯条表面积 2/3 的油。
- number: 1
  description: 喜欢脆薯条的，取出后拿着锅体跳舞让空气经过薯条表面后装盘；喜欢软薯条的直接装盘。配合蘸酱或浇上酱汁更佳。
tips: 番茄酱、蛋黄酱、蜂蜜芥末酱、[蒜香酱油](../../condiment/蒜香酱油.md)……炸薯条的晋级之路在于对酱料及酱料组合的探究。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
