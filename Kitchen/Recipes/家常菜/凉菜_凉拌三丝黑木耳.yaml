steps:
- number: 1
  description: 食材准备。
- number: 2
  description: 山药削皮，洗净切丝，胡萝卜洗净切丝。
- number: 3
  description: 紫甘蓝洗净切丝，过凉开水，沥干放碗中。
- number: 4
  description: 锅内加水，放入洗净黑木耳，煮熟捞出。
- number: 5
  description: 水再烧开，放入山药焯一下，开后捞出。
- number: 6
  description: 同样，胡萝卜也焯一下，开后捞出。
- number: 7
  description: 将黑木耳、紫甘蓝、山药、胡萝卜放在一起，加入盐。
- number: 8
  description: 再放入白醋，糖和鸡精，.搅拌一下。
- number: 9
  description: 最后放入麻油拌匀。
- number: 10
  description: 装盘即可食用。
