steps:
- number: 1
  description: 将锅洗净，放油烧热后下白糖小火炒糖色。
- number: 2
  description: 下入五花肉均匀裹上糖色。
- number: 3
  description: 下入酱油、姜片、八角炒匀,加入适量热水（以淹住材料为宜）开始焖。
- number: 4
  description: 焖至八成熟时放入土豆继续焖。
- number: 5
  description: 至土豆和五花肉软烂，汤汁浓稠时加盐调味即可。
