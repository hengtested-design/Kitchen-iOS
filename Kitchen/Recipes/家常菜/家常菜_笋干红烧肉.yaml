steps:
- number: 1
  description: 三层肉入开水锅焯去血水后切成1到2厘米见方的小块。
- number: 2
  description: 嫩笋干事先泡发好后洗净。
- number: 3
  description: 炒锅下油，加入白糖炒融化至起泡，下入肉块翻炒上色。
- number: 4
  description: 把肉移到砂锅里，加入适量开水，加入八角、桂皮、姜片、蒜瓣、酱油、料酒拌匀。
- number: 5
  description: 再加入笋干拌匀，大火烧开转中火慢慢炖。
- number: 6
  description: 炖至汤汁浓稠时下入少许盐、白糖、鸡精，略煮即可装盘。
