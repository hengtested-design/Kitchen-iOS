id: 10362
name: 凉拌金针菇
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 163
servings: 2
tags:
- 咸鲜
- 快手菜
- 凉拌
description: 凉拌金针菇是一道简单快捷的家常开胃凉菜，口感脆嫩爽滑，咸鲜微酸。金针菇富含膳食纤维和多种维生素，热量较低。制作全程只需焯烫和调味，对新手非常友好，忙碌时也能快速准备。从备菜到完成大约只需 10 分钟。
ingredients:
- name: 金针菇 150 g （约 1 小包）
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 2 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 醋 10 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 3 g（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 香油 5 ml（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒油 5 ml（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将 金针菇 根部切除，用清水冲洗干净，备用。
- number: 2
  description: 将 小葱 洗净，切成葱花，备用。
- number: 3
  description: 将 大蒜 去皮，切成蒜末，备用。
- number: 4
  description: 锅中加入 1000 ml 饮用水，大火烧开。
- number: 5
  description: 放入 金针菇，煮 **1-2 分钟**，至金针菇变软。
- number: 6
  description: 将 煮好的 金针菇 捞出，沥干水分，放入一个较大的碗中，备用。
- number: 7
  description: 在另一个干净的小碗中，加入 15 ml 生抽，10 ml 醋，3 g 白糖（可选），5 ml 香油（可选）。
- number: 8
  description: 加入切好的 大蒜末。
- number: 9
  description: 搅拌均匀，使 白糖 充分溶解，酱汁混合均匀。
- number: 10
  description: 将制作好的酱汁均匀淋在 金针菇 上。
- number: 11
  description: 撒上切好的 小葱花。
- number: 12
  description: 根据个人喜好，淋上 5 ml 辣椒油（可选）。
- number: 13
  description: 用 筷子 轻轻拌匀，即可食用。
tips: 金针菇焯水时间不宜过长，以免影响口感。; 酱汁的比例可以根据个人口味喜好进行调整。; 如果不喜欢吃辣，可以省略辣椒油。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
