tips: 炖煮时保证汤加入的时候是温热的; 炖煮时不要扣盖否则土豆会烂; 炖煮时时不时翻动避免糊底; 砂锅炖煮会更好吃，可以在炒锅里炒完倒到煮锅里炖，如果用砂锅开锅之前不要用大火避免裂开; 酱油总量不要太多，汤汁浓缩的时候会变咸，稀的时候稍微淡点没事，炖煮时候觉得不够也可以再加酱油; 不要用鸡精味精，会抢夺牛肉的鲜味; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
