id: 10246
name: 酱牛肉
cuisine: 家常菜
difficulty: 5
duration: 600
calories: 2265
servings: 2
tags:
- 炖
cover: https://s.chuimg.com/酱牛肉/酱牛肉.jpeg
description: 酱牛肉是一道北派家常冷荤，酱香浓郁，口感紧实不散，嚼劲十足。牛腱子肉富含优质蛋白和多种氨基酸，慢炖后更易消化吸收。制作过程不算复杂，但包含腌制、慢炖和长时间冷藏，对新手来说需要些耐心，从头到尾大约需要 10 小时。
ingredients:
- name: 牛腱子肉 2000 克
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 1 片
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 3 片
  amount: 0
  unit: 适量
  isMain: false
- name: 葱半根
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 桂皮 1 块
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 7-8 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒 15 粒
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 30ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 8 克
  amount: 0
  unit: 适量
  isMain: false
- name: 八角 4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 黄豆酱 15ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 牛腱子肉清洗干净，用清水浸泡 1 小时，去除血水
- number: 2
  description: 用牙签或者叉子在牛腱子肉表面扎孔，加料酒、花椒、姜片后，用保鲜膜紧密包裹容器，腌制 4-6 小时
- number: 3
  description: 牛腱子肉切成 8cm，不超过 10cm 的肉块
- number: 4
  description: 牛腱子肉放入锅中，加入冷水至水面没过牛肉，开锅至水沸腾开始计时，同时捞出浮沫。3 分钟后停火，捞出牛肉，用温水洗净
- number: 5
  description: 将洗净后的牛腱子肉放入砂锅或炖锅，加水没过牛腱子肉，开大火，放入除盐之外其他未使用的配料
- number: 6
  description: 水开之后，大火转为小火，持续加热 90 分钟，加盐
- number: 7
  description: 加盐后，继续小火 90 分钟（注：每 30 分钟确认水位线，要求至少达到牛肉面高度的 80%）
- number: 8
  description: 加热 180 分钟后，捞出牛腱子肉，捞出牛腱子肉，用保鲜膜紧密包裹，放入冰箱冷藏数小时
- number: 9
  description: 取出后沿牛肉纹路切片，上桌食用，其他牛腱子肉建议不切片冷藏
tips: 操作时，需要注意观察沸腾的水位线，如发现低于 2/3 的食材应加热水至没过食材（约每 30 分钟确认一次）。; 用保鲜膜紧密包裹牛肉，放入冰箱冷藏数小时，可以使得切片肉质紧实不散。; 用牙签或者叉子在牛肉表面扎孔可以破坏筋膜，便于入味。; [下厨房app中的食谱](http://www.xiachufang.com/recipe/106670199/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
