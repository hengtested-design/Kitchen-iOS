id: 10339
name: 蛋包饭
cuisine: 家常菜
difficulty: 3
duration: 25
calories: 695
servings: 2
tags:
- 酸甜
- 炒
description: 以嫩滑蛋皮包裹茄汁炒饭，口感丰富，酸甜开胃，是一道经典的日式家庭料理。富含蛋白质、碳水和多种维生素，营养均衡。包裹蛋皮需要一点技巧，但整体难度适中，新手也可尝试，从准备到完成约需 25 分钟。
ingredients:
- name: 鸡蛋 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 胡萝卜 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 火腿肠或鸡胸肉 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 玉米粒和青豆总共 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 米饭 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄酱 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 牛奶 10ml（与鸡蛋混合）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 洋葱、胡萝卜、火腿肠或鸡胸肉切成小丁，备用
- number: 2
  description: 热锅，锅中倒入 10ml 食用油，等待 10 秒加热
- number: 3
  description: 先放入洋葱丁翻炒 1 分钟，出香味后加入胡萝卜、玉米粒、青豆继续翻炒 2 分钟
- number: 4
  description: 加入火腿肠或鸡胸肉丁，炒至变色
- number: 5
  description: 加入米饭炒散后，加入番茄酱 20ml，翻炒均匀，炒饭完成，盛出备用
- number: 6
  description: 鸡蛋打散，加入 10ml 牛奶搅匀
- number: 7
  description: 锅中放入 5ml 食用油，倒入蛋液，轻晃锅底让蛋液均匀铺满锅面
- number: 8
  description: 用小火加热，待蛋液表面半熟状态时，将炒饭放入蛋液中央
- number: 9
  description: 用铲子将蛋皮折叠包住米饭，形成椭圆形状
- number: 10
  description: 用锅铲轻轻推至盘中，整理外形，可在表面挤上少量番茄酱装饰
tips: 炒饭用隔夜饭不易粘锅，口感更好。; 打蛋时加入牛奶可以让蛋皮更加嫩滑。; 操作蛋皮时火力需小，避免底部焦糊。; 如果不擅长包裹造型，也可以直接将炒饭铺盘后盖上蛋皮。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
