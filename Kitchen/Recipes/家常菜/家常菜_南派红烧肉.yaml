id: 10220
name: 南派红烧肉
cuisine: 家常菜
difficulty: 4
duration: 300
calories: 3248
servings: 2
tags:
- 炖
description: 这道红烧肉成菜色泽红亮，肥肉入口即化、瘦肉酥烂不柴，咸中带甜，是典型的南方甜口风味。五花肉提供优质蛋白和丰富的胶原蛋白，香辛料还能去腥暖胃。制作虽需熬糖色与慢炖，但每一步都拆解得清晰易懂，新手跟着操作也能成功，全程约 1.5 小时即可端上桌。
ingredients:
- name: 猪五花肉：1000g（约 2 斤）。*注：生肉烹饪后缩水脱脂严重，此分量最终出肉量约满足 2-3 人正常饭量。如仅 1 人食用，建议所有食材剂量减半。*
  amount: 0
  unit: 适量
  isMain: false
- name: 油：100-150ml，色拉油、猪油、花生油都可以
  amount: 0
  unit: 适量
  isMain: false
- name: 姜： 6 片
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱：约 30g（3-4 根），葱白切段备用
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜：约 25g（5-6 瓣），中间切开备用
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖：50g（约大拇指甲盖大小的碎单晶冰糖 15 块）。如果上一步炒糖色已经使用了 50g，此处的 50g 为炖煮时二次调味使用，可根据对"南派甜口"的接受度调整至 30g。
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖：30g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽：15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒：总量 30ml（其中 20ml 用于前期焯水去腥，10ml 用于后期炖煮提鲜）
  amount: 0
  unit: 适量
  isMain: false
- name: 凉水：没过食材的量即可，看锅大小准备
  amount: 0
  unit: 适量
  isMain: false
- name: 开水：没过食材的量即可，看锅大小准备
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶：4 片
  amount: 0
  unit: 适量
  isMain: false
- name: 八角：3 个
  amount: 0
  unit: 适量
  isMain: false
- name: 盐：2-3g
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒：10g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: '`猪五花肉`先不切小块，切成能放入锅中的大块（约 5–6cm 宽）即可'
- number: 2
  description: '`生姜`切片（每片厚度约 3mm ）'
- number: 3
  description: '`开水`烧开'
- number: 4
  description: '`凉水`自来水即可'
- number: 5
  description: '`小葱`小葱白色的部分`葱白`切成小段（小葱最佳，大葱也可以）'
- number: 6
  description: '`蒜`中间切开，不要拍扁，否则难以捞出以至最后`收汁`时影响味道'
- number: 7
  description: 请将辅料分为两个"预备包"：
- number: 8
  description: 凉水锅中放入五花肉大块，加入 **20ml 料酒** 与 **A包**（2 片姜、2 段葱段），煮 15 分钟去掉血腥，捞出来后洗干净；
- number: 9
  description: 将焯过水的五花肉捞出，稍微放凉（不烫手即可），切成边长约 **3cm × 3cm × 3cm** 的正方体块（焯水后肉质收紧，此时切块比生肉时更容易且成品大小更均匀。3cm 切块最终成品约为 2.5cm，是最适宜入口且容易烧透的尺寸）
- number: 10
  description: 另起锅炒[糖色](./../../condiment/简易版炒糖色.md)，注意：**在此菜谱中，请采用其中提到的"操作 2"来制作**，即在糖液起密集小泡时，迅速将 **B包**（生姜、葱白、蒜、花椒、八角、香叶）倒入锅中爆香。
- number: 11
  description: 爆出香味后（约 5-10 秒内），**先不要加开水**，而是立刻将焯过水的`五花肉`倒入锅中`大火`翻炒，让肉块均匀裹上糖色并煸炒出油脂。待闻到肉香后，再倒入开水至没过全部肉，盖上锅盖，转中小火炖煮 50 分钟-60 分钟（高压锅则为 40 分钟）；
- number: 12
  description: 加入 **10ml 料酒**；
- number: 13
  description: 盖上锅盖煮至沸腾后，每隔 25 分钟打开盖子将浮在表面的油和沫捞出；
- number: 14
  description: 当水的高度减至肉最高的高度与锅底高度的 3/5 时，转中火，并捞出除肉和水以外的所有辅料，开始收汁；
- number: 15
  description: 打开锅盖，待汤汁快没有的时粘稠状出锅（切记不可收干）；
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
