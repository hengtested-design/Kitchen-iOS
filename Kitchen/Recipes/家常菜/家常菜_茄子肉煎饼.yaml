id: 10336
name: 茄子肉煎饼
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 904
servings: 2
tags:
- 煎
cover: https://s.chuimg.com/茄子肉煎饼/茄子肉煎饼.jpeg
description: 这道家常煎饼融合了腊肉的咸香与茄子的软糯，外皮酥脆、内里绵润，是一道充满乡土风味的米粉主食。它富含碳水化合物和优质蛋白质，茄子还能提供膳食纤维和维生素，荤素搭配营养均衡。制作难度中等，需要掌握面糊稠度和煎制火候，但初学者跟着步骤操作也能成功。从备料到出锅大约需要 30 分钟。
steps:
- number: 1
  description: 将茄子去皮后切成片，将腊肉切成片，备用
- number: 2
  description: 依次向盆中加入 250g 米粉（大米研磨成的粉）、50g 面粉和 1 个鸡蛋
- number: 3
  description: 边用筷子搅拌，边加入清水（**清水用于调节粘稠度**），使米粉、面粉、鸡蛋混合成面糊,当面糊能够附着在茄片、肉片上而不掉落时停止加水，而后将所有茄片和肉片放入面糊中，用面糊充分包裹
- number: 4
  description: 平底锅加入食用油**10-30ml**，开小火
- number: 5
  description: 用筷子或勺子把裹了面糊的茄片、肉片放入锅中，先煎至两面金黄，再煎**3-6分钟**（**煎的过程中，食用油会变少，可再添加食用油**）
- number: 6
  description: 撒盐，翻炒均匀，起锅装盘
tips: '* 用小火煎; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
