steps:
- number: 1
  description: 炒锅到油爆香花椒，大料，香叶，辣椒。
- number: 2
  description: 放入焯烫过的五花肉翻炒。
- number: 3
  description: 加入冰糖。
- number: 4
  description: 继续炒至五花肉变透明。
- number: 5
  description: 加入老抽。
- number: 6
  description: 加入料酒翻炒均匀。
- number: 7
  description: 炒至肉出香。
- number: 8
  description: 加入清水大火煮上15分钟。
- number: 9
  description: 放入当归，党参。
- number: 10
  description: 放入红枣继续。
- number: 11
  description: 把栗子倒入煮上5分钟。
- number: 12
  description: 把所有材料倒入砂锅，加入鹌鹑蛋。
- number: 13
  description: 大火煮开，小火炖煮1·5个小时，汤汁半干加一点盐，鸡精调味关火。
