id: 10269
name: 空气炸锅羊排
cuisine: 家常菜
difficulty: 3
duration: 10
calories: 473
servings: 2
tags:
- 炸
cover: https://s.chuimg.com/空气炸锅羊排/空气炸锅羊排.jpeg
description: 这道菜做法超级懒人，用空气炸锅能逼出多余油脂，成品外焦里嫩、蒜香浓郁，风味主要取决于羊排本身品质。羊肉富含优质蛋白和铁、锌等微量元素，有助于温补气血、增强体质。烹饪难度适中，新手也能轻松上手，实际动手操作仅需 10 分钟，算上腌制总时长约 40 分钟就能端上餐桌。
ingredients:
- name: 羊排 1 片约 160g
  amount: 0
  unit: 适量
  isMain: false
- name: 黑椒混合牛排调味料 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜蓉酱 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 黄油 1 小盒 10g 或 烧烤料 20g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 羊排放入碗中清水洗净血水
- number: 2
  description: 羊排用厨房纸吸干水分，双面抹上黑椒混合调味料、蒜蓉酱，静置腌制 20 分钟
- number: 3
  description: 锡纸碗放上烤架，羊排放在烤架上，撒上罗勒碎，黄油或烧烤料放在羊排上，空气炸锅 180° 10 分钟
- number: 4
  description: 羊排翻面，撒上罗勒碎，黄油（从锡纸碗里舀上来）或烧烤料放在羊排上，空气炸锅 180° 5 分钟（可以视个人喜好加一点时间，这里写的是不会焦的时间）
tips: 推荐购买温控比较好的空气炸锅，不然可能会糊; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
