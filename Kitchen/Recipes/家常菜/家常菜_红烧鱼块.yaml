steps:
- number: 1
  description: 鲤鱼洗净切块，放入料酒，盐，胡椒粉腌制1小时。
- number: 2
  description: 腌好的鱼块裹蛋液。
- number: 3
  description: 热油下锅炸鱼块。
- number: 4
  description: 炸至鱼块金黄后捞出。
- number: 5
  description: 炒锅倒油炸香葱，姜，八角。
- number: 6
  description: 倒入热水，放入盐，老抽，少许白糖。
- number: 7
  description: 放入鱼块小火炖至入味即可。
- number: 8
  description: 来碗米饭就是一顿不错的午餐了。
