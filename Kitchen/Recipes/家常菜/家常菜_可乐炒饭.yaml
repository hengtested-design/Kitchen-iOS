id: 10302
name: 可乐炒饭
cuisine: 家常菜
difficulty: 3
duration: 20
calories: 913
servings: 2
tags:
- 炒
description: 这道菜以可乐替代糖调味，带来独特的焦香微甜风味，酱汁浓郁包裹粒粒米饭，属于创意家常炒饭。鸡蛋和火腿肠提供优质蛋白质与能量，搭配主食米饭，营养均衡管饱。操作步骤直观，适合新手尝试，一般 大约 20 分钟便可端上桌。
ingredients:
- name: 米饭 200 g
  amount: 0
  unit: 适量
  isMain: false
- name: 可乐 160 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 3 个
  amount: 0
  unit: 适量
  isMain: false
- name: 火腿肠 20-100 g
  amount: 0
  unit: 适量
  isMain: false
- name: 油 25 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 7.5 ml（如果使用无糖可乐，追加 5 ml，如果不使用豆瓣酱，追加 5 ml）
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 7.5 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 5 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 葱花 5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 胡椒粉 1 g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将锅烧热后，加入 25 ml 油，放两个鸡蛋，煎至底部完全凝固
- number: 2
  description: 翻面，煎至两面完全凝固
- number: 3
  description: 关火，将鸡蛋取出，剪成 2-5 cm² 的小块后放回锅中（也可以直接用锅铲铲碎）
- number: 4
  description: 重新开火，倒入可乐、生抽、老抽、豆瓣酱、蚝油，搅拌均匀
- number: 5
  description: 加热到锅内液体剩 1/3，倒入米饭和火腿肠翻炒
- number: 6
  description: 翻炒均匀后，改小火，锅内食物中心挖一个洞，打入 1 个鸡蛋，盖上锅盖，焖 2 分钟
- number: 7
  description: 开盖翻炒至第三颗鸡蛋熟透，撒上葱花和胡椒粉，出锅
tips: 含糖可乐口感更好; 如果喜欢干一点，多炒一会儿; 如果嫌麻烦，可以在第一步直接放 3 个鸡蛋，取消挖洞打另一个鸡蛋的步骤; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
