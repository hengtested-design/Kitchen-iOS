id: 10133
name: 冬瓜茶
cuisine: 家常菜
difficulty: 2
duration: 300
calories: 296
servings: 2
description: 冬瓜茶是一款清爽解暑的传统饮品，口感甘甜柔和，带有冬瓜特有的清香，冰镇后风味更佳。冬瓜本身低热量、富含水分，搭配冰糖熬制，能补充能量、生津止渴。制作不复杂，但对新手而言需要一些耐心，全程大约需要 4 到 5 小时。
ingredients:
- name: 冬瓜 1000g
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 300g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: '**准备冬瓜**：将冬瓜去皮，去籽，切成小块（每块不超过 4cm）。'
- number: 2
  description: '**加入冰糖**：冬瓜加入冰糖，搅拌均匀，盖上保鲜膜放冰箱冷藏 2 小时以上。'
- number: 3
  description: '**煮冬瓜**： 此时冬瓜出了很多水, 倒入锅中 大火煮开，然后转中小火慢慢熬制 1~2 个小时，中途多搅拌防止糊锅。'
- number: 4
  description: '**过滤冬瓜茶**：使用过滤网将煮好的冬瓜茶液过滤，取出冬瓜块，只保留茶液。'
- number: 5
  description: '**冷却**：将冬瓜茶液放凉后，倒入干净的容器中，放入冰箱冷藏即可。'
- number: 6
  description: '**享用**: 熬好的冬瓜茶液是浓缩汁，根据个人喜好添加水或其他饮品，冷热皆宜。'
tips: '**口感调整**：冰糖的用量可以调整，以达到个人喜好的甜度。; **保存方法**：冷藏保存，建议 1 周内喝完。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
