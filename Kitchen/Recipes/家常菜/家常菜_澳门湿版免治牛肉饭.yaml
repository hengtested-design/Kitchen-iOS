id: 10204
name: 澳门湿版免治牛肉饭
cuisine: 家常菜
difficulty: 2
duration: 30
calories: 1011
servings: 2
cover: https://s.chuimg.com/澳门湿版免治牛肉饭/澳门湿版免治牛肉饭.jpeg
description: 这是一道经典的澳门葡式风味快餐，牛肉碎嫩滑咸香，裹着浓郁酱汁和半熟蛋液，拌入米饭后口感油润诱人。牛肉末提供优质蛋白质，搭配鸡蛋和洋葱，营养均衡管饱。操作步骤简单易上手，特别适合新手尝试，从备料到出锅大约只需 30 分钟。
ingredients:
- name: 牛肉末 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 半个
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1 个（用于制作水波蛋或半熟煎蛋）
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 3 汤匙（1 汤匙用于腌制，2 汤匙用于料汁）
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 半汤匙
  amount: 0
  unit: 适量
  isMain: false
- name: 番茄酱 2 汤匙
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 半汤匙
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 1 汤匙
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉 1 汤匙
  amount: 0
  unit: 适量
  isMain: false
- name: 清水 50ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将 200g 牛肉末放入碗中，加入 1 汤匙生抽、半汤匙白糖和 2g 黑胡椒，搅拌均匀，**等待腌制 10 分钟**。
- number: 2
  description: 将半个洋葱切成小丁，备用。
- number: 3
  description: 调制料汁：在碗中加入 2 汤匙生抽、2 汤匙番茄酱、1 汤匙料酒、1 汤匙淀粉、半汤匙老抽和 50ml 清水，搅拌均匀备用。
- number: 4
  description: 另起一锅，制作一个水波蛋或半熟煎蛋，备用。
- number: 5
  description: 热锅，放入 10g 黄油。待黄油融化后，放入洋葱丁，小火煎熟至散发香味。
- number: 6
  description: 加入腌制好的牛肉末，与洋葱一起翻炒至牛肉变色。
- number: 7
  description: 倒入调好的料汁，撒上 2g 黑胡椒，继续炒制直至汤汁变粘稠后关火。
- number: 8
  description: 将炒好的免治牛肉浇在热米饭上，放上提前准备好的水波蛋或半熟煎蛋。
- number: 9
  description: （可选）表面撒上 5g 切好的小葱花作装饰。
tips: 如果没有黄油，使用普通食用油也可以，但黄油会增加独特的奶香味。; 吃的时候将半熟的蛋黄戳破，与牛肉和米饭拌匀食用，口感最佳。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
