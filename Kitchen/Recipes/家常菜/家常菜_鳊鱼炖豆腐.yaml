id: 10076
name: 鳊鱼炖豆腐
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 524
servings: 2
tags:
- 咸鲜
- 炖
cover: https://s.chuimg.com/鳊鱼炖豆腐/鳊鱼炖豆腐.jpeg
description: 鳊鱼炖豆腐是一道家常红烧菜，鱼肉鲜嫩入味，豆腐饱吸汤汁，咸鲜微辣。鳊鱼富含优质蛋白和不饱和脂肪酸，豆腐则提供植物蛋白和钙质，搭配起来营养均衡。制作难度适中，煎鱼时稍需耐心防粘，整体步骤清晰，新手也能尝试。从备料到完成约需 40 分钟。
ingredients:
- name: 鳊鱼：550 克
  amount: 0
  unit: 适量
  isMain: false
- name: 老豆腐：400 克
  amount: 0
  unit: 适量
  isMain: false
- name: 姜：5 片
  amount: 0
  unit: 适量
  isMain: false
- name: 葱：半根（50 克）
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜：4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽：2ml（不太喜欢重口的可以不放）
  amount: 0
  unit: 适量
  isMain: false
- name: 桂皮：1 块
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖：5 块
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒：4-6 个（根据个人口味选择）
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒：5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽：4ml
  amount: 0
  unit: 适量
  isMain: false
- name: 盐：5-8 克（根据个人口味选择）
  amount: 0
  unit: 适量
  isMain: false
- name: 八角：1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶：1-3 片
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油：10ml
  amount: 0
