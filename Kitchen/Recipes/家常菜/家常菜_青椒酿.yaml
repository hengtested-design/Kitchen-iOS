id: 10249
name: 青椒酿
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 1403
servings: 2
tags:
- 咸鲜
- 下饭菜
- 煮
cover: https://s.chuimg.com/青椒酿/青椒酿.jpeg
description: 这道广西经典家常菜以青椒包裹调好味的肉馅或虾滑，煎至表皮起皱呈虎皮色后焖煮入味，青椒清香与馅料鲜美交融，咸香微辣，十分下饭。猪肉和虾仁提供优质蛋白质，青椒富含维生素 C，营养均衡。制作需要一点耐心酿馅，但整体流程清晰，跟着步骤操作一般 30 分钟就能完成。
ingredients:
- name: 青椒 8 个（约 400g，选笔直肉厚的尖椒）
  amount: 0
  unit: 适量
  isMain: false
- name: 猪肉馅 250g（肥瘦比例 3:7）
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 2 根（约 30g）
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 1 小块（约 10g）
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 30ml（其中 15ml 调馅，15ml 调酱汁）
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 3g
  amount: 0
  unit: 适量
  isMain: false
