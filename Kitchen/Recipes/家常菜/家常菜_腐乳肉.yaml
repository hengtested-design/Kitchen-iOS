id: 10227
name: 腐乳肉
cuisine: 家常菜
difficulty: 5
duration: 60
calories: 1190
servings: 2
tags:
- 咸鲜
- 煮
description: 这是一道经典的江南家常菜，五花肉与红腐乳同炖，色泽红亮如琥珀，肉质酥烂到入口即化，咸甜交织的酒香与豆香在舌尖层层展开。富含优质蛋白质和 B 族维生素，经慢火煨煮后更易消化。制作流程需要耐心把控火候和收汁，对新手来说有一定挑战，预计制作时长约 1 小时。
ingredients:
- name: 带皮五花肉 400 g
  amount: 0
  unit: 适量
  isMain: false
- name: 红腐乳 30 g（约 2 块）
  amount: 0
  unit: 适量
  isMain: false
- name: 腐乳汁 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 25 g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 5 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 15 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 葱白 15 g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱花 5 g
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 10 g
  amount: 0
  unit: 适量
  isMain: false
- name: 清水 500 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 10 ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 五花肉切成长宽 2.5 cm 的小块
- number: 2
  description: 冷水放料酒姜片，五花肉放入开火慢慢加入到水沸腾后捞出
- number: 3
  description: 玫瑰腐乳块和腐乳汁碾成泥，加冰糖、老抽调成酱汁
- number: 4
  description: 热锅冷油爆香葱姜，下肉块煸到金黄
- number: 5
  description: 倒入腐乳酱炒匀加热水焖煮
- number: 6
  description: 小火慢炖 40 分钟
- number: 7
  description: 大火收汁，看到汤汁冒浓稠鱼眼泡时关火
tips: 建议用单晶冰糖; 腐乳自带咸鲜，不用额外放盐; 大火收汁时要不断晃动锅体避免粘底; 参考资料：[【步骤图】腐乳肉的做法_腐乳肉的做法步骤_菜谱_下厨房](https://www.xiachufang.com/recipe/102507/); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
