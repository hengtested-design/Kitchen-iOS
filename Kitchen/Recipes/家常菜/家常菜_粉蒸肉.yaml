id: 10216
name: 粉蒸肉
cuisine: 家常菜
difficulty: 4
duration: 90
calories: 1606
servings: 2
tags:
- 蒸
description: 粉蒸肉是一道经典中式蒸菜，香味浓郁，口感软糯，属于广泛流传的家常风味。五花肉提供优质蛋白质和脂肪，搭配土豆等根茎蔬菜，营养均衡。此菜适合有一定烹饪经验的人士制作，从准备到完成大约需要 90 分钟。
ingredients:
- name: 五花肉 250g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒸肉米粉 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 7.5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 7.5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 郫县豆瓣酱 5g（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 姜末 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜末 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 2.5g
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆或南瓜 150g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒸锅用水 1000ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将五花肉洗净，切成长约 5cm、宽约 3cm、厚度约 0.5cm 的肉片
- number: 2
  description: 将姜、蒜切成颗粒直径不大于 1mm 的细末
- number: 3
  description: 取一大碗，放入切好的五花肉、15ml 生抽、10ml 老抽、15ml 料酒、10g 郫县豆瓣酱、10g 姜末、10g 蒜末、5g 白砂糖
- number: 4
  description: 用筷子搅拌均匀后，盖上保鲜膜，室温(20°C - 25°C)静置腌制 30 分钟
- number: 5
  description: 腌制完成后，加入 100g 蒸肉米粉，继续翻拌 2 分钟，确保每片肉都均匀裹粉
- number: 6
  description: 土豆去皮，切片厚度控制在 0.8cm，片面积约为 5cm x 5cm，重量控制在 300g
- number: 7
  description: 在直径 20cm 的深碗底部铺满土豆片，尽量无重叠
- number: 8
  description: 将拌好粉的五花肉均匀铺在土豆片上，压实
- number: 9
  description: 蒸锅中加入 2000ml 清水，开火加热至水面持续冒泡(100°C)
- number: 10
  description: 将装好食材的碗放入蒸锅内，盖好锅盖
- number: 11
  description: 保持中火蒸 60 分钟（火力保持在可持续沸腾的程度，约 600W 热功率）
- number: 12
  description: 时间结束后，用筷子插入肉块中央，若能轻松穿透并无明显阻力，则表明蒸熟
- number: 13
  description: 若未达到此状态，则继续加热 10 - 15 分钟，直至肉质软烂，油脂渗出
- number: 14
  description: 取出盛盘，即可食用
tips: 如需自制米粉，可将大米 150g 放入锅中，中小火炒至微黄色（约 8 分钟），再加入干辣椒 1g、花椒 1g、八角 0.5g，炒香后用料理机打碎，过筛备用; 蒸制期间如水量低于锅底高度 1cm，应立即补充 500ml 热水（90°C 以上），以维持蒸汽充足; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
