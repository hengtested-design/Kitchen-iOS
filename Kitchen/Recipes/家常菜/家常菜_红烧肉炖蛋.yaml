id: 10010
name: 红烧肉炖蛋
cuisine: 家常菜
difficulty: 2
duration: 60
calories: 310
servings: 2
tags:
- 咸鲜
- 烧
cover: https://i01piccdn.sogoucdn.com/ab61c57521dd5818
ingredients:
- name: 五花肉
  amount: 500
  unit: 克
  isMain: true
- name: 鹌鹑蛋
  amount: 24
  unit: 枚
  isMain: true
- name: 植物油
  amount: 20
  unit: 克
  isMain: false
- name: 冰糖
  amount: 1
  unit: 小把
  isMain: false
- name: 白酒
  amount: 20
  unit: 克
  isMain: false
- name: 盐
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜
  amount: 0
  unit: 数瓣
  isMain: false
- name: 姜
  amount: 1
  unit: 块
  isMain: false
- name: 八角
  amount: 2
  unit: 颗
  isMain: false
steps:
- number: 1
  description: 带皮五花肉清洗干净
- number: 2
  description: 切成两公分厚的块
- number: 3
  description: 炒锅中倒一点点油，放入一小把冰糖
- number: 4
  description: 中小火炒出焦糖色
- number: 5
  description: 将五花肉块倒入锅中翻炒，一定要中小火噢
- number: 6
  description: 将肉块中的油脂煸出来，多余的油可以倒掉，也可以用来炒菜不浪费
- number: 7
  description: 将八角、大蒜、姜块入锅中，继续煸炒
- number: 8
  description: 倒入适量的白酒，白酒比料酒更适合放这道菜里
- number: 9
  description: 翻炒均匀，让酒挥发，带走肉腥气
- number: 10
  description: 沿着锅边倒入热水，不要倒在肉块上，这样焦糖色就能很好地保留在肉块表面了，也不要翻动肉块；盖盖子，小火焖烧30分钟
- number: 11
  description: 鹌鹑蛋煮熟剥皮
- number: 12
  description: 将鹌鹑蛋倒入锅中，再放少许盐，混合均匀，继续小火焖烧30分钟左右
- number: 13
  description: 收汁，留少量的汤汁，附着在肉块和鹌鹑蛋表面，好看有滋味
- number: 14
  description: 色泽金红，好诱人
- number: 15
  description: 好香
_source: cookbook-kg
