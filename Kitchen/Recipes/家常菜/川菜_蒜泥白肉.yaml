steps:
- number: 1
  description: 五花肉冷水下锅，加葱姜料酒煮 20 分钟
- number: 2
  description: 捞出过冷水，切薄片摆盘
  tips: 肉越薄越好吃
- number: 3
  description: 大蒜捣成泥，加生抽、香醋、红油、糖调成酱汁
- number: 4
  description: 淋在肉片上即可
