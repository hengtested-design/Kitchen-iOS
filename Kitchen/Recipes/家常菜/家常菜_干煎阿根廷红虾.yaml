id: 10053
name: 干煎阿根廷红虾
cuisine: 家常菜
difficulty: 3
duration: 20
calories: 309
servings: 2
tags:
- 咸鲜
- 快手菜
- 煎
cover: https://s.chuimg.com/干煎阿根廷红虾/干煎阿根廷红虾.jpeg
description: 一道鲜美诱人的海鲜快手菜，煎制后的阿根廷红虾肉质白嫩，口感鲜甜浓郁，虾壳酥香。富含碘、磷和虾青素等微量元素，有助于增强免疫力、保护心脏并降低胆固醇。难度适中，需要掌握火候和翻面技巧，但步骤清晰，新手按操作来也能成功。预计 大约 20 分钟即可完成。
ingredients:
- name: 阿根廷红虾 2-3 只
  amount: 0
  unit: 适量
  isMain: false
- name: 海盐 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 黑胡椒（研磨装）
  amount: 0
  unit: 适量
  isMain: false
- name: 白葡萄酒 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 1ml
  amount: 0
  unit: 适量
  isMain: false
- name: 香菜 3 片
  amount: 0
  unit: 适量
  isMain: false
- name: 柠檬 1 片
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 大蒜 10g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 阿根廷红虾解冻，最好是提前 1 天从速冻取出放到冷藏里自然解冻，能更好保持风味和口感。可买已经开背去虾线的，节省了不少时间
- number: 2
  description: 解冻好的红虾洗净擦干备用，注意这里一定要沥干水分，赶时间可以用厨房用纸吸干水分
- number: 3
  description: 生姜切片，洋葱切小方块，香菜洗干净后，叶茎分离，把香菜叶切碎，大蒜压碎切成小块碎末
- number: 4
  description: 大火热锅，热锅后倒入两调羹橄榄油，等油温升高后，放入生姜片，洋葱块和香菜茎煸炒
- number: 5
  description: 约 1 分钟后取出生姜，洋葱和香菜茎，弃用
- number: 6
  description: 调中大火，放入红虾开始煎，注意所有虾需要单面都完整接触平底锅，煎约 2 分钟，同时给每只虾刷上一层油
- number: 7
  description: 待底面虾壳有微微焦黄时翻面，并撒入大蒜碎末，轻微晃动平底锅使得受热均匀
- number: 8
  description: 约 1 分钟后添加 20ml 白葡萄酒
- number: 9
  description: 再煎 1 分钟后调中小火，均匀撒上一层盐和黑胡椒
- number: 10
  description: 给每只虾滴上一滴生抽
- number: 11
  description: 撒上香菜叶，装盘
- number: 12
  description: 切好柠檬片，摆放到盘边即可
tips: 柠檬可提升虾的口感，但偏酸，可以根据喜好添加，也可以不用; 趁热吃; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
