id: 10202
name: 湖南家常红烧肉
cuisine: 家常菜
difficulty: 3
duration: 60
calories: 1348
servings: 2
tags:
- 炖
cover: https://s.chuimg.com/湖南家常红烧肉/湖南家常红烧肉.jpeg
description: 湖南家常红烧肉是一道湘味浓郁的家常菜，五花肉经慢炖后肥而不腻、入口软糯，咸香中带着微辣回甘。富含优质蛋白和脂肪，能为身体提供充足能量。制作需要一些耐心，对新手有一定挑战，但按步骤操作不难掌握，预计全程约 1 小时。
ingredients:
- name: 五花肉：500g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油：10g
  amount: 0
  unit: 适量
  isMain: false
- name: 香叶 5 片
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 3 片
  amount: 0
  unit: 适量
  isMain: false
- name: 桂皮 1 小块
  amount: 0
  unit: 适量
  isMain: false
- name: 冰糖 6 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 20 克
  amount: 0
