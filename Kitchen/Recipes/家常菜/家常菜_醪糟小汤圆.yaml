id: 10346
name: 醪糟小汤圆
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 957
servings: 2
description: 醪糟小汤圆是一道香甜软糯的传统中式甜品，酒酿的微酸与糯米的绵滑交融，暖胃又舒心。它富含碳水化合物和少量 B 族维生素，能快速补充能量，也有助促进血液循环。做法毫无门槛，对新手特别友好，从烧水到出锅只需约 15 分钟，是一碗随时都能轻松完成的家常甜汤。
steps:
- number: 1
  description: 将水倒入锅中并煮沸
- number: 2
  description: 放入小汤圆煮 8 分钟
- number: 3
  description: 放入醪糟和枸杞再煮 2 分钟
- number: 4
  description: 盛入碗中根据个人口味加入白糖并搅拌均匀
- number: 5
  description: 吃
tips: '* 白糖的用量根据个人口味更改; * 若喜欢更浓的口感可以减少 100 毫升内的水; * 若喜欢软点的枸杞口感，可以将枸杞和小汤圆同时煮; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
