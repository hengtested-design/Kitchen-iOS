id: 10165
name: 商芝肉
cuisine: 家常菜
difficulty: 5
duration: 300
calories: 1621
servings: 2
description: 商芝肉是陕西商县的传统风味菜，色泽红润，质地软嫩，肥而不腻，带有商芝独特的清香。猪肉提供优质蛋白和脂肪，蕨类蔬菜商芝则增添了膳食纤维和多种微量元素。这道菜工序繁琐，对刀工和火候均有要求，适合有一定烹饪基础的人挑战。从备料到成菜，全程大约需要 2.5 小时。
