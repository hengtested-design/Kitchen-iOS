steps:
- number: 1
  description: 安康鱼清理干净。
- number: 2
  description: 安康鱼清理干净。
- number: 3
  description: 斩块儿。
- number: 4
  description: 沸水中焯一下捞出沥水备用。
- number: 5
  description: 另起锅，倒入少许油，炒香葱姜蒜。
- number: 6
  description: 沸起酱油。
- number: 7
  description: 加入适量热水，调入盐，白糖，醋，尝下味道，倒入鱼块儿。
- number: 8
  description: 小火炖至汤收到一半的时候，再尝一下，根据情况调整味道，之后大火收汤就可以了，汤不要收太干，鱼汤也是很下饭的。
