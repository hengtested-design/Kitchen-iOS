id: 10278
name: 排骨苦瓜汤
cuisine: 家常菜
difficulty: 4
duration: 240
calories: 905
servings: 2
tags:
- 咸鲜
description: 排骨苦瓜汤是一道汤色清亮、鲜美回甘的粤式家常汤品，排骨软烂、苦瓜清热解腻。富含蛋白质与维生素，虾皮还能补充钙质。处理过程需要焯水去腥、仔细去除苦瓜瓤，对新手有一定挑战，但借助电压力锅可大幅简化；传统慢炖需 2 至 4 小时，建议提前 4 小时准备，压力锅则只需约 1 小时。
ingredients:
- name: 排骨  250g 到 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 苦瓜 100g 到 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 虾皮 5g 到 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 5~10g（可选，用于焯水时去腥）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 排骨洗净，切到约 4cm ±2cm * 3 ± 2cm 的小块（如没有剁排骨的工具，可以求助摊主）
- number: 2
  description: 炒锅倒入冷水 700ml 和排骨一起加热至煮沸，关火捞出排骨
- number: 3
  description: 苦瓜中间切为两半，清除干净内部的种子和苦瓜瓤，切为 0.5 ± 0.3 cm 的苦瓜条，洗净
tips: 可以使用其他带有鲜味的食材代替虾皮，如瑶柱; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
