id: 10279
name: 昂刺鱼豆腐汤
cuisine: 家常菜
difficulty: 3
duration: 40
calories: 321
servings: 2
tags:
- 咸鲜
- 煎
cover: https://s.chuimg.com/昂刺鱼豆腐汤/昂刺鱼豆腐汤.jpeg
description: 昂刺鱼豆腐汤是一道口感鲜嫩、汤白味浓的家常汤品，鱼肉刺少肉嫩，豆腐滑润，带有胡椒的微辛暖意，适合各个年龄层。鱼富含优质蛋白质，搭配豆腐能补充钙质，营养均衡好吸收。制作过程不算复杂，只要注意去腥和煎鱼防粘，一般初学者也可以上手，预计制作时长约 40 分钟。
steps:
- number: 1
  description: 鱼处理好后洗净，（特别注意肚内的血丝、不洗干净会有腥味），放入大碗中，倒入料酒、10g 姜片、5g 盐，腌制 15 分钟
- number: 2
  description: 豆腐切块，放入凉水浸泡 5 分钟，捞出备用
- number: 3
  description: 煎鱼前，先用生姜片擦一下锅防止粘锅，倒入油（油量为 15ml * 鱼的条数 ），烧热后放入鱼煎 2~3 分钟，期间需要晃动一下鱼，防止粘底，且需要翻一次身
- number: 4
  description: 待鱼全部煎好之后，倒入开水、5ml 料酒、姜片，小火转至大火，盖上锅盖、大火煮 10 分钟（水要稍微多一些，后面会蒸发掉一些）
- number: 5
  description: 见汤变白后倒入准备好的豆腐，调中火再煮 5 分钟，加入 10g 盐、3g 胡椒粉调味，最后撒上葱花出锅
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
