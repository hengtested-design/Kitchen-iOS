id: 10372
name: 拔丝土豆
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 1158
servings: 2
cover: https://s.chuimg.com/拔丝土豆/拔丝土豆.jpeg
description: 拔丝土豆是一道经典的鲁菜，成菜色泽金黄、糖丝细长，外脆里糯、香甜可口。土豆富含碳水化合物和维生素 C，能快速补充能量。这道菜有一定难度，新手需注意熬糖火候，避免翻沙或焦苦。从备料到出锅，预计制作时长约 30 分钟。
steps:
- number: 1
  description: 土豆去皮，切均匀的小块。放入淀粉（不加水）搅拌，使得淀粉覆盖土豆表面
- number: 2
  description: 起锅烧油，放入土豆块，缓缓翻滚煎炸 5-7 分钟 ，直至筷子可以插进土豆
- number: 3
  description: 取出土豆，放入大碗备用
- number: 4
  description: 锅中加入水、白砂糖，沿着一个方向慢慢搅动白砂糖，直到白砂糖颜色变成褐色
- number: 5
  description: 重新倒入土豆，翻炒 30 S 后 出锅
- number: 6
  description: 土豆盛盘，散上芝麻
tips: '* 土豆煎炸不可太熟透，否则在拔丝端盘时不容易定型，影响美观; * 对于使用剩余的食用油，可以考虑重新收集到油壶。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
