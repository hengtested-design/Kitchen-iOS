id: 10135
name: 印度奶茶
cuisine: 家常菜
difficulty: 2
duration: 10
calories: 135
servings: 2
tags:
- 煮
description: 印度奶茶是一道充满异域风情的家常饮品，以红茶、牛奶和多种香料现煮而成，口感浓郁顺滑，带有生姜、豆蔻、肉桂交织的辛香暖意。牛奶提供优质蛋白和钙质，香料则有助于暖身驱寒、促进消化。制作过程简单直观，对新手友好，从备料到入口只需大约 10 分钟。
ingredients:
- name: 水 120ml
  amount: 0
  unit: 适量
  isMain: false
- name: 全脂牛奶 120ml
  amount: 0
  unit: 适量
  isMain: false
- name: 红茶 8g（约 2 茶匙）
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 5g（约 1cm 一块），拍碎
  amount: 0
  unit: 适量
  isMain: false
- name: 绿色小豆蔻 2 颗，拍开
  amount: 0
  unit: 适量
  isMain: false
- name: 肉桂棒 1 小段（约 2cm）
  amount: 0
  unit: 适量
  isMain: false
- name: 丁香 2 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 黑胡椒粒 2 颗，拍碎
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 10-15g（根据个人口味调整）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将生姜拍碎（不用切太碎，拍开即可释放姜汁）
- number: 2
  description: 将小豆蔻用刀背拍开，露出里面的籽
- number: 3
  description: 将黑胡椒粒拍碎
- number: 4
  description: 在小奶锅中倒入 120ml 水
- number: 5
  description: 放入拍碎的生姜、小豆蔻、肉桂棒、丁香、黑胡椒粒
- number: 6
  description: 大火煮沸后转小火，**煮 2 分钟**，让香料的味道充分释出
- number: 7
  description: 加入红茶 8g，继续小火**煮 2 分钟**，直至*茶汤颜色变深*
- number: 8
  description: 倒入全脂牛奶 120ml
- number: 9
  description: 中火加热，**注意观察**，当奶茶开始*冒泡上升*时立即转小火（牛奶极易溢出）
- number: 10
  description: 小火**煮 2-3 分钟**，期间可以将锅提起倒回（反复提拉 3-4 次），使茶汤与牛奶充分融合
- number: 11
  description: 加入糖，搅拌溶解
- number: 12
  description: 关火
- number: 13
  description: 用滤网过滤到茶盏中，去除茶叶和香料残渣
- number: 14
  description: 趁热饮用
tips: CTC 红茶（Crush, Tear, Curl 工艺制成）是印度奶茶的最佳选择，因为其颗粒细碎，能在短时间内释放浓厚的茶味。中国的祁门红茶或滇红也可以替代。; 牛奶和水的比例可以根据个人喜好调整。更浓的奶茶用牛奶多水少，更清爽的用水多牛奶少。; 生姜是印度奶茶的灵魂，不建议省略。; 印度人喜欢将奶茶煮得很甜，如果不习惯可以减少糖量。; 在印度，Chai 不仅是饮品，更是一种社交文化。朋友聚会、商务谈判、甚至初次见面，都从一份 Chai 开始。据统计印度每天消耗超过 10 亿份茶。; 印度街头奶茶摊(Chai Wala)通常使用陶土杯(Kulhad)盛茶，赋予茶汤一种独特的泥土芬芳。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
