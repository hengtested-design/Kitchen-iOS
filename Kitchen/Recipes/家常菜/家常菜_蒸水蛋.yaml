id: 10097
name: 蒸水蛋
cuisine: 家常菜
difficulty: 2
duration: 15
calories: 143
servings: 2
tags:
- 咸鲜
- 蒸
description: 这是一道以滑嫩如布丁的口感和清雅鲜美的风味见长的家常菜，南北通吃，北方常亲切地称其为“鸡蛋糕儿”。鸡蛋富含优质蛋白和卵磷脂，是日常补充营养的便捷之选。做法只需掌握蛋水比例和小火慢蒸的诀窍，对新手非常友好，从准备到出锅通常 大约 15 分钟就能完成。
ingredients:
- name: 鸡蛋两只
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 热水 260ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡蛋打入碗中，打散
- number: 2
  description: 取其他容器，倒入 1.5 倍（半个蛋壳为 0.5 倍水）于蛋液的温水（温度 20~30），将盐倒入水中化开
- number: 3
  description: 将盐水倒入鸡蛋液中，顺时针或逆时针单方向搅拌均匀，气泡之类的可以用舀出丢弃，过筛则口感更加。
- number: 4
  description: 使用锡纸包裹盛蛋液的碗（或用盘子盖住），置入提前带盖并加入大约 3cm 深度水的锅中
- number: 5
  description: 中火烧至水开，转最小的火继续蒸 4 分钟
tips: 一般出锅稍晾即可食用，保留鸡蛋原香的终极口感; 也可加入蒸鱼豉油，葱花香油作为佐料。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
