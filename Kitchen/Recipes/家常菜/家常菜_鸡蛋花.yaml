id: 10418
name: 鸡蛋花
cuisine: 家常菜
difficulty: 1
duration: 5
calories: 107
servings: 2
tags:
- 快手菜
description: 一道简单易做的家常食疗汤饮，有甜咸两种风味，口感柔滑嫩爽，属于民间润喉小方。富含优质蛋白质和卵磷脂，易于消化吸收，可缓解喉咙干痒不适。制作极简单，初学者看一遍就能上手，从烧水到完成大约只需 5 分钟。
ingredients:
- name: 鸡蛋 1 个 （去壳后约 50 g）
  amount: 0
  unit: 适量
  isMain: false
- name: 沸水 100 - 150 ml
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 5 - 10 g （如制作甜口）
  amount: 0
  unit: 适量
  isMain: false
- name: 食盐 1 - 2 g （如制作咸口）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将鸡蛋打入碗中。
- number: 2
  description: 使用筷子或搅拌器，顺着一个方向搅打蛋液，直至蛋清与蛋黄完全混合均匀，颜色一致。（此过程约需 1 - 2 分钟）
- number: 3
  description: 将糖或盐等调味料加入蛋液中，略微搅匀。
- number: 4
  description: 准备刚烧开的、100 ℃ 的沸水。
- number: 5
  description: '**一边用筷子快速搅拌碗中的蛋液，一边将沸水以细流状冲入蛋液中**。确保沸水与蛋液充分混合。'
- number: 6
  description: 持续搅拌片刻，直至蛋液被完全烫熟，形成均匀的淡黄色蛋花。
tips: 为了防止生鸡蛋中可能含有的沙门氏菌，建议使用刚烧开的、100 ℃ 的滚水，瞬间将鸡蛋液完全烫熟。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
