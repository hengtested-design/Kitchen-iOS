steps:
- number: 1
  description: 花鲢一条去鳞和内脏。
- number: 2
  description: 把收拾好的鱼洗净切成大块。
- number: 3
  description: 鱼块放碗中放盐、料酒、腌制下倒入淀粉。
- number: 4
  description: 把淀粉均匀的裹在鱼块上。
- number: 5
  description: 炒锅倒入油烧热、下入裹淀粉的鱼块炸至金黄。
- number: 6
  description: 炸好的鱼块、金黄的。
- number: 7
  description: 葱、姜、蒜、香菜。
- number: 8
  description: 葱、姜、蒜改刀切片、香菜切段。
- number: 9
  description: 干红椒、豆瓣酱、花椒、大料。
- number: 10
  description: 炒锅到底油、爆香花椒、大料、炒香豆瓣酱、在放葱、姜、蒜片。
- number: 11
  description: 炒香底料后兑入开水、放一点糖。
- number: 12
  description: 水开倒入炸好的鱼块、大火烧开、点入老抽、小火烧一会、放味精、大火收一下汁就可以了、出锅装盘撒上香菜。
