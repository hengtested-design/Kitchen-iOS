id: 10085
name: 手抓饼
cuisine: 家常菜
difficulty: 2
duration: 40
calories: 1050
servings: 2
description: 手抓饼外酥里软，层次分明，是深受喜爱的家常面点。饼皮用半烫面制作，柔韧有嚼劲，搭配鸡蛋和蔬菜，营养均衡。做法对新手很友好，从和面到出锅大约只需 40 分钟，非常适合忙碌的早晨。
ingredients:
- name: 面粉 200 克
  amount: 0
  unit: 适量
  isMain: false
- name: 开水 100 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 冷水 50 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 15 毫升
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 3 克
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 生菜 30 克
  amount: 0
  unit: 适量
  isMain: false
- name: 火腿 30 克
  amount: 0
  unit: 适量
  isMain: false
- name: 芝士片 1 片
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 面粉放入碗中，加入开水搅拌成絮状，再加入冷水揉成光滑面团，覆盖湿布静置 20 分钟。
- number: 2
  description: 面团分成每份约 100 克，搓圆，擀成薄片。
- number: 3
  description: 表面均匀涂抹食用油，撒上盐，卷成蜗牛状，松弛 10 分钟。
- number: 4
  description: 面团再次擀成薄饼，厚度均匀。
- number: 5
  description: 热锅中倒入油，小火煎至两面金黄起泡。
- number: 6
  description: 煎好的饼依次铺入煎蛋、生菜、火腿、芝士片等配料，卷起即可。
tips: 使用开水与冷水混合和面，有助于提升饼皮柔韧度。; 面团醒发时间不宜少于 20 分钟，否则不易擀薄。; 可根据个人口味增减配料，建议配料总重控制在 100 克以内。; 剩余生饼皮可冷藏保存 24 小时，使用时回温擀平即可。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
