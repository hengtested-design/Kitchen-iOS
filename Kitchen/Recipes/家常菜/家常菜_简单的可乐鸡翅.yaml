steps:
- number: 1
  description: 鸡翅用刀划两刀方便入味。
- number: 2
  description: 放入生姜丝，料酒，生抽，胡椒粉腌两小时。（也可以不用腌那么久）
- number: 3
  description: 点火坐锅，锅内放少许油。
- number: 4
  description: 油七分热的时候放入腌好的鸡翅炒至两面金黄，然后下入姜丝与葱白炒出香味。
- number: 5
  description: 然后倒入可乐（可乐一定要淹住鸡翅）大火烧开。
- number: 6
  description: 大概二十几分钟就可乐就烧干了，然后出锅。
