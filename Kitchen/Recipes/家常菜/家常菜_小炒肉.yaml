id: 10175
name: 小炒肉
cuisine: 家常菜
difficulty: 3
duration: 30
calories: 2873
servings: 2
tags:
- 咸鲜
- 下饭菜
- 炒
description: 小炒肉是一道香辣下饭的经典湘式家常菜，五花肉片焦香不腻，搭配鲜辣椒与豆豉、豆瓣酱炒出浓郁酱香。富含优质蛋白质和脂肪，辣椒能提供丰富的维生素 C，有助开胃暖身。制作难度中等，适合有一定基础的新手尝试，需注意肉片腌制和火候把控。从备料到出锅大约需要 1 小时，其中腌制 30 分钟，炒制过程约 15 分钟。
ingredients:
- name: 五花肉 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 朝天椒 4 条
  amount: 0
  unit: 适量
  isMain: false
- name: 小米椒 4 颗
  amount: 0
  unit: 适量
  isMain: false
- name: 豆豉 10g，根据个人口味加减 ±5g
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 10g，根据个人口味加减 ±5g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 1-2g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 0.5-1 根
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜 2 瓣
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 15ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 五花肉切片
- number: 2
  description: 把肉放入器皿内，加入淀粉、老抽、盐搅拌腌制半小时
- number: 3
  description: 葱切段
- number: 4
  description: 小米椒、朝天椒斜刀切好
- number: 5
  description: 热锅、倒油
- number: 6
  description: 油热后加入五花肉煸炒。炒至变色后盛出来
- number: 7
  description: 向锅中加蒜，煸出香味，加入豆豉，翻炒均匀
- number: 8
  description: 加入豆瓣酱翻炒均匀
- number: 9
  description: 加入炒好的五花肉继续的翻炒均匀
- number: 10
  description: 加入小米椒、朝天椒、葱段翻炒 40 秒
- number: 11
  description: 出锅。
