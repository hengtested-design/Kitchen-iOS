steps:
- number: 1
  description: 鲅鱼2块。
- number: 2
  description: 将鲅鱼切成小块，放入盆中，加盐、料酒、葱、姜腌20分钟。
- number: 3
  description: 锅中油烧热，放入鲅鱼炸至两面金黄。
- number: 4
  description: 炸好的鲅鱼。
- number: 5
  description: 葱切段，姜切片，八角一个。
- number: 6
  description: 锅中另放油，放葱段、姜、八角翻炒。
- number: 7
  description: 倒入料汁（酱油、醋、糖、蚝油、加水调成）。
- number: 8
  description: 放入鲅鱼。
- number: 9
  description: 加水，大火烧开，转小火闷10分钟，汤汁剩不多加适量盐盛出装盘即可。
