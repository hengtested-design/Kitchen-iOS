cover: https://s.chuimg.com/炒凉粉/炒凉粉.jpeg
description: 炒凉粉是一道山西、陕西地区的特色小吃，入口滑嫩，咸香微辣，带着蒜香和酱香。凉粉主要由淀粉制成，能提供丰富的碳水化合物，快速补充能量。烹饪难度适中，适合有一定基础的新手尝试，全程制作大约需要 15 分钟。
ingredients:
- name: 凉粉 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 玉米油 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜末 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 香葱 15g
  amount: 0
  unit: 适量
  isMain: false
