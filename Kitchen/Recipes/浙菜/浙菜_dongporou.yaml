steps:
- number: 1
  description: 五花肉切方块，用棉绳十字绑好
- number: 2
  description: 砂锅底铺姜片、葱段，放上肉块
- number: 3
  description: 放上八角、桂皮，冰糖敲碎放在肉上
- number: 4
  description: 加入生抽、老抽、料酒
  tips: 不加水
- number: 5
  description: 大火烧开转小火炖2小时
  tips: 中途不要揭盖
- number: 6
  description: 肉块装入小碗，淋上原汁蒸30分钟
tips: 全程不加水，靠酱汁炖熟
