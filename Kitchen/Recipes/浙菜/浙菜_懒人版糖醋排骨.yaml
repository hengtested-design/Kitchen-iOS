id: 10061
name: 懒人版糖醋排骨
cuisine: 浙菜
difficulty: 1
duration: 60
calories: 280
servings: 2
tags:
- 酸甜
- 煮
cover: https://i02piccdn.sogoucdn.com/624490e44b60d48a
ingredients:
- name: 排骨
  amount: 0
  unit: 适量
  isMain: true
- name: 水
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒
  amount: 0
  unit: 适量
  isMain: false
- name: 糖
  amount: 0
  unit: 适量
  isMain: false
- name: 醋
  amount: 0
  unit: 适量
  isMain: false
- name: 酱油
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 排骨切块，洗净，在开水里焯一下去掉血水，然后放到温水里洗一下沥干水分待用。
- number: 2
  description: 按一斤排骨，1大勺料酒，2大勺糖，3大勺醋，4大勺酱油，5大勺水或高汤的比例调成料汁，用筷子搅一搅让糖能溶解。这个就是标题上说的12345的原则了，按照此比例，做出来的味道刚刚好。
- number: 3
  description: 锅里放少许油，把沥干水分的排骨放到热油里炒一下，喜欢吃干香的可以多炒一下，喜欢吃软嫩的就不要炒太久，否则会太干。
- number: 4
  description: 然后加入上述2中调好的料汁，大火烧开后，改中小火慢慢煮40分钟到一个小时，看排骨切的大小，等排骨都熟了以后，再开大火收汁。我煮了大概1个小时里面汤汁还很多，不过已经入味了，有时间的话可以等到汤汁完全收干，如果喜欢还可以勾一点儿芡来收汁。
- number: 5
  description: 起锅装盘洒上一些熟芝麻粒就可以开吃了，是不是很简单。
_source: cookbook-kg
