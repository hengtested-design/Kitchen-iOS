steps:
- number: 1
  description: 排骨洗净冷水下锅焯水5分钟沥出
- number: 2
  description: 重新下入锅中、倒入适量清水、姜片、葱段、3勺盐、煮30分钟、
- number: 3
  description: 煮至软烂沥干水份
- number: 4
  description: 放入淀粉中均匀的裹上淀粉
- number: 5
  description: 4成热下锅炸
- number: 6
