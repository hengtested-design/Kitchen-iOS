steps:
- number: 1
  description: 排骨切块，焯水去血沫
  tips: 冷水下锅
- number: 2
  description: 锅中放油，加冰糖炒至融化变色
  tips: 小火慢炒
- number: 3
  description: 下排骨翻炒上色
  tips: 均匀裹上糖色
- number: 4
  description: 加开水没过排骨，放入调料
  tips: 一定要用开水
- number: 5
  description: 大火烧开转小火炖30分钟
  tips: 注意水量
- number: 6
  description: 大火收汁，加白醋
  tips: 醋要最后放
- number: 7
  description: 撒白芝麻装盘
  tips: 增香
tips: 糖醋比例约为1:1，根据个人口味调整
