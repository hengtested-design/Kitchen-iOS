steps:
- number: 1
  description: 准备好原料。
- number: 2
  description: 把排骨放入水中洗干净。
- number: 3
  description: 准备好葱和姜。
- number: 4
  description: 把葱和姜切碎。
- number: 5
  description: 锅中入开水加入洗好的排骨，烫开。
- number: 6
  description: 捞出排骨，放入一个装有清水的盆中。
- number: 7
  description: 再捞出，放入大碗中备用。
- number: 8
  description: 容器中按比例放入两份酱油、两份生抽、两份糖、一份醋。
- number: 9
  description: 锅烧热加入油，放入葱和姜炸香。
- number: 10
  description: 倒入排骨炒到微黄色。
- number: 11
  description: 加入图8，再炒。
- number: 12
  description: 炒干汁时，倒入开水盖上盖子用中火炒烧到烂（中间看看缺水要加水）。
- number: 13
  description: 锅中还有少量汁时加入盐、味精、胡椒粉拌匀出锅。
