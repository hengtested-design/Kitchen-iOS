id: 10103
name: 油泼辣子
cuisine: 川菜
difficulty: 3
duration: 10
calories: 1854
servings: 2
cover: https://s.chuimg.com/油泼辣子/油泼辣子.jpeg
description: 一道香辣扑鼻的陕西风味调味料，红油润泽，芝麻蒜香交织，入口辣而不燥、回味绵长。辣椒富含维生素 C 与辣椒素，能增进食欲、暖身驱寒。制作过程需掌握油温，对新手稍有挑战，但按部就班即可成功。全程约 10 分钟完成，是家常拌菜拌面的点睛之笔。
ingredients:
- name: 蒜头 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒面 100 克
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 5 克
  amount: 0
  unit: 适量
  isMain: false
- name: 熟白芝麻 15 克
  amount: 0
  unit: 适量
  isMain: false
- name: 小米椒 1 个
  amount: 0
  unit: 适量
  isMain: false
- name: 花生油 150 毫升 （可用菜籽油替换）
  amount: 0
  unit: 适量
  isMain: false
- name: 五香粉 10 克（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 草寇 1 个（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 3-5 根（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 其他配料：八角(1)、花椒（20-50 粒都可，看个人口味）、香叶（2-3 片）、白芷（2-3 片）、姜片（大拇指粗细的姜切片）（可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 30 克
  amount: 0
  unit: 适量
  isMain: false
- name: 白醋 5 ml（大概就是小铁勺子的量）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 拿出蒜头掰 2 个`小蒜头`去皮
- number: 2
  description: 拿出砧板剁碎`小蒜头`、`小米椒`
- number: 3
  description: 拿出碗倒入`花生油`
- number: 4
  description: 油热放入`其他配料`和`小葱`,等到香料变焦，捞出扔掉
- number: 5
  description: 拿出铁锅将碗内的油放入加热 2 分钟（菜籽油烧至冒烟）
- number: 6
  description: 此时是空碗
- number: 7
  description: 往空碗加入`干辣椒面`、`白芝麻`、`蒜末`、`小米椒`、`盐`、`五香粉`、`草寇`作为"调料"
- number: 8
  description: 关火将油温冷却至 `210` 摄氏度
- number: 9
  description: 将锅内热油倒入碗内并用勺子搅拌即可（可以在 `165` 摄氏度时加入同样"调料"的碗最后进行混合进行增辣）
- number: 10
  description: 倒入热油稍微搅拌后放入白醋，此时会重新沸腾。继续进行搅拌，白醋增香。
- number: 11
  description: 油泼辣子冷却到温热放白糖和味精，白糖可以使辣味柔和，不会那么地呛口
tips: 五香粉、草寇作为"调料"加入，可以增加香味，使油泼辣子更香; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
