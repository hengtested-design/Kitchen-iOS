steps:
- number: 1
  description: 猪肉、水青菜、豆瓣酱、料酒、淀粉、盐、干辣椒、花椒、葱、肉汤或水、酱油、糖、蒜沫、姜沫
- number: 2
  description: '材料准备好。: 2'
