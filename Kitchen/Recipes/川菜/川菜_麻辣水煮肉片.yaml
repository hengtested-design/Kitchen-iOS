- number: 8
  description: '锅里放油，加入姜蒜沫和豆瓣酱炒出红油。: 8'
- number: 9
  description: '加入水或者高汤。: 9'
- number: 10
  description: '加入之前腌制好的肉片用筷子迅速搅拌开。: 10'
- number: 11
  description: '煮开后倒入之前码好青菜的碗中。: 11'
- number: 12
  description: '把之前准备好的辣椒沫和花椒放入锅里炸香。: 12'
- number: 13
  description: '铺在碗最上面，最后锅里再放入适当的油，热了以后浇到辣椒沫和花椒上面，即可出红油，这道菜就可以开吃啦: 13'
