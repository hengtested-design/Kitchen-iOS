steps:
- number: 1
  description: 原料图如图所示。
- number: 2
  description: 鱼段去骨和鱼腩，取肉备用。
- number: 3
  description: 鱼从尾部开始片成鱼片，淘洗干净，用盐一茶匙，胡椒粉一茶匙，蛋清一个，食用油半汤匙，鸡精半茶匙腌渍十分钟。
- number: 4
  description: 黄芪和枸杞用开水泡五分钟备用。
- number: 5
  description: 鱼片拌上半汤匙淀粉备用。
- number: 6
  description: 锅里放油炒香葱姜，把鱼骨和鱼腩放进去炒一下。
- number: 7
  description: 兑入黄芪和枸杞泡的水烧开。
- number: 8
  description: 调入盐和胡椒粉，下入豆芽煮熟。
- number: 9
  description: 碗里铺上生菜，豆芽备用。
- number: 10
  description: 鱼片分份下入汤里，不要一下子都放进去。大火烧，鱼片定型即可捞出。
- number: 11
  description: 鱼片捞出在碗里，锅里的汤用滤网过滤倒入碗里。
- number: 12
  description: 锅里放油，冷油下辣椒和花椒。
- number: 13
  description: 辣椒和花椒变微红就捞出来放在碗上面。
- number: 14
  description: 锅里的油继续熬，冒青烟后，关火，默数三秒，倒在鱼片上。
