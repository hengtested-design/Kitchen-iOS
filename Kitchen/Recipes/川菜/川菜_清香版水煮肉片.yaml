steps:
- number: 1
  description: 蒜子切米，姜切菱形片，小米辣切圈，蒜苗切粒，连枝爆花椒洗净待用
- number: 2
  description: 里脊肉切片，用蛋清、玉米淀粉、啤酒抓匀，腌制30分钟，生菜去跟去烂叶洗净待用
- number: 3
  description: 坐锅起油，下姜蒜、小米辣、蒜苗粒、花椒爆香
- number: 4
  description: 下辣椒红油、蒜蓉辣酱炒出红油
- number: 5
  description: 下高汤，大火煮沸，下味素、盐调味
- number: 6
  description: 下生菜叶，烫30秒捞起，铺在碗底
- number: 7
  description: 下肉片，划散，煮3分钟
- number: 8
  description: 将煮好的肉片铺在生菜上，撒蒜米、小米辣、蒜苗粒、花椒，锅内烧热油，淋在香料上激出香味即可
