  description: 里脊肉切丝，加盐、淀粉腌制10分钟
  tips: 切丝要细
- number: 2
  description: 木耳、胡萝卜、青椒切丝备用
- number: 3
  description: 调鱼香汁：生抽、醋、糖、淀粉、清水调匀
- number: 4
  description: 锅中倒油，下肉丝炒散盛出
- number: 5
  description: 下豆瓣酱炒香，加蔬菜丝翻炒
- number: 6
  description: 倒入肉丝和鱼香汁，翻炒均匀
tips: 鱼香汁比例：生抽:醋:糖 = 1:1:1
