id: 10210
name: 甜辣烤全翅
cuisine: 川菜
difficulty: 3
duration: 30
calories: 775
servings: 2
tags:
- 炸
description: 这道甜辣烤全翅利用空气炸锅烹制，外皮微焦、内里多汁，甜中带辣的风味很受欢迎。鸡肉富含优质蛋白质，用空气炸代替油炸大幅减少了油脂，吃起来负担更轻。制作流程清晰明了，只需提前腌制并中途翻面一次，对新手也比较友好。从处理食材到出锅大约需要 3 个小时，大部分是静置腌制的时间，实际操作并不繁琐。
ingredients:
- name: 鸡全翅 4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 45ml
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 15ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜粉 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 胡椒粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 甜椒粉 10g
  amount: 0
  unit: 适量
