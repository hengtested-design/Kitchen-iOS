id: 10174
name: 宫保鸡丁
cuisine: 川菜
difficulty: 4
duration: 300
calories: 1790
servings: 2
tags:
- 酸甜
- 下饭菜
cover: https://s.chuimg.com/宫保鸡丁/宫保鸡丁.jpeg
description: 这道川味名菜以糊辣荔枝味见长，小酸甜中透着干辣椒与花椒的香气，鸡丁嫩滑、花生酥脆，口感层次丰富。富含优质蛋白和不饱和脂肪酸，开胃下饭。做法分成简易和进阶两版，对新手比较友好，提前规划好腌制时间即可。从备料到出锅大约需要 1.5 小时。
ingredients:
- name: 必须配料
  amount: 0
  unit: 适量
  isMain: false
- name: 手枪腿（或者鸡胸脯肉） = 1 支（约 350g）
  amount: 0
  unit: 适量
  isMain: false
- name: 大葱 180g）
  amount: 1
  unit: 适量
  isMain: false
- name: 熟花生
  amount: 150
  unit: g
  isMain: true
- name: 姜片
  amount: 10
  unit: g
  isMain: true
- name: 干辣椒（或者二荆条） = 10g（若选择二荆条，则需要大约 4 支）
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽酱油
  amount: 10
  unit: g
