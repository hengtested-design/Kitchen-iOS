steps:
- number: 1
  description: 肉丝用蛋清，胡椒粉腌渍。
- number: 2
  description: 笋切丝焯水煮六分钟（腌笋处理方法），香菇胡萝卜切丝。葱姜蒜剁碎。
- number: 3
  description: 腌好的肉再抓上干淀粉，七成热油滑至发白。
- number: 4
  description: 小火炒剁椒和郫县豆瓣，炒出红油。
- number: 5
  description: 倒入肉丝炒均匀。
- number: 6
  description: 倒入其他配料，翻炒均匀，放生抽一汤勺，老抽半汤勺，糖两茶匙，兑高汤一碗。
- number: 7
  description: 大火烧开根据自己的口味调入盐，这时候别调咸了，收汁后味道还要重。
- number: 8
  description: 小火焖十分钟，大火收汁水淀粉勾芡，放点味精即可。
