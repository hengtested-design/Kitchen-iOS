id: 10256
name: 鱼香茄子
cuisine: 川菜
difficulty: 3
duration: 30
calories: 579
servings: 2
tags:
- 酸甜
- 下饭菜
- 炸
cover: https://s.chuimg.com/鱼香茄子/鱼香茄子.jpeg
description: 鱼香茄子是一道经典的川味家常菜，酸甜微辣，茄子软糯吸汁，非常下饭。茄子富含膳食纤维和多种维生素，搭配肉末能补充蛋白质。制作难度中等，需要掌握炸茄子和调味技巧，新手稍加练习也能成功。从备料到出锅大约需要 30 分钟。
ingredients:
- name: 茄子 2 根
  amount: 0
  unit: 适量
  isMain: false
- name: 肉末 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 3-5g
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 5-10g
  amount: 0
  unit: 适量
  isMain: false
- name: 味精 5g
  amount: 0
  unit: 适量
  isMain: false
