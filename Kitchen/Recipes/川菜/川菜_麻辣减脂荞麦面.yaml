id: 10354
name: 麻辣减脂荞麦面
cuisine: 川菜
difficulty: 2
duration: 20
calories: 790
servings: 2
tags:
- 麻辣
- 咸鲜
description: 麻辣汤底融合了火锅底料与花生酱、牛奶，口感浓郁顺滑，带有鲜明麻辣风味。搭配高纤维荞麦面与新鲜蔬菜，低卡饱腹，适合减脂期享用。做法毫无难度，无需厨艺基础，全程约 20 分钟即可端锅开吃。
ingredients:
- name: 半干荞麦面 100g
  amount: 0
  unit: 适量
  isMain: false
- name: 娃娃菜 8 片（共 150g）
  amount: 0
  unit: 适量
  isMain: false
- name: 生菜 6 片（共 80g）
  amount: 0
  unit: 适量
  isMain: false
- name: 火锅底料 25g
  amount: 0
  unit: 适量
  isMain: false
- name: 花生酱 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 全脂牛奶 150ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 6ml
  amount: 0
  unit: 适量
  isMain: false
- name: 辣椒油 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 醋 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒油 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 水 500ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 娃娃菜、生菜洗好，备用
- number: 2
  description: 锅内倒入 500ml 水，开大火，将荞麦面和娃娃菜放进去，等待水沸腾
- number: 3
  description: 水沸腾后，转小火，加入火锅底料、花生酱、牛奶、生抽、辣椒油，水开后煮 5 分钟
- number: 4
  description: 加入生菜，再煮 2 分钟
- number: 5
  description: 加入醋、花椒油，关火，直接端着小锅开吃。
tips: '* 一定要选半干荞麦面，口感最好; * 可以随意添加其他东西，比如火锅丸、蛋饺等; * 火锅底料、花生酱、牛奶一定要加，口味三大巨头; * 如果不能吃酸，可以不加醋; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
