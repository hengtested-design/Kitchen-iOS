id: 10167
name: 回锅肉
cuisine: 川菜
difficulty: 4
duration: 40
calories: 997
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/回锅肉/回锅肉.jpeg
description: 回锅肉是四川传统名菜，以二刀肉或五花肉为主料，成菜色泽红亮，肥肉透明微卷、瘦肉干香不柴，口感肥而不腻，咸鲜微辣，带有蒜苗与豆瓣酱的复合香气。猪肉富含优质蛋白和必需脂肪酸，搭配青红椒、蒜苗可补充维生素。这道菜步骤稍多，包含煮、切、煸炒，对火候和刀工有一定要求，但按流程操作新手也能成功，预计全程耗时约 40 分钟。
ingredients:
- name: 五花肉的用量为 0.5 斤/男人 0.3 斤/女人 （正宗回锅肉使用二刀肉[俗称：臀尖]制作，肉质坚实，肥瘦合适）
  amount: 0
  unit: 适量
  isMain: false
- name: 小葱 2 棵
  amount: 0
  unit: 适量
  isMain: false
- name: 生姜 10-40g
  amount: 0
  unit: 适量
  isMain: false
- name: 青红椒（根据受辣程度选择, 0-30g）*注：不建议使用肉厚的菜椒
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜苗 1 把
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 味精 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 5ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 锅烧热，用手将五花肉紧紧压在锅上炙皮
- number: 2
  description: 用钢丝球把皮刷干净，至黑色部分碳化部分被完全去除，不刷干净会有苦味
- number: 3
  description: 将五花肉放入锅中，放入能淹没五花肉的冷水，放入生姜片、料酒和小葱（取 2 棵小葱打结）
- number: 4
  description: 开大火煮，水开后撇去浮沫，继续煮 15 分钟，煮至瘦肉部分可以用筷子轻松刺穿
- number: 1
  description: 青红椒切圈
- number: 2
  description: 蒜苗切段
- number: 3
  description: 生姜切小薄片
- number: 4
  description: 将 5ml 豆瓣酱和 5ml 生抽提前混合
- number: 1
  description: 将煮熟的五花肉捞出放入冷水晾凉
- number: 2
  description: 擦干五花肉的水，切成上肥下瘦的 2mm 的薄片（切厚了口感不好，而且很油）
- number: 1
  description: 锅烧热，放入一层底油滑锅
- number: 2
  description: 放入五花肉煸炒至肥肉透明，肉片微卷（欲称起灯盏窝），二刀肉效果最佳。
- number: 3
  description: 倒入豆瓣生抽混合物，5g 味精翻炒 15 秒
- number: 4
  description: 放入青红椒圈和小姜片，放入另 5ml 豆瓣酱翻炒 30 秒
- number: 5
  description: 放入蒜苗翻炒 60 秒
- number: 6
  description: 出锅
- number: 1
  description: 选用冰冻五花肉常量放置 0.5 小时 或者鲜五花肉放冰箱冷藏 1 个小时，切成 2-5 mm 薄片
- number: 2
  description: 开中火，辣椒放过锅中干煸 30-45 秒后取出
- number: 3
  description: 锅烧热，放入一层底油滑锅，放入姜片煸炒 15 秒
- number: 4
  description: 倒入五花肉，间隔 10 S 翻炒一次，待五花肉出现焦黄色（翻炒时间越久五花肉口感越硬）
- number: 5
  description: 倒入之前干煸过的辣椒、10ml 豆瓣酱，生抽调味，继续翻炒 60 秒
- number: 6
  description: 倒入切成段的蒜苗翻炒 10 秒
- number: 7
  description: 出锅
tips: 不喜欢蒜苗可以换成洋葱或者其他蔬菜，但是要注意蔬菜的易熟程度将蔬菜提前炒至，不然会出现蔬菜半生不熟的情况; 如果回锅肉比较大块可以切成 5 厘米见方的块，五花肉煮至筷子稍微用力即可插入猪皮即可; 回锅肉过冷水晾凉后肉质会更紧致; 回锅肉擦干水是为了避免炒至的时候爆油溅伤; 回锅肉切记不要切厚了，不然很腻; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
