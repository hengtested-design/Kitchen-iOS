id: 10087
name: 水煮玉米
cuisine: 川菜
difficulty: 2
duration: 15
calories: 108
servings: 2
tags:
- 咸鲜
- 快手菜
- 煮
description: 水煮玉米是一道家常快手菜，口感清甜软糯。新鲜玉米带皮煮制，保留原香，加入盐和糖更能提味。它富含膳食纤维、维生素与碳水化合物，能为身体提供饱足感。做法极其简单，新手也能轻松上手，从准备到上桌只需大约 15 分钟。
ingredients:
- name: 一个带皮玉米
  amount: 0
  unit: 适量
  isMain: false
- name: 淹过玉米约半节指头的水
  amount: 0
  unit: 适量
  isMain: false
- name: 煮玉米的时候，开始和淡盐水，差不多 2 克盐加 50ml 的水
  amount: 0
  unit: 适量
  isMain: false
- name: 根据口味选择加或者不加糖（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将新鲜玉米剥去外皮，剩部分玉米皮入锅
- number: 2
  description: 加入淹过玉米约半节指头的水，加盐和糖
- number: 3
  description: 水煮开之后转至小火，加盖继续煮 15-20 分钟，玉米煮久点没事。
- number: 4
  description: 煮熟后沥干水分，冷却后食用。
