steps:
- number: 1
  description: 原料图
- number: 2
  description: 鱼清洗干净，肚里的黑色清干净，鱼的左右的两头各切一刀，抽出白色的筋
- number: 3
  description: 开水中倒入用盐水腌过的豆芽，待水再开豆芽捞起冲凉水
- number: 4
  description: 脆脆的豆芽待用
- number: 5
  description: 鱼剔除鱼骨，肉切薄片，鱼骨和鱼头鱼尾斩断，鱼肉片和鱼骨分别加入盐、生抽、花椒油、辣椒油、自制麻辣粉、剁碎的郫县豆瓣、姜片、嫩肉粉、花生油，拌匀等30分钟入味
- number: 6
  description: 炒锅里放油，加入姜、葱、切碎的豆瓣，爆香
- number: 7
  description: 加适量水烧开
- number: 8
  description: 放入鱼骨煮10分钟
- number: 9
  description: 放入豆芽煮一分钟
- number: 10
  description: 鱼骨和豆芽捞起待用
- number: 11
  description: 单独烧一锅清水，加盐，烧开
- number: 12
  description: 鱼片放入，迅速散开，待水再开捞出放进煮鱼骨的锅里
- number: 13
  description: 煮一分钟，连同汤一起倒进装鱼骨和豆芽的容器里
- number: 14
  description: 已经可以吃的半成品了
- number: 15
  description: 炒锅里放油，多一点，三成热下干辣椒和花椒，中火炸香
- number: 16
  description: 炸好的干辣椒和花椒连同油一起浇入鱼里，随着哗啦啦的声音，香气飘满屋
