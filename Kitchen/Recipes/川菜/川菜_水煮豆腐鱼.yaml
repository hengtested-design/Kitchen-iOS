steps:
- number: 1
  description: 白鲢鱼一条，去鳞去内脏清洗干净，用刀逐片将鱼肉片成薄薄的鱼片，鱼头对开，鱼骨斩块
- number: 2
  description: 生姜切成粒
- number: 3
  description: 片好的鱼片用姜，料酒，盐，豆瓣酱拌匀腌制起来备用
- number: 4
  description: 大蒜，大葱切段，泡椒切碎
- number: 5
  description: 炒锅放入菜籽油，下入花椒和辣椒段炸香，捞出剁碎末备用
- number: 6
  description: 炒锅放油，加入豆瓣酱，大蒜，姜泡椒碎炒出红油
- number: 7
  description: 加入肉汤或者清水，同时放入打好的葱结，放入鱼头和鱼骨烧开
- number: 8
  description: 水开后，用筷子逐片将鱼片下锅
- number: 9
  description: 在将豆腐下锅调入适量的盐，小火焖炖15分钟煮熟倒入容器
- number: 10
  description: 另取一锅，加入食用油烧热
- number: 11
  description: 将煮好的鱼片倒入容器后，上面撒上炸好的辣椒碎和花椒碎、青花椒粉，将烧好的热油倒入蒜碎和花椒碎上，即可食用
