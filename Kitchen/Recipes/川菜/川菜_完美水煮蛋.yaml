id: 10080
name: 完美水煮蛋
cuisine: 川菜
difficulty: 2
duration: 35
calories: 86
servings: 2
tags:
- 煮
cover: https://s.chuimg.com/breakfast/完美水煮蛋.jpeg
description: 这是一道通过科学家研发的循环水煮法制成的鸡蛋，蛋黄绵密细腻，蛋白均匀凝固，口感层次分明。它保留了更多营养素，多酚含量比传统煮法高 23%，蛋白质丰富。制作难度较高，需精准控温并反复转移，预计制作时长约 35 分钟。
ingredients:
- name: 鸡蛋 1 个（约 60g ）
  amount: 0
  unit: 适量
  isMain: false
- name: 100°C 沸水 1500ml
  amount: 0
  unit: 适量
  isMain: false
- name: 30°C 温水 1500ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 准备两锅水： A 锅维持 100°C 沸水， B 锅维持 30°C 温水
- number: 2
  description: 用漏勺将鸡蛋放入 A 锅，启动定时器
- number: 3
  description: 精准**每 2 分钟**将鸡蛋转移至另一锅水
- number: 4
  description: 重复转移操作共 16 次（总时长 32 分钟）
- number: 5
  description: 最后一次转移后，在 B 锅静置 30 秒
- number: 6
  description: 立即放入冰水（ 0 摄氏度）终止加热（维持 30 秒）
- number: 7
  description: 剥壳时从钝端气室处开始，沿纵轴剥离蛋膜
tips: 关键参数：; 蛋黄中心温度：67±1°C; 蛋白分层温度：; 外层：100°C→87°C; 中层：87°C→55°C; 内层：55°C→30°C; 营养优势：多酚含量比传统煮法高 23%; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
