steps:
- number: 1
  description: 材料备齐。草鱼去鳞去内脏洗净。
- number: 2
  description: 莴苣叶洗净切段。
- number: 3
  description: 草鱼去头去尾剔骨，留两片鱼肉斜切成鱼片。
- number: 4
  description: 鱼片加盐、胡椒粉、鸡蛋清、淀粉、少许料酒。
- number: 5
  description: 鱼片抓拌均匀后，腌制15分钟。
- number: 6
  description: 锅中入油入姜片，鱼头鱼尾鱼骨斩块下锅煸炒一下去腥味。
- number: 7
  description: 加水没过鱼骨，加盐大火烧开，中火煮十五分钟左右，熬成鱼汤。
- number: 8
  description: 大葱切段后，和黄豆芽、莴苣叶过鱼汤焯烫。
- number: 9
  description: 焯烫后放入碗底垫底。并加入两勺鱼汤。同时，将腌好的鱼片过鱼汤焯烫后均匀的铺在莴苣叶之上。
- number: 10
  description: 在鱼片上均匀的撒上辣椒碎、花椒粉、辣椒粉、干辣椒段，大蒜末。
- number: 11
  description: 浇入三勺滚油。
- number: 12
  description: 撒上香菜碎和小葱末即可。
_source: cookbook-kg
