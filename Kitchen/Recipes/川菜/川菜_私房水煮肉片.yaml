steps:
- number: 1
  description: 里脊肉切薄片，用嫩肉粉，白胡椒，和香油腌渍十分钟
- number: 2
  description: 各种蔬菜洗净备用（也可选择自己喜欢的蔬菜）
- number: 3
  description: 锅内放油，炒香干红辣椒，香叶和八角（小火），放酱料小火炒一会
- number: 4
  description: 兑水，放浓汤宝，煮开调味，一次下入豆芽，蘑菇，莴笋青菜，捞出来码放好
- number: 5
  description: 大火烧，放入肉片和盐方，如果你的肉片够薄，只要默数五个数，但是肉片厚了可不保
- number: 6
  description: 摆上辣椒丝花椒，香菜蒜苗碎，熬油浇上即可（油冒烟，挪下等三秒再浇）
