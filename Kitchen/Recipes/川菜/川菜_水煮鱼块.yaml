id: 10088
name: 水煮鱼块
cuisine: 川菜
difficulty: 2
duration: 30
calories: 240
servings: 2
tags:
- 麻辣
- 煮
cover: https://i04piccdn.sogoucdn.com/ae0ced001d687548
ingredients:
- name: 花鲢
  amount: 3
  unit: 斤多
  isMain: true
- name: 芹菜
  amount: 0.5
  unit: 斤多
  isMain: false
- name: 大葱
  amount: 0
  unit: 三两左右
  isMain: false
- name: 盐
  amount: 0
  unit: 少许
  isMain: false
- name: 料酒
  amount: 0
  unit: 少许
  isMain: false
- name: 蒜
  amount: 0
  unit: 少许
  isMain: false
- name: 生姜
  amount: 0
  unit: 少许
  isMain: false
- name: 花椒
  amount: 0
  unit: 少许
  isMain: false
- name: 豆瓣
  amount: 2
  unit: 汤匙半
  isMain: false
- name: 油
  amount: 0
  unit: 少许
  isMain: false
- name: 豆豉
  amount: 0
  unit: 少许
  isMain: false
- name: 清水
  amount: 0
  unit: 清水的量要能淹没鱼块
  isMain: false
- name: 鸡精
  amount: 0
  unit: 少许
  isMain: false
steps:
- number: 1
  description: 买来的花鲢切成块，鱼头也剖开切成块。
- number: 2
  description: 把鱼块用盐和料酒腌匀，放置二十分钟左右。
- number: 3
  description: 把大葱洗净切成短节。
- number: 4
  description: 芹菜洗净切成节
- number: 5
  description: 蒜，生姜切成片，抓上少许花椒。
- number: 6
  description: 作料碗中加入2汤匙半豆瓣。
- number: 7
  description: 锅热后倒适量油。
- number: 8
  description: 油热后，将碗中的所有作料倒入油中翻炒一下，注意不要炒糊了。
- number: 9
  description: 加入少许酱油，少量豆豉
- number: 10
  description: 向锅中加入适量清水，清水的量要能淹没鱼块。煮开。
- number: 11
  description: 向煮开的锅中加入少量鸡精。
- number: 12
  description: 将鱼块放入煮开的锅中，注意，先放鱼头。
- number: 13
  description: 将鱼块和汤一起煮五分钟左右。
- number: 14
  description: 鱼块煮五分钟左右后，将芹菜放入锅中。
- number: 15
  description: 葱节放入锅中。
- number: 16
  description: 盖上锅盖，焖一分钟左右，焖出香味即可出锅。水煮鱼块里的菜好吃，还可以根据个人喜好，加入蒜苗，黄豆芽，今天妈妈图省事，只加了芹菜。
