steps:
- number: 1
  description: 超市打折买的2条海鲈鱼，我的教训是不要用它做鱼片
- number: 2
  description: 处理干净取鱼片
- number: 3
  description: 把鱼片放入碗里加蛋清
- number: 4
  description: 加入料酒
- number: 5
  description: 加点盐
- number: 6
  description: 加点姜汁
- number: 7
  description: 加点生粉
- number: 8
  description: 用手拌匀腌制一会
- number: 9
  description: 锅里加水放入姜片、花椒、葱段煮
- number: 10
  description: 煮至香气出来后捞出调味料
- number: 11
  description: 放入毛豆和白玉菇
- number: 12
  description: 再次煮开后放入盐和鸡精调味，我放的牛肉粉
- number: 13
  description: 煮开后把鱼片放入煮开马上捞出
- number: 14
  description: 把鱼片装入盆里
- number: 15
  description: 加入适量煮出来的汤汁
- number: 16
  description: 加点葱花和红椒
- number: 17
  description: 加热少许色拉油和红油，把热油淋在葱花上
- number: 18
  description: 小清新版水煮鱼完成
