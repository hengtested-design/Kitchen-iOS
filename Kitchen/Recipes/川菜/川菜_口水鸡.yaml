id: 10160
name: 口水鸡
cuisine: 川菜
difficulty: 3
duration: 300
calories: 1392
servings: 2
tags:
- 麻辣
- 咸鲜
- 煮
cover: https://s.chuimg.com/口水鸡/口水鸡.jpeg
description: 口水鸡是一道经典的四川凉菜，红油包裹的鸡肉冰爽 Q 弹、麻辣鲜香，夏季食用开胃解腻。鸡肉富含优质蛋白，搭配花生碎和香料，提供能量与风味。制作难度中等，需注意煮鸡火候和红油调味，适合有一定下厨经验的烹饪者。从备料、煮鸡、冷却到淋汁完成，预计耗时约 1.5 小时。
