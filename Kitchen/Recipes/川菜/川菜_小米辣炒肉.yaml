id: 10178
name: 小米辣炒肉
cuisine: 川菜
difficulty: 3
duration: 25
calories: 620
servings: 2
tags:
- 咸鲜
- 下饭菜
- 炒
description: 小米辣炒肉香辣过瘾，是一道典型的西南风味下饭菜，猪肉的鲜嫩搭配小米辣的爽辣，令人食欲大开。猪肉富含蛋白质和脂肪，辣椒提供丰富的维生素 C，能够促进食欲。虽然需要掌握爆香和翻炒的火候，但步骤清晰，新手也能轻松上手，预计制作时长约 25 分钟。注意，这道菜辣味突出，不建议清淡饮食者尝试。
ingredients:
- name: 小米椒 20 个，根据个人口味加减
  amount: 0
  unit: 适量
  isMain: false
- name: 花生油 20ml
  amount: 0
  unit: 适量
  isMain: false
- name: 五花肉/瘦肉 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 1-2g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 蚝油 10ml
  amount: 0
  unit: 适量
  isMain: false
- name: 姜蒜 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 豆瓣酱 10g，根据个人口味加减
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡精 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 5g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将小米辣洗净，斜刀切大一点
- number: 2
  description: 肉的话，想切丝切丝，想切片切片，倒入调料（生抽、蚝油、盐）腌制 5 分钟
- number: 3
  description: 热锅倒油，先把肉炒好盛起
- number: 4
  description: 姜蒜爆香，倒入豆瓣酱翻炒，到入切好的小米辣，再倒入瘦肉，翻炒一下，放点生抽、鸡精、盐、糖翻炒
tips: '**调料可以根据自己的喜好放，也可以加老抽，老抽更香！**; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
