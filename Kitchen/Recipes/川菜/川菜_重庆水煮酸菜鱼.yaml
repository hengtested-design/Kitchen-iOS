steps:
- number: 1
  description: 鲢鱼宰杀，去鳃去内脏，洗净。
- number: 2
  description: 鲢鱼切段，加盐、花椒、老姜、白胡椒、鸡精、料酒码味30分钟。
- number: 3
  description: 豆腐切块，过水煮3分钟。
- number: 4
  description: 竹笋洗净，切段，过水煮5分钟。
- number: 5
  description: 锅热后加菜油，熟后加猪油。油热后加入酸菜炒熟。
- number: 6
  description: 加入干辣椒、花椒、老姜、大蒜。
- number: 7
  description: 再加入麻辣豆瓣酱翻炒出香味。
- number: 8
  description: 加水烧开熬制汤料。
- number: 9
  description: 加入鱼头熬汤。
- number: 10
  description: 加入鱼块。
- number: 11
  description: 加入竹笋、豆腐。
- number: 12
  description: 烧开后煮3分钟，关火，撒上葱花、白胡椒面，水煮酸菜鱼做好了。
