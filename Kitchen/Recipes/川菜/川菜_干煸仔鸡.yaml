id: 10185
name: 干煸仔鸡
cuisine: 川菜
difficulty: 4
duration: 60
calories: 1300
servings: 2
tags:
- 炸
cover: https://s.chuimg.com/干煸仔鸡/干煸仔鸡.jpeg
description: 这是一道源自北大食堂、甜辣风味的创新川菜，鸡肉先腌后炸，外酥里嫩，土豆香糯，青椒脆爽，裹满红亮的甜辣酱汁，咸甜微辣十分开胃。富含蛋白质、碳水化合物及维生素。制作涉及油炸和酱汁熬制，对新手稍有挑战，但按步骤操作即可成功，全程约需 1 小时。
ingredients:
- name: 鸡腿肉 400g
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 青椒 60g
  amount: 0
  unit: 适量
  isMain: false
- name: 蒜瓣 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 3g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡精 3g （可选）
  amount: 0
  unit: 适量
  isMain: false
- name: 胡椒粉 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 2g
  amount: 0
  unit: 适量
  isMain: false
- name: 料酒 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 淀粉 20g
  amount: 0
  unit: 适量
  isMain: false
- name: 郫县红油豆瓣酱 40g
  amount: 0
  unit: 适量
  isMain: false
- name: 白糖 30g
  amount: 0
  unit: 适量
  isMain: false
- name: 花椒碎 2g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 鸡腿去骨（如使用鸡腿排可忽略此步骤），鸡腿肉用刀背砸一砸，切成 2cm 的块。
- number: 2
  description: 鸡腿肉中加入盐、鸡精（可选）、胡椒粉、生抽、老抽、料酒，抓拌至粘手时加入淀粉拌匀，加入食用油防止粘连，腌制 30 分钟。
- number: 3
  description: 土豆去皮，切成 2cm 的块，沸水煮 5 分钟后捞出，控干水分，防止油炸时爆锅。
- number: 4
  description: 青椒去籽，切成 2cm 小片，放在笊篱中备用。
- number: 5
  description: 锅中加入宽油（根据锅的形状，能没过食材即可），油温烧至 180℃ 时，下入土豆块炸 3 分钟后捞出。
- number: 6
  description: 待油温再次升高到 180℃时，下入鸡块炸 2 分钟后捞出。
- number: 7
  description: 待油温再次升高到 180℃时，下入鸡块复炸 1 分钟后捞出。
- number: 8
  description: 待油温再次升高到 180℃时，下入土豆块复炸 1 分钟后，将锅中的油和土豆块经过笊篱过滤倒出，让笊篱上的青椒片断生。
- number: 9
  description: 锅中加入 5ml 食用油，小火煸炒蒜瓣至发黄，下入红油豆瓣酱煸炒出香，下入白糖炒融化，下入花椒碎，加 40ml 清水，不停搅拌至酱汁粘稠。
- number: 10
  description: 下入炸好的鸡块、土豆块、青椒片，搅拌均匀后出锅。
tips: 不舍得使用宽油油炸的话，可改用更少的油煎鸡块和土豆块。会增长用时，部分影响口感，但不会影响总体味道。; 参考资料：[北大餐饮中心官方资讯](https://mp.weixin.qq.com/s/gd7F1bezTyd3OQsUVVur1w); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
