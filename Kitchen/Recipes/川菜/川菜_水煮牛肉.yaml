steps:
- number: 1
  description: 牛肉洗干净切片。
- number: 2
  description: 加入 15g 姜丝，1 个鸡蛋，15g 淀粉，8g 蚝油，10ml 料酒搅拌均匀，腌制 15 分钟。
- number: 3
  description: 香菜洗干净切好。
- number: 4
  description: 锅里倒油，加入豆瓣酱，5g 姜丝，蒜片。
- number: 5
  description: 倒入开水，煮成红汤。
- number: 6
  description: 豆芽洗干净去掉尾须，放进开水里焯熟。
- number: 7
  description: 将豆芽铺入碗底。
- number: 8
  description: 将牛肉片一片一片的放进红汤中，煮熟以后捞出。
- number: 9
  description: 将牛肉铺在豆芽上，撒上香菜梗。
- number: 10
  description: 撒上香菜叶，辣椒粉，辣椒圈。
- number: 11
  description: 另起锅烧热油，将热油淋在菜上面，就完成了。
tips: '参考: [水煮牛肉的详细步骤](https://www.zhms.cn/recipe/blrqm.html?source=2); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
