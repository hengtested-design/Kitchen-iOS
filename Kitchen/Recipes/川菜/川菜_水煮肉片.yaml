id: 10198
name: 水煮肉片
cuisine: 川菜
difficulty: 5
duration: 120
calories: 361
servings: 2
tags:
- 麻辣
- 咸鲜
- 下饭菜
- 煮
description: 水煮肉片是一道麻辣鲜香、肉片滑嫩、配菜爽脆的经典川菜，极其适合下饭。猪里脊提供优质蛋白质，搭配豆芽等蔬菜，营养均衡。做法稍显繁琐，尤其需要耐心腌制肉片和制作刀口辣椒，新手大约需要 1 至 2 小时完成。
