steps:
- number: 1
  description: 猪肉切丝，加少许料酒和一汤匙水淀粉抓匀，腌制20分钟。
- number: 2
  description: 杏鲍菇切备用。
- number: 3
  description: 青椒切丝、胡萝卜切丝、葱姜蒜切末，备用。
- number: 4
  description: 黑木耳焯水后，挤掉水分切丝备用。
- number: 5
  description: 杏鲍菇丝放入沸水中焯至熟软，捞出备用。
- number: 6
  description: 郫县豆瓣剁碎、泡野山椒切碎。生抽一汤匙、醋一汤匙、白糖一汤匙、盐一茶匙、料酒一汤匙、清水半碗、淀粉5克兑成碗汁备用。
- number: 7
  description: 锅中热油，放葱姜末爆香，放郫县豆瓣和野山椒炒出红油。
- number: 8
  description: 放入肉丝炒至变色。
- number: 9
  description: 放入杏鲍菇丝翻炒半分钟。
- number: 10
  description: 放入木耳丝和胡萝卜丝，炒至胡萝卜丝变熟。
- number: 11
  description: 放入青椒丝略炒，淋入碗汁。
- number: 12
  description: 将材料和调料翻炒均匀，出锅前洒蒜末翻一下即可出锅。
