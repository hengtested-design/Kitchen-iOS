id: 10258
name: 麻辣香锅
cuisine: 川菜
difficulty: 3
duration: 30
calories: 1050
servings: 2
tags:
- 麻辣
- 炒
description: 一道麻辣浓郁的川味家常菜，汇集蔬菜、肉类和豆制品，口感香辣过瘾、层次丰富。荤素搭配提供了优质蛋白质和多种维生素，营养全面。操作步骤清晰，需要掌握焯水和翻炒火候，对新手有一定挑战，总制作时间约 30 分钟。
ingredients:
- name: 青菜共需 455 克，其中油菜、油麦菜、菠菜的比例按自己喜好分配即可
  amount: 0
  unit: 适量
  isMain: false
- name: 无骨肉共需 430 克，其中猪肉、牛肉、鸡肉、鱼丸、火腿肠的比例按自己喜好分配即可
  amount: 0
  unit: 适量
  isMain: false
- name: 干豆腐 152 克
  amount: 0
  unit: 适量
  isMain: false
- name: 北京麻辣方便面 1 袋
  amount: 0
  unit: 适量
  isMain: false
- name: 干辣椒 5 克
  amount: 0
  unit: 适量
  isMain: false
- name: 麻辣香锅调料 110 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 烧开一锅水（水量能没过第 2-4 步中的食材即可）。
- number: 2
  description: 在开水中放入青菜，焯 5 分钟后盛出备用。
- number: 3
  description: 在开水中放入无骨肉，焯 4 分钟后盛出备用。
- number: 4
  description: 在开水中放入北京麻辣方便面，煮 2 分钟后盛出备用。
- number: 5
  description: 倒出开水，擦干锅具，放入 105 克食用油，大火加热 30 秒。
- number: 6
  description: 放入麻辣香锅调料，翻炒 20 秒。
- number: 7
  description: 放入干辣椒，翻炒 10 秒。
- number: 8
  description: 放入焯过的青菜，改中火，翻炒 3 分钟。
- number: 9
  description: 放入焯过的无骨肉，翻炒 3 分钟。
- number: 10
  description: 放入煮过的北京麻辣方便面，用筷子翻动 1 分钟。
- number: 11
  description: 关火，出锅。
tips: 关于火候的说明：; 大火通常温度在 240 摄氏度，以电磁炉为例，输入功率大约 2 千瓦。; 中火通常温度在 120 摄氏度，以电磁炉为例，输入功率大约 1.4 千瓦。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
