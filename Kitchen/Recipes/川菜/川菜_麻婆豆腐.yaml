id: 10257
name: 麻婆豆腐
cuisine: 川菜
difficulty: 3
duration: 40
calories: 476
servings: 2
tags:
- 咸鲜
- 下饭菜
cover: https://s.chuimg.com/麻婆豆腐/麻婆豆腐.jpeg
description: 这道香辣滑嫩的豆腐菜以咸鸭蛋替代传统豆瓣酱，咸鲜中带着微麻微辣，格外开胃下饭。富含优质蛋白和钙、铁等多种微量元素。制作难度适中，对新手友好，全程约需 40 分钟。
ingredients:
- name: 1 盒内脂豆腐
  amount: 0
  unit: 适量
  isMain: false
- name: 1 枚咸鸭蛋
  amount: 0
  unit: 适量
  isMain: false
- name: 20-30g 五花肉
  amount: 0
  unit: 适量
  isMain: false
- name: 两瓣大蒜
  amount: 0
  unit: 适量
  isMain: false
- name: 2 片生姜
  amount: 0
  unit: 适量
  isMain: false
- name: 5 根小米辣
  amount: 0
  unit: 适量
  isMain: false
- name: 5g 蒜蓉辣酱
  amount: 0
  unit: 适量
  isMain: false
- name: 20 颗花椒
  amount: 0
  unit: 适量
  isMain: false
- name: 3g 食盐
  amount: 0
  unit: 适量
  isMain: false
- name: 10g 酱油
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 大蒜和生姜切碎，备用
- number: 2
  description: 小米辣切成辣椒圈，备用
- number: 3
  description: 五花肉切成肉糜（本来就是买的肉糜的跳过）
- number: 4
  description: 肉糜中加入一半的食盐和味极鲜酱油，搅拌均匀，备用
- number: 5
  description: 鸭蛋用菜刀竖着对半切开（注意安全），去除蛋黄（一定要去除，不然会腥），剩下的蛋白捣碎成大约 2 mm * 2 mm 大小，不用太碎，备用
- number: 6
  description: 打开豆腐包装，用水果刀将在盒子中的豆腐划成大约 2.5 cm * 3 cm 大小，备用
- number: 7
  description: 热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高
- number: 8
  description: 调成小火，放入大蒜、生姜、辣椒圈、花椒、咸鸭蛋、蒜蓉辣酱翻炒 20 秒，炒出香味
- number: 9
  description: 调成中火，放入肉糜，翻炒大约 1 分钟，肉炒变色
- number: 10
  description: 调成小火，放入豆腐，将剩下的食盐、味极鲜酱油酱油均匀的洒在豆腐上
- number: 11
  description: 从锅边倒入开水（不然豆腐容易破），没过豆腐即可
- number: 12
  description: 开大火，水沸腾后立马转入中火，等待大约 10 分钟
- number: 13
  description: 等到水只剩 1/5 并且豆腐表面已经入色，关火，盛盘
tips: 期间一定要注意观察，防止糊锅; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
