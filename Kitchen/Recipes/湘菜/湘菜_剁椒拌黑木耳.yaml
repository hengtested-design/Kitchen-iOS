steps:
- number: 1
  description: 主要材料备齐。
- number: 2
  description: 黑木耳泡发后去根洗净；
- number: 3
  description: 葱姜蒜切末，干辣椒切小段备用；
- number: 4
  description: 黑木耳下开水锅焯烫至熟捞出沥干；
- number: 5
  description: 锅中入油爆香姜末、蒜末加剁椒、黄灯笼椒酱，桂皮，放少许盐炒香；
- number: 6
  description: 将炒好的部分到入木耳中，淋入调好的糖醋汁拌匀；
- number: 7
  description: 摆盘即可。
