id: 10203
name: 湘祁米夫鸭
cuisine: 湘菜
difficulty: 4
duration: 60
calories: 1332
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/湘祁米夫鸭/湘祁米夫鸭.jpeg
description: 湖南两祁地区传统特色菜，鸭肉煸炒后裹上混合米粉蒸制，口感软糯，咸香入味，回味悠长。鸭肉富含优质蛋白质和 B 族维生素，搭配米粉提供能量，营养均衡。制作需先煸炒再高压蒸制，稍有难度，适合有一定烹饪基础的朋友。从备料到出锅大约需要 1 小时，若选用老鸭需延长蒸制时间。
