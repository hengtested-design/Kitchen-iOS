ingredients:
- name: 意面
  amount: 0
  unit: 适量
  isMain: true
- name: 培根
  amount: 2
  unit: 片
  isMain: true
- name: 番茄
  amount: 1
  unit: 个
  isMain: true
- name: 胡萝卜
  amount: 0.5
  unit: 根
  isMain: true
- name: 洋葱
  amount: 4
  unit: 分之一个
  isMain: true
- name: 番茄酱
  amount: 0
  unit: 适量
  isMain: true
- name: 意式混合香料
  amount: 0
