id: 10265
name: 半成品意面
cuisine: 西餐
difficulty: 1
duration: 2
calories: 578
servings: 2
description: 这是一道利用市售半成品快速完成的西式简餐，面条弹韧有嚼劲，搭配现成酱料风味浓郁。以碳水化合物为主，能迅速补充能量，并含有蛋白质。制作难度极低，新手也能零失误，从开火到装盘仅需约 2 分钟。
ingredients:
- name: 2 人 1 顿 520g（以半成品为准）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 热锅
- number: 2
  description: 将 50 ml 清水倒入平底锅
- number: 3
  description: 将面条放入，炒 1 分钟
- number: 4
  description: 将酱料倒入，翻炒 1 分钟
- number: 5
  description: 装盘即可
- number: 1
  description: 将面条放入「可用于微波炉加热」的盘子中
- number: 2
  description: 将附带的酱料倒在面条上
- number: 3
  description: 倒入 50 ml 清水
- number: 4
  description: 700W 加热 2 分钟
- number: 5
  description: 取出拌匀即可
tips: 传统意大利面非常长。20 世纪下半叶开始流行短的意大利粉，典型长度 25–30 cm。; “Spaghettoni”是较厚的意大利粉。“Spaghettini”较细的意大利面。“capellini”是更细版的意大利面。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
