id: 10309
name: 披萨饼皮
cuisine: 西餐
difficulty: 4
duration: 840
calories: 537
servings: 2
tags:
- 烤
cover: https://s.chuimg.com/披萨饼皮/披萨饼皮.jpeg
description: 披萨饼皮采用低温隔夜发酵，成品饼底柔软又略带嚼劲，属于家常西式面点。主要提供碳水化合物和少量优质脂肪。制作流程简单，但需要耐心等待面团发酵，对新手也算友好。从准备到烘烤完成，算上隔夜冷藏时间大约需要 10-14 小时，适合提前一天备好。
ingredients:
- name: 面粉 125g x 4= 500g，
  amount: 0
  unit: 适量
  isMain: false
- name: 水 70 x 5 = 350g，
  amount: 0
  unit: 适量
  isMain: false
- name: 橄榄油 7 x 5 =35g，
  amount: 0
  unit: 适量
  isMain: false
- name: 酵母粉 1 x 5 = 5g，
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 0.6 x 5 = 3g，
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 0.6 x 5 = 3g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 用准备好的温水把酵母粉化开，稍微搅拌小就好，备用
- number: 2
  description: 取准备好的面粉，依次添加盐、橄榄油、白砂糖
- number: 3
  description: 准备混合水和面粉，边加水边搅拌直至水全部加完
- number: 4
  description: 搅拌至看不到干米粉为止
- number: 5
  description: 用差不多三倍大面团的容器装好，密封，冰箱冷藏（4 度） **等待 8~12 小时，一般晚上做第二天就可以用**
- number: 6
  description: 观察面团醒发完毕 **差不多是原始大小大约两倍算醒发完毕**
- number: 7
  description: 取醒发好的面团，均匀分成四份，分别用保鲜膜盖好，备用
- number: 8
  description: 案板撒稍微多一点的干面粉，准备开始揉面
- number: 9
  description: 因为是比较湿的面团，所以粘上干面粉后才没那么粘手，不用揉太多次，面团表面稍微光滑一点就可以了
- number: 10
  description: 用手拉扯，或者擀面杖擀平，也不一定非得擀圆，只要厚度均匀，烤箱放得进去就好
- number: 11
  description: 铺好油纸，放上饼皮，依照个人口味，把准备好的食材放上去，撒上芝士碎
- number: 12
  description: 水果烤箱上 180 度，下 220 度，16 分钟即可
- number: 13
  description: 肉蔬菜烤箱上 200 度，下 230 度，18 分钟即可
- number: 14
  description: 挤上沙拉酱或者其他自己喜欢的酱即可享用~
tips: 一定要注意水的比例; 烤箱品质层次不齐，第一次做注意观察火候对披萨的影响; 一般不特别标注是低筋或高筋面粉，基本都是中筋面粉; 容易出水的水果不能作为食材，比如西瓜、橘子等; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
