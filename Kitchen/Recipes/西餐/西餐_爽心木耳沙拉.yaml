id: 10124
name: 爽心木耳沙拉
cuisine: 西餐
difficulty: 2
duration: 30
calories: 90
servings: 2
tags:
- 微辣
- 拌
cover: https://i04piccdn.sogoucdn.com/9d8272575e81453a
ingredients:
- name: 黑木耳
  amount: 200
  unit: 克
  isMain: true
- name: 圣女果
  amount: 7
  unit: 个
  isMain: true
- name: 彩椒
  amount: 60
  unit: 克
  isMain: true
- name: 麻辣花生
  amount: 100
  unit: 克
  isMain: true
- name: 干辣椒
  amount: 3
  unit: 只
  isMain: false
- name: 姜
  amount: 2
  unit: 片
  isMain: false
- name: 花椒
  amount: 20
  unit: 粒
  isMain: false
- name: 香草醋
  amount: 1
  unit: 勺
  isMain: false
- name: 生抽
  amount: 15
  unit: 毫升
  isMain: false
- name: 白糖
  amount: 0
  unit: 少许
  isMain: false
- name: 橄榄油
  amount: 0
  unit: 适量
  isMain: false
- name: 盐
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 准备好材料。
- number: 2
  description: 木耳撕小朵，烧开水后加少许盐，把木耳焯烫1分钟。
- number: 3
  description: 捞出沥干水分，加点糖和生抽拌匀。
- number: 4
  description: 圣女果洗净每个切成4瓣，彩椒切小片。
- number: 5
  description: 另起锅加热，倒入油，放入花椒、干辣椒和姜片用小火煸出香味后关火。
- number: 6
  description: 把辣椒花椒姜片挑出不要，立即把热油浇在木耳上。
- number: 7
  description: 然后放入圣女果和彩椒，淋入香草醋。
- number: 8
  description: 最后加入麻辣花生，拌匀即可。
_source: cookbook-kg
