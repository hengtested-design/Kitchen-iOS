steps:
- number: 1
  description: 猪肉切成小丁
- number: 2
  description: 番茄开水烫一下去皮切成小块
- number: 3
  description: 洋葱切成小块、大蒜剁成蓉
- number: 4
  description: 锅内放入一大匙橄榄油，放入猪肉馅略微翻炒
- number: 5
  description: 加入蒜蓉和洋葱丁，炒出香味
- number: 6
  description: 调入少许料酒后，加入番茄块，翻炒均匀
- number: 7
  description: 调入番茄沙司、耗油和生抽，再倒入少许清水
- number: 8
  description: 煮至诚浓厚的酱汁后，加入少许糖、盐、黑胡椒粉，入味后即可盛出
- number: 9
  description: 不锈钢锅内入水，加少许盐，滴入少许橄榄油（防止面条粘连），加盖烧开后，放入意大利面，大火10分钟左右
- number: 10
  description: 将煮好的意大利面捞出，浸在凉开水中
- number: 11
  description: 面条捞出沥干，盛入盘内，淋上做好的番茄肉酱，撒上卡夫芝士粉即可
