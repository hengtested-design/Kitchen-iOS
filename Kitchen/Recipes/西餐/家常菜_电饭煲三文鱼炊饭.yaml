id: 10328
name: 电饭煲三文鱼炊饭
cuisine: 西餐
difficulty: 2
duration: 45
calories: 889
servings: 2
tags:
- 咸鲜
cover: https://s.chuimg.com/电饭煲三文鱼炊饭/电饭煲三文鱼炊饭.jpeg
description: 这是一道融合日式炊饭做法的家常料理，米饭吸饱牛油和三文鱼的香气，口感浓郁鲜香。三文鱼提供优质蛋白和不饱和脂肪酸，搭配菌菇更添膳食纤维。操作极其简单，只需用电饭煲一键完成，从备料到出锅大约 45 分钟，非常适合新手尝试。
ingredients:
- name: 米 50g / 人
  amount: 0
  unit: 适量
  isMain: false
- name: 三文鱼 300g / 人
  amount: 0
  unit: 适量
  isMain: false
- name: 水
  amount: 0
  unit: 适量
  isMain: false
- name: 牛油一汤匙 / 人
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 三文鱼去鳞，去骨
- number: 2
  description: 金菇、冬菇切碎
- number: 3
  description: 洗米三次
- number: 4
  description: 把三文鱼、米、牛油放入电饭煲
- number: 5
  description: 想口感浓厚一点，可以加多一汤匙牛油
- number: 6
  description: 根据电饭煲的刻度放水
- number: 7
  description: 把电饭煲調較至煲飯模式，等待大約 30 - 45 分鐘
tools:
- 电饭煲
tips: 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
