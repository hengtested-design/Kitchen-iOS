steps:
- number: 1
  description: 准备所需材料。
- number: 2
  description: 锅烧热，将20克黄油烧融化。
- number: 3
  description: 倒入面粉。
- number: 4
  description: 小火翻炒面粉。
- number: 5
  description: 分三次兑入牛奶。
- number: 6
  description: 边倒边充分搅拌没有面疙瘩，煮粘稠后将做好的白酱盛出备用。
- number: 7
  description: 另取一锅，水沸腾后放入意面，加少许盐大火煮约7-8分钟即可捞出。
- number: 8
  description: 准备意面的配料，黄甜椒、培根切块，蘑菇切片，洋葱、蒜瓣切碎，西兰花掰成小朵备用。
- number: 9
  description: 炒锅加热，倒入橄榄油。
- number: 10
  description: 放入洋葱碎、蒜碎炒香后，倒入培根和鲜虾翻炒。
- number: 11
  description: 再加入西兰花和黄甜椒、蘑菇片翻炒，加少许盐调味。
- number: 12
  description: 加入煮好的意大利面翻炒均匀。
- number: 13
  description: 最后倒入奶油白酱，使酱汁包裹住面条即可关火。
- number: 14
  description: 趁热食用。
_source: cookbook-kg
