id: 10137
name: 奇异果菠菜特调
cuisine: 西餐
difficulty: 1
duration: 10
calories: 184
servings: 2
tags:
- 酸甜
cover: https://s.chuimg.com/奇异果菠菜特调/奇异果菠菜特调.jpeg
description: 这是一道清爽健康的果蔬特饮，口感酸甜细腻，带有奇异果与苹果的天然果香，菠菜味清淡不抢。富含维生素 C 和膳食纤维，有助于促进消化。制作非常简单，新手也能一次成功，全程预计只需 10 分钟。
ingredients:
- name: 饮用水 700ml
  amount: 0
  unit: 适量
  isMain: false
- name: 奇异果 2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 苹果 1/2 个
  amount: 0
  unit: 适量
  isMain: false
- name: 菠菜叶 4 叶
  amount: 0
  unit: 适量
  isMain: false
- name: 白砂糖 12 克
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将猕猴桃切成两半，每半再分四份小块
- number: 2
  description: 将苹果切丁
- number: 3
  description: 将菠菜叶去梗，只留叶子部分
- number: 4
  description: 将菠菜切碎
- number: 5
  description: 一起倒入榨汁机搅拌杯
- number: 6
  description: 注水
- number: 7
  description: 加入白砂糖
- number: 8
  description: 启动搅拌机，搅拌约 4 个 15 秒（每 15 秒停下看状态）
tips: 关于白砂糖的量：全糖为 12g，可根据个人情况在 0-12g 中调整; 本品是仿照宜家的奇异果菠菜汁自己研制的，没有宜家的好喝，但也不错; 欢迎改进！; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
