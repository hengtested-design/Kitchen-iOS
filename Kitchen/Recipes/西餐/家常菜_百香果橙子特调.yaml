id: 10144
name: 百香果橙子特调
cuisine: 西餐
difficulty: 3
duration: 30
calories: 173
servings: 2
tags:
- 酸甜
- 咸鲜
cover: https://s.chuimg.com/百香果橙子特调/百香果橙子特调.jpeg
description: 这是一道酸甜清爽的夏日饮品，融合了百香果的热带果香与橙子的鲜甜，搭配茉莉绿茶或苏打气泡水，口感层次分明，冰爽解腻。富含维生素 C，有助增强免疫力和滋润肌肤。包含腌制、泡茶、榨汁等步骤，操作略多但难度适中，新手也能尝试。需提前一天腌制百香果，总耗时约 24 小时，实际动手时间仅 大约 30 分钟。
