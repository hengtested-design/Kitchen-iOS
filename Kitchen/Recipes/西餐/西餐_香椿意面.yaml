steps:
- number: 1
  description: 将新鲜的香椿芽洗净晒干切碎。
- number: 2
  description: 将腰果、亚麻籽、松子及黄豆混合捣碎。
- number: 3
  description: 坚果碎加入香椿末搅拌成酱，加入少许盐调味，放入品利橄榄油调均。
- number: 4
  description: 将小番茄切丁
- number: 5
  description: 意面下锅煮熟后盛出。
- number: 6
  description: 将香椿酱、番茄丁及意面依次下入锅中翻炒。
- number: 7
  description: 装盘盛出后以薄荷叶点缀即可。
