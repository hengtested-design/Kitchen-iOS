id: 10119
name: 烤箱版巴斯克芝士蛋糕
cuisine: 西餐
difficulty: 2
duration: 30
calories: 266
servings: 2
tags:
- 烤
cover: https://s.chuimg.com/烤箱版巴斯克芝士蛋糕/烤箱版巴斯克芝士蛋糕.jpeg
description: 巴斯克芝士蛋糕是一道口感浓郁绵密、表面焦香内部湿润的甜品，属于西班牙巴斯克地区的经典风味。主要原料为奶油奶酪和鸡蛋，富含优质蛋白质和钙质。制作过程非常简单，新手也能轻松驾驭。从准备到出炉仅需约 30 分钟，但建议冷藏过夜后食用，总耗时约 8 小时以上。
steps:
- number: 1
  description: 奶油奶酪软化，微波炉 10s + 10s。
- number: 2
  description: 奶油奶酪加入白砂糖，打蛋器打至顺滑。
- number: 3
  description: 加入 2 个全蛋 + 1 个蛋黄，搅拌均匀。
- number: 4
  description: 加入淡奶油，搅拌均匀。
- number: 5
  description: 加入低筋面粉，搅拌均匀。
- number: 6
  description: 烤箱 220°(425°F)，20 - 25 分钟（本人一般 20 或者 22 分钟）。
- number: 7
  description: 放凉之后放入冰箱，最好过夜。
tips: 烤箱出来成品抖动是正常的，放凉后口感还不是最好的，一定要冷藏才好吃！; 参考资料：下厨房 - 巴斯克芝士蛋糕『最简单的蛋糕』零失败🔥芝士控; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
