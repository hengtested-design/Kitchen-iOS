steps:
- number: 1
  description: 意大利面200g。
- number: 2
  description: 烧开水，加一勺盐，放入意面，煮大约12分钟，没有中间的白芯即可。
- number: 3
  description: 过凉水。
- number: 4
  description: ：将胡萝卜、洋葱、青椒洗干净。
- number: 5
  description: 将4中切丝，将五花肉切丝，姜切丝、蒜牌烂。
- number: 6
  description: 锅热油，葱姜爆香，加肉丝翻炒。
- number: 7
  description: 变色时加生抽翻炒均匀。
- number: 8
  description: 放入胡萝卜丝和洋葱丁翻炒片刻 。
- number: 9
  description: 加入高汤、大火烧开后小火慢熬；
- number: 10
  description: 收汁差不多时，加青椒丝和适量盐，放入意面翻炒3分钟、撒少许胡椒粉，即可。
- number: 11
  description: 盛盘。
