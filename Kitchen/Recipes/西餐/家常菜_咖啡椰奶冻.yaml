id: 10113
name: 咖啡椰奶冻
cuisine: 西餐
difficulty: 4
duration: 60
calories: 162
servings: 2
cover: https://s.chuimg.com/咖啡椰奶冻/咖啡椰奶冻.jpeg
description: 这款甜品融合了咖啡的醇厚与椰奶的清甜，口感像布丁般细腻滑嫩，层次丰富。淡奶油和椰汁提供了优质脂肪与植物营养，食用能带来满足感。做法非常友好，只需混合加热，无需复杂技巧，新手也能一次成功。不算冷藏的话，实际操作约需 1 小时，加上冷藏定型共 大约 4 小时即可享用。
ingredients:
- name: 125ml 淡奶油(whipping cream, 35% M.E)
  amount: 0
  unit: 适量
  isMain: false
- name: 250ml 椰树牌椰汁
  amount: 0
  unit: 适量
  isMain: false
- name: 35ml espresso 意式浓缩（个人不推荐用 fruity 的咖啡豆）
  amount: 0
  unit: 适量
  isMain: false
- name: 50ml 椰子水（推荐 vita coco coconut water，有条件可以敲一个椰子）
  amount: 0
  unit: 适量
  isMain: false
- name: 10g 吉利丁
  amount: 0
  unit: 适量
  isMain: false
- name: 糖（可选）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将定量淡奶油，椰树牌椰汁，espresso，椰子水混合备用。
- number: 2
  description: 将以上液体加热 1 分钟，温度达到 50-60 度即可。
- number: 3
  description: （可选）如果格外嗜甜可以加额外的糖。
- number: 4
  description: 倒入吉利丁，搅拌至融化，煮 1 分钟。
- number: 5
  description: （可选）过筛 （这一步可以让椰奶冻口感更佳顺畅）。
- number: 6
  description: 放入模具。
- number: 7
  description: （可选）过滤掉表层的泡泡。这一步可以让椰奶冻口感更好，并且看着也会更棒。
- number: 8
  description: 放入冰箱冷藏区，等待 3 小时。
tips: 注意事项：请务必不要让液体煮沸！！！也不要冒泡泡！！！; 关于厨具清洗：建议直接用洗碗机，如果没有的话可以用温水洗。（因为 gelatin 不好清洗，洗碗机会比较好）; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
