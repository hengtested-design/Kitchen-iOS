steps:
- number: 1
  description: 准备材料。
- number: 2
  description: 先煮面。锅中的水烧开后 加入一勺盐、一勺橄榄油，下入一小把量的意大利面，让面条自然的散落，不要着急搅拌，待面条根部软化后，用筷子轻轻翻转几下煮8分钟左右。
- number: 3
  description: 待面条大约7-8成熟的时候捞出，放进凉水中划散，之后沥干水分。
- number: 4
  description: 淋入适量的橄榄油用筷子拌匀备用。
- number: 5
  description: 接下来做酱汁。番茄顶部划十字刀口，在火上略烧一会，剥皮。
- number: 6
  description: 牛肉切末，番茄切碎，蘑菇切片。
- number: 7
  description: 锅中将黄油融化，将洋葱和大蒜下油锅爆香，用中火慢慢炒至洋葱开始变色。
- number: 8
  description: 然后放入切好的牛肉末；
- number: 9
  description: 再加入蘑菇片、玉米胡萝卜火腿粒翻炒。
- number: 10
  description: 加入番茄和适量水继续煮。
- number: 11
  description: 待番茄软烂后，加入盐、黑胡椒粉、汤、罗勒调味。
- number: 12
  description: 将酱汁与面拌匀即可。
