steps:
- number: 1
  description: 准备好材料。
- number: 2
  description: 洋葱、蒜、胡萝卜、西芹、西红柿都切末。
- number: 3
  description: 将意大利面放入滚水中煮熟（参考包装上的说明，我用了不到5分钟）。
- number: 4
  description: 捞起面泡冷水至凉，控水后拌入少量橄榄油，备用。
- number: 5
  description: 油热后。
- number: 6
  description: 放入肉馅、洋葱末、蒜末炒香。
- number: 7
  description: 加入胡萝卜末、西芹末。
- number: 8
  description: 番茄酱、少量水翻炒均匀。
- number: 9
  description: 依据个人口味加入盐、黑胡椒碎、综合香料，小火煮至汤汁浓稠。
- number: 10
  description: 加入意大利面，调入糖和芝士粉，拌匀即可。
_source: cookbook-kg
