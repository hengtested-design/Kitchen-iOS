id: 10317
name: 炒意大利面
cuisine: 西餐
difficulty: 3
duration: 30
calories: 406
servings: 2
tags:
- 炒
cover: https://s.chuimg.com/炒意大利面/炒意大利面.jpeg
description: 这道炒意大利面软糯爽口，搭配肥牛和酱料，酱香浓郁，是带有西式风味的家常主食。富含碳水化合物与蛋白质，能快速补充能量。做法简单，新手也能轻松掌握，全程大约需要 30 分钟。
ingredients:
- name: 意大利面 50 克 / 人
  amount: 0
  unit: 适量
  isMain: false
- name: 肥牛 5 片 / 人
  amount: 0
  unit: 适量
  isMain: false
- name: 食用油 5ml / 50 克意面
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 加入 250 克水 / 人
- number: 2
  description: 待水烧开，下入面条，中火煮 15 - 20 分钟（这个面通常比较硬，捞起来之前最好尝一下，中心如果有一点硬，需要继续煮）
- number: 3
  description: 捞出面条，盛入盘中备用
- number: 4
  description: 热锅倒入食用油，待油温中热，下入面条翻炒一分钟（如果太干，加入少量水）
- number: 5
  description: 放入 10 克番茄酱、肥牛、加入 2g 食盐，继续翻炒一分钟
- number: 6
  description: 起锅
