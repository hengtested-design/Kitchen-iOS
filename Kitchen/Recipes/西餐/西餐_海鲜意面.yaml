steps:
- number: 1
  description: 西兰花洗净，撕成小朵后焯熟备用。
- number: 2
  description: 虾去皮去虾线备用。
- number: 3
  description: 鱿鱼切丝。
- number: 4
  description: 将洋葱切几刀，同圣女果一同放入料理机打成泥。
- number: 5
  description: 锅内烧水，加入半勺盐，放入意面煮至没有硬心后捞出控水。
- number: 6
  description: 在意面中加入一勺橄榄油拌匀备用。
- number: 7
  description: 锅内放入适量橄榄油，放入虾和鱿鱼翻炒熟后取出。
- number: 8
  description: 不用洗锅，将打好的番茄泥倒入锅中，中小火熬煮。
- number: 9
  description: 番茄汁熬至浓稠后放入适量的盐、罗勒、黑胡椒翻炒均匀。
- number: 10
  description: 将意面和海鲜一同倒入锅中，均匀地裹上酱汁后装盘。
