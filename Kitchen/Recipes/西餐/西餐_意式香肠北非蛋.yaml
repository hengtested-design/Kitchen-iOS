id: 10084
name: 意式香肠北非蛋
cuisine: 西餐
difficulty: 3
duration: 30
calories: 668
servings: 2
tags:
- 酸甜
- 咸鲜
description: 意式香肠北非蛋是一道浓郁鲜香的地中海风味料理，溏心蛋卧在酸甜的番茄肉酱里，搭配脆面包蘸食，口感丰富。主要食材提供优质蛋白质，番茄、甜椒和洋葱带来维生素与膳食纤维。制作不难，只需注意焖蛋火候，全程约 30 分钟即可上桌。
ingredients:
- name: 肉类（香肠/午餐肉）：100g - 150g
  amount: 0
  unit: 适量
  isMain: false
- name: 百味来拿坡里意面酱：1 罐（400g，提供基本的番茄、洋葱和香草风味）
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡蛋：3 - 4 个
  amount: 0
  unit: 适量
  isMain: false
- name: 甜椒：半个（切细丝）
  amount: 0
  unit: 适量
  isMain: false
- name: 洋葱：半个（切小丁）
  amount: 0
  unit: 适量
  isMain: false
- name: 橄榄油：10ml - 15ml（用于炒菜）
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 将意式猪肉香肠去肠衣备用；洋葱切小丁；甜椒切细丝。
- number: 2
  description: 在宽口平底锅中倒入 10ml - 15ml 橄榄油，中火加热。
- number: 3
  description: 放入处理好的香肠或午餐肉，翻炒至边缘金黄酥脆（如果使用生香肠，翻炒时用勺子将其捣碎变色）。
- number: 4
  description: 将洋葱丁和甜椒丝加入锅中与肉一起翻炒，持续翻炒 4 - 5 分钟，直到蔬菜变软，洋葱呈半透明状。
- number: 5
  description: 倒入百味来拿坡里意面酱，搅拌均匀。将火调至中低火，保持微沸炖煮 2 - 3 分钟。（如果酱汁看起来太稠，可以加入 15ml 水）。
- number: 6
  description: 用勺子的背面在锅内的酱汁中挖出 3 - 4 个小“坑”。
- number: 7
  description: 依次小心地将鸡蛋打入每个坑中。
- number: 8
  description: 盖上平底锅的盖子，利用蒸汽焖熟蛋白。等待 3 - 5 分钟。**注意：请频繁检查状态**。当蛋白变得不透明且凝固，但轻轻摇晃平底锅时蛋黄仍能晃动（溏心状态）时即可结束这一步。
- number: 9
  description: 关火。根据个人喜好撒上磨碎的帕马森干酪、新鲜欧芹或干辣椒碎。
- number: 10
  description: 将平底锅直接端上桌，配以硬壳面包蘸取蛋黄与酱汁食用。
tips: '**肉类选择建议：**; **意式香肠**：最能体现正宗风味（推荐寻找配料中含有小茴香籽/Fennel seeds 的香肠）。; **午餐肉**：带来咸香、怀旧的口感，并且表面能煎得微脆。; **辣香肠 (Chorizo)**：若喜欢烟熏、辛辣的口感，并且能将底油染成诱人的红色，这是最好的选择。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
