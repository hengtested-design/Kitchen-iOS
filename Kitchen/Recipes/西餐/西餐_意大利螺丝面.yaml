steps:
- number: 1
  description: 面加点盐，过热水，注意一定要加盐，煮三到五分钟即可捞出，然后过凉水冲，控水后滴几滴橄榄油。
- number: 2
  description: 大葱切薄片，西红柿洋葱青椒随意切块。
- number: 3
  description: 炒锅加油，炒菜。
- number: 4
  description: 菜快好时，加入面。
- number: 5
  description: 搅拌均匀再小炒一会。
- number: 6
  description: 装盘享用。
