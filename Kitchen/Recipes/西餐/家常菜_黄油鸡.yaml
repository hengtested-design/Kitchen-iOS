id: 10259
name: 黄油鸡
cuisine: 西餐
difficulty: 4
duration: 45
calories: 641
servings: 2
tags:
- 酸甜
- 煮
description: 这是一道源自印度的经典咖喱菜肴，以烤制后再炖煮的鸡腿肉搭配番茄、黄油和奶油制成的酱汁，口感醇厚丝滑，酸甜微辣，带有独特的香料复合香气。鸡肉、酸奶和腰果提供了丰富的蛋白质与健康脂肪，番茄和香料也带来一定的维生素与抗氧化物。制作有一定挑战，需要掌握火候和香料的平衡，加上腌制时间共约 1 小时 45 分钟方可完成。
