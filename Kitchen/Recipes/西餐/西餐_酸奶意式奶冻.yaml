id: 10127
name: 酸奶意式奶冻
cuisine: 西餐
difficulty: 4
duration: 300
calories: 1034
servings: 2
cover: https://s.chuimg.com/酸奶意式奶冻/酸奶意式奶冻.jpeg
description: 一道改良自意大利经典的甜品，融入原味酸奶后口感更为清爽顺滑，甜而不腻，适合作为餐后小点搭配水果或果酱。奶制品带来丰富的钙质和蛋白质，营养温和。制作步骤简单，只需加热搅拌和冷藏定型，新手也能顺利上手，从准备到冷藏完成大约需要 5 小时。
ingredients:
- name: 淡奶油 200g
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 40g
  amount: 0
  unit: 适量
  isMain: false
- name: 原味酸奶 250g
  amount: 0
  unit: 适量
  isMain: false
- name: 吉利丁片 6g
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 吉利丁片剪成小片，泡入冷水中
- number: 2
  description: 淡奶油和糖放入锅中，加热至 60 度
- number: 3
  description: 关火，吉利丁从水中取出，控干水份，加入热淡奶油中，搅拌均匀
- number: 4
  description: 淡奶油降温至 40 度，加入原味酸奶，搅拌均匀
- number: 5
  description: 将上述步骤得到的混合物过两遍筛网
- number: 6
  description: 分装入合适的容器，放入冰箱冷藏 4 小时以上
tips: 传统版本的意式奶冻只用淡奶油，且糖量更大，比较甜腻。此版本做了改良，吃起来负担更小。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
