id: 10191
name: 杀猪菜
cuisine: 东北
difficulty: 4
duration: 30
calories: 1657
servings: 2
tags:
- 咸鲜
- 煮
description: 这是一道源自东北的经典炖菜，酸爽鲜香、暖心暖胃。酸菜富含乳酸菌和膳食纤维，排骨提供优质蛋白与钙质，血肠则能补充铁元素。制作时需要耐心处理血肠以防煮爆，对厨房新手有一定挑战。从备料到出锅，预计耗时约一小时。
ingredients:
- name: 血肠 200 克
  amount: 0
  unit: 适量
  isMain: false
- name: 酸菜 500 克
  amount: 0
  unit: 适量
  isMain: false
- name: 排骨 400 克
  amount: 0
  unit: 适量
  isMain: false
