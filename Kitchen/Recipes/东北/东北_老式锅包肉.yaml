tips: '**注意事项**：; 肉片厚度应为 8mm，过厚过薄都会影响口感。; 炸制时控制油温，避免外壳过深或不酥脆，这点非常重要。; 熬糖醋汁时，注意熬至粘稠但不结块，避免变成糖浆。; **参考资料**：; [老饭骨版本](https://www.bilibili.com/video/BV19F411b7ME); [老东北美食版本](https://www.bilibili.com/video/BV1wa4y1C7Cd); [村驴版本](https://www.bilibili.com/video/BV1xy411i7Mi); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
