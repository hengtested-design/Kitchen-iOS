id: 10214
name: 白菜猪肉炖粉条
cuisine: 东北
difficulty: 3
duration: 45
calories: 1880
servings: 2
tags:
- 咸鲜
- 炖
description: 猪肉白菜炖粉条是东北地区经典的家常炖菜，汤汁浓郁咸鲜，五花肉软烂、粉条吸饱肉香后滑韧入味，白菜清甜解腻。整道菜荤素搭配均衡，能提供蛋白质、维生素和碳水化合物，营养饱腹。制作过程需要一些耐心，特别是粉条处理和炖煮火候，对新手有一定挑战，但按步骤操作不易失败，从头到尾大约需要 45 分钟即可上桌。
ingredients:
- name: 五花肉 300g
  amount: 0
  unit: 适量
  isMain: false
- name: 大白菜 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 土豆干粉条 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 十三香 10g
  amount: 0
  unit: 适量
  isMain: false
- name: 鸡精 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 食用盐 15g
  amount: 0
  unit: 适量
  isMain: false
- name: 老抽 5ml
  amount: 0
  unit: 适量
  isMain: false
- name: 生抽 5ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 锅内烧水，水开后放入干粉条，煮 5 分钟后同水一起倒出容器中，盖上盖子继续浸泡泡 备用（第一步先做这个，期间可以进行以下步骤）
- number: 2
  description: 五花肉切 3mm 的肉片，备用
- number: 3
  description: 大白菜嫩叶与白菜帮子分开切成 2 份菜片，备用
- number: 4
  description: 热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高
- number: 5
  description: 放入五花肉，保持翻炒至肉变色
- number: 6
  description: 加入老抽，炒 **1 分钟**，给肉上色
- number: 7
  description: 加入白菜帮子，加入食用盐、生抽，炒一分钟（如果粘锅，烹入 10ml 水）
- number: 8
  description: 加水没过所有食材，加入鸡精 ，十三香，沸腾后，将火调小然后**等待 20 分钟**
- number: 9
  description: 粉条滤水切成小段放入碗中 备用
- number: 10
  description: 加入白菜嫩叶，炒匀后将粉条放在菜上方，加盖再煮 **5 分钟**
- number: 11
  description: 尝味、关火，收汁
tips: 土豆干粉条煮制时间长，可以放在第一步，期间进行其他步骤; 最后一步尝味，如果发现有味道淡、未熟，继续加盖煮一段时间; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
