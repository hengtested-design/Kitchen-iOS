id: 10186
name: 广式萝卜牛腩
cuisine: 粤菜
difficulty: 4
duration: 300
calories: 483
servings: 2
tags:
- 炖
cover: https://s.chuimg.com/广式萝卜牛腩/广式萝卜牛腩.jpeg
description: 这是一道广式家常炖菜，牛腩软烂入味，萝卜吸饱汤汁后清甜浓郁，整体酱香回甘。富含优质蛋白和膳食纤维，开胃助消化。制作步骤稍多但难度适中，新手按部就班也能成功。预计从头到尾大约需要 2.5 小时完成。
ingredients:
- name: 牛腩 500g
  amount: 0
  unit: 适量
  isMain: false
- name: 白萝卜 1 根
  amount: 0
  unit: 适量
  isMain: false
- name: 姜片 8 片
  amount: 0
  unit: 适量
  isMain: false
