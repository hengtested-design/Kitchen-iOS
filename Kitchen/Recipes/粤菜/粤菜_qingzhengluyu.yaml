id: 3
name: 清蒸鲈鱼
cuisine: 粤菜
difficulty: 2
duration: 25
calories: 180
servings: 2
tags:
- 清淡
- 海鲜
cover: https://i03piccdn.sogoucdn.com/19594f0bde2cf5eb
ingredients:
- name: 鲈鱼
  amount: 500
  unit: g
  isMain: true
- name: 姜
  amount: 10
  unit: g
  isMain: false
- name: 葱
  amount: 20
  unit: g
  isMain: false
- name: 蒸鱼豉油
  amount: 30
  unit: ml
  isMain: false
- name: 料酒
  amount: 10
  unit: ml
  isMain: false
- name: 食用油
  amount: 20
  unit: ml
  isMain: false
- name: 盐
  amount: 3
  unit: g
  isMain: false
steps:
- number: 1
  description: 鲈鱼去鳞、去内脏，在鱼身两侧划几刀
  tips: 方便入味
- number: 2
  description: 鱼身抹盐和料酒，腌制10分钟
  tips: 去腥
- number: 3
  description: 盘底铺姜片、葱段，放上鱼
  tips: 架空鱼身
- number: 4
  description: 水开后蒸8-10分钟
  tips: 根据鱼大小调整
- number: 5
  description: 倒掉盘中的汤汁，撒上新的葱姜丝
  tips: 去腥关键
- number: 6
  description: 淋上热油和蒸鱼豉油
  tips: 激发香味
tips: 蒸的时间不要过长，否则肉质变老
