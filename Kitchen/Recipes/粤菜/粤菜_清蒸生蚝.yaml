id: 10058
name: 清蒸生蚝
cuisine: 粤菜
difficulty: 3
duration: 30
calories: 184
servings: 2
tags:
- 咸鲜
- 蒸
description: 清蒸生蚝是一道原汁原味的沿海家常菜，蚝肉鲜嫩多汁，带着淡淡的海水咸香，蒜蓉与姜丝激发出清甜口感。生蚝富含优质蛋白和锌元素，能帮助提升免疫力。操作不算复杂，但掀开滚烫锅盖和处理蚝壳需要稍加小心，新手也能顺利完成。从刷洗到出锅，大约只需二十分钟。
steps:
- number: 1
  description: 将生蚝用刷子刷干净（没有刷子用牙刷）。
- number: 2
  description: 蒸锅中放水，将蒸屉放上之后，将 6 个生蚝平铺在蒸屉，使用 50%功率，蒸 3 分钟。
- number: 3
  description: 用右手拿着湿抹布掀开烫锅盖，将每个生蚝的外壳掀开一半去掉，生蚝的凸面向下，平面向上，每个放 1 根姜丝,10g 蒜末放到生蚝上。
- number: 4
  description: 关上烫锅盖，100%功率蒸 3.5 分钟。
- number: 5
  description: 停火，用右手拿着抹布掀开烫锅盖，每个放 5ml 酱油。
- number: 6
  description: 盛盘。
