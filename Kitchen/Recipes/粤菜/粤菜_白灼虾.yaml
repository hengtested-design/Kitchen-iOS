steps:
- number: 1
  description: 洋葱切小块，姜切片，平铺平底锅。
- number: 2
  description: 活虾冲洗一下（去除虾线、剪刀减掉虾腿虾须子都是可选操作），控水，铺在平底锅的洋葱、姜片之上。
- number: 3
  description: 锅内倒入料酒，盖上锅盖，中火 1 分钟，小火 5 分钟，关火 5 分钟。
- number: 4
  description: 和上一步并行操作，制作蘸料：
- number: 5
  description: 虾出锅，用干净的盘子装好。
tips: 技术细节：; 开始不能大火、防止糊底。; 如果锅盖有通气口、时间要相应调节一下（考虑增加 30 秒中火）。; 蘸料其实也是可选的、也可以是纯的醋，大自然馈赠的鲜虾在没有水带走冲淡鲜甜的情况下口感味道都非常棒的。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。
