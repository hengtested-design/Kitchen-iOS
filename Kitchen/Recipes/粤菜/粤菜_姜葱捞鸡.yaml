id: 10172
name: 姜葱捞鸡
cuisine: 粤菜
difficulty: 3
duration: 40
calories: 549
servings: 2
tags:
- 咸鲜
- 下饭菜
- 蒸
description: 姜葱捞鸡是一道粤式经典家常菜，鸡肉嫩滑多汁，葱姜香气浓郁，咸鲜适口，十分下饭。鸡腿肉提供优质蛋白质，搭配姜葱能温中散寒、促进食欲。整体操作以蒸制和手撕为主，步骤清晰，对新手来说比较容易上手。从备料到完成大约需要 40 分钟。
ingredients:
- name: 鸡腿 4 个， 约 400g
  amount: 0
  unit: 适量
  isMain: false
- name: 盐焗鸡粉 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 姜 50g
  amount: 0
  unit: 适量
  isMain: false
- name: 葱 1 根
  amount: 0
  unit: 适量
  isMain: false
- name: 盐 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 糖 5g
  amount: 0
  unit: 适量
  isMain: false
- name: 油 35ml
  amount: 0
  unit: 适量
  isMain: false
steps:
- number: 1
  description: 四个鸡腿清洗干净，放入碗中
- number: 2
  description: 碗中加入盐焗鸡粉和 5ml 油，搅拌均匀
- number: 3
  description: 让鸡腿静置腌制 15 分钟， 同时准备蒸锅并把水煮开
- number: 4
  description: 鸡腿腌制完成后， 放入水开后的蒸锅中，蒸制 20 分钟
- number: 5
  description: 将姜根据个人口味切成 1）姜蓉或 2）姜丝或 3）姜粒
- number: 6
  description: 将葱切成 0.5cm 小段
- number: 7
  description: 将葱姜放入蘸料碗，并加入盐和糖
- number: 8
  description: 将剩余的油倒入另一个锅中加热至六至七层热
- number: 9
  description: 将热油淋入葱姜碗中
- number: 10
  description: 鸡腿蒸好后将其撕碎成鸡丝，不需要特别细，大概 1cm 粗就可以
- number: 11
  description: 姜葱姜油淋在鸡丝上，搅拌均匀即可
tips: '参考: [白饭杀手来啦 #姜葱捞鸡-哔哩哔哩](https://b23.tv/2trBdqJ); 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
