id: 10
name: 白切鸡
cuisine: 粤菜
difficulty: 3
duration: 45
calories: 220
servings: 4
tags:
- 宴客菜
- 清淡
cover: ''
ingredients:
- name: 三黄鸡
  amount: 1000
  unit: g
  isMain: true
- name: 姜
  amount: 30
  unit: g
  isMain: false
- name: 葱
  amount: 30
  unit: g
  isMain: false
- name: 盐
  amount: 15
  unit: g
  isMain: false
- name: 料酒
  amount: 20
  unit: ml
  isMain: false
- name: 香菜
  amount: 10
  unit: g
  isMain: false
steps:
- number: 1
  description: 鸡洗净，姜切片、葱打结
- number: 2
  description: 锅中加水，放入姜、葱、料酒烧开
- number: 3
  description: 手提鸡头，将鸡身浸入开水3秒，提出水面
  tips: 重复3次
- number: 4
  description: 整只鸡放入锅中，小火煮20分钟
  tips: 水不要大开
- number: 5
  description: 捞出放入冰水浸泡10分钟
  tips: 皮会更脆
- number: 6
  description: 斩件装盘，配姜葱酱食用
tips: 鸡在冰水中浸泡后皮爽肉滑
