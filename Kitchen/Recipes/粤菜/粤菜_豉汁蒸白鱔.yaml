tips: '**注意事项**：; 确保白鱔新鲜，购买时选择活鱼，肉质更鲜嫩。; 鱼贩切段时可指定长度 （约 5 厘米为宜），方便蒸制和食用。; 蒸制时间不宜过长，以免白鱔肉质变韧。; **变种做法**：; 可加入辣椒或 XO 酱，增加辣味和层次感。; 若喜欢更软嫩的口感，可在腌制时加入米酒。; 如果您遵循本指南的制作流程而发现有问题或可以改进的流程，请提出 Issue 或 Pull request 。'
