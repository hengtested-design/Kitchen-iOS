description: 豉汁蒸白鱔是一道粤式经典蒸菜，豆豉蒜蓉的酱香渗透进鱼肉，口感嫩滑鲜美。白鱔富含优质蛋白和多种不饱和脂肪酸，对身体有滋补作用。操作步骤清晰，但处理生鱼和掌握火候稍有挑战，适合有一定基础的厨友。从备料到上桌大约需要 30 分钟。
